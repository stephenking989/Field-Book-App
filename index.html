    );

    const PageContent = getPageComponent(page.type);

    return (
      <div className="flex flex-col h-full" style={{ background: FBC.field }}>
        {page.type !== 'sketch' && (
          <NavBar
            title={page.title && page.title.trim() ? page.title.trim() : `P.${page.pageNumber} — ${meta.label}`}
            subtitle={`${project.name} · P.${page.pageNumber}`}
            onBack={() => navigate(`#/project/${projectId}`)}
            actions={navActions}
          />
        )}
        {/* Sketch pages must NOT be scrollable — the canvas handles all pointer/wheel
            events directly and needs to fill the full remaining height without a
            scrollable ancestor (which the browser prefers over canvas wheel handlers).
            All other page types keep overflow-y-auto + the safe-area bottom spacer. */}
        <div
          className={`flex-1 screen-enter${(page.type === 'sketch' || page.type === 'photo') ? ' overflow-hidden flex flex-col' : ' overflow-y-auto'}`}
          onClick={() => showExportMenu && setShowExportMenu(false)}>
          <PageContent
            page={page}
            projectId={projectId}
            project={project}
            onReload={reload}
            onRegisterExports={page.type === 'data' || page.type === 'photo' ? registerExports : undefined}
            onBack={page.type === 'sketch' ? () => navigate(`#/project/${projectId}`) : undefined}
            prevPageId={page.type === 'sketch' ? prevPage?.id : undefined}
            nextPageId={page.type === 'sketch' ? nextPage?.id : undefined}
            onDownload={page.type === 'sketch' ? handleExportPDF : undefined}
            onDelete={page.type === 'sketch' ? handleDelete : undefined}
            pageCount={page.type === 'sketch' ? pages.length : undefined}
          />
          {page.type !== 'sketch' && <div style={{ height: 'max(24px, env(safe-area-inset-bottom))' }} />}
        </div>
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // IMAGE COMPRESSION UTILITY
  // Resizes + compresses an image File to a JPEG base64 data URI.
  // Uses a Blob URL (not FileReader.readAsDataURL) to avoid allocating a huge
  // base64 string in memory before decode — critical on mobile where a 12MP
  // camera JPEG otherwise doubles peak RAM and can OOM-kill the PWA.
  // maxDim 1600 + quality 0.65 = good fieldbook quality at ~150-300KB per photo.
  // Used by PhotoPage and exposed via window._fb so sketch.js can call it.
  // ─────────────────────────────────────────────────────────────────────────────
  function compressImage(file, maxDim = 1400, quality = 0.6) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      const cleanup = () => URL.revokeObjectURL(url);
      img.onerror = (e) => { cleanup(); reject(e); };
      img.onload = () => {
        try {
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;
          if (!w || !h) { cleanup(); reject(new Error('Image has no dimensions')); return; }
          if (w > maxDim || h > maxDim) {
            if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
            else        { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = c.toDataURL('image/jpeg', quality);
          // Free the canvas immediately (helps on iOS where canvas buffers are limited)
          c.width = 0; c.height = 0;
          cleanup();
          resolve(dataUrl);
        } catch (err) {
          cleanup();
          reject(err);
        }
      };
      img.src = url;
    });
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // PHOTO PAGE
  // ─────────────────────────────────────────────────────────────────────────────
  // ─────────────────────────────────────────────────────────────────────────────
  // NOTES PAGE
  // ─────────────────────────────────────────────────────────────────────────────

  function NotesPage({ page, projectId, onReload, onRegisterExports }) {
    const editorRef  = useRef(null);
    const saveTimer  = useRef(null);
    const toast      = useToast();
    const [pinOpen, setPinOpen] = useState(false);
    const pinRangeRef = useRef(null);   // caret position saved before the GPS sheet takes focus

    // Restore saved HTML into the contenteditable on mount / page change
    useEffect(() => {
      if (editorRef.current && page.notesHtml !== undefined) {
        // GPS pin chips are re-written from their point rows so they follow an
        // edited point number / description.
        const html = fbGeo.refreshPins(page.notesHtml || '', DB.getProject(projectId));
        editorRef.current.innerHTML = html;
        if (html !== (page.notesHtml || '')) DB.updatePage(projectId, page.id, { notesHtml: html });
      }
    }, [page.id]);

    // Register PDF export
    useEffect(() => {
      if (!onRegisterExports) return;
      onRegisterExports({ exportPage: () => exportNotesPDF(page, toast) });
    }, [page]);

    function scheduleSave() {
      if (saveTimer.current) clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(() => {
        const html = editorRef.current ? editorRef.current.innerHTML : '';
        DB.updatePage(projectId, page.id, { notesHtml: html });
        onReload?.();
      }, 800);
    }

    function execCmd(cmd, val) {
      editorRef.current?.focus();
      document.execCommand(cmd, false, val ?? null);
    }

    // ── GPS pin — a geotagged point reference dropped into the note ──
    // The point itself is a Points-page row (source 'notes-pin'); the note
    // holds a non-editable chip that names it.
    // The caret position is saved on pointer-down (before the editor can lose
    // it); the sheet opens on the click. Opening it on pointer-down put the
    // sheet's backdrop under the finger, so the same tap closed it again.
    function savePinRange() {
      const sel = window.getSelection();
      const inEditor = sel && sel.rangeCount && editorRef.current?.contains(sel.anchorNode);
      pinRangeRef.current = inEditor ? sel.getRangeAt(0).cloneRange() : null;
    }

    function insertPin(pt) {
      const row = addGpsPointRow(projectId, { ...pt, geo: { ...pt.geo, notePageId: page.id } });
      setPinOpen(false);
      const ed = editorRef.current;
      if (!row || !ed) return;
      const chip = document.createElement('span');
      chip.className = 'fb-geo-pin';
      chip.contentEditable = 'false';
      chip.dataset.ptId = row.id;
      chip.dataset.ptNum = pt.number;
      chip.textContent = fbGeo.pinText(row, DB.getProject(projectId));
      const range = pinRangeRef.current;
      if (range && ed.contains(range.startContainer)) {
        range.collapse(false);
        range.insertNode(document.createTextNode(' '));
        range.insertNode(chip);
      } else {
        ed.appendChild(chip);
        ed.appendChild(document.createTextNode(' '));
      }
      scheduleSave();
      toast.success(`GPS pin ${pt.number} added`);
    }

    // Toolbar button definitions
    const tbBtns = [
      { label: 'B',  title: 'Bold',        cmd: 'bold',        style: { fontWeight: 700 } },
      { label: 'I',  title: 'Italic',       cmd: 'italic',      style: { fontStyle: 'italic' } },
      { label: 'H1', title: 'Heading 1',    cmd: 'formatBlock', val: 'H2' },
      { label: 'H2', title: 'Heading 2',    cmd: 'formatBlock', val: 'H3' },
      { label: '•',  title: 'Bullet list',  cmd: 'insertUnorderedList' },
      { label: '1.', title: 'Numbered list',cmd: 'insertOrderedList' },
      { label: '—',  title: 'Horizontal rule', cmd: 'insertHorizontalRule' },
      { label: 'Tx', title: 'Clear formatting', cmd: 'removeFormat' },
    ];

    return (
      <div className="flex flex-col h-full" style={{ background: FBC.field }}>
        <PageHeaderStrip page={page} projectId={projectId} onReload={onReload} />
        {/* Formatting toolbar */}
        <div style={{
          display: 'flex', gap: 4, padding: '6px 10px', overflowX: 'auto',
          borderBottom: '1px solid #E5E1D8', background: '#F5F1E8', flexShrink: 0,
        }}>
          {tbBtns.map(btn => (
            <button key={btn.label}
              onPointerDown={e => { e.preventDefault(); execCmd(btn.cmd, btn.val); }}
              title={btn.title}
              style={{
                minWidth: 32, height: 32, padding: '0 8px', borderRadius: 7,
                border: '1px solid #D4CFCA', background: FBC.field, cursor: 'pointer',
                fontSize: 13, fontFamily: FBF.ui, color: FBC.heading,
                flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
                ...btn.style,
              }}>
              {btn.label}
            </button>
          ))}
          <button onPointerDown={e => { e.preventDefault(); savePinRange(); }}
            onClick={() => setPinOpen(true)}
            title="Drop a GPS pin at your position"
            className="h-8 px-2.5 ml-1 rounded-lg text-[13px] font-semibold inline-flex items-center gap-1.5 whitespace-nowrap flex-shrink-0 bg-fb-accent-pale border border-fb-accent text-fb-heading">
            <Ico.Pin size={14} /> Drop GPS pin
          </button>
        </div>
        {pinOpen && (
          <GpsCaptureSheet projectId={projectId} source="notes-pin" heading="Drop GPS Pin"
            onClose={() => setPinOpen(false)} onSave={insertPin} />
        )}
        {/* Editor */}
        <div
          ref={editorRef}
          contentEditable
          suppressContentEditableWarning
          onInput={scheduleSave}
          spellCheck
          style={{
            flex: 1, minHeight: 0, overflowY: 'auto',
            padding: '16px 18px', outline: 'none',
            fontFamily: FBF.hand, fontSize: 18,
            lineHeight: 1.7, color: FBC.ink,
            caretColor: FBC.accent,
          }}
        />
      </div>
    );
  }

  async function exportNotesPDF(page, toast) {
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
      const margin = 18, pageW = doc.internal.pageSize.getWidth();
      const usableW = pageW - margin * 2;
      let y = margin;

      // Page header
      doc.setFont('Courier', 'bold');
      doc.setFontSize(13);
      doc.text(page.title || 'Notes', margin, y); y += 7;
      doc.setFont('Courier', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(120);
      doc.text([page.date || '', page.weather || ''].filter(Boolean).join('  ·  '), margin, y); y += 8;
      doc.setTextColor(0);
      doc.setLineWidth(0.3);
      doc.line(margin, y, pageW - margin, y); y += 6;

      // Render HTML content as plain text (strip tags)
      const tmp = document.createElement('div');
      tmp.innerHTML = page.notesHtml || '';
      const text = tmp.innerText || tmp.textContent || '';
      doc.setFont('Courier', 'normal');
      doc.setFontSize(10);
      const lines = doc.splitTextToSize(text, usableW);
      for (const ln of lines) {
        if (y > doc.internal.pageSize.getHeight() - margin) {
          doc.addPage(); y = margin;
        }
        doc.text(ln, margin, y); y += 6;
      }

      doc.save((page.title || 'Notes') + '.pdf');
      toast({ message: 'PDF exported.', type: 'success' });
    } catch(err) {
      toast({ message: 'Export failed: ' + (err.message || 'unknown error'), type: 'error' });
    }
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // MEDIA GEOTAGGING + VOICE NOTES (used by PhotoPage)
  // ─────────────────────────────────────────────────────────────────────────────

  // Watch the phone position and keep the most accurate fix seen. Used for
  // media, where a quick "about here" position is wanted without a dialog.
  function startFixTracker(onBest) {
    let best = null, id = null;
    if (navigator.geolocation) {
      id = navigator.geolocation.watchPosition(
        pos => {
          const c = pos.coords;
          const f = { lat: c.latitude, lon: c.longitude, h: c.altitude, acc: c.accuracy, fixes: 1 };
          if (!best || f.acc <= best.acc) { best = f; onBest && onBest(best); }
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
      );
    }
    return {
      best: () => best,
      stop: () => { if (id !== null) { navigator.geolocation.clearWatch(id); id = null; } },
    };
  }

  // One-shot position: resolves with the best fix seen within maxMs (early
  // once it is good enough), or null when there is no fix / no permission.
  function getQuickFix(maxMs = 8000, goodEnough = 8) {
    return new Promise(resolve => {
      let done = false;
      const finish = () => { if (done) return; done = true; clearTimeout(timer); tracker.stop(); resolve(tracker.best()); };
      const timer = setTimeout(finish, maxMs);
      const tracker = startFixTracker(best => { if (best.acc <= goodEnough) setTimeout(finish, 0); });
    });
  }

  // GPS position written into an uploaded photo by the camera that took it.
  // Returns a `geo` block or null. EXIF altitude is treated like the phone's
  // own GPS height — ellipsoidal, reduced with the geoid (H = h − N). That is
  // what Android cameras write; a camera that writes sea-level height instead
  // would come out about 20 m high in Nova Scotia. Either way it is ±5–15 m.
  async function readExifGeo(file) {
    if (!window.exifr) return null;
    try {
      // One pass over the GPS block (+ capture time). The options-object form
      // is required — the lite build throws on a plain tag-name array.
      const x = await window.exifr.parse(file, { ifd0: false, gps: true, exif: ['DateTimeOriginal'] });
      if (!x || !isFinite(x.latitude) || !isFinite(x.longitude)) return null;
      if (x.latitude === 0 && x.longitude === 0) return null;   // unset tags
      let acc = null, ts = null, h = null;
      if (typeof x.GPSHPositioningError === 'number' && isFinite(x.GPSHPositioningError)) acc = x.GPSHPositioningError;
      if (typeof x.GPSAltitude === 'number' && isFinite(x.GPSAltitude)) {
        const ref = x.GPSAltitudeRef;                      // 1 = below the reference surface
        const below = ref === 1 || (ref && ref[0] === 1);
        h = below ? -x.GPSAltitude : x.GPSAltitude;
      }
      if (x.DateTimeOriginal instanceof Date && !isNaN(x.DateTimeOriginal)) ts = x.DateTimeOriginal.toISOString();
      return { ...fbGeo.makeGeo({ lat: x.latitude, lon: x.longitude, h, acc, ts }, 'photo'), from: 'exif' };
    } catch { return null; }
  }

  function fmtDur(secs) {
    const s = Math.max(0, Math.round(secs || 0));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  const VOICE_MAX_SECS = 300;   // hard stop so a forgotten recorder can't fill storage
  function pickAudioMime() {
    if (typeof MediaRecorder === 'undefined') return '';
    return ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus']
      .find(m => MediaRecorder.isTypeSupported(m)) || '';
  }

  // Bottom sheet: record → review → save a voice note. Hands the finished
  // record (audio already in audioDB) to onSave.
  function VoiceRecorderSheet({ projectId, geotag, heading = 'Voice Note', onSave, onClose }) {
    const crsId = fbGeo.projectCrsId(DB.getProject(projectId));
    const [phase, setPhase] = useState('idle');   // 'idle' | 'recording' | 'recorded' | 'saving'
    const [err, setErr]     = useState(null);
    const [secs, setSecs]   = useState(0);
    const [title, setTitle] = useState('');
    const [desc, setDesc]   = useState('');
    const [fix, setFix]     = useState(null);
    const [previewUrl, setPreviewUrl] = useState(null);
    const recRef = useRef(null), streamRef = useRef(null), chunksRef = useRef([]);
    const blobRef = useRef(null), urlRef = useRef(null), trackerRef = useRef(null);
    const t0Ref = useRef(0), durRef = useRef(0);
    const trapRef = useRef(null);
    useFocusTrap(trapRef, true, onClose);

    function stopStream() {
      if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
    }

    // Position warms up while the sheet is open; the best fix is taken at save.
    useEffect(() => {
      if (geotag) trackerRef.current = startFixTracker(best => setFix(best));
      return () => {
        try { if (recRef.current && recRef.current.state === 'recording') { recRef.current.onstop = null; recRef.current.stop(); } } catch {}
        stopStream();
        if (trackerRef.current) trackerRef.current.stop();
        if (urlRef.current) URL.revokeObjectURL(urlRef.current);
      };
    }, []);

    useEffect(() => {
      if (phase !== 'recording') return;
      const t = setInterval(() => {
        const s = Math.floor((Date.now() - t0Ref.current) / 1000);
        setSecs(s);
        if (s >= VOICE_MAX_SECS) stop();
      }, 250);
      return () => clearInterval(t);
    }, [phase]);

    async function start() {
      setErr(null);
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
        setErr('This browser cannot record audio.');
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        setErr(
          (e.name === 'NotAllowedError' || e.name === 'SecurityError')
            ? 'Microphone permission denied. Allow the microphone for this site in your browser settings, then try again.'
          : e.name === 'NotFoundError' ? 'No microphone found on this device.'
          : 'Could not start the microphone.');
        return;
      }
      streamRef.current = stream;
      const mime = pickAudioMime();
      let rec;
      try { rec = new MediaRecorder(stream, { ...(mime ? { mimeType: mime } : {}), audioBitsPerSecond: 32000 }); }
      catch { rec = new MediaRecorder(stream); }
      chunksRef.current = [];
      rec.ondataavailable = e => { if (e.data && e.data.size) chunksRef.current.push(e.data); };
      rec.onstop = () => {
        stopStream();
        const blob = new Blob(chunksRef.current, { type: rec.mimeType || mime || 'audio/webm' });
        blobRef.current = blob;
        durRef.current = Math.max(1, Math.round((Date.now() - t0Ref.current) / 1000));
        if (urlRef.current) URL.revokeObjectURL(urlRef.current);
        urlRef.current = URL.createObjectURL(blob);
        setPreviewUrl(urlRef.current);
        setPhase('recorded');
      };
      recRef.current = rec;
      t0Ref.current = Date.now();
      setSecs(0);
      rec.start(1000);
      setPhase('recording');
    }

    function stop() {
      try { if (recRef.current && recRef.current.state === 'recording') recRef.current.stop(); } catch {}
    }

    async function save() {
      const blob = blobRef.current;
      if (!blob || !blob.size) { setErr('Nothing was recorded — try again.'); setPhase('idle'); return; }
      setPhase('saving');
      try {
        const ref = audioDB.newRef();
        await audioDB.put(ref, blob);
        const best = trackerRef.current ? trackerRef.current.best() : null;
        onSave({
          id: 'vn_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
          audioRef: ref, mime: blob.type, dur: durRef.current, size: blob.size,
          title: title.trim(), desc: desc.trim(),
          createdAt: new Date().toISOString(),
          ...(best ? { geo: fbGeo.makeGeo(best, 'voice') } : {}),
        });
      } catch (e) {
        console.error('Voice note save failed:', e);
        setErr('Recording could not be saved — device storage may be full.');
        setPhase('recorded');
      }
    }

    const fieldCls = 'w-full px-3 py-3 rounded-xl text-base text-fb-ink bg-fb-field border border-fb-border outline-none focus:border-fb-accent placeholder:text-fb-ink-faint';

    return (
      <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && phase !== 'recording' && onClose()}>
        <div ref={trapRef} className="modal-sheet" style={{ paddingBottom: 32 }}>
          <div tabIndex={0} className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4 outline-none" />
          <h2 className="text-xl font-bold text-fb-ink mb-4">{heading}</h2>

          <div className="rounded-xl px-4 py-3 mb-3 text-center bg-fb-page-alt border border-fb-border">
            <p className={`font-data text-[30px] leading-tight ${phase === 'recording' ? 'text-fb-error' : 'text-fb-ink'}`}>
              {fmtDur(phase === 'recording' ? secs : phase === 'idle' ? 0 : durRef.current)}
            </p>
            <p className="text-xs text-fb-ink-muted mt-1">
              {phase === 'recording' ? `Recording… (max ${VOICE_MAX_SECS / 60} min)`
                : phase === 'idle' ? 'Tap Record to start'
                : 'Recorded — play it back, then save'}
            </p>
            {geotag && (
              <p className={`text-xs font-data mt-2 flex items-center justify-center gap-1.5 ${fix ? 'text-fb-heading' : 'text-fb-ink-faint'}`}>
                <Ico.Pin size={14} />
                <span>{fix ? `${fbGeo.fmtPosition(fix.lat, fix.lon, crsId)} · ${fbGeo.fmtAcc(fix.acc)}` : 'Locating…'}</span>
              </p>
            )}
          </div>

          {err && <Notice tone="error" className="mb-3">{err}</Notice>}

          {(phase === 'recorded' || phase === 'saving') && (
            <>
              <audio controls src={previewUrl || undefined} className="w-full mb-3" />
              <input type="text" value={title} onChange={e => setTitle(e.target.value)} placeholder="Title (optional)"
                className={fieldCls + ' mb-2'} maxLength={80} />
              <textarea value={desc} onChange={e => setDesc(e.target.value)} placeholder="Description (optional)" rows={2}
                className={fieldCls + ' mb-3 resize-none'} />
            </>
          )}

          {phase === 'idle' && (
            <button onClick={start}
              className="w-full py-3.5 rounded-xl text-base font-semibold text-white bg-fb-error active:opacity-80 flex items-center justify-center gap-2">
              <Ico.Mic size={18} /> Record
            </button>
          )}
          {phase === 'recording' && (
            <button onClick={stop}
              className="w-full py-3.5 rounded-xl text-base font-semibold text-white bg-fb-accent active:opacity-80 flex items-center justify-center gap-2">
              <span className="w-3 h-3 bg-current" /> Stop
            </button>
          )}
          {(phase === 'recorded' || phase === 'saving') && (
            <div className="flex gap-2">
              <button onClick={() => { setPreviewUrl(null); blobRef.current = null; setPhase('idle'); }} disabled={phase === 'saving'}
                className="py-3 px-5 rounded-xl text-sm font-semibold text-fb-ink bg-fb-page-alt border border-fb-border active:bg-fb-page-deep">
                Redo
              </button>
              <button onClick={save} disabled={phase === 'saving'}
                className="flex-1 py-3.5 rounded-xl text-base font-semibold text-white bg-fb-accent active:opacity-80 disabled:bg-fb-ink-faint">
                {phase === 'saving' ? 'Saving…' : 'Save voice note'}
              </button>
            </div>
          )}
        </div>
      </div>
    );
  }

  // One saved voice record: play/pause, title, duration, delete. The full
  // (standalone) form adds a description; `compact` is the per-photo memo row.
  function VoiceCard({ rec, compact, onChange, onDelete, children }) {
    const [playing, setPlaying] = useState(false);
    const [missing, setMissing] = useState(false);
    const audioRef = useRef(null), urlRef = useRef(null);

    useEffect(() => () => {
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      if (urlRef.current) URL.revokeObjectURL(urlRef.current);
    }, []);

    async function toggle() {
      if (audioRef.current) {
        if (playing) audioRef.current.pause(); else audioRef.current.play().catch(() => {});
        return;
      }
      let blob = null;
      try { blob = await audioDB.get(rec.audioRef); } catch {}
      if (!blob) { setMissing(true); return; }
      urlRef.current = URL.createObjectURL(blob);
      const a = new Audio(urlRef.current);
      a.onplay  = () => setPlaying(true);
      a.onpause = () => setPlaying(false);
      a.onended = () => setPlaying(false);
      audioRef.current = a;
      a.play().catch(() => setMissing(true));
    }

    return (
      <div className={compact ? 'py-1.5' : 'flex-shrink-0 rounded-xl p-3 bg-fb-page-alt border border-fb-border'}>
        <div className="flex items-center gap-2.5">
          <button onClick={toggle} disabled={missing} title={playing ? 'Pause' : 'Play'}
            className="w-11 h-11 rounded-full flex-shrink-0 flex items-center justify-center text-white bg-fb-accent active:opacity-80 disabled:bg-fb-border">
            {playing ? <Ico.Pause /> : <Ico.Play />}
          </button>
          <input type="text" value={rec.title || ''} onChange={e => onChange({ title: e.target.value })}
            placeholder={compact ? 'Voice memo…' : 'Voice note title…'} maxLength={80}
            className="flex-1 min-w-0 py-0.5 font-handwritten text-[17px] text-fb-ink bg-transparent border-b border-fb-border outline-none placeholder:text-fb-ink-faint" />
          <span className="font-data text-[13px] text-fb-ink-muted flex-shrink-0">{fmtDur(rec.dur)}</span>
          <button onClick={onDelete} title="Delete recording"
            className="w-9 h-9 rounded-full flex-shrink-0 flex items-center justify-center text-fb-error active:bg-fb-page-deep">
            <Ico.Trash />
          </button>
        </div>
        {missing && <p className="text-xs font-semibold text-fb-error mt-1">Recording not found on this device.</p>}
        {!compact && (
          <textarea value={rec.desc || ''} onChange={e => onChange({ desc: e.target.value })}
            placeholder="Description…" rows={2}
            className="w-full resize-none mt-2.5 rounded-lg px-2.5 py-2 font-handwritten text-base text-fb-ink bg-fb-page border border-fb-border outline-none placeholder:text-fb-ink-faint" />
        )}
        {children}
      </div>
    );
  }

  // Position + point row under a photo or voice note. A geotagged record owns
  // a numbered point on the Points page (so it is listed, exported and can be
  // placed on a sketch); "Link…" attaches it to a different existing point
  // instead — the monument in the photo, say.
  //   onNumber(v) — Pt # typed: an existing number links, a new one renumbers
  function MediaGeoRow({ rec, source, project, locating, onNumber, onLink, onUnlink, onLocate, onAddPoint }) {
    const pt  = fbGeo.mediaPoint(rec, project, source);
    const geo = rec.geo || null;
    const number = pt ? pt.number : '';
    const [num, setNum] = useState(number);
    useEffect(() => { setNum(number); }, [number, rec.id]);
    const linkedElsewhere = !!(pt && pt.rowId && !pt.own);
    const uri = pt && pt.lat !== null ? fbGeo.geoUri(pt.lat, pt.lon, [pt.number, pt.desc].filter(Boolean).join(' ')) : null;

    let pos, tag = null;
    if (pt) {
      pos = (pt.N !== null && pt.E !== null) ? `N ${pt.text.n}  E ${pt.text.e}${pt.text.z ? '  Z ' + pt.text.z : ''}`
          : pt.lat !== null ? fbGeo.fmtLatLon(pt.lat, pt.lon)
          : 'Point has no coordinates yet';
      tag = linkedElsewhere ? `Linked to Pt ${pt.number}${pt.desc ? ' — ' + pt.desc : ''}`
          : pt.from === 'exif' ? (pt.acc !== null ? `±${Math.round(pt.acc)} m · photo EXIF GPS` : 'photo EXIF GPS')
          : fbGeo.fmtAcc(pt.acc);
    } else {
      pos = locating ? 'Locating…' : 'No position';
    }
    // Phone height is always shown when there is one. Whether it is written to
    // the point's Z is the project's "Fill Z from phone height" setting.
    const ht = (!linkedElsewhere && geo && typeof geo.h === 'number')
      ? (typeof geo.H === 'number'
          ? `H ${fbGeo.fmtElev(geo.H)} m  (phone ht ${fbGeo.fmtElev(geo.h)} m − geoid ${geo.N.toFixed(1)} m)`
          : `Ellipsoid ht ${fbGeo.fmtElev(geo.h)} m (phone)`)
      : null;

    function commit() {
      const v = num.trim();
      if (!v || v === number) { setNum(number); return; }
      onNumber(v);
    }

    const chip = 'h-9 px-3 rounded-lg text-[13px] font-semibold inline-flex items-center gap-1.5 whitespace-nowrap flex-shrink-0 bg-fb-page-alt border border-fb-border text-fb-heading active:bg-fb-page-deep';

    return (
      <div className="mt-2.5">
        <div className="flex items-center gap-2">
          {pt && <SourceTag source={pt.source} />}
          <span className={`font-data text-[13px] min-w-0 ${pt ? 'text-fb-ink' : 'text-fb-ink-faint'}`}>{pos}</span>
        </div>
        {(tag || ht) && (
          <div className="flex flex-wrap gap-x-2.5 mt-0.5">
            {tag && <span className={`text-xs font-semibold ${linkedElsewhere ? 'text-fb-heading' : 'text-fb-warn'}`}>{tag}</span>}
            {ht && <span className="text-xs text-fb-ink-muted">{ht}</span>}
          </div>
        )}
        <div className="flex items-center gap-1.5 mt-2 overflow-x-auto">
          <span className="font-heading text-[10px] font-semibold tracking-[0.09em] uppercase text-fb-heading flex-shrink-0">Pt #</span>
          <input type="text" inputMode="numeric" value={num} placeholder="—"
            onChange={e => setNum(e.target.value)} onBlur={commit}
            onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
            className="w-[72px] h-9 flex-shrink-0 rounded-lg px-2 text-base font-data text-fb-ink bg-fb-field border border-fb-border outline-none focus:border-fb-accent placeholder:text-fb-ink-faint" />
          <button className={chip} onClick={onLink}><Ico.Link size={14} /> Link…</button>
          {linkedElsewhere && <button className={chip} onClick={onUnlink}>Unlink</button>}
          {pt && !pt.rowId && onAddPoint && <button className={chip} onClick={onAddPoint}>＋ Points</button>}
          {!pt && onLocate && (
            <button className={chip} onClick={onLocate} disabled={locating}><Ico.Pin size={14} /> {locating ? 'Locating…' : 'Locate'}</button>
          )}
          {uri && <a href={uri} className={chip}><Ico.Map size={14} /> Map</a>}
        </div>
      </div>
    );
  }

  // Pick an existing Points-page point to link a photo / voice note to.
  function PointPickerSheet({ project, onPick, onClose }) {
    const [q, setQ] = useState('');
    const trapRef = useRef(null);
    useFocusTrap(trapRef, true, onClose);
    const all = fbGeo.rowPoints(project).filter(p => p.number);
    const needle = q.trim().toLowerCase();
    const list = needle ? all.filter(p => p.number.toLowerCase().includes(needle) || p.desc.toLowerCase().includes(needle)) : all;
    return (
      <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
        <div ref={trapRef} className="modal-sheet" style={{ paddingBottom: 24 }}>
          <div tabIndex={0} className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4 outline-none" />
          <h2 className="text-xl font-bold text-fb-ink mb-4">Link to Point</h2>
          <input type="text" value={q} onChange={e => setQ(e.target.value)} placeholder="Search number or description"
            className="w-full px-3 py-3 rounded-xl text-base text-fb-ink bg-fb-field border border-fb-border outline-none focus:border-fb-accent placeholder:text-fb-ink-faint mb-3" />
          <div className="space-y-1.5 overflow-y-auto" style={{ maxHeight: '45vh' }}>
            {list.length === 0 && (
              <p className="text-sm text-fb-ink-muted py-6 text-center rounded-xl bg-fb-page-alt">
                {all.length === 0 ? 'No numbered points on this project\'s Points pages yet.' : 'No matching points.'}
              </p>
            )}
            {list.map(p => (
              <button key={p.id} onClick={() => onPick(p)}
                className="w-full flex items-center gap-3 px-3 py-3 rounded-xl text-left bg-fb-page-alt border border-fb-border active:opacity-80">
                <span className="font-data text-base text-fb-ink w-16 flex-shrink-0 truncate">{p.number}</span>
                <span className="flex-1 min-w-0">
                  <span className="flex items-center gap-1.5">
                    <span className="flex-1 min-w-0 text-sm text-fb-ink truncate">{p.desc || '—'}</span>
                    <SourceTag source={p.source} />
                  </span>
                  <span className="block text-xs text-fb-ink-muted font-data truncate">
                    {p.N !== null && p.E !== null ? `N ${p.text.n}  E ${p.text.e}` : 'no coordinates'}
                  </span>
                </span>
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  function PhotoPage({ page, projectId, onReload, onRegisterExports }) {
    const [photos, setPhotos] = useState(page.photos || []);
    const [urlMap, setUrlMap] = useState({}); // photoRef -> dataUrl, for rendering
    const [expandedId, setExpandedId] = useState(null);
    const [uploading, setUploading] = useState(false);
    const [camKey, setCamKey] = useState(0);
    const fileRef = useRef(null);
    const camRef  = useRef(null);
    const toast   = useToast();
    const project = DB.getProject(projectId);

    // Standalone voice notes on this page (per-photo memos live on the photo)
    const [voiceNotes, setVoiceNotes] = useState(page.voiceNotes || []);
    const voiceRef = useRef(voiceNotes);
    useEffect(() => { voiceRef.current = voiceNotes; }, [voiceNotes]);
    useEffect(() => { const v = page.voiceNotes || []; voiceRef.current = v; setVoiceNotes(v); }, [page.id]);
    // Geotag in-app photos and voice notes with the phone's position (on by default)
    const [geotag, setGeotag] = useState(() => {
      try { return localStorage.getItem('fb_photo_geotag') !== 'false'; } catch { return true; }
    });
    const [locating, setLocating]     = useState({});    // record id -> true while a fix is pending
    const [recorder, setRecorder]     = useState(null);  // null | { photoId: string | null }
    const [linkTarget, setLinkTarget] = useState(null);  // null | { kind: 'photo' | 'voice', id }
    const [, bump] = useState(0);   // re-render after a Points-page row changes under a card
    const noFixToastRef = useRef(false);

    // Ref mirrors the photos state so async handlers always see the latest
    // array after awaits, avoiding the stale-closure bug that caused the
    // second upload to clobber or drop the first.
    const photosRef = useRef(photos);
    useEffect(() => { photosRef.current = photos; }, [photos]);

    // On page mount: (1) lazy-migrate any legacy inline-dataUrl photos into
    // photoDB (IDB) so they share the same photoRef model as new photos, and
    // (2) load all referenced dataUrls into `urlMap` for rendering.
    useEffect(() => {
      let cancelled = false;
      (async () => {
        const raw = page.photos || [];
        let migrated = raw;
        let didMigrate = false;

        // Migrate legacy entries — those with a dataUrl but no photoRef.
        const legacy = raw.filter(p => p && p.dataUrl && !p.photoRef);
        if (legacy.length) {
          const updates = {};
          for (const ph of legacy) {
            try {
              const ref = photoDB.newRef();
              await photoDB.put(ref, ph.dataUrl);
              updates[ph.id] = ref;
            } catch (err) {
              console.error('Photo migration failed:', err);
            }
          }
          migrated = raw.map(p => {
            if (updates[p.id]) {
              const { dataUrl, ...rest } = p;
              return { ...rest, photoRef: updates[p.id] };
            }
            return p;
          });
          try {
            DB.updatePage(projectId, page.id, { photos: migrated });
            didMigrate = true;
          } catch (err) {
            console.error('Failed to save migrated photos:', err);
          }
        }

        // Every geotagged photo / voice note owns a numbered point on the Points page.
        try {
          if (ensureMediaPoints(projectId, page.id)) {
            const fresh = DB.getPage(projectId, page.id) || {};
            migrated = fresh.photos || [];
            if (!cancelled) { voiceRef.current = fresh.voiceNotes || []; setVoiceNotes(voiceRef.current); }
          }
        } catch (err) { console.error('Media point migration failed:', err); }

        // Resolve all current refs into the urlMap.
        const refs = migrated.map(p => p.photoRef).filter(Boolean);
        const map  = await photoDB.getMany(refs);

        // Also keep any inline dataUrls from unmigrated entries so they still render.
        migrated.forEach(p => {
          if (!p.photoRef && p.dataUrl) map[p.id] = p.dataUrl;
        });

        if (cancelled) return;
        photosRef.current = migrated;
        setPhotos(migrated);
        setUrlMap(map);
        if (didMigrate) toast.success(`Upgraded ${legacy.length} photo${legacy.length === 1 ? '' : 's'} to new storage.`);
      })();
      return () => { cancelled = true; };
    }, [page.id]);

    // Register per-page PDF export so the header export button works
    useEffect(() => {
      if (!onRegisterExports) return;
      onRegisterExports({
        exportPage: () => exportPhotoPDF({ ...page, voiceNotes }, photos, urlMap, toast, DB.getProject(projectId)),
      });
    }, [page, photos, urlMap, voiceNotes]);

    // Persist a specific `next` array to both DB and component state.
    // Returns true on success, false if localStorage threw (quota exceeded).
    function savePhotos(next) {
      try {
        DB.updatePage(projectId, page.id, { photos: next });
      } catch (err) {
        toast.error('Photo not saved — storage full. Delete photos or old projects to free space.');
        return false;
      }
      photosRef.current = next;
      setPhotos(next);
      return true;
    }

    // Resolve a photo record to its dataUrl for rendering/export.
    function photoUrl(ph) {
      if (!ph) return null;
      if (ph.photoRef && urlMap[ph.photoRef]) return urlMap[ph.photoRef];
      if (ph.dataUrl) return ph.dataUrl; // unmigrated legacy fallback
      return null;
    }

    async function handleFileInput(e, fromCamera) {
      const files = Array.from(e.target.files || []);
      e.target.value = '';
      if (!files.length) return;
      setUploading(true);
      let savedCount = 0;
      let failedCount = 0;
      let quotaHit = false;
      // Process one at a time — parallel decode of multi-MP images via
      // Promise.all is what was OOM-killing the PWA on phones (camera capture
      // green-screen) and causing the "second photo vanishes" bug.
      // Save after each photo so a mid-batch crash still retains earlier ones.
      for (const f of files) {
        try {
          // Position. An uploaded photo uses the GPS its camera wrote into the
          // file — read from the ORIGINAL, because compression strips EXIF. A
          // photo taken now uses the phone's own fix (EXIF as a fallback); it
          // arrives after the photo is saved so the camera never waits on GPS.
          const exifP = (fromCamera && !geotag) ? null : readExifGeo(f);
          const fixP  = (fromCamera && geotag) ? getQuickFix() : null;
          const dataUrl = await compressImage(f);
          const ref = photoDB.newRef();
          await photoDB.put(ref, dataUrl);
          const exifGeo = exifP ? await exifP : null;
          const id = 'ph_' + Date.now() + '_' + Math.random().toString(36).slice(2);
          const next = [...photosRef.current, {
            id,
            photoRef: ref,
            note: '',
            ...(exifGeo && !fixP ? { geo: exifGeo } : {}),
          }];
          if (savePhotos(next)) {
            setUrlMap(m => ({ ...m, [ref]: dataUrl }));
            savedCount++;
            if (fixP) locatePhoto(id, fixP, exifGeo);
            else adoptPoint('photo', id);
          } else {
            // localStorage quota hit — the page-level save failed, so the ref
            // would be orphaned. Clean up the IDB entry we just wrote.
            try { await photoDB.del(ref); } catch {}
            quotaHit = true;
            break;
          }
        } catch (err) {
          failedCount++;
          console.error('Photo import failed:', err);
        }
      }
      setUploading(false);
      if (quotaHit) return;
      if (failedCount > 0 && savedCount === 0) {
        toast.error('Failed to import image.');
      } else if (failedCount > 0) {
        toast.error(`Imported ${savedCount} of ${savedCount + failedCount} photos.`);
      }
    }

    function updateNote(id, note) {
      savePhotos(photosRef.current.map(p => p.id === id ? { ...p, note } : p));
    }

    function patchPhoto(id, patch) {
      if (!photosRef.current.some(p => p.id === id)) return;
      savePhotos(photosRef.current.map(p => p.id === id ? { ...p, ...patch } : p));
    }

    function setLocatingFor(id, on) {
      setLocating(l => { const n = { ...l }; if (on) n[id] = true; else delete n[id]; return n; });
    }

    // Attach the phone fix to a just-taken photo once it resolves.
    function locatePhoto(id, fixP, fallbackGeo) {
      setLocatingFor(id, true);
      fixP.then(fix => {
        setLocatingFor(id, false);
        const geo = fix ? fbGeo.makeGeo(fix, 'photo') : fallbackGeo;
        if (geo) { patchPhoto(id, { geo }); adoptPoint('photo', id); return; }
        if (!noFixToastRef.current) {
          noFixToastRef.current = true;
          toast.error('No GPS position — photo saved without a location.');
        }
      });
    }

    // "Locate" on a card that has no position yet — tag it with where the phone is now.
    function locateNow(kind, id) {
      setLocatingFor(id, true);
      getQuickFix().then(fix => {
        setLocatingFor(id, false);
        if (!fix) { toast.error('No GPS position available.'); return; }
        if (kind === 'photo') patchPhoto(id, { geo: fbGeo.makeGeo(fix, 'photo') });
        else patchVoice(id, { geo: fbGeo.makeGeo(fix, 'voice') });
        adoptPoint(kind, id);
      });
    }

    // ── Points for media ──
    const recOf = (kind, id) => (kind === 'photo' ? photosRef.current : voiceRef.current).find(r => r.id === id);
    const patchRec = (kind, id, patch) => (kind === 'photo' ? patchPhoto(id, patch) : patchVoice(id, patch));

    // Give a geotagged record its own point on the Points page, unless it
    // already resolves to one.
    function adoptPoint(kind, id, number) {
      const rec = recOf(kind, id);
      if (rec && rec.geo && !fbGeo.mediaRow(rec, fbGeo.rowPoints(DB.getProject(projectId)))) {
        if (rec.noPoint) patchRec(kind, id, { noPoint: undefined });
        createMediaPoint(projectId, page.id, kind, rec, number);
      }
      bump(n => n + 1);
    }

    // Link a record to another existing point; its own point is superseded.
    function linkTo(kind, id, row) {
      patchRec(kind, id, { ptId: row.id, ptNum: row.number });
      if (row.mediaId !== id) removeMediaPoint(projectId, id);
      bump(n => n + 1);
    }

    function unlink(kind, id) {
      patchRec(kind, id, { ptId: undefined, ptNum: undefined });
      adoptPoint(kind, id);
    }

    // Pt # typed on a card: an existing number links to that point, a new
    // number renumbers the record's own point.
    function setNumber(kind, id, value) {
      const v = String(value).trim();
      const rec = recOf(kind, id);
      if (!v || !rec) return;
      const rows = fbGeo.rowPoints(DB.getProject(projectId));
      const cur = fbGeo.mediaRow(rec, rows);
      if (cur && cur.number === v) return;
      const other = rows.find(r => r.number === v);
      if (other) { linkTo(kind, id, other); toast.success(`Linked to point ${v}`); return; }
      if (cur && cur.mediaId === id) {
        updatePointRow(projectId, cur.id, { col_ptnum: v });
        bump(n => n + 1);
        return;
      }
      if (rec.geo) {   // linked elsewhere (or no point yet) → its own point, with this number
        patchRec(kind, id, { ptId: undefined, ptNum: undefined });
        adoptPoint(kind, id, v);
        return;
      }
      toast.error(`No point ${v} — use Link… to pick an existing point.`);
      bump(n => n + 1);
    }

    function toggleGeotag() {
      setGeotag(g => {
        const next = !g;
        try { localStorage.setItem('fb_photo_geotag', String(next)); } catch {}
        return next;
      });
    }

    // ── Voice notes ──
    function saveVoiceNotes(next) {
      try {
        DB.updatePage(projectId, page.id, { voiceNotes: next });
      } catch (err) {
        toast.error('Voice note not saved — storage full.');
        return false;
      }
      voiceRef.current = next;
      setVoiceNotes(next);
      return true;
    }

    // Recorder finished: the audio is already in audioDB, attach the record
    // to the photo it was recorded for, or to the page.
    function addVoice(rec) {
      const target = recorder;
      setRecorder(null);
      const memo = !!(target && target.photoId);
      const ok = memo
        ? savePhotos(photosRef.current.map(p => p.id === target.photoId ? { ...p, voice: [...(p.voice || []), rec] } : p))
        : saveVoiceNotes([...voiceRef.current, rec]);
      if (!ok) { audioDB.del(rec.audioRef).catch(() => {}); return; }
      if (!memo) adoptPoint('voice', rec.id);
      toast.success('Voice note saved');
    }

    function patchVoice(id, patch) {
      saveVoiceNotes(voiceRef.current.map(v => v.id === id ? { ...v, ...patch } : v));
    }

    function deleteVoice(id) {
      const v = voiceRef.current.find(x => x.id === id);
      if (!v || !window.confirm('Delete this voice note?')) return;
      if (saveVoiceNotes(voiceRef.current.filter(x => x.id !== id))) {
        dropAudioIfUnused(v.audioRef);
        removeMediaPoint(projectId, id);
      }
    }

    function patchMemo(photoId, memoId, patch) {
      savePhotos(photosRef.current.map(p => p.id === photoId
        ? { ...p, voice: (p.voice || []).map(v => v.id === memoId ? { ...v, ...patch } : v) } : p));
    }

    function deleteMemo(photoId, memoId) {
      const ph = photosRef.current.find(p => p.id === photoId);
      const v = ph && (ph.voice || []).find(x => x.id === memoId);
      if (!v || !window.confirm('Delete this voice memo?')) return;
      if (savePhotos(photosRef.current.map(p => p.id === photoId
            ? { ...p, voice: (p.voice || []).filter(x => x.id !== memoId) } : p))) {
        dropAudioIfUnused(v.audioRef);
      }
    }

    function deletePhoto(id) {
      const toRemove = photosRef.current.find(p => p.id === id);
      const next = photosRef.current.filter(p => p.id !== id);
      if (!savePhotos(next)) return;
      // Voice memos recorded on this photo go with it, and so does its point
      ((toRemove && toRemove.voice) || []).forEach(v => dropAudioIfUnused(v.audioRef));
      removeMediaPoint(projectId, id);
      // Lazy IDB cleanup — pruneOrphans handles this safely at app-level, so
      // we don't need to worry about duplicate pages sharing a ref. Only
      // remove if we're confident no other page references it on this project.
      // Simplest correct behaviour: don't delete from IDB here. pruneOrphans
      // (DataManagementModal button + app launch) will sweep unreferenced
      // entries. Photos deleted here just drop from page.photos in localStorage.
      if (toRemove && toRemove.photoRef) {
        // Non-blocking best-effort cleanup if the ref appears nowhere else.
        // Safe because pruneOrphans will catch anything we miss.
        queueMicrotask(() => {
          try {
            const projects = DB.getProjects();
            const stillReferenced = projects.some(pr =>
              (pr.pages || []).some(pg =>
                (pg.photos || []).some(ph => ph.photoRef === toRemove.photoRef)));
            if (!stillReferenced) photoDB.del(toRemove.photoRef).catch(() => {});
          } catch {}
        });
      }
    }

    return (
      <div className="flex flex-col h-full" style={{ background: FBC.field }}>
        <PageHeaderStrip page={page} projectId={projectId} onReload={onReload} />
        {/* Hidden file inputs.
            Camera input uses capture="environment" to open the rear camera directly.
            Key remount after each capture forces a fresh input element so rapid repeat
            shots don't silently skip onChange (a known Android/Chrome quirk).
            Upload input allows multiple files for gallery imports. */}
        <input ref={fileRef} type="file" accept="image/*" multiple
               style={{ position: 'fixed', top: -9999, left: -9999, width: 1, height: 1, opacity: 0 }}
               onChange={handleFileInput} />
        <input key={camKey} ref={camRef} type="file" accept="image/*" capture="environment"
               style={{ position: 'fixed', top: -9999, left: -9999, width: 1, height: 1, opacity: 0 }}

  // Resolve a list of photo records into a `{ id -> dataUrl }` map for export.
  // Prefers the caller's urlMap (already loaded in PhotoPage) and falls back
  // to a photoDB lookup for each missing ref. Legacy inline dataUrl photos
  // pass through unchanged.
  async function resolvePhotoUrls(photos, urlMap) {
    urlMap = urlMap || {};
    const out = {};
    const missing = [];
    for (const ph of (photos || [])) {
      if (!ph) continue;
      if (ph.photoRef && urlMap[ph.photoRef]) {
        out[ph.id] = urlMap[ph.photoRef];
      } else if (ph.photoRef) {
        missing.push(ph);
      } else if (ph.dataUrl) {
        out[ph.id] = ph.dataUrl;
      }
    }
    if (missing.length) {
      const map = await photoDB.getMany(missing.map(p => p.photoRef));
      for (const ph of missing) {
        if (map[ph.photoRef]) out[ph.id] = map[ph.photoRef];
      }
    }
    return out;
  }

  // Caption under a photo in PDF exports: its point number and coordinates in
  // the project's system, how that position was obtained, the note, and one
  // line per voice memo. Returns [{ text, style: 'bold' | 'grey' | 'note' }].
  function _photoPdfCaption(ph, project) {
    const lines = [];
    const pt = fbGeo.mediaPoint(ph, project, 'photo');
    if (pt) {
      const pos = (pt.N !== null && pt.E !== null) ? `N ${pt.text.n}   E ${pt.text.e}`
                : pt.lat !== null ? fbGeo.fmtLatLon(pt.lat, pt.lon) : '';
      const own = !pt.rowId || pt.own;
      const z = pt.text.z ? `   Z ${pt.text.z}`
              : (own && ph.geo && typeof ph.geo.H === 'number') ? `   H ${fbGeo.fmtElev(ph.geo.H)} (phone)` : '';
      lines.push({ text: `${pt.number ? 'Pt ' + pt.number + '   ' : ''}${pos}${z}`.trim(), style: 'bold' });
      const how = !pt.phone ? 'Points page coordinates'
                : pt.from === 'exif' ? 'photo EXIF GPS'
                : fbGeo.fmtAcc(pt.acc);
      lines.push({ text: `${how} · ${fbGeo.projectCrs(project).short}`, style: 'grey' });
    }
    if (ph.note && ph.note.trim()) lines.push({ text: ph.note.trim(), style: 'note' });
    (ph.voice || []).forEach(v => {
      lines.push({ text: `[Voice memo ${fmtDur(v.dur)}]${v.title ? ' ' + v.title : ''}`, style: 'grey' });
    });
    return lines;
  }

  // Body of a Photos page in a PDF: 2×2 photo grid with captions, then a
  // "Voice notes" list — a record that each recording exists (title, length,
  // time, position); the audio itself stays in the app / .fieldbook file.
  // Shared by the whole-project export and the single-page export.
  async function _pdfPhotoPageBody(pdf, page, photos, urls, project, W, H, margin, contentY) {
    photos = photos || [];
    const voice = page.voiceNotes || [];
    if (photos.length === 0 && voice.length === 0) {
      pdf.setTextColor(150, 150, 150); pdf.setFontSize(9);
      pdf.text('(No photos)', W / 2, contentY + 20, { align: 'center' });
      return;
    }
    const bottom = H - margin - 14;
    const colGap = 6, rowGap = 6;
    const cellW = (W - margin * 2 - colGap) / 2;
    const maxImgH = 62, captH = 26, lineH = 3.5, maxCaptLines = 7;
    const cellH = maxImgH + captH;
    let pi = 0, isFirstPage = true, y = contentY + 4;

    while (pi < photos.length) {
      if (!isFirstPage) pdf.addPage();
      isFirstPage = false;
      let py = contentY + 4;
      for (let row = 0; row < 2 && pi < photos.length; row++) {
        for (let col = 0; col < 2 && pi < photos.length; col++) {
          const ph = photos[pi++];
          const url = urls[ph.id];
          const cx = margin + col * (cellW + colGap);
          if (url) {
            try {
              const tmp = new Image();
              await new Promise(res => { tmp.onload = res; tmp.onerror = res; tmp.src = url; });
              const aspect = (tmp.naturalWidth || 4) / (tmp.naturalHeight || 3);
              let imgW = cellW, imgH = imgW / aspect;
              if (imgH > maxImgH) { imgH = maxImgH; imgW = imgH * aspect; }
              pdf.addImage(url, 'JPEG', cx + (cellW - imgW) / 2, py, imgW, imgH);
            } catch { /* skip unloadable */ }
          }
          let ly = py + maxImgH + 4, used = 0;
          for (const ln of _photoPdfCaption(ph, project)) {
            if (used >= maxCaptLines) break;
            if (ln.style === 'bold')      { pdf.setFont('helvetica', 'bold');   pdf.setFontSize(7.5); pdf.setTextColor(28, 28, 28); }
            else if (ln.style === 'grey') { pdf.setFont('helvetica', 'normal'); pdf.setFontSize(6.5); pdf.setTextColor(110, 110, 110); }
            else                          { pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.5); pdf.setTextColor(60, 60, 60); }
            const wrapped = pdf.splitTextToSize(ln.text, cellW).slice(0, ln.style === 'note' ? 2 : 1);
            for (const w of wrapped) {
              if (used >= maxCaptLines) break;
              pdf.text(w, cx + cellW / 2, ly, { align: 'center' });
              ly += lineH; used++;
            }
          }
        }
        py += cellH + rowGap;
      }
      y = py;
    }

    if (voice.length === 0) return;
    const crs = fbGeo.projectCrs(project);
    const usableW = W - margin * 2;
    if (y + 20 > bottom) { pdf.addPage(); y = margin + 6; }
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8); pdf.setTextColor(28, 28, 28);
    pdf.text('VOICE NOTES', margin, y + 3);
    pdf.setDrawColor(180, 180, 180); pdf.setLineWidth(0.2);
    pdf.line(margin, y + 5, W - margin, y + 5);
    y += 10;
    voice.forEach((v, i) => {
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.5);
      const descLines = (v.desc && v.desc.trim()) ? pdf.splitTextToSize(v.desc.trim(), usableW - 6).slice(0, 3) : [];
      const pt = fbGeo.mediaPoint(v, project, 'voice');
      const need = 4.5 + (pt ? 3.8 : 0) + descLines.length * 3.8 + 3;
      if (y + need > bottom) { pdf.addPage(); y = margin + 6; }
      let when = '';
      try { if (v.createdAt) when = new Date(v.createdAt).toLocaleString('en-CA', { dateStyle: 'medium', timeStyle: 'short' }); } catch {}
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8); pdf.setTextColor(28, 28, 28);
      pdf.text(`${i + 1}.  ${v.title || 'Voice note'}`, margin, y);
      pdf.setFont('helvetica', 'normal'); pdf.setTextColor(110, 110, 110);
      pdf.text(`${fmtDur(v.dur)}${when ? '   ' + when : ''}`, W - margin, y, { align: 'right' });
      y += 4.5;
      pdf.setFontSize(7.5);
      if (pt) {
        const pos = (pt.N !== null && pt.E !== null) ? `N ${pt.text.n}   E ${pt.text.e}${pt.text.z ? '   Z ' + pt.text.z : ''}`
                  : pt.lat !== null ? fbGeo.fmtLatLon(pt.lat, pt.lon) : '';
        const how = !pt.phone ? 'Points page coordinates' : fbGeo.fmtAcc(pt.acc);
        pdf.setTextColor(60, 60, 60);
        pdf.text(`${pt.number ? 'Pt ' + pt.number + '   ' : ''}${pos}   (${how} · ${crs.short})`, margin + 6, y);
        y += 3.8;
      }
      pdf.setTextColor(60, 60, 60);
      descLines.forEach(ln => { pdf.text(ln, margin + 6, y); y += 3.8; });
      y += 3;
    });
    if (y + 5 > bottom) { pdf.addPage(); y = margin + 6; }
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(6.5); pdf.setTextColor(140, 140, 140);
    pdf.text('Audio recordings are kept in the FieldBook app and its .fieldbook export. They are not part of this PDF.', margin, y + 2);
  }

  // Single-page photo PDF export (used by per-page export button)
  async function exportPhotoPDF(page, photos, urlMap, toast, project) {
    if (!window.jspdf) { toast({ message: 'PDF library not loaded.', type: 'error' }); return; }
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
    const W = pdf.internal.pageSize.getWidth();
    const H = pdf.internal.pageSize.getHeight();
    const margin = 14;
    const meta = { label: 'Photos', color: '#7C3AED', bg: '#EDE9FE' };
    const F = _initPDFFonts();
    const contentY = _pdfPageHeader(pdf, page, meta, W, H, margin, F);
    const urls = await resolvePhotoUrls(photos, urlMap);
    await _pdfPhotoPageBody(pdf, page, photos, urls, project || { pages: [] }, W, H, margin, contentY);
    const title = page.title?.trim() || 'Photos';
    pdf.save(`${title}.pdf`);
    toast({ message: 'PDF exported.', type: 'success' });
  }

    if (type === 'notes')  return NotesPage;
    if (type === 'points') return DataPage;           // DataPage with locked PNEZD columns

  }
