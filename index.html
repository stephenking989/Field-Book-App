  // ─────────────────────────────────────────────────────────────────────────────
  // DMS ENGINE  — shared by DataPage
  // ─────────────────────────────────────────────────────────────────────────────

  // Parse a DMS string entered by the user into decimal degrees.
  // Accepts all of these formats:
  //   "45 34 23"        → 45°34'23"  (space-separated — the primary fast-entry method)
  //   "45 34"           → 45°34'00"
  //   "45"              → 45°00'00"
  //   "45.5"            → treated as decimal degrees (no spaces)
  // Supported input formats (all accept a leading "-" for south/west):
  //   Classical:      45°34'23"  or  45°34'23.5"  (° ' " with optional spaces)
  //   d/m/s words:    45d34m23s  or  45d 34m 23s  (also handles voice "45 degrees 34 minutes")
  //   Space-sep:      45 34 23   or  45 34         (D M S or D M)
  //   Dash-sep:       45-34-23   or  45-34         (D-M-S, common in voice transcription)
  //   Colon-sep:      45:34:23   or  45:34         (D:M:S — Excel clipboard round-trip format)
  //   DD.MMSS:        45.3423  → 45°34'23"         (exactly 4 decimal digits, valid MM < 60 and SS < 60)
  //   Plain decimal:  45.5722  → 45.5722°          (fallback when not valid DD.MMSS)
  //   Unicode quotes: handles ' " ′ ″ ' ' " " variants from voice/paste
  // Returns decimal degrees (number) or null if unparseable.
  function parseDMSInput(raw) {
    if (!raw || !raw.trim()) return null;
    const s = raw.trim();

    // Strip sign, work with absolute value, reapply at end
    const neg = s.charAt(0) === '-';
    const abs = neg ? s.slice(1).trimStart() : s;
    const sign = neg ? -1 : 1;

    // ── Classical notation: 45°34'23" / 45d34m23s / 45d 34m 23s ──────
    // Degree sep: °  d  (case-insensitive d)
    // Minute sep: '  ′  '  '  m
    // Second sep: "  ″  "  "  s  (optional at end)
    const classicRe = /^(\d+)\s*[°dD]\s*(\d+)\s*['''′m]\s*(\d+(?:\.\d+)?)\s*["""″sS]?$/;
    const cm = abs.match(classicRe);
    if (cm) {
      const d = parseInt(cm[1], 10), m = parseInt(cm[2], 10), sec = parseFloat(cm[3]);
      if (m >= 60 || sec >= 60) return null;
      return sign * (d + m / 60 + sec / 3600);
    }

    // ── Voice variant: "45 degrees 34 minutes 23 seconds" ─────────────
    const wordsRe = /^(\d+)\s+degrees?\s+(\d+)\s+minutes?\s+(\d+(?:\.\d+)?)\s+seconds?$/i;
    const wm = abs.match(wordsRe);
    if (wm) {
      const d = parseInt(wm[1], 10), m = parseInt(wm[2], 10), sec = parseFloat(wm[3]);
      if (m >= 60 || sec >= 60) return null;
      return sign * (d + m / 60 + sec / 3600);
    }

    // ── Space-separated: "45 34 23" or "45 34" ────────────────────────
    const spaceRe = /^(\d+)\s+(\d+)(?:\s+(\d+(?:\.\d+)?))?$/;
    const sm = abs.match(spaceRe);
    if (sm) {
      const d = parseInt(sm[1], 10), m = parseInt(sm[2], 10), sec = sm[3] ? parseFloat(sm[3]) : 0;
      if (m >= 60 || sec >= 60) return null;
      return sign * (d + m / 60 + sec / 3600);
    }

    // ── Dash-separated: "45-34-23" or "45-34" ─────────────────────────
    const dashRe = /^(\d+)-(\d+)(?:-(\d+(?:\.\d+)?))?$/;
    const dm = abs.match(dashRe);
    if (dm) {
      const d = parseInt(dm[1], 10), m = parseInt(dm[2], 10), sec = dm[3] ? parseFloat(dm[3]) : 0;
      if (m >= 60 || sec >= 60) return null;
      return sign * (d + m / 60 + sec / 3600);
    }

    // ── Colon-separated: "45:34:23" or "45:34" ────────────────────────
    // This is the format produced by formatDMSColon() for the Excel clipboard export,
    // so values copied out of the app paste back in cleanly (round-trip).
    const colonRe = /^(\d+):(\d+)(?::(\d+(?:\.\d+)?))?$/;
    const coM = abs.match(colonRe);
    if (coM) {
      const d = parseInt(coM[1], 10), m = parseInt(coM[2], 10), sec = coM[3] ? parseFloat(coM[3]) : 0;
      if (m >= 60 || sec >= 60) return null;
      return sign * (d + m / 60 + sec / 3600);
    }

    // ── DD.MMSS shorthand: exactly 4 decimal digits, MM < 60, SS < 60 ─
    // e.g. 45.3423 → 45°34'23"   127.1505 → 127°15'05"
    // Ambiguous with decimal degrees, but in a DMS column this is the intended interpretation.
    const shortRe = /^(\d+)\.(\d{4})$/;
    const shm = abs.match(shortRe);
    if (shm) {
      const d  = parseInt(shm[1], 10);
      const mm = parseInt(shm[2].slice(0, 2), 10);
      const ss = parseInt(shm[2].slice(2), 10);
      if (mm < 60 && ss < 60) return sign * (d + mm / 60 + ss / 3600);
      // Falls through to plain decimal if MM or SS are out of range
    }

    // ── Plain decimal degrees (final fallback) ─────────────────────────
    const plain = parseFloat(abs);
    if (!isNaN(plain)) return sign * plain;

    return null;
  }

  // Format decimal degrees as D°MM'SS.s" for display in DMS columns.
  function formatDMS(dd) {
    if (dd === null || dd === undefined || isNaN(dd)) return '';
    const sign = dd < 0 ? '-' : '';
    const abs  = Math.abs(dd);
    const d    = Math.floor(abs);
    const mf   = (abs - d) * 60;
    const m    = Math.floor(mf);
    const sf   = (mf - m) * 60;
    let dispS = Math.round(sf), dispM = m, dispD = d;
    if (dispS >= 60) { dispS -= 60; dispM += 1; }   // carry seconds
    if (dispM >= 60) { dispM -= 60; dispD += 1; }   // carry minutes
    return `${sign}${dispD}°${String(dispM).padStart(2,'0')}'${String(dispS).padStart(2,'0')}"`;
  }

  // Format decimal degrees as DD:MM:SS for clipboard export (Excel-compatible angle format).
  function formatDMSColon(dd) {
    if (dd === null || dd === undefined || isNaN(dd)) return '';
    const sign = dd < 0 ? '-' : '';
    const abs  = Math.abs(dd);
    const d    = Math.floor(abs);
    const mf   = (abs - d) * 60;
    const m    = Math.floor(mf);
    let dispS = Math.round((mf - m) * 60), dispM = m, dispD = d;
    if (dispS >= 60) { dispS -= 60; dispM += 1; }
    if (dispM >= 60) { dispM -= 60; dispD += 1; }
    return `${sign}${dispD}:${String(dispM).padStart(2,'0')}:${String(dispS).padStart(2,'0')}`;
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // HYPERFORMULA SURVEY PLUGIN
  // Registers custom surveyor functions once, before any HF instance is created.
  // Safe to call multiple times — guarded by window._fbSurveyPluginRegistered.
  // ─────────────────────────────────────────────────────────────────────────────
  // ─────────────────────────────────────────────────────────────────────────────
  // CUSTOM SURVEYOR FUNCTIONS
  // Evaluated in plain JavaScript AFTER HyperFormula runs — avoiding HF's plugin
  // API entirely (which breaks under Babel standalone's class-inheritance model).
  //
  // Supported formulas (entire cell must be one of these calls):
  //   =HDIST(slope_dist, zenith_deg)       horizontal distance
  //   =VDIST(slope_dist, zenith_deg)       vertical distance
  //   =AZIMUTH(n1, e1, n2, e2)            bearing 0-360°
  //   =DISTANCE(n1, e1, n2, e2)           Pythagorean distance
  //   =DEG2RAD(degrees)                   degrees → radians
  //   =RAD2DEG(radians)                   radians → degrees
  //
  // Arguments can be numeric literals or simple cell references (A1, $B$3, etc.).
  // ─────────────────────────────────────────────────────────────────────────────

  const SURVEY_FUNCS = {
    HDIST:    (d, z) => d * Math.sin(z * Math.PI / 180),
    VDIST:    (d, z) => d * Math.cos(z * Math.PI / 180),
    AZIMUTH:  (n1, e1, n2, e2) => (((Math.atan2(e2 - e1, n2 - n1) * 180 / Math.PI) % 360) + 360) % 360,
    DISTANCE: (n1, e1, n2, e2) => Math.sqrt((n2 - n1) ** 2 + (e2 - e1) ** 2),
    DEG2RAD:  (d) => d * Math.PI / 180,
    RAD2DEG:  (r) => r * 180 / Math.PI,
  };

  // "A" → 0, "B" → 1, "AA" → 26, etc.
  function colLetterToIndex(letters) {
    let n = 0;
    for (let i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64);
    return n - 1;
  }

  // Try to evaluate a single-call surveyor formula using live HF cell values.
  // Returns a Number on success, an error string on formula error, or null when
  // the formula is not a recognized surveyor function (so caller can fall through).
  function evalSurveyFormula(formula, hf) {
    if (!formula || !formula.startsWith('=')) return null;
    // Match:  =FUNCNAME( ... )
    const m = formula.slice(1).trim().match(/^([A-Z][A-Z0-9_]*)\s*\((.+)\)$/i);
    if (!m) return null;
    const fn = SURVEY_FUNCS[m[1].toUpperCase()];
    if (!fn) return null;

    // Resolve each comma-separated argument to a number
    const args = m[2].split(',').map(raw => {
      const s = raw.trim();
      // Simple cell reference: A1  $B$3  a1  etc.
      const cellM = s.match(/^\$?([A-Z]+)\$?(\d+)$/i);
      if (cellM && hf) {
        const v = hf.getCellValue({ sheet: 0, row: parseInt(cellM[2], 10) - 1, col: colLetterToIndex(cellM[1].toUpperCase()) });
        if (typeof v === 'number') return v;
        const n = parseFloat(v);
        return isNaN(n) ? NaN : n;
      }
      // Numeric literal (handles negatives: -1.5)
      const n = parseFloat(s);
      return isNaN(n) ? NaN : n;
    });

    if (args.some(isNaN)) return '#VALUE!';
    try {
      const result = fn(...args);
      return isFinite(result) && !isNaN(result) ? result : '#DIV/0!';
    } catch (_) {
      return '#ERR';
    }
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // FORMULA FILL — relative/absolute reference shifting for drag-fill
  // ─────────────────────────────────────────────────────────────────────────────

  // Shift all *relative* row numbers in a formula string by `offset` rows.
  // Rules match Excel:
  //   A1   → relative col + relative row  → shift row
  //   $A1  → absolute col + relative row  → shift row
  //   A$1  → relative col + absolute row  → keep row
  //   $A$1 → absolute col + absolute row  → keep row
  function shiftFormulaDown(formula, offset) {
    if (!formula.startsWith('=') || offset === 0) return formula;
    return formula.replace(/(\$?)([A-Z]+)(\$?)(\d+)/g, (match, dc, col, dr, row) => {
      if (dr === '$') return match;   // absolute row — leave untouched
      const newRow = parseInt(row, 10) + offset;
      return newRow < 1 ? match : dc + col + dr + newRow;
    });
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // DMS NUMPAD
  // Full-screen bottom panel for rapid DMS entry on mobile — suppresses the
  // native OS keyboard when a DMS column cell is being edited.
  // ─────────────────────────────────────────────────────────────────────────────
  function DmsNumpad({ value, onChange, onCommit, onDismiss }) {
    // Top row: digits + DMS symbols. Bottom: wide space bar.
    const rows = [
      [
        { label: '7', cls: 'digit' }, { label: '8', cls: 'digit' },
        { label: '9', cls: 'digit' }, { label: '°', cls: 'sym' },
      ],
      [
        { label: '4', cls: 'digit' }, { label: '5', cls: 'digit' },
        { label: '6', cls: 'digit' }, { label: "'", cls: 'sym' },
      ],
      [
        { label: '1', cls: 'digit' }, { label: '2', cls: 'digit' },
        { label: '3', cls: 'digit' }, { label: '"', cls: 'sym' },
      ],
      [
        { label: '±', cls: 'special' }, { label: '0', cls: 'digit' },
        { label: '⌫', cls: 'del' },    { label: '✓', cls: 'confirm' },
      ],
    ];

    function tap(key) {
      if (key === '⌫') { onChange(value.slice(0, -1)); return; }
      if (key === '✓') { onCommit(); return; }
      if (key === '±') {
        onChange(value.startsWith('-') ? value.slice(1) : '-' + value);
        return;
      }
      onChange(value + key);
    }

    const isEmpty = !value || !value.trim();

    return (
      <div className="dp-numpad">
        {/* Value preview */}
        <div className={`dp-numpad-preview${isEmpty ? ' empty' : ''}`}>
          {isEmpty ? '0' : value}
        </div>
        {/* Main key grid */}
        <div className="dp-numpad-grid">
          {rows.flat().map((k, i) => (
            <button key={i} className={`dp-numpad-btn ${k.cls}`}
              onPointerDown={e => { e.preventDefault(); tap(k.label); }}>
              {k.label}
            </button>
          ))}
        </div>
        {/* Wide space bar */}
        <button className="dp-numpad-space"
          onPointerDown={e => { e.preventDefault(); onChange(value + ' '); }}>
          SPACE
        </button>
        <button className="dp-numpad-dismiss"
          onPointerDown={e => { e.preventDefault(); onDismiss(); }}>
          dismiss keyboard
        </button>
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // HYPERFORMULA ENGINE  — one instance per DataPage mount
  // ─────────────────────────────────────────────────────────────────────────────

  // Return the effective type for a single cell: per-cell override wins over column default.
  function getCellType(row, col) {
    return (row?.cellMeta || {})[col?.id]?.colType || col?.colType || 'num';
  }

  // Build a 2-D array of raw values suitable for HyperFormula from the page data.
  // DMS columns/cells store their decimal-degree equivalent so formulas work numerically.
  function buildHFSheet(columns, rows) {
    return rows.map(row =>
      columns.map(col => {
        const raw = (row.cells || {})[col.id] || '';
        if (!raw.trim()) return '';
        if (raw.startsWith('=')) return raw;   // formula — pass through
        if (getCellType(row, col) === 'dms') {
          const dd = parseDMSInput(raw);
          return dd !== null ? dd : raw;
        }
        const num = parseFloat(raw);
        return isNaN(num) ? raw : num;
      })
    );
  }

  // Evaluate all formula cells for export functions that run outside React.
  // Returns a map { "rowId_colId": displayString } same shape as calcResults state.
  function evalDataPageCells(columns, rows) {
    const results = {};
    if (typeof HyperFormula === 'undefined' || !columns.length || !rows.length) return results;
    try {
      const sheetData = buildHFSheet(columns, rows);
      const hf = HyperFormula.buildFromArray(sheetData, { licenseKey: 'gpl-v3', precisionRounding: 10 });
      rows.forEach((row, ri) => {
        columns.forEach((col, ci) => {
          const raw = (row.cells || {})[col.id] || '';
          if (!raw.trim()) return;
          const key = row.id + '_' + col.id;
          const cellType = getCellType(row, col);
          if (raw.startsWith('=')) {
            try {
              const val = hf.getCellValue({ sheet: 0, row: ri, col: ci });
              if (typeof val === 'number') {
                results[key] = cellType === 'dms' ? formatDMS(val) : String(Math.round(val * 1e8) / 1e8);
              } else if (val instanceof Error || (val && val.type)) {
                const custom = evalSurveyFormula(raw, hf);
                results[key] = custom !== null
                  ? (typeof custom === 'number'
                      ? (cellType === 'dms' ? formatDMS(custom) : String(Math.round(custom * 1e8) / 1e8))
                      : String(custom))
                  : '#ERR';
              } else {
                results[key] = String(val ?? '');
              }
            } catch(e) { results[key] = '#ERR'; }
          } else if (cellType === 'dms') {
            const dd = parseDMSInput(raw);
            if (dd !== null) results[key] = formatDMS(dd);
          }
        });
      });
      try { hf.destroy(); } catch(e) {}
    } catch(e) {}
    return results;
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // POINTS PAGE TOOLS — inverse between two points, description code chips (beta)
  // ─────────────────────────────────────────────────────────────────────────────

  // Grid inverse from point A to point B (PNEZD rows). Returns null when either
  // point lacks a northing/easting. Azimuth is grid, clockwise from grid north.
  function pointInverse(a, b) {
    const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : null; };
    const n1 = num(a.cells?.col_north), e1 = num(a.cells?.col_east);
    const n2 = num(b.cells?.col_north), e2 = num(b.cells?.col_east);
    if (n1 === null || e1 === null || n2 === null || e2 === null) return null;
    const dN = n2 - n1, dE = e2 - e1;
    const hd = Math.hypot(dN, dE);
    let az = Math.atan2(dE, dN) * 180 / Math.PI;
    if (az < 0) az += 360;
    const z1 = num(a.cells?.col_elev), z2 = num(b.cells?.col_elev);
    const dZ = z1 !== null && z2 !== null ? z2 - z1 : null;
    return { dN, dE, hd, az, dZ, sd: dZ !== null ? Math.hypot(hd, dZ) : null };
  }

  // Quadrant bearing, e.g. N 45°12'30" E. A zero-length line has no bearing.
  function quadrantBearing(az, hd) {
    if (!(hd > 0)) return '—';
    if (az <= 90)  return `N ${formatDMS(az)} E`;
    if (az <= 180) return `S ${formatDMS(180 - az)} E`;
    if (az <= 270) return `S ${formatDMS(az - 180)} W`;
    return `N ${formatDMS(360 - az)} W`;
  }

  function inverseText(fromPt, toPt, inv) {
    const f = v => v.toFixed(3);
    const lines = [
      `Inverse ${fromPt} → ${toPt}`,
      `Bearing ${quadrantBearing(inv.az, inv.hd)}  (Az ${inv.hd > 0 ? formatDMS(inv.az) : '—'})`,
      `HD ${f(inv.hd)} m`,
      `ΔN ${f(inv.dN)}  ΔE ${f(inv.dE)}`,
    ];
    if (inv.dZ !== null) lines.push(`ΔElev ${f(inv.dZ)}  SD ${f(inv.sd)}`);
    return lines.join('\n');
  }

  // Sheet: pick two point numbers on this page and read the inverse.
  function InverseSheet({ rows, initialFrom, initialTo, onClose }) {
    const [from, setFrom] = useState(initialFrom || '');
    const [to, setTo]     = useState(initialTo || '');
    const trapRef = useRef(null);
    useFocusTrap(trapRef, true, onClose);
    const toast = useToast();
    const find = pt => rows.find(r => String(r.cells?.col_ptnum ?? '').trim().toLowerCase() === pt.trim().toLowerCase());
    const a = from.trim() ? find(from) : null;
    const b = to.trim() ? find(to) : null;
    const inv = a && b ? pointInverse(a, b) : null;
    const problem = !from.trim() || !to.trim() ? null
      : !a ? `No point ${from.trim()} on this page`
      : !b ? `No point ${to.trim()} on this page`
      : !inv ? 'Both points need a northing and easting'
      : null;
    const f = v => v.toFixed(3);
    const inputCls = 'w-full px-3 py-3 rounded-xl text-base font-data text-fb-ink bg-fb-field border border-fb-border outline-none focus:border-fb-accent placeholder:text-fb-ink-faint';

    async function copy() {
      if (!inv) return;
      const text = inverseText(from.trim(), to.trim(), inv);
      try { await navigator.clipboard.writeText(text); toast.success('Inverse copied'); }
      catch { toast.error('Copy failed'); }
    }

    return (
      <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
        <div ref={trapRef} className="modal-sheet">
          <div className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4" />
          <div className="flex items-baseline justify-between mb-4">
            <h2 className="text-xl font-bold text-fb-ink">Inverse</h2>
            <span className="text-xs font-semibold text-fb-ink-muted font-data">Grid</span>
          </div>
          <div className="flex gap-2 mb-3">
            <div className="flex-1">
              <p className="text-[10px] font-bold text-fb-ink-muted uppercase tracking-widest mb-1.5">From Pt #</p>
              <input className={inputCls} value={from} onChange={e => setFrom(e.target.value)} inputMode="numeric" autoFocus={!initialFrom} />
            </div>
            <div className="flex-1">
              <p className="text-[10px] font-bold text-fb-ink-muted uppercase tracking-widest mb-1.5">To Pt #</p>
              <input className={inputCls} value={to} onChange={e => setTo(e.target.value)} inputMode="numeric" autoFocus={!!initialFrom && !initialTo} />
            </div>
          </div>
          {problem && <p className="text-sm text-fb-warn mb-3">{problem}</p>}
          {inv && (
            <div className="rounded-xl px-4 py-3 text-center bg-fb-field border border-fb-border mb-3" data-inverse-result>
              <p className="text-[10px] font-bold text-fb-ink-muted uppercase tracking-widest mb-1">Bearing</p>
              <p className="font-data text-fb-ink text-[26px] leading-tight">{quadrantBearing(inv.az, inv.hd)}</p>
              <p className="text-xs text-fb-ink-muted mt-1 font-data">Az {inv.hd > 0 ? formatDMS(inv.az) : '—'}</p>
              <p className="font-data text-fb-ink text-[22px] leading-tight mt-2">{f(inv.hd)} m</p>
              <p className="text-xs text-fb-ink-muted mt-1 font-data">ΔN {f(inv.dN)} · ΔE {f(inv.dE)}</p>
              {inv.dZ !== null && <p className="text-xs text-fb-ink-muted font-data">ΔElev {f(inv.dZ)} · SD {f(inv.sd)}</p>}
            </div>
          )}
          <div className="flex gap-2">
            <button className="py-3 px-5 rounded-xl text-sm font-medium text-fb-ink-muted bg-black/[0.04] active:bg-fb-page-deep" onClick={onClose}>Close</button>
            <button className="flex-1 py-3.5 rounded-xl text-base font-semibold text-white bg-fb-accent active:opacity-80 disabled:bg-fb-ink-faint" disabled={!inv} onClick={copy}>Copy result</button>
          </div>
        </div>
      </div>
    );
  }

  // Bearing text → grid azimuth in decimal degrees, or null. Takes an azimuth
  // in any DMS form parseDMSInput reads (123 45 30, 123.4530, 123°45'30"), or a
  // quadrant bearing: N 45 12 30 E, S45.1230W.
  function parseBearing(raw) {
    const s = String(raw ?? '').trim();
    if (!s) return null;
    const q = s.match(/^([NS])\s*(.+?)\s*([EW])$/i);
    if (q) {
      const a = parseDMSInput(q[2]);
      if (a === null || a < 0 || a > 90) return null;
      const ns = q[1].toUpperCase(), ew = q[3].toUpperCase();
      const az = ns === 'N' ? (ew === 'E' ? a : 360 - a) : (ew === 'E' ? 180 - a : 180 + a);
      return az % 360;
    }
    const az = parseDMSInput(s);
    return az === null || az < 0 || az >= 360 ? null : az;
  }

  // New point from a known point, a grid azimuth and a horizontal distance.
  function forwardPoint(n, e, az, hd) {
    const r = az * Math.PI / 180;
    return { n: n + hd * Math.cos(r), e: e + hd * Math.sin(r) };
  }

  const ptKey = v => String(v ?? '').trim().toLowerCase();
  const findPt = (rows, num) => num.trim() ? rows.find(r => ptKey(r.cells?.col_ptnum) === ptKey(num)) : null;
  const ptNE = r => {
    const num = v => { const x = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(x) ? x : null; };
    const n = num(r?.cells?.col_north), e = num(r?.cells?.col_east);
    return n === null || e === null ? null : { n, e };
  };
  const sheetLabel = 'text-[10px] font-bold text-fb-ink-muted uppercase tracking-widest mb-1.5';
  const sheetInput = 'w-full px-3 py-3 rounded-xl text-base font-data text-fb-ink bg-fb-field border border-fb-border outline-none focus:border-fb-accent placeholder:text-fb-ink-faint';

  // Sheet: forward a new point (bearing + distance) from a point on this page.
  function ForwardPointSheet({ rows, projectId, initialFrom, suggestNum, onAdd, onClose }) {
    const [from, setFrom] = useState(initialFrom || '');
    const [brg, setBrg]   = useState('');
    const [dist, setDist] = useState('');
    const [num, setNum]   = useState(suggestNum || '');
    const [desc, setDesc] = useState('');
    const trapRef = useRef(null);
    useFocusTrap(trapRef, true, onClose);

    const a  = findPt(rows, from);
    const ne = ptNE(a);
    const az = parseBearing(brg);
    const hd = parseFloat(String(dist).replace(/,/g, ''));
    const taken = num.trim() && isPtNumTaken(projectId, num.trim());
    const res = ne && az !== null && isFinite(hd) && hd > 0 ? forwardPoint(ne.n, ne.e, az, hd) : null;
    const problem = from.trim() && !a ? `No point ${from.trim()} on this page`
      : a && !ne ? `Point ${from.trim()} needs a northing and easting`
      : brg.trim() && az === null ? 'Can\'t read that bearing'
      : dist.trim() && !(hd > 0) ? 'Distance must be more than 0'
      : taken ? `Point ${num.trim()} is already used`
      : null;
    const canAdd = res && num.trim() && !taken;

    function add() {
      if (!canAdd) return;
      onAdd({ number: num.trim(), n: res.n.toFixed(3), e: res.e.toFixed(3), desc: desc.trim() });
    }

    return (
      <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
        <div ref={trapRef} className="modal-sheet" data-forward-sheet>
          <div className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4" />
          <div className="flex items-baseline justify-between mb-4">
            <h2 className="text-xl font-bold text-fb-ink">Forward point</h2>
            <span className="text-xs font-semibold text-fb-ink-muted font-data">Grid</span>
          </div>
          <div className="flex gap-2 mb-3">
            <div className="w-24">
              <p className={sheetLabel}>From Pt #</p>
              <input className={sheetInput} value={from} onChange={e => setFrom(e.target.value)} inputMode="numeric" autoFocus={!initialFrom} data-fwd-from />
            </div>
            <div className="flex-1">
              <p className={sheetLabel}>Bearing or azimuth</p>
              <input className={sheetInput} value={brg} onChange={e => setBrg(e.target.value)} placeholder="N 45 12 30 E" autoFocus={!!initialFrom} data-fwd-brg />
            </div>
          </div>
          <div className="flex gap-2 mb-3">
            <div className="flex-1">
              <p className={sheetLabel}>HD (m)</p>
              <input className={sheetInput} value={dist} onChange={e => setDist(e.target.value)} inputMode="decimal" data-fwd-dist />
            </div>
            <div className="w-24">
              <p className={sheetLabel}>New Pt #</p>
              <input className={sheetInput} value={num} onChange={e => setNum(e.target.value)} inputMode="numeric" data-fwd-num />
            </div>
          </div>
          <p className={sheetLabel}>Description</p>
          <input className={`${sheetInput} mb-3`} value={desc} onChange={e => setDesc(e.target.value)} data-fwd-desc />
          {problem && <p className="text-sm text-fb-warn mb-3">{problem}</p>}
          {res && (
            <div className="rounded-xl px-4 py-3 text-center bg-fb-field border border-fb-border mb-3" data-forward-result>
              <p className="text-xs text-fb-ink-muted font-data mb-1">{quadrantBearing(az, hd)} · Az {formatDMS(az)}</p>
              <p className="font-data text-fb-ink text-[22px] leading-tight">N {res.n.toFixed(3)}</p>
              <p className="font-data text-fb-ink text-[22px] leading-tight">E {res.e.toFixed(3)}</p>
            </div>
          )}
          <div className="flex gap-2">
            <button className="py-3 px-5 rounded-xl text-sm font-medium text-fb-ink-muted bg-black/[0.04] active:bg-fb-page-deep" onClick={onClose}>Close</button>
            <button className="flex-1 py-3.5 rounded-xl text-base font-semibold text-white bg-fb-accent active:opacity-80 disabled:bg-fb-ink-faint" disabled={!canAdd} onClick={add}>
              {num.trim() ? `Add point ${num.trim()}` : 'Add point'}
            </button>
          </div>
        </div>
      </div>
    );
  }

  // Stakeout from an occupied point: angle turned clockwise from the backsight
  // to the target, and the horizontal distance to set out.
  function stakeout(oc, bs, tg) {
    const azBs = pointInverse(oc, bs), azTg = pointInverse(oc, tg);
    if (!azBs || !azTg || !(azBs.hd > 0) || !(azTg.hd > 0)) return null;
    const right = ((azTg.az - azBs.az) % 360 + 360) % 360;
    return { right, left: right === 0 ? 0 : 360 - right, hd: azTg.hd, az: azTg.az, bsAz: azBs.az, bsHd: azBs.hd, dZ: azTg.dZ };
  }

  function StakeoutSheet({ rows, initialOc, onClose }) {
    const [oc, setOc] = useState(initialOc || '');
    const [bs, setBs] = useState('');
    const [tg, setTg] = useState('');
    const trapRef = useRef(null);
    useFocusTrap(trapRef, true, onClose);
    const toast = useToast();
    const pts = [oc, bs, tg].map(v => findPt(rows, v));
    const names = [oc, bs, tg].map(v => v.trim());
    const missing = names.findIndex((v, i) => v && !pts[i]);
    const noNE = names.findIndex((v, i) => pts[i] && !ptNE(pts[i]));
    const same = names[0] && (ptKey(names[0]) === ptKey(names[1]) || ptKey(names[0]) === ptKey(names[2]));
    const so = pts.every(Boolean) && noNE < 0 && !same ? stakeout(pts[0], pts[1], pts[2]) : null;
    const problem = missing >= 0 ? `No point ${names[missing]} on this page`
      : noNE >= 0 ? `Point ${names[noNE]} needs a northing and easting`
      : same ? 'Backsight and target must differ from the occupied point'
      : null;
    const f = v => v.toFixed(3);

    async function copy() {
      if (!so) return;
      const lines = [
        `Stakeout ${names[2]} from ${names[0]}, BS ${names[1]}`,
        `Turn right ${formatDMS(so.right)}  (left ${formatDMS(so.left)})`,
        `HD ${f(so.hd)} m  Az ${formatDMS(so.az)}`,
        `BS Az ${formatDMS(so.bsAz)}  HD ${f(so.bsHd)}`,
      ];
      if (so.dZ !== null) lines.push(`ΔElev ${f(so.dZ)}`);
      try { await navigator.clipboard.writeText(lines.join('\n')); toast.success('Stakeout copied'); }
      catch { toast.error('Copy failed'); }
    }

    const field = (label, val, set, key, focus) => (
      <div className="flex-1">
        <p className={sheetLabel}>{label}</p>
        <input className={sheetInput} value={val} onChange={e => set(e.target.value)} inputMode="numeric" autoFocus={focus} data-so={key} />
      </div>
    );

    return (
      <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
        <div ref={trapRef} className="modal-sheet" data-stakeout-sheet>
          <div className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4" />
          <div className="flex items-baseline justify-between mb-4">
            <h2 className="text-xl font-bold text-fb-ink">Stakeout</h2>
            <span className="text-xs font-semibold text-fb-ink-muted font-data">Grid</span>
          </div>
          <div className="flex gap-2 mb-3">
            {field('Occupied', oc, setOc, 'oc', !initialOc)}
            {field('Backsight', bs, setBs, 'bs', !!initialOc)}
            {field('Target', tg, setTg, 'tg', false)}
          </div>
          {problem && <p className="text-sm text-fb-warn mb-3">{problem}</p>}
          {so && (
            <div className="rounded-xl px-4 py-3 text-center bg-fb-field border border-fb-border mb-3" data-stakeout-result>
              <p className="text-[10px] font-bold text-fb-ink-muted uppercase tracking-widest mb-1">Turn right from BS</p>
              <p className="font-data text-fb-ink text-[26px] leading-tight">{formatDMS(so.right)}</p>
              <p className="text-xs text-fb-ink-muted mt-1 font-data">Left {formatDMS(so.left)}</p>
              <p className="text-[10px] font-bold text-fb-ink-muted uppercase tracking-widest mt-3 mb-1">HD to target</p>
              <p className="font-data text-fb-ink text-[22px] leading-tight">{f(so.hd)} m</p>
              <p className="text-xs text-fb-ink-muted mt-1 font-data">Az {formatDMS(so.az)} · BS Az {formatDMS(so.bsAz)}</p>
              {so.dZ !== null && <p className="text-xs text-fb-ink-muted font-data">ΔElev {f(so.dZ)}</p>}
            </div>
          )}
          <div className="flex gap-2">
            <button className="py-3 px-5 rounded-xl text-sm font-medium text-fb-ink-muted bg-black/[0.04] active:bg-fb-page-deep" onClick={onClose}>Close</button>
            <button className="flex-1 py-3.5 rounded-xl text-base font-semibold text-white bg-fb-accent active:opacity-80 disabled:bg-fb-ink-faint" disabled={!so} onClick={copy}>Copy result</button>
          </div>
        </div>
      </div>
    );
  }

  // Description codes. The editable list is a device preference (fb_desc_codes);
  // recent codes come from the first word of this page's descriptions.
  const DEFAULT_DESC_CODES = ['IB', 'IP', 'CP', 'BM', 'PP', 'FH', 'CL', 'EP', 'TOB', 'BOB'];
  function loadDescCodes() {
    try {
      const v = JSON.parse(localStorage.getItem('fb_desc_codes'));
      if (Array.isArray(v)) return v.filter(c => typeof c === 'string' && c.trim());
    } catch {}
    return DEFAULT_DESC_CODES;
  }
  function saveDescCodes(codes) {
    try { localStorage.setItem('fb_desc_codes', JSON.stringify(codes)); } catch {}
  }
  function recentDescCodes(rows, max = 6) {
    const out = [];
    for (let i = rows.length - 1; i >= 0 && out.length < max; i--) {
      const w = String(rows[i].cells?.col_desc ?? '').trim().split(/\s+/)[0];
      if (w && !out.includes(w.toUpperCase())) out.push(w.toUpperCase());
    }
    return out;
  }
  function parseDescCodes(text) {
    const seen = new Set();
    return text.split(/[\s,;]+/).map(c => c.trim().toUpperCase()).filter(c => c && !seen.has(c) && seen.add(c));
  }

  function DescCodesSheet({ codes, onSave, onClose }) {
    const [text, setText] = useState(codes.join(' '));
    const trapRef = useRef(null);
    useFocusTrap(trapRef, true, onClose);
    return (
      <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
        <div ref={trapRef} className="modal-sheet">
          <div className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4" />
          <h2 className="text-xl font-bold text-fb-ink mb-4">Description codes</h2>
          <p className="text-[10px] font-bold text-fb-ink-muted uppercase tracking-widest mb-1.5">Codes</p>
          <textarea rows={4} value={text} onChange={e => setText(e.target.value)} autoCapitalize="characters" spellCheck={false}
            className="w-full px-3 py-3 rounded-xl text-base font-data text-fb-ink bg-fb-field border border-fb-border outline-none focus:border-fb-accent placeholder:text-fb-ink-faint mb-4"
            placeholder="IB IP CP BM" />
          <div className="flex gap-2">
            <button className="py-3 px-5 rounded-xl text-sm font-medium text-fb-ink-muted bg-black/[0.04] active:bg-fb-page-deep" onClick={() => setText(DEFAULT_DESC_CODES.join(' '))}>Reset</button>
            <button className="flex-1 py-3.5 rounded-xl text-base font-semibold text-white bg-fb-accent active:opacity-80" onClick={() => onSave(parseDescCodes(text))}>Save codes</button>
          </div>
        </div>
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // DATA PAGE
  // ─────────────────────────────────────────────────────────────────────────────

  function DataPage({ page, projectId, onReload, onRegisterExports }) {
    const columns = page.columns || [];
    const [rows, setRows]               = useState(page.rows || []);
    const [activeCell, setActiveCell]   = useState(null);   // { rowIdx, colIdx }
    const [editingCell, setEditingCell] = useState(null);   // { rowIdx, colIdx }
    const [editValue, setEditValue]     = useState('');
    const [formulaBarVal, setFormulaBarVal] = useState('');
    const [colModal, setColModal]       = useState(null);   // null | { col }
    const [colModalForm, setColModalForm] = useState({});
    const [templateModal, setTemplateModal] = useState(false);
    const [customTemplates, setCustomTemplates] = useState(() => DB.getCustomTemplates());
    const [openTbMenu, setOpenTbMenu]   = useState(null); // 'insert' | 'formulas' | 'view' | 'edit' | null
    const [insertSub, setInsertSub]     = useState(null); // 'rows' | 'cols' — the list open inside Insert ▾
    const [csvImportModal, setCsvImportModal] = useState(null); // null | { parsed, useHeader }
    const [gpsOpen, setGpsOpen]         = useState(false);  // GPS capture sheet (points pages)
    const [inverseOpen, setInverseOpen] = useState(null);   // { from, to } while the Inverse sheet is open
    const [forwardOpen, setForwardOpen] = useState(null);   // { from } while the Forward point sheet is open
    const [stakeoutOpen, setStakeoutOpen] = useState(null); // { oc } while the Stakeout sheet is open
    const [descCodes, setDescCodes]     = useState(loadDescCodes);
    const [codesOpen, setCodesOpen]     = useState(false);
    const [srcFilter, setSrcFilter]     = useState('all');  // points pages: 'all' | a fbGeo.SOURCES key
    const [menuPos, setMenuPos]         = useState({ top: 0, left: 0 }); // fixed-position for open dropdown
    // DMS keyboard — global setting persisted in localStorage, OFF by default
    const [dmsKeyboard, setDmsKeyboard] = useState(() => {
      try { return localStorage.getItem('fb_dms_keyboard') === 'true'; } catch { return false; }
    });
    const [hf, setHf]                   = useState(null);
    const [calcResults, setCalcResults] = useState({});    // { 'r_xxx_cId': displayValue }
    const [selectionAnchor, setSelectionAnchor] = useState(null); // { rowIdx, colIdx }
    const [dragStartCol, setDragStartCol] = useState(null);
    const [dragOverCol,  setDragOverCol]  = useState(null);
    const [dragStartRow, setDragStartRow] = useState(null);
    const [dragOverRow,  setDragOverRow]  = useState(null);
    const [headerOpen, setHeaderOpen]       = useState(false);
    const [fillDragRow, setFillDragRow]     = useState(null); // row index the fill handle is dragged to
    const inputRef        = useRef(null);
    const fbInputRef      = useRef(null);
    const tableRef        = useRef(null);
    const pdfContainerRef = useRef(null);
    const colModalRef     = useRef(null);
    const templateModalRef = useRef(null);
    const tbMenuRef       = useRef(null); // ref on the open dropdown panel
    const copyAnchorRef   = useRef(null); // { rowIdx, colIdx } of top-left cell at last copy
    const isDraggingSelRef = useRef(false); // true while mouse-drag cell selection is active
    const fbFocusedRef     = useRef(false); // true while formula bar input has focus
    const rowsHistoryRef  = useRef([]);    // undo stack — array of past rows snapshots (max 50)
    const [canUndo, setCanUndo] = useState(false);
    const fillDragRef      = useRef({ active: false, startRow: -1, startCol: -1 });
    const lpTimerRef       = useRef(null);  // long-press timer ID (touch only)
    const lpStartRef       = useRef(null);  // { x, y, ri, ci } at touch pointerdown
    const touchDragRef     = useRef(null);  // a row / column under a finger: { kind, from, over, x, y, active, timer }
    const touchDragDoneRef = useRef(0);     // when the last touch drag was dropped (ms)
    const touchDragFns     = useRef({});    // this render's move / end handlers, for the document listeners
    // ── Formula ref selection (mobile range picker) ─────────────
    const [formulaRefSel, setFormulaRefSel] = useState(null);
    // { r1, c1, r2, c2 } — range highlighted for formula ref insertion
    const formulaRefInsertPosRef = useRef(null);
    // { start, len } — position in formula text where ref was inserted (for replacement)
    const formulaTouchRef = useRef(null);
    // { x, y, ri, ci } — touch start for tap-vs-scroll discrimination in formula mode
    const formulaHandleDragRef = useRef(null);
    // { handle: 'tr'|'bl', anchorRi, anchorCi } — active corner handle drag state
    useFocusTrap(colModalRef, !!colModal, () => setColModal(null));
    useFocusTrap(templateModalRef, templateModal, () => setTemplateModal(false));
    const toast = useToast();

    // Sync rows when page changes
    useEffect(() => { setRows(page.rows || []); setSrcFilter('all'); }, [page.id]);

    // Reset drag-selection flag on global pointer-up (handles releases outside cells)
    useEffect(() => {
      const fn = () => { isDraggingSelRef.current = false; };
      document.addEventListener('pointerup', fn);
      return () => document.removeEventListener('pointerup', fn);
    }, []);

    // Touch drag of a row or column: follow the finger wherever it goes, and
    // keep the table from scrolling under it while something is being carried.
    useEffect(() => {
      const move = e => touchDragFns.current.move && touchDragFns.current.move(e);
      const end  = e => touchDragFns.current.end && touchDragFns.current.end(e);
      const hold = e => { if (touchDragRef.current && touchDragRef.current.active) e.preventDefault(); };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', end);
      document.addEventListener('pointercancel', end);
      document.addEventListener('touchmove', hold, { passive: false });
      return () => {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', end);
        document.removeEventListener('pointercancel', end);
        document.removeEventListener('touchmove', hold);
        if (touchDragRef.current && touchDragRef.current.timer) clearTimeout(touchDragRef.current.timer);
      };
    }, []);

    // Close toolbar dropdown on outside click
    useEffect(() => {
      if (!openTbMenu) return;
      const fn = (e) => {
        if (tbMenuRef.current && !tbMenuRef.current.contains(e.target)) {
          setOpenTbMenu(null);
        }
      };
      document.addEventListener('pointerdown', fn, true);
      return () => document.removeEventListener('pointerdown', fn, true);
    }, [openTbMenu]);

    // Keep the open dropdown on screen: it opens under its button, which on a
    // phone can run it off the right edge. It also scrolls if it is too tall.
    React.useLayoutEffect(() => {
      const el = tbMenuRef.current;
      if (!openTbMenu || !el) return;
      const left = Math.max(4, Math.min(menuPos.left, window.innerWidth - el.offsetWidth - 4));
      const maxH = Math.max(120, Math.floor(window.innerHeight - menuPos.top - 6));
      if (left !== menuPos.left || maxH !== menuPos.maxH) setMenuPos({ top: menuPos.top, left, maxH });
    }, [openTbMenu, insertSub, menuPos.left, menuPos.top, menuPos.maxH]);
    const tbPanelAt = { top: menuPos.top, left: menuPos.left, maxHeight: menuPos.maxH, overflowY: 'auto' };

    // Initialise / refresh HyperFormula whenever rows or columns change
    useEffect(() => {
      if (typeof HyperFormula === 'undefined') return;
      try {
        const sheetData = buildHFSheet(columns, rows);
        let instance;
        if (hf) {
          try { hf.destroy(); } catch(e) {}
        }
        instance = HyperFormula.buildFromArray(sheetData, {
          licenseKey: 'gpl-v3',
          precisionRounding: 10,
        });
        setHf(instance);
        // Compute display values for every cell
        const results = {};
        rows.forEach((row, ri) => {
          columns.forEach((col, ci) => {
            const raw = (row.cells || {})[col.id] || '';
            if (!raw.trim()) return;
            const cellType = getCellType(row, col);
            if (raw.startsWith('=')) {
              try {
                const val = instance.getCellValue({ sheet: 0, row: ri, col: ci });
                const key = row.id + '_' + col.id;

                if (typeof val === 'number') {
                  // Normal HF result
                  results[key] = cellType === 'dms' ? formatDMS(val) : String(Math.round(val * 1e8) / 1e8);

                } else if (val instanceof Error || (val && val.type)) {
                  // HF errored — could be our custom surveyor function → try JS evaluator
                  const custom = evalSurveyFormula(raw, instance);
                  if (custom !== null) {
                    results[key] = typeof custom === 'number'
                      ? (cellType === 'dms' ? formatDMS(custom) : String(Math.round(custom * 1e8) / 1e8))
                      : String(custom);          // propagate '#VALUE!' / '#DIV/0!' / '#ERR' strings
                  } else {
                    results[key] = '#ERR';
                  }

                } else {
                  results[key] = String(val ?? '');
                }
              } catch(e) {
                results[row.id + '_' + col.id] = '#ERR';
              }
            } else if (cellType === 'dms') {
              const dd = parseDMSInput(raw);
              if (dd !== null) results[row.id + '_' + col.id] = formatDMS(dd);
            }
          });
        });
        setCalcResults(results);
      } catch(e) {
        toast.error('Formula engine error — check cell values');
      }
    }, [rows, page.id]);

    // Points pages — View ▾ → Open in Map. Any row whose N/E converts to
    // lat/lon through the project CRS qualifies, however it was entered.
    const mapCrs   = page.type === 'points' ? fbGeo.projectCrs(DB.getProject(projectId)) : null;
    const mapRow   = (mapCrs && activeCell) ? rows[activeCell.rowIdx] : null;
    const mapPoint = mapRow ? fbGeo.rowPoint(mapRow, mapCrs.id) : null;
    const mapUri   = (mapPoint && mapPoint.lat !== null)
      ? fbGeo.geoUri(mapPoint.lat, mapPoint.lon, [mapPoint.number, mapPoint.desc].filter(Boolean).join(' '))
      : null;
    // Point type of a row, and the View ▾ → Show filter built on it. Filtered
    // rows are only hidden — indices, formulas and exports are unaffected.
    const rowSrc    = r => (r.geo ? (r.geo.source || 'gps') : 'instrument');
    const srcCounts = {};
    if (page.type === 'points') rows.forEach(r => { const k = rowSrc(r); srcCounts[k] = (srcCounts[k] || 0) + 1; });
    const rowHidden = r => page.type === 'points' && srcFilter !== 'all' && rowSrc(r) !== srcFilter;
    const mediaPage = (mapRow && mapRow.geo && mapRow.geo.mediaPageId)
      ? (DB.getProject(projectId)?.pages || []).find(pg => pg.id === mapRow.geo.mediaPageId) : null;
    const mapHint  = !mapCrs ? ''
      : !mapRow ? 'Select a point row first'
      : mapUri ? (mapPoint.phone ? `Pt ${mapPoint.number} · ${fbGeo.fmtAcc(mapPoint.acc)}` : `Pt ${mapPoint.number} · ${mapCrs.short}`)
      : !mapCrs.proj4 ? 'Local coordinates — no map position'
      : (mapPoint && mapPoint.N !== null && mapPoint.E !== null) ? `N/E is outside ${mapCrs.short}`
      : 'This row has no N/E';

    function persistRows(updated) {
      // Push current state to undo stack before applying (cap at 50 steps)
      rowsHistoryRef.current.push(rows);
      if (rowsHistoryRef.current.length > 50) rowsHistoryRef.current.shift();
      setCanUndo(true);
      setRows(updated);
      DB.updatePage(projectId, page.id, { rows: updated });
    }

    function persistColumns(updated) {
      DB.updatePage(projectId, page.id, { columns: updated });
      onReload();
    }

    // Compute the next sequential point number for a Points Data Page
    function nextPointNum(existingRows) {
      const nums = existingRows.map(r => parseInt(r.cells['col_ptnum'])).filter(n => !isNaN(n));
      return String(nums.length ? Math.max(...nums) + 1 : existingRows.length + 1);
    }

    function addRow() {
      const cells = {};
      columns.forEach(c => { cells[c.id] = ''; });
      if (page.type === 'points') cells['col_ptnum'] = nextPointNum(rows);
      const row = { id: 'r_' + Date.now(), cells };
      persistRows([...rows, row]);
    }

    function addRows(n) {
      const newRows = [];
      for (let i = 0; i < n; i++) {
        const cells = {};
        columns.forEach(c => { cells[c.id] = ''; });
        if (page.type === 'points') cells['col_ptnum'] = nextPointNum([...rows, ...newRows]);
        newRows.push({ id: 'r_' + Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2), cells });
      }
      persistRows([...rows, ...newRows]);
    }

    function deleteRow(rowId) {
      if (page.type === 'points') {
        // Cross-page sync: remove this point from all sketch canvases and this data page
        window._fb?.deletePointPermanently?.(projectId, rowId);
        // Reload rows from DB since deletePointPermanently already updated this page
        const updated = DB.getPage(projectId, page.id);
        if (updated) { setRows(updated.rows || []); onReload(); }
        return;
      }
      persistRows(rows.filter(r => r.id !== rowId));
    }

    function updateCell(rowId, colId, val) {
      persistRows(rows.map(r => r.id === rowId ? { ...r, cells: { ...r.cells, [colId]: val } } : r));
    }

    // ── Cell interaction handlers ───────────────────────────────────────

    function colLetter(ci) {
      // A, B, C ... Z, AA, AB ...
      let s = '';
      let n = ci + 1;
      while (n > 0) { s = String.fromCharCode(64 + (n % 26 || 26)) + s; n = Math.floor((n - 1) / 26); }
      return s;
    }

    function cellRef(ri, ci) { return colLetter(ci) + (ri + 1); }

    // Inverse of colLetter — "A" → 0, "B" → 1, "AA" → 26, etc.
    function colLetterToIdx(s) {
      let n = 0;
      for (let i = 0; i < s.length; i++) n = n * 26 + (s.charCodeAt(i) - 64);
      return n - 1; // 0-based
    }

    // Adjust cell references in a formula by (dr rows, dc cols).
    // Absolute refs ($A or $1) are not moved.  Out-of-bounds refs are clamped to row 1 / col A.
    function adjustFormula(formula, dr, dc) {
      if (!formula || !formula.startsWith('=') || (dr === 0 && dc === 0)) return formula;
      return formula.replace(/(\$?)([A-Z]+)(\$?)(\d+)/g, (_, colAbs, colStr, rowAbs, rowStr) => {
        let newCol = colStr;
        let newRow = parseInt(rowStr, 10);
        if (!colAbs) {
          const newCI = Math.max(0, colLetterToIdx(colStr) + dc);
          newCol = colLetter(newCI);
        }
        if (!rowAbs) {
          newRow = Math.max(1, newRow + dr);
        }
        return `${colAbs}${newCol}${rowAbs}${newRow}`;
      });
    }

    // ── Auto-increment: "BM-1" → "BM-2", "TP3" → "TP4", "100" → "101" ──
    function autoIncrement(str) {
      const m = str.match(/^(.*?)(\d+)(\D*)$/);
      if (!m) return str;
      const [, pre, num, suf] = m;
      return pre + String(parseInt(num, 10) + 1).padStart(num.length, '0') + suf;
    }

    // Apply autoIncrement n times (for filling row at offset n from the source)
    function autoIncrementN(str, n) {
      let val = str;
      for (let i = 0; i < n; i++) val = autoIncrement(val);
      return val;
    }

    // ── Core fill engine used by both toolbar button and drag handle ──────
    // Fills rows [startRowIdx+1 … endRowIdx] in column colIdx.
    // Formulas: relative refs shift per-row; absolute refs stay fixed.
    // Plain values: trailing number auto-increments.
    function performFillDown(startRowIdx, colIdx, endRowIdx) {
      const col = columns[colIdx];
      const startRow = rows[startRowIdx];
      if (!col || !startRow) return;
      const startVal = (startRow.cells || {})[col.id] || '';
      if (!startVal.trim()) { toast.error('Starting cell is empty'); return; }
      const isFormula = startVal.startsWith('=');
      const count = endRowIdx - startRowIdx;
      const updated = rows.map((r, idx) => {
        if (idx <= startRowIdx || idx > endRowIdx) return r;
        const offset = idx - startRowIdx;
        const newVal = isFormula
          ? shiftFormulaDown(startVal, offset)
          : autoIncrementN(startVal, offset);
        return { ...r, cells: { ...r.cells, [col.id]: newVal } };
      });
      persistRows(updated);
      // Highlight the filled range so the user sees what was filled
      setSelectionAnchor({ rowIdx: startRowIdx, colIdx });
      setActiveCell({ rowIdx: endRowIdx, colIdx });
      toast.success(`Filled ${count} cell${count !== 1 ? 's' : ''}`);
    }

    // ── Toolbar "Fill ↓" — fills from active cell to last row ────────────
    function fillDown() {
      if (!activeCell) { toast.error('Select a starting cell first'); return; }
      const { rowIdx: ri, colIdx: ci } = activeCell;
      if (ri >= rows.length - 1) { toast.error('No rows below to fill'); return; }
      performFillDown(ri, ci, rows.length - 1);
    }

    // ── Cycle cell-reference type at cursor position (F4 behaviour) ───
    // A1 → $A$1 → A$1 → $A1 → A1
    function cycleFormulaRef(formula, cursor, callback) {
      if (!formula.startsWith('=')) return;
      const refRe = /(\$?)([A-Z]+)(\$?)(\d+)/g;
      let best = null, bestDist = Infinity, match;
      while ((match = refRe.exec(formula)) !== null) {
        const s = match.index, e2 = match.index + match[0].length;
        const dist = Math.min(Math.abs(cursor - s), Math.abs(cursor - e2));
        if (dist < bestDist) { bestDist = dist; best = { match, start: s, end: e2 }; }
      }
      if (!best) return;
      const { match: m, start, end } = best;
      const [, dc, col2, dr, row2] = m;
      const hasDC = dc === '$', hasDR = dr === '$';
      let nc, nr;
      if (!hasDC && !hasDR)    { nc = '$'; nr = '$'; }
      else if (hasDC && hasDR) { nc = '';  nr = '$'; }
      else if (!hasDC && hasDR){ nc = '$'; nr = '';  }
      else                     { nc = '';  nr = '';  }
      const newRef = nc + col2 + nr + row2;
      callback(formula.slice(0, start) + newRef + formula.slice(end), start + newRef.length);
    }

    function getSelectionBounds() {
      if (!activeCell) return null;
      const anchor = selectionAnchor || activeCell;
      return {
        minR: Math.min(activeCell.rowIdx, anchor.rowIdx),
        maxR: Math.max(activeCell.rowIdx, anchor.rowIdx),
        minC: Math.min(activeCell.colIdx, anchor.colIdx),
        maxC: Math.max(activeCell.colIdx, anchor.colIdx),
      };
    }

    function isInRange(ri, ci) {
      const b = getSelectionBounds();
      if (!b) return false;
      return ri >= b.minR && ri <= b.maxR && ci >= b.minC && ci <= b.maxC;
    }

    // ── Per-cell type override ────────────────────────────────────────
    // Sets (or clears) a cell-level colType override for the active selection.
    // Pass null to remove override and revert to column default.
    function setCellsType(type) {
      const b = getSelectionBounds();
      if (!b) return;
      const updated = rows.map((row, ri) => {
        if (ri < b.minR || ri > b.maxR) return row;
        const meta = { ...(row.cellMeta || {}) };
        columns.forEach((col, ci) => {
          if (ci < b.minC || ci > b.maxC) return;
          if (type === null) {
            delete meta[col.id];
          } else {
            meta[col.id] = { colType: type };
          }
        });
        return { ...row, cellMeta: meta };
      });
      persistRows(updated);
    }

    // Current effective type of the active cell (for badge display)
    const activeCellEffType = activeCell
      ? getCellType(rows[activeCell.rowIdx], columns[activeCell.colIdx])
      : null;
    // Whether the active cell has a per-cell override (so we can show a reset option)
    const activeCellHasOverride = activeCell
      ? !!(rows[activeCell.rowIdx]?.cellMeta?.[columns[activeCell.colIdx]?.id]?.colType)
      : false;

    function activateCell(ri, ci) {
      setActiveCell({ rowIdx: ri, colIdx: ci });
      setSelectionAnchor({ rowIdx: ri, colIdx: ci }); // always collapse on plain navigation
      const row = rows[ri];
      const col = columns[ci];
      if (!row || !col) return;
      const raw = (row.cells || {})[col.id] || '';
      setFormulaBarVal(raw);
      // Focus the table container so grid-level keyboard events fire
      setTimeout(() => { if (tableRef.current) tableRef.current.focus(); }, 0);
    }

    // ── Formula ref insertion / range update (mobile + mouse) ────────────
    // Inserts (or replaces the previously inserted) cell ref at the tracked cursor position.
    function insertFormulaRef(refStr, ri, ci) {
      const cur = editingCell !== null ? editValue : formulaBarVal;
      const pos = formulaRefInsertPosRef.current;
      let newVal, insertAt;
      if (pos) {
        // Replace the ref that was inserted last time
        newVal = cur.slice(0, pos.start) + refStr + cur.slice(pos.start + pos.len);
        formulaRefInsertPosRef.current = { start: pos.start, len: refStr.length };
      } else {
        // First tap: insert at current cursor position (or end of string)
        insertAt = editingCell !== null
          ? (inputRef.current?.selectionStart ?? cur.length)
          : (fbInputRef.current?.selectionStart ?? cur.length);
        newVal = cur.slice(0, insertAt) + refStr + cur.slice(insertAt);
        formulaRefInsertPosRef.current = { start: insertAt, len: refStr.length };
      }
      if (editingCell !== null) {
        setEditValue(newVal); setFormulaBarVal(newVal);
        requestAnimationFrame(() => inputRef.current?.focus());
      } else {
        setFormulaBarVal(newVal); setEditValue(newVal);
        requestAnimationFrame(() => fbInputRef.current?.focus());
      }
      setFormulaRefSel({ r1: ri, c1: ci, r2: ri, c2: ci });
    }

    // Updates the formula text to reflect a dragged range selection (called live during handle drag).
    function updateFormulaRefRange(sel) {
      const pos = formulaRefInsertPosRef.current;
      if (!pos) return;
      const minR = Math.min(sel.r1, sel.r2), minC = Math.min(sel.c1, sel.c2);
      const maxR = Math.max(sel.r1, sel.r2), maxC = Math.max(sel.c1, sel.c2);
      const refStr = (minR === maxR && minC === maxC)
        ? cellRef(minR, minC)
        : cellRef(minR, minC) + ':' + cellRef(maxR, maxC);
      const cur = editingCell !== null ? editValue : formulaBarVal;
      const newVal = cur.slice(0, pos.start) + refStr + cur.slice(pos.start + pos.len);
      formulaRefInsertPosRef.current = { start: pos.start, len: refStr.length };
      if (editingCell !== null) {
        setEditValue(newVal); setFormulaBarVal(newVal);
      } else {
        setFormulaBarVal(newVal); setEditValue(newVal);
      }
    }

    // Clears all formula ref selection state (called when leaving formula editing).
    function clearFormulaRefSel() {
      setFormulaRefSel(null);
      formulaRefInsertPosRef.current = null;
      formulaTouchRef.current = null;
      formulaHandleDragRef.current = null;
    }

    function startEdit(ri, ci) {
      const row = rows[ri];
      const col = columns[ci];
      if (!row || !col) return;
      const raw = (row.cells || {})[col.id] || '';
      setEditingCell({ rowIdx: ri, colIdx: ci });
      setEditValue(raw);
      setFormulaBarVal(raw);
      setTimeout(() => inputRef.current && inputRef.current.focus(), 0);
    }

    function commitEdit(ri, ci, val) {
      const row = rows[ri];
      const col = columns[ci];
      if (!row || !col) { setEditingCell(null); return; }
      // For DMS columns: if user typed space-separated numbers, keep as-is (raw storage)
      // The display layer will format it; HF gets the decimal equivalent
      updateCell(row.id, col.id, val.trim());
      setEditingCell(null);
      setFormulaBarVal(val.trim());
      clearFormulaRefSel();
    }

    function handleCellKeyDown(e, ri, ci) {
      if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        commitEdit(ri, ci, editValue);
        if (e.key === 'Tab') {
          const nextCi = e.shiftKey ? ci - 1 : ci + 1;
          if (nextCi >= 0 && nextCi < columns.length) { activateCell(ri, nextCi); startEdit(ri, nextCi); }
          else if (!e.shiftKey && ri + 1 < rows.length) { activateCell(ri + 1, 0); startEdit(ri + 1, 0); }
        } else {
          if (ri + 1 < rows.length) { activateCell(ri + 1, ci); startEdit(ri + 1, ci); }
        }
      } else if (e.key === 'Escape') {
        setEditingCell(null);
        setEditValue('');
      } else if (e.key === 'F4') {
        e.preventDefault();
        if (!editValue.startsWith('=')) return;
        const cursor = inputRef.current?.selectionStart ?? editValue.length;
        cycleFormulaRef(editValue, cursor, (newVal, newCursor) => {
          setEditValue(newVal);
          setFormulaBarVal(newVal);
          requestAnimationFrame(() => {
            if (inputRef.current) {
              inputRef.current.focus();
              inputRef.current.setSelectionRange(newCursor, newCursor);
            }
          });
        });
      }
    }

    // ── Grid-level keyboard handler (fires when a cell is selected but NOT in edit mode) ──
    function handleGridKeyDown(e) {
      if (e.target.tagName === 'INPUT') return;
      if (!activeCell) return;
      const { rowIdx: ri, colIdx: ci } = activeCell;

      // ── Ctrl+Z / Cmd+Z ── Undo
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undoRows(); return; }

      // ── Ctrl+C / Cmd+C ── Copy selection
      if ((e.ctrlKey || e.metaKey) && e.key === 'c') { e.preventDefault(); copyCells(); return; }

      // ── Ctrl+X / Cmd+X ── Cut selection
      if ((e.ctrlKey || e.metaKey) && e.key === 'x') { e.preventDefault(); cutCells(); return; }

      // ── Ctrl+V / Cmd+V ── Let the browser fire the native paste event, handled by handleGridPaste
      // (Do NOT call e.preventDefault() here — that would block the paste event from firing)

      // ── Delete / Backspace ── Clear all cells in selection range
      if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        const b = getSelectionBounds();
        if (!b) return;
        const updated = rows.map((row, r) => {
          if (r < b.minR || r > b.maxR) return row;
          const newCells = { ...row.cells };
          for (let c = b.minC; c <= b.maxC; c++) {
            const col = columns[c];
            if (col) newCells[col.id] = '';
          }
          return { ...row, cells: newCells };
        });
        persistRows(updated);
        setFormulaBarVal('');
        return;
      }

      // ── Enter / Shift+Enter ── Vertical navigation, collapse selection
      if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        if (e.shiftKey) { if (ri - 1 >= 0) activateCell(ri - 1, ci); }
        else            { if (ri + 1 < rows.length) activateCell(ri + 1, ci); }
        return;
      }

      // ── Tab / Shift+Tab ── Horizontal navigation with row wrap, collapse selection
      if (e.key === 'Tab') {
        e.preventDefault();
        if (e.shiftKey) {
          if (ci - 1 >= 0)      activateCell(ri, ci - 1);
          else if (ri - 1 >= 0) activateCell(ri - 1, columns.length - 1);
        } else {
          if (ci + 1 < columns.length) activateCell(ri, ci + 1);
          else if (ri + 1 < rows.length) activateCell(ri + 1, 0);
        }
        return;
      }

      // ── Arrow keys ── Navigate; Shift extends selection, plain collapses it
      if (['ArrowDown','ArrowUp','ArrowRight','ArrowLeft'].includes(e.key)) {
        e.preventDefault();
        let newRi = ri, newCi = ci;
        if (e.key === 'ArrowDown'  && ri + 1 < rows.length)    newRi = ri + 1;
        if (e.key === 'ArrowUp'    && ri - 1 >= 0)             newRi = ri - 1;
        if (e.key === 'ArrowRight' && ci + 1 < columns.length) newCi = ci + 1;
        if (e.key === 'ArrowLeft'  && ci - 1 >= 0)             newCi = ci - 1;
        if (newRi === ri && newCi === ci) return;
        if (e.shiftKey) {
          // Extend: anchor stays, focus moves
          if (!selectionAnchor) setSelectionAnchor({ rowIdx: ri, colIdx: ci });
          setActiveCell({ rowIdx: newRi, colIdx: newCi });
          const row2 = rows[newRi], col2 = columns[newCi];
          if (row2 && col2) setFormulaBarVal((row2.cells || {})[col2.id] || '');
          setTimeout(() => { if (tableRef.current) tableRef.current.focus(); }, 0);
        } else {
          activateCell(newRi, newCi);
        }
        return;
      }

      // ── F2 ── Enter edit mode keeping existing value
      if (e.key === 'F2') {
        e.preventDefault();
        startEdit(ri, ci);
        return;
      }

      // ── Printable character ── Enter edit mode, pre-fill with typed char
      // (Ctrl+V does NOT reach here — it is handled by handleGridPaste via the native paste event)
      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault();
        const row = rows[ri];
        const col = columns[ci];
        if (!row || !col) return;
        setEditingCell({ rowIdx: ri, colIdx: ci });
        setEditValue(e.key);
        setFormulaBarVal(e.key);
        setTimeout(() => {
          if (inputRef.current) {
            inputRef.current.focus();
            inputRef.current.setSelectionRange(1, 1);
          }
        }, 0);
      }
    }

    // ── Grid paste handler — uses the native paste event so clipboard data is always available ──
    // This is more reliable than navigator.clipboard.readText() which requires document focus
    // and can silently fail after re-renders / async state updates.
    function handleGridPaste(e) {
      if (e.target.tagName === 'INPUT') return; // cell in edit mode — let browser paste into the input
      if (!activeCell) return;
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
      if (!text) return;
      const { rowIdx: ri, colIdx: ci } = activeCell;
      const lines = text.trimEnd().split('\n').map(l => l.split('\t'));
      const startR = ri, startC = ci;
      let updatedRows = [...rows];
      const needed = startR + lines.length - updatedRows.length;
      if (needed > 0) {
        for (let i = 0; i < needed; i++) {
          const cells = {};
          columns.forEach(c => { cells[c.id] = ''; });
          updatedRows.push({ id: 'r_' + Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2), cells });
        }
      }
      const anchor = copyAnchorRef.current;
      const dr = anchor ? startR - anchor.rowIdx : 0;
      const dc = anchor ? startC - anchor.colIdx : 0;
      updatedRows = updatedRows.map((row, r) => {
        const li = r - startR;
        if (li < 0 || li >= lines.length) return row;
        const newCells = { ...row.cells };
        lines[li].forEach((val, ci2) => {
          const col = columns[startC + ci2];
          if (!col) return;
          // Adjust relative formula references if pasting from an in-app copy
          const adjusted = (dr !== 0 || dc !== 0) && val.startsWith('=')
            ? adjustFormula(val, dr, dc) : val;
          newCells[col.id] = adjusted;
        });
        return { ...row, cells: newCells };
      });
      persistRows(updatedRows);
    }

    // ── Copy / Cut / Paste — also called from toolbar buttons ────────────────
    function copyCells() {
      const b = getSelectionBounds();
      if (!b) return;
      // Store anchor so paste can adjust relative formula references
      copyAnchorRef.current = { rowIdx: b.minR, colIdx: b.minC };
      const lines = [];
      for (let r = b.minR; r <= b.maxR; r++) {
        const row = rows[r];
        if (!row) continue;
        const cells = [];
        for (let c = b.minC; c <= b.maxC; c++) {
          const col = columns[c];
          if (!col) { cells.push(''); continue; }
          const raw = (row.cells || {})[col.id] || '';
          if (raw.startsWith('=')) {
            // Always copy raw formula — relative adjustment happens on paste
            cells.push(raw);
          } else if (getCellType(row, col) === 'dms' && raw.trim()) {
            // Non-formula DMS: copy as displayed (e.g. 45°30'15") not Excel colon format
            cells.push(displayValue(row, col).text || raw);
          } else {
            cells.push(raw);
          }
        }
        lines.push(cells.join('\t'));
      }
      navigator.clipboard.writeText(lines.join('\n')).catch(() => {});
      toast.success('Copied');
    }

    function cutCells() {
      copyCells();
      const b = getSelectionBounds();
      if (!b) return;
      const updated = rows.map((row, r) => {
        if (r < b.minR || r > b.maxR) return row;
        const newCells = { ...row.cells };
        for (let c = b.minC; c <= b.maxC; c++) {
          const col = columns[c];
          if (col) newCells[col.id] = '';
        }
        return { ...row, cells: newCells };
      });
      persistRows(updated);
    }

    async function pasteCells() {
      if (!activeCell) { toast.error('Select a cell first'); return; }
      try {
        const text = await navigator.clipboard.readText();
        if (!text) return;
        const { rowIdx: ri, colIdx: ci } = activeCell;
        const lines = text.trimEnd().split('\n').map(l => l.split('\t'));
        let updatedRows = [...rows];
        const needed = ri + lines.length - updatedRows.length;
        if (needed > 0) {
          for (let i = 0; i < needed; i++) {
            const cells = {};
            columns.forEach(c => { cells[c.id] = ''; });
            updatedRows.push({ id: 'r_' + Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2), cells });
          }
        }
        const anchor = copyAnchorRef.current;
        const dr = anchor ? ri - anchor.rowIdx : 0;
        const dc = anchor ? ci - anchor.colIdx : 0;
        updatedRows = updatedRows.map((row, r) => {
          const li = r - ri;
          if (li < 0 || li >= lines.length) return row;
          const newCells = { ...row.cells };
          lines[li].forEach((val, ci2) => {
            const col = columns[ci + ci2];
            if (!col) return;
            // Adjust relative formula references if pasting from an in-app copy
            const adjusted = (dr !== 0 || dc !== 0) && val.startsWith('=')
              ? adjustFormula(val, dr, dc) : val;
            newCells[col.id] = adjusted;
          });
          return { ...row, cells: newCells };
        });
        persistRows(updatedRows);
      } catch(err) {
        toast.error('Paste failed — allow clipboard access in browser settings');
      }
    }

    // ── Edit menu operations ──────────────────────────────────────────────
    function undoRows() {
      const prev = rowsHistoryRef.current.pop();
      if (!prev) { toast.error('Nothing to undo'); return; }
      setCanUndo(rowsHistoryRef.current.length > 0);
      setRows(prev);
      DB.updatePage(projectId, page.id, { rows: prev });
    }

    function clearSelectedCells() {
      const b = getSelectionBounds();
      if (!b) return;
      const updated = rows.map((row, r) => {
        if (r < b.minR || r > b.maxR) return row;
        const newCells = { ...row.cells };
        for (let c = b.minC; c <= b.maxC; c++) {
          const col = columns[c];
          if (col) newCells[col.id] = '';
        }
        return { ...row, cells: newCells };
      });
      persistRows(updated);
      setFormulaBarVal('');
    }

    function insertRowAt(atRowIdx, position) {
      const insertIdx = position === 'above' ? atRowIdx : atRowIdx + 1;
      const cells = {};
      columns.forEach(c => { cells[c.id] = ''; });
      if (page.type === 'points') cells['col_ptnum'] = nextPointNum(rows);
      const newRow = { id: 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2), cells };
      const next = [...rows];
      next.splice(insertIdx, 0, newRow);
      persistRows(next);
      setActiveCell({ rowIdx: insertIdx, colIdx: activeCell?.colIdx ?? 0 });
      setSelectionAnchor(null);
    }

    function deleteSelectedRows() {
      const b = getSelectionBounds();
      if (!b) return;
      if (page.type === 'points') {
        // Cross-page sync: deleteRow handles sketch canvas removal and DB reload per row
        const ids = rows.slice(b.minR, b.maxR + 1).map(r => r.id);
        ids.forEach(id => deleteRow(id));
      } else {
        const ids = new Set(rows.slice(b.minR, b.maxR + 1).map(r => r.id));
        persistRows(rows.filter(r => !ids.has(r.id)));
      }
      setActiveCell(null);
      setSelectionAnchor(null);
    }

    function duplicateRow(rowIdx) {
      const src = rows[rowIdx];
      if (!src) return;
      const newRow = { id: 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2), cells: { ...src.cells } };
      const next = [...rows];
      next.splice(rowIdx + 1, 0, newRow);
      persistRows(next);
      setActiveCell({ rowIdx: rowIdx + 1, colIdx: activeCell?.colIdx ?? 0 });
      setSelectionAnchor(null);
    }

    function selectAll() {
      if (!rows.length || !columns.length) return;
      setActiveCell({ rowIdx: 0, colIdx: 0 });
      setSelectionAnchor({ rowIdx: rows.length - 1, colIdx: columns.length - 1 });
    }

    function selectEntireRow(rowIdx) {
      setActiveCell({ rowIdx, colIdx: 0 });
      setSelectionAnchor({ rowIdx, colIdx: columns.length - 1 });
    }

    function selectEntireColumn(colIdx) {
      setActiveCell({ rowIdx: 0, colIdx });
      setSelectionAnchor({ rowIdx: rows.length - 1, colIdx });
    }

    function handleFormulaBarCommit(e) {
      if (e.key === 'Enter' && activeCell) {
        const { rowIdx: ri, colIdx: ci } = activeCell;
        const row = rows[ri]; const col = columns[ci];
        if (row && col) {
          updateCell(row.id, col.id, formulaBarVal.trim());
          setEditingCell(null);
          fbInputRef.current?.blur();
          clearFormulaRefSel();
        }
      } else if (e.key === 'Escape') {
        // Revert to saved value
        if (activeCell) {
          const row = rows[activeCell.rowIdx]; const col = columns[activeCell.colIdx];
          const orig = row && col ? ((row.cells || {})[col.id] || '') : '';
          setFormulaBarVal(orig);
          setEditValue(orig);
        }
        setEditingCell(null);
        clearFormulaRefSel();
        fbInputRef.current?.blur();
      } else if (e.key === 'F4') {
        e.preventDefault();
        const cursor = fbInputRef.current?.selectionStart ?? formulaBarVal.length;
        cycleFormulaRef(formulaBarVal, cursor, (newVal, newCursor) => {
          setFormulaBarVal(newVal);
          setEditValue(newVal);
          requestAnimationFrame(() => {
            if (fbInputRef.current) {
              fbInputRef.current.focus();
              fbInputRef.current.setSelectionRange(newCursor, newCursor);
            }
          });
        });
      }
    }

    // ── Column modal helpers ──────────────────────────────────────────

    function openColModal(col) {
      setColModal({ col });
      setColModalForm({ label: col.label, colType: col.colType || 'num', width: col.width || 80 });
    }

    function saveColModal() {
      if (!colModalForm.label.trim()) { setColModal(null); return; }
      const updated = columns.map(c =>
        c.id === colModal.col.id
          ? { ...c, label: colModalForm.label.trim(), colType: colModalForm.colType, width: colModalForm.width }
          : c
      );
      persistColumns(updated);
      setColModal(null);
    }

    function deleteCol(colId) {
      if (!window.confirm('Delete this column and all its data?')) return;
      const updated = columns.filter(c => c.id !== colId);
      const updatedRows = rows.map(r => {
        const cells = { ...r.cells };
        delete cells[colId];
        return { ...r, cells };
      });
      DB.updatePage(projectId, page.id, { columns: updated, rows: updatedRows });
      onReload();
      setColModal(null);
    }

    // A new, empty column at position `idx` (columns.length = at the end).
    function insertColAt(idx) {
      const newId = 'c_' + Date.now();
      const at = Math.max(0, Math.min(columns.length, idx));
      const updated = [...columns];
      updated.splice(at, 0, { id: newId, label: 'Col ' + (columns.length + 1), colType: 'num', width: 80 });
      const updatedRows = rows.map(r => ({ ...r, cells: { ...r.cells, [newId]: '' } }));
      setRows(updatedRows);
      DB.updatePage(projectId, page.id, { columns: updated, rows: updatedRows });
      onReload();
      if (activeCell) { setActiveCell({ rowIdx: activeCell.rowIdx, colIdx: at }); setSelectionAnchor(null); }
    }

    // ── CSV Import (Points pages only) ──────────────────────────────────

    function importPointsCSV() {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.csv,.txt';
      inp.onchange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const text = ev.target.result;
            // Split into lines, remove blank lines
            const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l);
            if (!lines.length) { toast.error('CSV file appears to be empty'); return; }
            // Parse each line: split on comma or tab, strip surrounding quotes
            const parsed = lines.map(line => {
              const sep = line.includes('\t') ? '\t' : ',';
              return line.split(sep).map(c => c.trim().replace(/^["']|["']$/g, ''));
            });
            // Skip header row if first cell looks like a column name
            const first = (parsed[0][0] || '').toLowerCase();
            const isHeader = isNaN(Number(first)) || ['pt','point','p#','#','no','num','id'].some(h => first.startsWith(h));
            const dataRows = isHeader ? parsed.slice(1) : parsed;
            if (!dataRows.length) { toast.error('No data rows found after header'); return; }
            // Map columns positionally: [ptNum, northing, easting, elev, desc]
            const colMap = ['col_ptnum','col_north','col_east','col_elev','col_desc'];
            const newRows = dataRows.map((cols, i) => {
              const cells = {};
              columns.forEach(c => { cells[c.id] = ''; });
              colMap.forEach((cid, ci) => { if (cols[ci] != null) cells[cid] = cols[ci]; });
              // If no pt number in CSV, auto-number based on existing + position
              if (!cells['col_ptnum']) cells['col_ptnum'] = nextPointNum([...rows, ...newRows.slice(0, i)]);

    // ── CSV Import (generic data pages) ─────────────────────────────────────
    function parseCSV(text) {
      const lines = text.split(/\r?\n/);
      const result = [];
      for (const line of lines) {
        if (!line.trim()) continue;
        const row = [];
        let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQ && line[i+1] === '"') { cur += '"'; i++; }
            else inQ = !inQ;
          } else if (ch === ',' && !inQ) {
            row.push(cur.trim()); cur = '';
          } else {
            cur += ch;
          }
        }
        row.push(cur.trim());
        result.push(row);
      }
      return result;
    }

        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = parseCSV(ev.target.result);
            if (!parsed.length) { toast({ message: 'CSV file appears to be empty.', type: 'error' }); return; }
            // Auto-detect header: first row has non-numeric values
            const firstRow = parsed[0];

    // A short tap keeps its meaning, and a finger that moves first scrolls.
    function touchDragStart(e, kind, from) {
      if (e.pointerType !== 'touch') return;
      touchDragEnd();
      const st = { kind, from, over: from, x: e.clientX, y: e.clientY, active: false, timer: null };
      st.timer = setTimeout(() => {

    function touchDragMove(e) {

        if (rect && e.clientY < rect.top + EDGE)    box.scrollTop -= SPEED;

    function touchDragEnd(e) {

            onFocus={() => { fbFocusedRef.current = true; }}
            onBlur={() => { fbFocusedRef.current = false; }}
            onKeyDown={handleFormulaBarCommit}
            placeholder="Select a cell to view or edit its value…  (F4 cycles $A$1 reference types)"
            spellCheck={false}
            style={{ background: isFormulaEditing ? 'rgba(45,106,79,0.05)' : 'transparent' }}
          />
        </div>
        {/* ── Description code chips (points pages, Description cell active) ── */}
        {page.type === 'points' && activeCell && columns[activeCell.colIdx]?.id === 'col_desc' && rows[activeCell.rowIdx] && (() => {
          const recent = recentDescCodes(rows);
          const chips = [...recent, ...descCodes.filter(c => !recent.includes(c))];
          // Cell being typed in: the code replaces the text and Enter saves it as usual.
          // Cell only selected: one tap saves the code.
          const apply = code => {

            </span>
