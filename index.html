        {/* ── Table ── */}
        <div ref={tableRef} tabIndex={0} onKeyDown={handleGridKeyDown} onPaste={handleGridPaste}
          onPointerMove={e => {
            if (e.pointerType === 'touch') {
              // Cancel formula-mode touch ref if finger moved too far (it became a scroll)
              if (formulaTouchRef.current) {
                const dx = e.clientX - formulaTouchRef.current.x;
                const dy = e.clientY - formulaTouchRef.current.y;
                if (Math.hypot(dx, dy) > 10) {
                  formulaTouchRef.current = null; // finger is scrolling — don't insert ref
                }

              // Cancel long-press if finger has scrolled (moved > 8px before timer fires)
              if (lpStartRef.current && lpTimerRef.current) {
                const dx = e.clientX - lpStartRef.current.x;
                const dy = e.clientY - lpStartRef.current.y;
                if (Math.hypot(dx, dy) > 8) {
                  clearTimeout(lpTimerRef.current);
                  lpTimerRef.current = null;
                  lpStartRef.current = null;
                }
              }
            }
            // Edge-scroll while drag-selecting
            if (isDraggingSelRef.current && tableRef.current) {
              const rect = tableRef.current.getBoundingClientRect();
              const EDGE = 44, SPEED = 10;
              if (e.clientY < rect.top    + EDGE) tableRef.current.scrollTop  -= SPEED;
              if (e.clientY > rect.bottom - EDGE) tableRef.current.scrollTop  += SPEED;
              if (e.clientX < rect.left   + EDGE) tableRef.current.scrollLeft -= SPEED;
              if (e.clientX > rect.right  - EDGE) tableRef.current.scrollLeft += SPEED;

          onPointerUp={e => {

              lpTimerRef.current = null;
              if (lpStartRef.current) {
                activateCell(lpStartRef.current.ri, lpStartRef.current.ci);
                lpStartRef.current = null;
              }
            } else {
              lpStartRef.current = null;
            }
            isDraggingSelRef.current = false;
          }}
          style={{ flex: 1, overflowX: 'auto', overflowY: 'auto', background: FBC.field, outline: 'none' }}>
          <table className="fb-table" style={{ tableLayout: 'fixed', width: 'max-content', minWidth: '100%' }}>

                    draggable={true}

                    const inSel = isInRange(ri, ci);
                    let selClass = '';
                    if (inSel && !isActive) {

                    const { text, isFormula, isDMS, isError } = displayValue(row, col);
                    const myCellRef = cellRef(ri, ci);
                    const refColor = refColorMap[myCellRef] || null;
                    // Fill preview: cells in the active column between active row and drag target
                    const isFillPreview = fillDragRow !== null &&
                      activeCell && ci === activeCell.colIdx &&
                      ri > activeCell.rowIdx && ri <= fillDragRow;

                    let isFrefHandleTR = false, isFrefHandleBL = false;
                    if (formulaRefSel) {
                      const fMinR = Math.min(formulaRefSel.r1, formulaRefSel.r2);
                      const fMaxR = Math.max(formulaRefSel.r1, formulaRefSel.r2);
                      const fMinC = Math.min(formulaRefSel.c1, formulaRefSel.c2);
                      const fMaxC = Math.max(formulaRefSel.c1, formulaRefSel.c2);

                        if (ri === fMinR) frefClass += ' dp-fref-top';
                        if (ri === fMaxR) frefClass += ' dp-fref-bottom';
                        if (ci === fMinC) frefClass += ' dp-fref-left';
                        if (ci === fMaxC) frefClass += ' dp-fref-right';
                      }
                      // Top-right handle: top row, rightmost col
                      isFrefHandleTR = ri === fMinR && ci === fMaxC;
                      // Bottom-left handle: bottom row, leftmost col
                      isFrefHandleBL = ri === fMaxR && ci === fMinC;
                    }
                    const needsRelative = isActive || !!refColor || isFrefHandleTR || isFrefHandleBL;
                    return (
                      <td key={col.id}
                        data-cell-ri={ri}
                        data-cell-ci={ci}
                        className={`${isActive ? 'dp-cell-active' : isFillPreview ? 'dp-cell-fill-preview' : selClass}${frefClass ? ' ' + frefClass : ''}`}
                        style={{
                          width: colWidth(col), minWidth: colWidth(col),
                          // Relative positioning needed for fill handle and formula ref handles
                          ...(needsRelative ? { position: 'relative' } : {}),
                          // Allow corner handles to visually overflow cell boundaries
                          ...(isFrefHandleTR || isFrefHandleBL ? { overflow: 'visible' } : {}),
                          // Colour-coded border when this cell is referenced by the formula being edited
                          ...(refColor ? { outline: `2px solid ${refColor}`, outlineOffset: '-1px', zIndex: 1 } : {}),
                        }}
                        onPointerDown={e => {
                          if (e.button !== 0) return;

                          // ── Point-to-select: insert cell ref into formula being edited ──
                          if (isFormulaEditing) {
                            if (e.pointerType === 'touch') {
                              // Touch: DON'T preventDefault so native scroll still works.
                              // Record start position; tap-vs-scroll decided in onPointerUp.
                              formulaTouchRef.current = { x: e.clientX, y: e.clientY, ri, ci };
                              return; // wait for pointerUp to confirm it was a tap
                            }
                            // Mouse / stylus: insert ref immediately
                            e.preventDefault();
                            insertFormulaRef(myCellRef, ri, ci);
                            return;
                          }

                          if (e.pointerType === 'touch') {
                            // Touch: don't select immediately — prevent scroll-while-selecting
                            // Long press (400ms) activates drag-select with haptic feedback
                            if (lpTimerRef.current) clearTimeout(lpTimerRef.current);
                            lpStartRef.current = { x: e.clientX, y: e.clientY, ri, ci };
                            lpTimerRef.current = setTimeout(() => {
                              lpTimerRef.current = null;
                              isDraggingSelRef.current = true;
                              activateCell(lpStartRef.current.ri, lpStartRef.current.ci);
                              if (navigator.vibrate) navigator.vibrate(50);
                            }, 400);
                            // Don't preventDefault — allows native scroll to work
                          } else {
                            // Mouse / stylus: existing behavior (immediate selection)
                            isDraggingSelRef.current = true;
                            if (e.shiftKey && activeCell) {
                              if (!selectionAnchor) setSelectionAnchor(activeCell);
                              setActiveCell({ rowIdx: ri, colIdx: ci });
                              const row2 = rows[ri], col2 = columns[ci];
                              if (row2 && col2) setFormulaBarVal((row2.cells || {})[col2.id] || '');
                              if (tableRef.current) tableRef.current.focus();
                            } else {
                              activateCell(ri, ci);
                            }
                          }
                        }}
                        onPointerEnter={e => {
                          if (!isDraggingSelRef.current || !(e.buttons & 1)) return;
                          setActiveCell({ rowIdx: ri, colIdx: ci });
                        }}
                        onDoubleClick={() => startEdit(ri, ci)}>
                        {isEditing ? (
                          <input
                            ref={inputRef}
                            type="text"
                            inputMode={isDMSCell ? 'none' : 'text'}
                            value={editValue}
                            onChange={e => {
                              setEditValue(e.target.value); setFormulaBarVal(e.target.value);
                              // User typed — invalidate tracked insert pos so next cell tap appends
                              formulaRefInsertPosRef.current = null;
                            }}
                            onBlur={() => commitEdit(ri, ci, editValue)}
                            onKeyDown={e => handleCellKeyDown(e, ri, ci)}
                            style={{ display: 'block', width: '100%', height: 32, padding: '0 5px',
                              background: `${fbAlpha('accent', 0.06)}`, border: 'none', outline: 'none',
                              fontFamily: FBF.hand, fontSize: 17, textAlign: 'center', color: FBC.ink }}
                          />
                        ) : (
                          <span
                            className={isError ? 'dp-cell-error' : isDMS ? 'dp-cell-dms' : isFormula ? 'dp-cell-formula' : ''}
                            style={{ display: 'block', height: 32, lineHeight: '32px', padding: '0 5px',
                              whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                              fontFamily: FBF.hand, fontSize: 17,
                              cursor: 'default', userSelect: 'none' }}
                            onDoubleClick={() => startEdit(ri, ci)}>
                            {text}
                          </span>
                        )}
                        {/* ── Fill handle — only on active non-editing cell ── */}
                        {isActive && !isEditing && (
                          <div
                            className="dp-fill-handle"
                            title="Drag down to fill · formulas shift relative refs automatically"
                            onPointerDown={e => {
                              e.stopPropagation();
                              e.preventDefault();
                              fillDragRef.current = { active: true, startRow: ri, startCol: ci };
                              setFillDragRow(ri);
                              e.currentTarget.setPointerCapture(e.pointerId);
                            }}
                            onPointerMove={e => {
                              if (!fillDragRef.current.active) return;
                              // elementFromPoint works regardless of pointer capture
                              const el = document.elementFromPoint(e.clientX, e.clientY);
                              const tr = el?.closest('tr[data-row-idx]');
                              if (tr) {
                                const idx = parseInt(tr.getAttribute('data-row-idx'), 10);
                                if (!isNaN(idx)) {
                                  setFillDragRow(Math.max(idx, fillDragRef.current.startRow));
                                }
                              }
                            }}
                            onPointerUp={e => {
                              if (!fillDragRef.current.active) return;
                              e.currentTarget.releasePointerCapture(e.pointerId);
                              const { startRow, startCol } = fillDragRef.current;
                              fillDragRef.current = { active: false, startRow: -1, startCol: -1 };
                              const endRow = fillDragRow;
                              setFillDragRow(null);
                              if (endRow !== null && endRow > startRow) {
                                performFillDown(startRow, startCol, endRow);
                              }
                            }}
                          />
                        )}
                        {/* ── Formula ref selection handles (top-right & bottom-left) ── */}
                        {isFrefHandleTR && (
                          <div
                            className="dp-fref-handle dp-fref-handle-tr"
                            title="Drag to expand range selection"
                            onPointerDown={e => {
                              e.stopPropagation(); e.preventDefault();
                              // Anchor = bottom-left corner
                              const fMinR = Math.min(formulaRefSel.r1, formulaRefSel.r2);
                              const fMaxR = Math.max(formulaRefSel.r1, formulaRefSel.r2);
                              const fMinC = Math.min(formulaRefSel.c1, formulaRefSel.c2);
                              formulaHandleDragRef.current = { handle: 'tr', anchorRi: fMaxR, anchorCi: fMinC };
                              e.currentTarget.setPointerCapture(e.pointerId);
                            }}
                            onPointerMove={e => {
                              if (!formulaHandleDragRef.current || formulaHandleDragRef.current.handle !== 'tr') return;
                              const el = document.elementFromPoint(e.clientX, e.clientY);
                              const td2 = el?.closest('td[data-cell-ri]');
                              if (!td2) return;
                              const tRi = parseInt(td2.getAttribute('data-cell-ri'));
                              const tCi = parseInt(td2.getAttribute('data-cell-ci'));
                              if (isNaN(tRi) || isNaN(tCi)) return;
                              const { anchorRi, anchorCi } = formulaHandleDragRef.current;
                              const newSel = {
                                r1: Math.min(anchorRi, tRi), c1: Math.min(anchorCi, tCi),
                                r2: Math.max(anchorRi, tRi), c2: Math.max(anchorCi, tCi),
                              };
                              setFormulaRefSel(newSel);
                              updateFormulaRefRange(newSel);
                            }}
                            onPointerUp={e => {
                              e.currentTarget.releasePointerCapture(e.pointerId);
                              formulaHandleDragRef.current = null;
                            }}
                          />
                        )}
                        {isFrefHandleBL && (
                          <div
                            className="dp-fref-handle dp-fref-handle-bl"
                            title="Drag to expand range selection"
                            onPointerDown={e => {
                              e.stopPropagation(); e.preventDefault();
                              // Anchor = top-right corner
                              const fMinR = Math.min(formulaRefSel.r1, formulaRefSel.r2);
                              const fMaxC = Math.max(formulaRefSel.c1, formulaRefSel.c2);
                              formulaHandleDragRef.current = { handle: 'bl', anchorRi: fMinR, anchorCi: fMaxC };
                              e.currentTarget.setPointerCapture(e.pointerId);
                            }}
                            onPointerMove={e => {
                              if (!formulaHandleDragRef.current || formulaHandleDragRef.current.handle !== 'bl') return;
                              const el = document.elementFromPoint(e.clientX, e.clientY);
                              const td2 = el?.closest('td[data-cell-ri]');
                              if (!td2) return;
                              const tRi = parseInt(td2.getAttribute('data-cell-ri'));
                              const tCi = parseInt(td2.getAttribute('data-cell-ci'));
                              if (isNaN(tRi) || isNaN(tCi)) return;
                              const { anchorRi, anchorCi } = formulaHandleDragRef.current;
                              const newSel = {
                                r1: Math.min(anchorRi, tRi), c1: Math.min(anchorCi, tCi),
                                r2: Math.max(anchorRi, tRi), c2: Math.max(anchorCi, tCi),
                              };
                              setFormulaRefSel(newSel);
                              updateFormulaRefRange(newSel);
                            }}
                            onPointerUp={e => {
                              e.currentTarget.releasePointerCapture(e.pointerId);
                              formulaHandleDragRef.current = null;
                            }}
                          />
                        )}
                      </td>
                    );
                  })}
                  <td className="td-action">
                    <button onClick={() => deleteRow(row.id)}
                      className="w-8 h-8 flex items-center justify-center text-gray-300 active:text-red-400 mx-auto">
                      <Ico.Trash />
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        {/* ── Status bar ── */}
        <div className="px-4 py-2 border-t border-fb-border bg-fb-cream2/50 flex items-center gap-4 flex-shrink-0" style={{ fontSize: 11 }}>
          <span className="text-fb-muted font-data">{rows.length} rows · {columns.length} cols</span>
          {activeCell && (() => {
            const b = getSelectionBounds();
            const isMulti = b && (b.maxR > b.minR || b.maxC > b.minC);
            if (isMulti) {
              const numRows = b.maxR - b.minR + 1, numCols = b.maxC - b.minC + 1;
              return (
                <span className="text-fb-mid font-data font-semibold">
                  {cellRef(b.minR, b.minC)}:{cellRef(b.maxR, b.maxC)}
                  <span style={{ color: '#9CA3AF', marginLeft: 4 }}>({numRows}×{numCols})</span>
                </span>

            return (
              <span className="text-fb-mid font-data font-semibold">
                {activeCellRef}
                {columns[activeCell.colIdx] && (
                  <span style={{ color: typeColors[columns[activeCell.colIdx].colType || 'num'], marginLeft: 4 }}>

        {/* ── DMS Numpad — shown when editing a DMS column cell ── */}
        {isDMSCell && (

            onCommit={() => {

        {colModal && (

                  />
                </div>
              </div>
              <div className="flex gap-3 mt-5">
                <button onClick={() => deleteCol(colModal.col.id)}
                  className="py-3 px-4 rounded-xl border-2 border-red-200 text-red-400 font-semibold text-sm active:bg-red-50">
                  Delete
                </button>
                <button onClick={() => setColModal(null)} className="flex-1 py-3 rounded-xl border-2 border-gray-200 text-gray-600 font-semibold text-sm">Cancel</button>
                <button onClick={saveColModal} className="flex-1 py-3 rounded-xl text-white font-semibold text-sm" style={{ background: '#2D6A4F' }}>Save</button>
              </div>
            </div>
          </div>
        )}

        {inverseOpen && (
          <InverseSheet rows={rows} initialFrom={inverseOpen.from} initialTo={inverseOpen.to} onClose={() => setInverseOpen(null)} />
        )}
        {stakeoutOpen && (
          <StakeoutSheet rows={rows} initialOc={stakeoutOpen.oc} onClose={() => setStakeoutOpen(null)} />
        )}
        {forwardOpen && (
          <ForwardPointSheet rows={rows} projectId={projectId} initialFrom={forwardOpen.from}
            suggestNum={nextPointNum(rows)} onClose={() => setForwardOpen(null)}
            onAdd={pt => {
              const cells = {};
              columns.forEach(c => { cells[c.id] = ''; });
              Object.assign(cells, { col_ptnum: pt.number, col_north: pt.n, col_east: pt.e, col_desc: pt.desc });
              persistRows([...rows, { id: 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7), cells }]);
              setForwardOpen(null);
              toast.success(`Point ${pt.number} added`);
            }} />
        )}
        {codesOpen && (
          <DescCodesSheet codes={descCodes} onClose={() => setCodesOpen(false)}
            onSave={codes => { saveDescCodes(codes); setDescCodes(codes); setCodesOpen(false); toast.success('Codes saved'); }} />
        )}

        {/* ── GPS capture (points pages) — the row lands on THIS page ── */}
        {gpsOpen && (
          <GpsCaptureSheet projectId={projectId}
            onClose={() => setGpsOpen(false)}
            onSave={pt => {
              persistRows([...rows, makeGpsRow(DB.getProject(projectId), pt)]);
              setGpsOpen(false);
              toast.success(`GPS point ${pt.number} saved`);
            }} />
        )}

        {/* ── CSV Import modal ── */}
        {csvImportModal && (
          <div className="modal-backdrop" onClick={() => setCsvImportModal(null)}>
            <div className="modal-sheet" onClick={e => e.stopPropagation()} style={{ maxWidth: 420 }}>
              <div className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4" />
              <h2 className="text-lg font-bold text-fb-dark mb-1">Import CSV</h2>
              <p className="text-fb-muted text-xs mb-4">
                {csvImportModal.parsed.length} row{csvImportModal.parsed.length !== 1 ? 's' : ''} detected,&nbsp;
                {Math.max(...csvImportModal.parsed.map(r => r.length))} column{Math.max(...csvImportModal.parsed.map(r => r.length)) !== 1 ? 's' : ''}.
              </p>
              {/* Header preview */}
              <div style={{ background: '#F5F1E8', borderRadius: 8, padding: '8px 10px', marginBottom: 16,
                            fontSize: 12, fontFamily: FBF.sketch, color: FBC.heading,
                            overflowX: 'auto', whiteSpace: 'nowrap' }}>
                <strong>Row 1:</strong> {csvImportModal.parsed[0].map(c => `"${c}"`).join(', ')}
              </div>
              {/* Use first row as headers toggle */}
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                            padding: '10px 12px', borderRadius: 10, background: '#F5F1E8', marginBottom: 20 }}>
                <span style={{ fontSize: 14, color: FBC.heading, fontWeight: 500 }}>Use first row as column headers</span>
                <button
                  onClick={() => setCsvImportModal(m => ({ ...m, useHeader: !m.useHeader }))}
                  style={{ padding: '4px 14px', borderRadius: 20, border: 'none', cursor: 'pointer',
                           fontWeight: 700, fontSize: 12,
                           background: csvImportModal.useHeader ? FBC.cover : '#E5E1D8',
                           color:      csvImportModal.useHeader ? FBC.field  : '#6B6560' }}>
                  {csvImportModal.useHeader ? 'ON' : 'OFF'}
                </button>
              </div>
              <p className="text-fb-muted text-xs mb-4" style={{ marginTop: -12 }}>
                {csvImportModal.useHeader
                  ? `Will import ${csvImportModal.parsed.length - 1} data row${csvImportModal.parsed.length - 1 !== 1 ? 's' : ''} using row 1 as headers.`
                  : `Will import all ${csvImportModal.parsed.length} rows with auto-labelled columns (A, B, C…).`}
              </p>
              <div style={{ display: 'flex', gap: 10 }}>
                <button onClick={() => setCsvImportModal(null)}
                  style={{ flex: 1, padding: '12px 0', borderRadius: 12, border: '2px solid #E5E1D8',
                           background: 'transparent', color: '#6B6560', fontWeight: 600, fontSize: 14, cursor: 'pointer' }}>
                  Cancel
                </button>
                <button onClick={() => confirmDataCSVImport(csvImportModal.parsed, csvImportModal.useHeader)}
                  style={{ flex: 2, padding: '12px 0', borderRadius: 12, border: 'none',
                           background: FBC.cover, color: FBC.field, fontWeight: 600, fontSize: 14, cursor: 'pointer' }}>
                  Import
                </button>
              </div>
            </div>
          </div>
        )}

        {/* ── Template modal ── */}
        {templateModal && (
          <div className="modal-backdrop" onClick={() => setTemplateModal(false)}>
            <div ref={templateModalRef} className="modal-sheet" onClick={e => e.stopPropagation()}
              style={{ maxHeight: '85vh', overflowY: 'auto' }}>
              <div className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4" />
              <h2 className="text-lg font-bold text-fb-dark mb-1">Templates</h2>
              <p className="text-fb-muted text-xs mb-4">Applying a template replaces the current columns and clears all rows.</p>

              {/* Save current as template */}
              {columns.length > 0 && (
                <button
                  onClick={() => {
                    const name = window.prompt('Template name:');
                    if (!name || !name.trim()) return;
                    const tpl = {
                      name: name.trim(),
                      desc: columns.map(c => c.label || c.id).join(' · '),
                      cols: columns.map((c, i) => ({ ...c, id: 'ct' + Date.now() + '_' + i })),
                      custom: true,
                      savedAt: new Date().toISOString(),
                    };
                    DB.saveCustomTemplate(tpl);
                    setCustomTemplates(DB.getCustomTemplates());
                  }}
                  className="w-full flex items-center justify-center gap-2 mb-4 py-2.5 rounded-xl border-2 border-dashed border-fb-mid text-fb-mid font-semibold text-sm active:bg-fb-mid/10">
                  <span style={{ fontSize: 16 }}>＋</span> Save current columns as template
                </button>
              )}

              {/* My templates */}
              {customTemplates.length > 0 && (
                <>
                  <p className="text-fb-muted text-xs font-semibold uppercase tracking-wide mb-2 px-1">My Templates</p>
                  <div className="space-y-2 mb-4">
                    {customTemplates.map(tpl => (
                      <div key={tpl.name} className="flex items-stretch gap-2">
                        <button
                          onClick={() => {
                            if (rows.some(r => Object.values(r.cells || {}).some(v => v.trim())))
                              if (!window.confirm('This will clear all existing data. Continue?')) return;
                            applyTemplate(tpl);
                          }}
                          className="flex-1 flex items-start gap-3 p-3 rounded-xl border-2 border-fb-mid/30 active:border-fb-mid text-left">
                          <div className="flex-1 min-w-0">
                            <p className="font-semibold text-fb-text text-sm">{tpl.name}</p>
                            <p className="text-fb-muted text-xs mt-0.5 font-data">{tpl.desc}</p>
                          </div>
                          <Ico.ChevR />
                        </button>
                        <button
                          onClick={() => {
                            if (!window.confirm(`Delete template "${tpl.name}"?`)) return;
                            DB.deleteCustomTemplate(tpl.name);
                            setCustomTemplates(DB.getCustomTemplates());
                          }}
                          className="w-10 flex items-center justify-center rounded-xl border-2 border-red-100 text-red-300 active:text-red-500 active:border-red-300 flex-shrink-0">
                          <Ico.Trash />
                        </button>
                      </div>
                    ))}
                  </div>
                </>
              )}

              {/* Built-in templates */}
              <p className="text-fb-muted text-xs font-semibold uppercase tracking-wide mb-2 px-1">Built-in</p>
              <div className="space-y-2">
                {TEMPLATES.map(tpl => (
                  <button key={tpl.name}
                    onClick={() => {
                      if (rows.some(r => Object.values(r.cells || {}).some(v => v.trim())))
                        if (!window.confirm('This will clear all existing data. Continue?')) return;
                      applyTemplate(tpl);
                    }}
                    className="w-full flex items-start gap-3 p-3 rounded-xl border-2 border-gray-100 active:border-fb-mid text-left">
                    <div className="flex-1 min-w-0">
                      <p className="font-semibold text-fb-text text-sm">{tpl.name}</p>
                      <p className="text-fb-muted text-xs mt-0.5 font-data">{tpl.desc}</p>
                    </div>
                    <Ico.ChevR />
                  </button>
                ))}
              </div>

              <button onClick={() => setTemplateModal(false)}
                className="w-full mt-4 py-3 rounded-xl border-2 border-gray-200 text-gray-600 font-semibold text-sm">
                Cancel
              </button>
            </div>
          </div>
        )}
      </div>
    );
  }


  // ─────────────────────────────────────────────────────────────────────────────
  // SKETCH PAGE — loaded from sketch.js (see that file for the full engine)
  // SketchPage is available on window.SketchPage after sketch.js executes.
  // ─────────────────────────────────────────────────────────────────────────────

  // ─────────────────────────────────────────────────────────────────────────────
  // TITLE PAGE
  // ─────────────────────────────────────────────────────────────────────────────

  function fmtDateDMY(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const months = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  }

  function TitlePage({ page, projectId, project, onReload }) {
    const [form, setForm] = useState({
      title:       page.title       || '',
      location:    page.location    || '',
      crew:        page.crew        || '',
      equipment:   page.equipment   || '',
      datum:       page.datum       || 'NAD83(CSRS), UTM Zone 20N / CGVD2013',
      ppm:         page.ppm         || '',
      temperature: page.temperature || '',
      pressure:    page.pressure    || '',
      prismConst:  page.prismConst  || '',
      summary:     page.summary     || '',
      codeList:    page.codeList    || '',
      fileNames:   page.fileNames   || '',
      surveyDate:  page.surveyDate  || '',
      startTime:   page.startTime   || '',
      stopTime:    page.stopTime    || '',
    });
    const [dirty, setDirty] = useState(false);
    const timerRef = useRef(null);
    const projCrs = fbGeo.projectCrs(DB.getProject(projectId));

    // Auto-grow all textareas on page load / page change
    useEffect(() => {
      document.querySelectorAll('.tp-grow').forEach(el => {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
      });
    }, [page.id]);

    useEffect(() => {
      setForm({
        title:       page.title       || '',
        location:    page.location    || '',
        crew:        page.crew        || '',
        equipment:   page.equipment   || '',
        datum:       page.datum       || 'NAD83(CSRS), UTM Zone 20N / CGVD2013',
        ppm:         page.ppm         || '',
        temperature: page.temperature || '',
        pressure:    page.pressure    || '',
        prismConst:  page.prismConst  || '',
        summary:     page.summary     || '',
        codeList:    page.codeList    || '',
        fileNames:   page.fileNames   || '',
        surveyDate:  page.surveyDate  || '',
        startTime:   page.startTime   || '',
        stopTime:    page.stopTime    || '',
      });
    }, [page.id]);

    // `immediate` writes without the typing delay — used for a stamped "Now"
    // time, which can't be retyped if the app is closed before the save.
    function handleChange(key, val, immediate) {
      const updated = { ...form, [key]: val };
      setForm(updated);
      clearTimeout(timerRef.current);
      const save = () => {
        DB.updatePage(projectId, page.id, updated);
        onReload();
        setDirty(false);
      };
      if (immediate) { save(); return; }
      setDirty(true);
      timerRef.current = setTimeout(save, 800);
    }
    // Worked out from the two times, never stored.
    const duration = fbGnss.dayDuration(form.startTime, form.stopTime);

    // Grows a textarea to fit its content, then keeps the cursor visible.
    function grow(el) {
      if (!el) return;
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
      // After the layout settles, scroll the active element back into view so
      // the cursor doesn't disappear below the bottom of the page/keyboard.
      if (document.activeElement === el) {
        requestAnimationFrame(() => el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
      }
    }

    // When a field is focused, wait for the mobile keyboard to finish sliding
    // open (~350 ms) then scroll the field to the center of whatever visible
    // viewport remains above the keyboard.
    function focusScroll(e) {
      const el = e.target;
      setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 350);
    }

    // visualViewport fires when the keyboard opens / closes. Re-scroll the
    // active element so it stays visible whenever the available height changes.
    useEffect(() => {
      if (!window.visualViewport) return;
      function onVVResize() {
        const el = document.activeElement;
        if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA')) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      window.visualViewport.addEventListener('resize', onVVResize);
      return () => window.visualViewport.removeEventListener('resize', onVVResize);
    }, []);

    const taClass = 'tp-grow w-full font-handwritten text-base text-fb-text bg-transparent outline-none resize-none placeholder-gray-300 leading-relaxed overflow-hidden';
    const inClass = 'w-full font-handwritten text-base text-fb-text bg-transparent outline-none placeholder-gray-300';
    const lblClass = 'text-[9px] font-bold text-fb-mid uppercase tracking-widest mb-0.5';
    const secClass = 'py-2.5 border-b border-fb-border';
    const instrInputClass = 'flex-1 min-w-0 font-handwritten text-base text-fb-text bg-transparent outline-none placeholder-gray-300';
    const instrLblClass   = 'text-[9px] font-bold text-fb-mid uppercase tracking-widest whitespace-nowrap flex-shrink-0';
    const instrUnitClass  = 'text-[10px] text-fb-muted flex-shrink-0';

    return (
      <div style={{ background: FBC.field }}>
        <div className="page-header-strip px-4 py-2.5 flex items-center justify-between gap-3">
          <div className="flex-1 min-w-0">
            <p className={lblClass}>Title Page · P.{page.pageNumber}</p>
            <input
              type="text"
              value={form.title}
              onChange={e => handleChange('title', e.target.value)}
              placeholder="Page title..."
              maxLength={60}
              className="w-full font-handwritten text-base text-fb-dark bg-transparent outline-none placeholder-gray-300"
              style={{ border: 'none', borderBottom: '1px solid rgba(180,165,140,0.5)', padding: '1px 0' }}
            />
          </div>
          <div className="flex-shrink-0 text-right">
            <p className="text-xs font-data text-fb-muted">{page.date}</p>
            {dirty && <span className="text-[10px] text-fb-muted italic">saving...</span>}
          </div>
        </div>
        {/* paddingBottom ensures bottom fields can scroll up above the keyboard */}
        <div className="px-5" style={{ paddingBottom: '50vh' }}>
          {/* Project Title / Location */}
          <div className={secClass}>
            <p className={lblClass}>Project Title / Location</p>
            <textarea
              ref={grow} onInput={e => grow(e.target)} onFocus={focusScroll}
              value={form.location} onChange={e => handleChange('location', e.target.value)}
              placeholder="Property address, legal description, project name..."
              className={taClass} rows={1} />
          </div>
          {/* Dates, start / stop time and duration */}
          <div className={secClass}>
            <p className={lblClass}>Dates &amp; Times</p>
            <div className="grid grid-cols-2 gap-x-4 gap-y-2 mt-0.5">
              <div className="flex flex-col gap-0.5">
                <span className={GN.lbl}>Created</span>
                <span className="font-handwritten text-base text-fb-text" style={{ opacity: 0.7 }}>
                  {fmtDateDMY((project && project.createdAt) || page.createdAt) || '—'}
                </span>
              </div>
              <div className="flex flex-col gap-0.5">
                <span className={GN.lbl}>Survey Date</span>
                <input
                  type="date"
                  value={form.surveyDate}
                  onChange={e => handleChange('surveyDate', e.target.value)}
                  onFocus={focusScroll}
                  className="font-handwritten text-base text-fb-text bg-transparent outline-none"
                  style={{ border: 'none', borderBottom: '1px solid rgba(180,165,140,0.5)', padding: '1px 0' }}
                />
              </div>
              <TpTime label="Start time" value={form.startTime} onChange={(v, now) => handleChange('startTime', v, now)} />
              <TpTime label="Stop time" value={form.stopTime} onChange={(v, now) => handleChange('stopTime', v, now)} />
              <GnReadout wide label="Duration" value={duration ? duration.text : ''}
                hint={duration && duration.overnight ? 'Stop is earlier than start — counted through midnight.' : undefined} />
            </div>
          </div>
          {/* Crew */}
          <div className={secClass}>
            <p className={lblClass}>Crew &amp; Responsibilities</p>
            <textarea
              ref={grow} onInput={e => grow(e.target)} onFocus={focusScroll}
              value={form.crew} onChange={e => handleChange('crew', e.target.value)}
              placeholder="Party chief: —   Rod person: —   Note keeper: —"
              className={taClass} rows={1} />
          </div>
          {/* Equipment */}
          <div className={secClass}>
            <p className={lblClass}>Equipment (Make, Model, S/N)</p>
            <textarea
              ref={grow} onInput={e => grow(e.target)} onFocus={focusScroll}
              value={form.equipment} onChange={e => handleChange('equipment', e.target.value)}
              placeholder="Total station: —   Level: —   Prism: —"
              className={taClass} rows={1} />
          </div>
          {/* Datum */}
          <div className={secClass}>
            <p className={lblClass}>Datum &amp; Projection</p>
            <input type="text" value={form.datum} onChange={e => handleChange('datum', e.target.value)}
              onFocus={focusScroll}
              placeholder="NAD83(CSRS), UTM Zone 20N / CGVD2013"
              className={inClass} />
            {!fbGeo.datumMatchesCrs(form.datum, projCrs.id) && (
              <div className="flex items-center gap-2 mt-1.5 px-3 py-2 rounded-xl bg-fb-warn-pale border border-fb-warn-line">
                <span className="text-fb-warn flex-shrink-0"><Ico.Warn /></span>
                <span className="flex-1 text-xs text-fb-ink leading-snug">Project coordinate system is <b>{projCrs.short}</b> — this text doesn't match.</span>
                <button onClick={() => handleChange('datum', projCrs.datumText)}
                  className="text-xs font-semibold px-3 py-2 rounded-lg text-white bg-fb-accent active:opacity-80 flex-shrink-0">
                  Update
                </button>
              </div>
            )}
          </div>
          {/* Instrument Settings — 2-column grid */}
          <div className={secClass}>
            <p className={lblClass}>Instrument Settings</p>
            <div className="grid grid-cols-2 gap-x-4 gap-y-1 mt-0.5">
              <div className="flex items-baseline gap-1.5 min-w-0">
                <span className={instrLblClass}>PPM</span>
                <input type="text" value={form.ppm} onChange={e => handleChange('ppm', e.target.value)}
                  onFocus={focusScroll} placeholder="—" className={instrInputClass} />
              </div>
              <div className="flex items-baseline gap-1.5 min-w-0">
                <span className={instrLblClass}>Temp</span>
                <input type="text" value={form.temperature} onChange={e => handleChange('temperature', e.target.value)}
                  onFocus={focusScroll} placeholder="—" className={instrInputClass} />
                <span className={instrUnitClass}>°C</span>
              </div>
              <div className="flex items-baseline gap-1.5 min-w-0">
                <span className={instrLblClass}>Pressure</span>
                <input type="text" value={form.pressure} onChange={e => handleChange('pressure', e.target.value)}
                  onFocus={focusScroll} placeholder="—" className={instrInputClass} />
                <span className={instrUnitClass}>hPa</span>
              </div>
              <div className="flex items-baseline gap-1.5 min-w-0">
                <span className={instrLblClass}>Prism K</span>
                <input type="text" value={form.prismConst} onChange={e => handleChange('prismConst', e.target.value)}
                  onFocus={focusScroll} placeholder="—" className={instrInputClass} />
                <span className={instrUnitClass}>mm</span>
              </div>
            </div>
          </div>
          {/* Summary */}
          <div className={secClass}>
            <p className={lblClass}>Summary of Work</p>
            <textarea
              ref={grow} onInput={e => grow(e.target)} onFocus={focusScroll}
              value={form.summary} onChange={e => handleChange('summary', e.target.value)}
              placeholder="Overview of survey objectives for this session..."
              className={taClass} rows={1} />
          </div>
          {/* Code List — carries over to new title pages */}
          <div className={secClass}>
            <p className={lblClass}>Code List</p>
            <textarea
              ref={grow} onInput={e => grow(e.target)} onFocus={focusScroll}
              value={form.codeList} onChange={e => handleChange('codeList', e.target.value)}
              placeholder="TL - Tree Line&#10;FT - Fallen Tree&#10;SPK - Spike&#10;SM FD - Survey Marker Found..."
              className={taClass} rows={1} />
          </div>
          {/* Digital File Names — day-specific, does not carry over */}
          <div className={secClass}>
            <p className={lblClass}>Digital File Names</p>
            <textarea
              ref={grow} onInput={e => grow(e.target)} onFocus={focusScroll}
              value={form.fileNames} onChange={e => handleChange('fileNames', e.target.value)}
              placeholder="e.g. 2026-04-06_Site9_TS.job&#10;2026-04-06_Site9_GNSS.csv"
              className={taClass} rows={1} />
          </div>
        </div>
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // GNSS STATIC OBSERVATION PAGE
  // A scrollable form filled in during a static GNSS session. All of its data
  // lives under page.gnss (see fbGnss.emptyGnss in gnss.js), so duplicate, copy,
  // page export and backup carry it with the page. gnss.js does the arithmetic.
  // ─────────────────────────────────────────────────────────────────────────────

  // Paper-surface class recipes for this page (DESIGN.md → GNSS Obs page).
  const GN = {
    lbl:  'font-heading text-[10px] font-semibold uppercase tracking-[0.09em] text-fb-heading',
    sec:  'font-heading text-[15px] font-semibold uppercase tracking-[0.05em] text-fb-heading',
    line: 'w-full min-w-0 h-10 bg-transparent outline-none border-b rounded-none placeholder:text-fb-ink-faint',
    ok:   'border-fb-border focus:border-fb-accent text-fb-ink',
    bad:  'border-fb-error text-fb-error',
    hand: 'font-handwritten text-lg',
    mono: 'font-data text-base',
    chip: 'h-11 px-3 rounded-lg text-[13px] font-semibold inline-flex items-center justify-center gap-1.5 whitespace-nowrap flex-shrink-0 bg-fb-page-alt border border-fb-border text-fb-heading active:bg-fb-page-deep',
    note: 'text-xs text-fb-ink-muted leading-snug',
  };

  function GnSection({ title, aside, children }) {
    return (
      <section className="py-3 border-b border-fb-border">
        <div className="flex items-center justify-between gap-3 mb-2">
          <h3 className={GN.sec}>{title}</h3>
          {aside}
        </div>
        {children}
      </section>
    );
  }

  // One labelled entry on the page: handwriting by default, `mono` for numbers
  // and codes. `bad` marks an entry that didn't parse.
  function GnField({ label, value, onChange, mono, wide, unit, action, hint, bad, ...input }) {
    return (
      <div className={`min-w-0 ${wide ? 'col-span-2' : ''}`}>
        <p className={GN.lbl}>{label}</p>
        <div className="flex items-end gap-2">
          <input type="text" autoComplete="off" aria-label={label} value={value}
            onChange={e => onChange(e.target.value)}
            className={`${GN.line} ${mono ? GN.mono : GN.hand} ${bad ? GN.bad : GN.ok}`} {...input} />
          {unit && <span className="font-data text-xs text-fb-ink-muted pb-2.5 flex-shrink-0">{unit}</span>}
          {action}
        </div>
        {hint && <p className={GN.note + ' mt-1'}>{hint}</p>}
      </div>
    );
  }

  // A value the page works out — shown like an entry but not editable.
  function GnReadout({ label, value, wide, mono = true, hint }) {
    return (
      <div className={`min-w-0 ${wide ? 'col-span-2' : ''}`}>
        <p className={GN.lbl}>{label}</p>
        <p className={`h-10 flex items-center border-b border-fb-border text-fb-ink truncate ${mono ? GN.mono : GN.hand}`}>{value || '—'}</p>
        {hint && <p className={GN.note + ' mt-1'}>{hint}</p>}
      </div>
    );
  }

  // Latitude or longitude: stored as decimal degrees, shown as DMS. Typing is
  // free-form ("44 38 55.7 N", "-63.5752") and is parsed when the field is left.
  function GnLatLon({ label, kind, value, onCommit, placeholder }) {
    const [text, setText] = useState(() => fbGnss.fmtLatLonDMS(value, kind));
    const [bad, setBad] = useState(false);
    const focused = useRef(false);
    const edited = useRef(false);     // leaving the field untouched must not count as a manual entry
    useEffect(() => {
      if (!focused.current) { setText(fbGnss.fmtLatLonDMS(value, kind)); setBad(false); }
    }, [value]);

    function commit() {
      focused.current = false;
      if (!edited.current) return;
      edited.current = false;
      if (!text.trim()) { setBad(false); onCommit(null); return; }
      const dd = fbGnss.parseLatLon(text);
      if (dd === null || Math.abs(dd) > (kind === 'lon' ? 180 : 90)) { setBad(true); return; }
      setBad(false);
      setText(fbGnss.fmtLatLonDMS(dd, kind));
      onCommit(dd);
    }
    return (
      <div className="min-w-0">
        <p className={GN.lbl}>{label}</p>
        <input type="text" autoComplete="off" aria-label={label} value={text} placeholder={placeholder}
          onFocus={() => { focused.current = true; }} onBlur={commit}
          onChange={e => { edited.current = true; setText(e.target.value); }}
          className={`${GN.line} ${GN.mono} ${bad ? GN.bad : GN.ok}`} />
        {bad && <p className="text-xs font-semibold text-fb-error mt-1">Not a valid {kind === 'lon' ? 'longitude' : 'latitude'}.</p>}
      </div>
    );
  }

  // A UT time (HH:MM:SS). "Now" stamps the current UTC time; 140322 typed on a
  // number pad is tidied to 14:03:22 when the field is left.
  function GnTime({ label, value, onChange, now = true }) {
    const bad = !!value.trim() && fbGnss.parseHMS(value) === null;
    function tidy() {
      const secs = fbGnss.parseHMS(value);
      if (secs !== null) onChange(fbGnss.fmtHMS(secs));
    }
    return (
      <GnField label={label} value={value} onChange={onChange} onBlur={tidy} mono bad={bad}
        inputMode="numeric" placeholder="HH:MM:SS"
        action={now && <button type="button" onClick={() => onChange(fbGnss.utcTimeHMS())} className={GN.chip}>Now</button>} />
    );
  }

  // The local clock time of a UT time, in the page's zone (g.tz). Only the UT
  // time is stored: a valid local entry is converted as it is typed, and the
  // field shows the converted UT value again once it is left. A local date
  // that isn't the UT observation date is marked −1 d / +1 d.
  function GnLocalTime({ label, ut, obsDate, tz, onChange }) {
    const loc = fbGnss.utToLocal(obsDate, ut, tz);
    const shown = loc ? loc.time : '';
    const [text, setText] = useState(shown);
    const focused = useRef(false);
    useEffect(() => { if (!focused.current) setText(shown); }, [shown]);
    const bad = !!text.trim() && fbGnss.parseHMS(text) === null;
    function edit(v) {
      setText(v);
      if (!v.trim()) onChange('');
      else { const u = fbGnss.localToUT(obsDate, v, tz); if (u !== null) onChange(u); }
    }
    const zone = fbGnss.localZone(obsDate, tz);
    return (
      <GnField label={`${label} (${loc ? loc.zone : zone})`} value={text} onChange={edit} mono bad={bad}
        onFocus={() => { focused.current = true; }} onBlur={() => { focused.current = false; setText(shown); }}
        inputMode="numeric" placeholder="HH:MM:SS"
        unit={loc && loc.dayShift ? `${loc.dayShift < 0 ? '−' : '+'}1 d` : undefined}
        action={<button type="button" onClick={() => { focused.current = false; onChange(fbGnss.utcTimeHMS()); }} className={GN.chip}>Now</button>} />
    );
  }

  // A local clock time (HH:MM, 24 h) — the Title page's start and stop. "Now"
  // stamps the current time and is saved at once (the second onChange argument);
  // 0805 typed on a number pad is tidied to 08:05 when the field is left.
  function TpTime({ label, value, onChange }) {
    const mins = fbGnss.parseHM(value);
    function tidy() {
      if (mins !== null && fbGnss.fmtHM(mins) !== value) onChange(fbGnss.fmtHM(mins));
    }
    return (
      <GnField label={label} value={value} onChange={v => onChange(v)} onBlur={tidy} mono bad={!!value.trim() && mins === null}
        inputMode="numeric" placeholder="HH:MM"
        action={<button type="button" onClick={() => onChange(fbGnss.localTimeHM(), true)} className={GN.chip}>Now</button>} />
    );
  }

  // ── Antenna library sheet ────────────────────────────────────────────────────
  const ANT_FORM_FIELDS = [
    ['R',  'R — radius to slant mark (m)'],
    ['d',  'd — slant mark above ARP (m)'],
    ['l1', 'L1 offset from ARP (m)'],
    ['l2', 'L2 offset from ARP (m)'],
  ];
  function antennaLine(a) {
    return ['R', 'd', 'l1', 'l2'].map(k => `${k === 'l1' ? 'L1' : k === 'l2' ? 'L2' : k} ${fbGnss.fmt4(a[k]) || '—'}`).join(' · ');
  }

  // Pick the antenna model for a page and manage the saved models (add, edit,
  // duplicate, delete). The library is shared by every project.
  function AntennaLibrarySheet({ currentId, onPick, onClose }) {
    const trapRef = useRef(null);
    useFocusTrap(trapRef, true, onClose);
    const toast = useToast();
    const [list, setList] = useState(() => fbGnss.getAntennas());
    const [sel, setSel] = useState(currentId || fbGnss.DEFAULT_ANTENNA_ID);
    const [form, setForm] = useState(null);   // the model being added or edited, as text fields
    const refresh = () => setList(fbGnss.getAntennas());
    const chosen = list.find(a => a.id === sel) || null;

    const fieldCls = 'w-full px-3 py-3 rounded-xl text-base text-fb-ink bg-fb-field border border-fb-border outline-none focus:border-fb-accent placeholder:text-fb-ink-faint';
    const lbl = 'text-[10px] font-bold text-fb-ink-muted uppercase tracking-widest mb-1.5';
    const chip = 'h-9 px-3 rounded-lg text-[13px] font-semibold inline-flex items-center gap-1.5 whitespace-nowrap bg-fb-page-alt border border-fb-border text-fb-heading active:bg-fb-page-deep';

    function edit(a) {
      setForm({ id: a.id, name: a.name, slantMark: a.slantMark || '', notes: a.notes || '',
                R: fbGnss.fmt4(a.R), d: fbGnss.fmt4(a.d), l1: fbGnss.fmt4(a.l1), l2: fbGnss.fmt4(a.l2) });
    }
    function duplicate(a) {
      const copy = fbGnss.duplicateAntenna(a.id);
      refresh();
      if (copy) { setSel(copy.id); toast.success(`${copy.name} added`); }
    }
    function remove(a) {
      if (!window.confirm(`Delete antenna "${a.name}"? Pages that already use it keep their own copy of the values.`)) return;
      fbGnss.deleteAntenna(a.id);
      refresh();
      setSel(currentId && currentId !== a.id ? currentId : fbGnss.DEFAULT_ANTENNA_ID);
      toast.success(`${a.name} deleted`);
    }

    if (form) {
      const n = k => fbGnss.num(form[k]);
      const numOk = k => Number.isFinite(n(k));
      const errs = {
        R:  form.R.trim()  && !(numOk('R') && n('R') > 0),
        d:  form.d.trim()  && !numOk('d'),
        l1: form.l1.trim() && !numOk('l1'),
        l2: form.l2.trim() && !numOk('l2'),
      };
      const valid = form.name.trim() && numOk('R') && n('R') > 0 && numOk('d') && !errs.l1 && !errs.l2;
      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
      function save() {
        const saved = fbGnss.saveAntenna(form);
        refresh();
        setSel(saved.id);
        setForm(null);
        toast.success(`${saved.name} saved`);
      }
      return (
        <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
          <div ref={trapRef} className="modal-sheet">
            <div className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4" />
            <h2 className="text-xl font-bold text-fb-ink mb-4">{form.id ? 'Edit antenna' : 'New antenna'}</h2>
            <p className={lbl}>Model name</p>
            <input type="text" value={form.name} onChange={e => set('name', e.target.value)} placeholder="e.g. Zephyr 3 Base"
              className={fieldCls + ' mb-3'} />
            {ANT_FORM_FIELDS.map(([k, label]) => (
              <div key={k} className="mb-3">
                <p className={lbl}>{label}</p>
                <input type="text" inputMode={k === 'd' ? 'text' : 'decimal'} value={form[k]} onChange={e => set(k, e.target.value)}
                  placeholder={k === 'd' ? '0.0000 (− if below ARP)' : '0.0000'} autoComplete="off"
                  className={`${fieldCls} font-data ${errs[k] ? 'border-fb-error' : ''}`} />
              </div>
            ))}
            <p className={lbl}>Slant measure mark</p>
            <input type="text" value={form.slantMark} onChange={e => set('slantMark', e.target.value)} placeholder="e.g. White line"
              className={fieldCls + ' mb-3'} />
            <p className={lbl}>Notes</p>
            <input type="text" value={form.notes} onChange={e => set('notes', e.target.value)} placeholder="Source of the values, calibration…"
              className={fieldCls + ' mb-5'} />
            <div className="flex gap-2">
              <button onClick={() => setForm(null)}
                className="py-3 px-5 rounded-xl text-sm font-medium text-fb-ink-muted bg-black/[0.04] active:bg-fb-page-deep">
                Cancel
              </button>
              <button onClick={save} disabled={!valid}
                className="flex-1 py-3.5 rounded-xl text-base font-semibold text-white bg-fb-accent active:opacity-80 disabled:bg-fb-ink-faint">
                Save antenna
              </button>
            </div>
          </div>
        </div>
      );
    }

    return (
      <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
        <div ref={trapRef} className="modal-sheet">
          <div className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4" />
          <div className="flex items-baseline justify-between mb-4">
            <h2 className="text-xl font-bold text-fb-ink">Antennas</h2>
            <span className="text-xs font-semibold text-fb-ink-muted">Shared by all projects</span>
          </div>
          <div className="space-y-1.5 mb-3">
            {list.map(a => {
              const on = a.id === sel;
              return (
                <div key={a.id}>
                  <button onClick={() => setSel(a.id)} role="radio" aria-checked={on}
                    className={`w-full flex items-center gap-3 px-3 py-3 rounded-xl text-left border active:opacity-80 ${on
                      ? 'bg-fb-accent-pale border-fb-accent' : 'bg-fb-page-alt border-fb-border'}`}>
                    <span className={`w-[18px] h-[18px] rounded-full border-2 border-fb-accent flex-shrink-0 ${on ? 'bg-fb-accent' : ''}`} />
                    <span className="flex-1 min-w-0">
                      <span className="block text-sm font-semibold text-fb-ink truncate">
                        {a.name}{a.builtin && <span className="font-normal text-fb-ink-muted"> · built in</span>}
                      </span>
                      <span className="block text-xs text-fb-ink-muted font-data">{antennaLine(a)}</span>
                      {a.slantMark && <span className="block text-xs text-fb-ink-muted">Slant mark: {a.slantMark}</span>}
                    </span>
                  </button>
                  {on && (
                    <div className="flex gap-1.5 mt-1.5 ml-[30px]">
                      {!a.builtin && <button onClick={() => edit(a)} className={chip}>Edit</button>}
                      <button onClick={() => duplicate(a)} className={chip}>Duplicate</button>
                      {!a.builtin && <button onClick={() => remove(a)} className={chip + ' text-fb-error'}><Ico.Trash /> Delete</button>}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          <button onClick={() => setForm({ name: '', R: '', d: '', l1: '', l2: '', slantMark: '', notes: '' })}
            className="w-full py-3 px-5 mb-3 rounded-xl text-sm font-semibold text-fb-ink bg-fb-page-alt border border-fb-border active:bg-fb-page-deep">
            Add antenna
          </button>
          <button onClick={() => chosen && onPick(chosen)} disabled={!chosen}
            className="w-full py-3.5 rounded-xl text-base font-semibold text-white bg-fb-accent active:opacity-80 disabled:bg-fb-ink-faint">
            {chosen ? `Use ${chosen.name}` : 'Use antenna'}
          </button>
          <p className="text-[11px] text-fb-ink-muted text-center mt-3 leading-snug">
            Built-in models are read-only — duplicate one to edit it.
          </p>
        </div>
      </div>
    );
  }

  // ── Antenna height readings ──────────────────────────────────────────────────
  const GN_READ_COLS = [['slant', 'before'], ['slant', 'after'], ['vert', 'before'], ['vert', 'after']];

  // S̄ / V̄ are written with a combining macron, which the mono font draws as a
  // loose "¯" after the letter — draw the bar with an overline instead. The
  // antenna offset d stays lower case inside the upper-case row labels.
  function gnBar(text) {
    return String(text).split(/([SV])\u0304|\b(d)\b/).filter(p => p !== undefined).map((part, i) =>
      i % 2 === 0 ? part : part === 'd' ? <span key={i} className="normal-case">d</span>
        : <span key={i} className="overline">{part}</span>);
  }

  // The before / after reading grid with its averages, and the reduced heights.
  function GnHeights({ g, res, onReading }) {
    const cellBad = raw => {
      if (!String(raw).trim()) return false;
      const v = fbGnss.num(raw);
      return !Number.isFinite(v) || v <= 0;
    };
    const stat = (set, part, key) => fbGnss.fmt4(res[set][part]?.[key]) || '';
    const rows = fbGnss.heightRows(res);
    // A null cell doesn't apply; a calc cell is derived from the other method's readings.
    const cell = (c, key) => !c ? <td key={key}></td>
      : c.calc ? <td key={key} className="gn-calc">{fbGnss.fmt4(c.v)}<span className="gn-calc-tag">calc</span></td>
      : <td key={key}>{fbGnss.fmt4(c.v) || '—'}</td>;
    // Only what puts the result at risk is spelled out: a range over the
    // tolerance, and an ARP more than 10 mm below zero (the PDF keeps the
    // within-noise note as part of the record).
    const warn = (name, n) => n && n.tone === 'warn' && <Notice className="mb-3">{name}: {n.text}</Notice>;
    const overTol = (set, name) => res[set].flag && (
      <Notice className="mb-3">
        {name} range {fbGnss.fmt4(res[set].all.range)} m is over the {fbGnss.fmt4(res.tol)} m tolerance.
      </Notice>
    );

    return (
      <>
        <table className="gn-table mb-3">
          <colgroup><col style={{ width: 30 }} /><col /><col /><col /><col /></colgroup>
          <thead>
            <tr>
              <th rowSpan={2}></th>
              <th colSpan={2}>Slant (m)</th>
              <th colSpan={2}>Vertical (m)</th>
            </tr>
            <tr><th>Before</th><th>After</th><th>Before</th><th>After</th></tr>
          </thead>
          <tbody>
            {[0, 1, 2].map(i => (
              <tr key={i}>
                <td className="gn-key">{i + 1}</td>
                {GN_READ_COLS.map(([set, part]) => (
                  <td key={set + part}>
                    <input type="text" inputMode="decimal" autoComplete="off" placeholder="0.0000"
                      aria-label={`${set === 'slant' ? 'Slant' : 'Vertical'} ${part} ${i + 1}`}
                      value={g[set][part][i]} onChange={e => onReading(set, part, i, e.target.value)}
                      className={cellBad(g[set][part][i]) ? 'gn-bad' : ''} />
                  </td>
                ))}
              </tr>
            ))}
            <tr>
              <td className="gn-key">Avg</td>
              {GN_READ_COLS.map(([set, part]) => <td key={set + part} className="gn-derived">{stat(set, part, 'avg')}</td>)}
            </tr>
            <tr>
              <td className="gn-key">Rng</td>
              {GN_READ_COLS.map(([set, part]) => <td key={set + part} className="gn-derived">{stat(set, part, 'range')}</td>)}
            </tr>
          </tbody>
        </table>
        {overTol('slant', 'Slant')}
        {overTol('vert', 'Vertical')}
        {res.slantErr && <Notice tone="error" className="mb-3">Slant: {res.slantErr}</Notice>}
        {res.vertErr && <Notice tone="error" className="mb-3">Vertical: {res.vertErr}</Notice>}
        {warn('Slant', res.slantNote)}
        {warn('Vertical', res.vertNote)}

        <table className="gn-table">
          <colgroup><col /><col style={{ width: '27%' }} /><col style={{ width: '27%' }} /></colgroup>
          <thead><tr><th className="gn-key">Heights (m)</th><th>Slant</th><th>Vertical</th></tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.key}>
                <td className="gn-key">{gnBar(r.label)}</td>
                {cell(r.slant, 's')}
                {cell(r.vert, 'v')}
              </tr>
            ))}
          </tbody>
        </table>
        {res.diff !== null && (
          <p className="font-data text-[13px] text-fb-ink-muted mt-2">
            Check: slant − vertical ARP = {fbGnss.fmtDiff(res.diff)} m
          </p>
        )}
      </>
    );
  }

  // One-of-N choice drawn as segmented tabs (DESIGN.md → Segmented tabs).
  function GnSegmented({ options, value, onChange, label }) {
    return (
      <div role="radiogroup" aria-label={label} className="flex gap-1 p-1 rounded-xl bg-fb-page-alt">
        {options.map(([id, text]) => (
          <button key={id} type="button" role="radio" aria-checked={value === id} onClick={() => onChange(id)}
            className={`flex-1 min-w-0 h-9 px-2 rounded-lg text-sm font-semibold truncate transition-all ${value === id
              ? 'bg-fb-field text-fb-heading shadow-sm' : 'text-fb-ink-faint'}`}>
            {text}
          </button>
        ))}
      </div>
    );
  }

  // A drawing built by gnss.js as an SVG string, scaled to the width it is given.
  function GnDrawing({ svg, className = '', onClick }) {
    return <div onClick={onClick} className={`mx-auto [&>svg]:block [&>svg]:w-full [&>svg]:h-auto ${className}`}
      dangerouslySetInnerHTML={{ __html: svg }} />;
  }

  // ── Site obstructions ────────────────────────────────────────────────────────
  // Azimuths and elevations: a plain number is decimal degrees; anything with
  // separators ("45 30", "45-30-15", 45°30') goes through the DMS parser.
  function gnAngle(raw) {
    const t = String(raw ?? '').trim().replace(/−/g, '-');
    if (!t) return null;
    if (/^-?\d+(\.\d+)?$/.test(t)) return parseFloat(t);
    return parseDMSInput(t);
  }
  const GN_OBS_ANGLES = [['fromAz', 'From Az', 360], ['fromEl', 'From Elev', 90], ['toAz', 'To Az', 360], ['toEl', 'To Elev', 90]];
  const gnNewId = prefix => prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // The obstruction table and the sky plot it feeds. Tapping a wedge marks its
  // row, and working in a row marks its wedge.
  function GnObstructions({ g, update }) {
    const [hot, setHot] = useState(null);
    const rows = g.obstructions;
    const setRow = (id, patch) => update(prev => ({ ...prev, obstructions: prev.obstructions.map(o => (o.id === id ? { ...o, ...patch } : o)) }));
    const addRow = () => {
      const id = gnNewId('ob_');
      update(prev => ({ ...prev, obstructions: [...prev.obstructions, { id, name: '', desc: '', fromAz: '', fromEl: '', toAz: '', toEl: '', comments: '' }] }));
      setHot(id);
    };
    const removeRow = id => update(prev => ({ ...prev, obstructions: prev.obstructions.filter(o => o.id !== id) }));
    const angleBad = (raw, max) => {
      if (!String(raw).trim()) return false;
      const v = gnAngle(raw);
      return v === null || !Number.isFinite(v) || v < 0 || v > max;
    };
    function onPlotTap(e) {
      const hit = e.target.closest('[data-obs]');
      const id = hit ? hit.getAttribute('data-obs') : null;
      setHot(id);
      if (id) document.getElementById('gn-obs-' + id)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    const north = fbGnss.plotNorth({ ref: g.bearingRef, declination: g.declination });
    const declBad = !!String(g.declination).trim() && !Number.isFinite(fbGnss.num(g.declination));
    const svg = fbGnss.buildSkyPlotSVG(rows, { ref: g.bearingRef, declination: g.declination, mask: g.elevMask, parse: gnAngle, highlight: hot });

    return (
      <>
        <div className="grid grid-cols-2 gap-x-4 gap-y-2 items-end mb-2">
          <div className="min-w-0">
            <p className={GN.lbl + ' mb-1'}>Bearings are</p>
            <GnSegmented label="Bearing reference" options={[['mag', 'Magnetic'], ['true', 'True']]}
              value={g.bearingRef} onChange={v => update({ bearingRef: v })} />
          </div>
          <GnField label="Declination" mono unit="°" placeholder="e.g. −16.5" bad={declBad}
            value={g.declination} onChange={v => update({ declination: v })} />
        </div>
        {g.bearingRef !== 'true' && north.shift
          ? <p className={GN.note + ' mb-3'}>Declination {north.shift > 0 ? '+' : '−'}{Math.abs(north.shift)}° applied: plotted to true north.</p>
          : <div className="mb-3" />}

        {rows.length === 0 && (
          <p className="text-sm text-fb-ink-muted py-4 mb-2 text-center rounded-xl bg-fb-page-alt">No obstructions recorded.</p>
        )}
        {rows.map((o, i) => (
          <div key={o.id} id={'gn-obs-' + o.id} onFocus={() => setHot(o.id)}
            className={`-mx-2 px-2 py-2 border-b border-fb-border/60 ${hot === o.id ? 'bg-fb-accent/10' : ''}`}>
            <div className="flex items-end gap-2">
              <button type="button" onClick={() => setHot(hot === o.id ? null : o.id)} title="Show on the sky plot"
                className={`w-9 h-10 flex-shrink-0 rounded-lg font-data text-base border ${hot === o.id
                  ? 'bg-fb-cover border-fb-cover text-white' : 'bg-fb-page-alt border-fb-border text-fb-heading'}`}>
                {i + 1}
              </button>
              <div className="flex-1 min-w-0 grid grid-cols-2 gap-x-2">
                <GnField label="Obstruction" placeholder="Tree line" value={o.name} onChange={v => setRow(o.id, { name: v })} />
                <GnField label="Type / Description" placeholder="Spruce, 12 m" value={o.desc} onChange={v => setRow(o.id, { desc: v })} />
              </div>
              <button type="button" onClick={() => removeRow(o.id)} title="Remove this obstruction"
                className="w-11 h-11 flex-shrink-0 flex items-center justify-center rounded-lg text-fb-error active:bg-fb-page-deep">
                <Ico.Trash />
              </button>
            </div>
            <div className="grid grid-cols-4 gap-x-2 mt-1.5 pl-11">
              {GN_OBS_ANGLES.map(([k, label, max]) => (
                <GnField key={k} label={label} mono inputMode="decimal" placeholder="°" bad={angleBad(o[k], max)}
                  value={o[k]} onChange={v => setRow(o.id, { [k]: v })} />
              ))}
            </div>
            <div className="mt-1.5 pl-11">
              <GnField label="Comments" value={o.comments} onChange={v => setRow(o.id, { comments: v })} />
            </div>
          </div>
        ))}
        <button type="button" onClick={addRow} className={GN.chip + ' mt-3'}>＋ Add obstruction</button>

        <p className={GN.lbl + ' mt-4 mb-1'}>Site Obstruction Diagram</p>
        <GnDrawing svg={svg} onClick={onPlotTap} className="max-w-[360px] cursor-pointer" />
      </>
    );
  }

  // ── Station sketch ───────────────────────────────────────────────────────────
  // The GNSS page whose station sketch is this sketch page, if any.
  function gnssOwnerOfSketch(project, sketchPage) {
    const owners = (project.pages || []).filter(p => p.type === 'gnss' && p.gnss?.sketch?.linkedSketchPageId === sketchPage.id);
    return owners.find(p => p.id === sketchPage.linkedTo) || owners[0] || null;
  }

  const GN_SKETCH_SOURCES = [['linked', 'Sketch'], ['satellite', 'Satellite'], ['photo', 'Photo'], ['blank', 'Blank']];
  // Grow a textarea to fit what's typed. An empty one keeps its `rows` height —
  // a wrapped placeholder would otherwise be measured as content.
  const gnGrow = el => {
    if (!el) return;
    el.style.height = 'auto';
    if (el.value) el.style.height = el.scrollHeight + 'px';
  };
  const gnUT = iso => (iso ? iso.slice(0, 16).replace('T', ' ') + ' UT' : '');

  // An ON / OFF setting on the page (DESIGN.md → Toggle row).
  function GnToggle({ on, onChange, title, help }) {
    return (
      <button type="button" onClick={() => onChange(!on)} aria-pressed={on}
        className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left bg-fb-page-alt border border-fb-border active:opacity-80">
        <span className="flex-1 min-w-0">
          <span className="block text-sm text-fb-ink">{title}</span>
          {help && <span className="block text-xs text-fb-ink-muted leading-snug">{help}</span>}
        </span>
        <span className={`text-xs font-bold px-2.5 py-1 rounded-full flex-shrink-0 ${on ? 'bg-fb-accent text-white' : 'bg-fb-border text-fb-ink'}`}>{on ? 'ON' : 'OFF'}</span>
      </button>
    );
  }

  // A picture kept in photoDB, drawn at the width it is given.
  function GnImage({ photoRef, alt }) {
    const [url, setUrl] = useState(null);
    const [missing, setMissing] = useState(false);
    useEffect(() => {
      let live = true;
      setUrl(null); setMissing(false);
      photoDB.get(photoRef)
        .then(u => { if (live) { if (u) setUrl(u); else setMissing(true); } })
        .catch(() => { if (live) setMissing(true); });
      return () => { live = false; };
    }, [photoRef]);
    if (missing) return <p className="text-sm text-fb-ink-muted py-6 text-center bg-fb-page-alt">This image isn't stored on this device.</p>;
    if (!url) return <div className="bg-fb-page-alt" style={{ aspectRatio: '4 / 3' }} />;
    return <img src={url} alt={alt} className="block w-full h-auto" />;
  }

  // Live thumbnail of a sketch page, drawn by the builder the PDF export uses.
  function GnSketchThumb({ sketchPage }) {
    const [svg, setSvg] = useState(null);
    useEffect(() => {
      let live = true;
      (async () => {
        const ids = (sketchPage.shapes || []).filter(s => s.type === 'image' && s.imageId).map(s => s.imageId);
        const imageMap = ids.length ? await photoDB.getMany(ids) : {};
        const out = (sketchPage.shapes || []).length
          ? buildSketchSVG(sketchPage.shapes, sketchPage.layers, _sketchView(sketchPage), sketchPage.scaleDenom, sketchPage.units,
                           sketchPage.showDims !== false, true, imageMap)
          : '';
        if (live) setSvg(out || '');
      })();
      return () => { live = false; };
    }, [sketchPage]);
    if (svg === null) return <div className="bg-fb-field" style={{ aspectRatio: '4 / 3' }} />;
    return svg
      ? <GnDrawing svg={svg} className="bg-fb-field" />
      : <p className="text-sm text-fb-ink-muted py-10 text-center bg-fb-field">Nothing drawn on this sketch yet.</p>;
  }

  // Sheet listing the project's sketch pages, to link one as the station sketch.
  function SketchPickerSheet({ project, currentId, onPick, onClose }) {
    const trapRef = useRef(null);
    useFocusTrap(trapRef, true, onClose);
    const sketches = (project.pages || []).filter(p => p.type === 'sketch');
    return (
      <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
        <div ref={trapRef} className="modal-sheet">
          <div className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4" />
          <h2 className="text-xl font-bold text-fb-ink mb-4">Link a sketch page</h2>
          {sketches.length === 0
            ? <p className="text-sm text-fb-ink-muted py-6 mb-3 text-center rounded-xl bg-fb-page-alt">No sketch pages in this project yet.</p>
            : (
              <div className="space-y-1.5 mb-3">
                {sketches.map(p => (
                  <button key={p.id} onClick={() => onPick(p)}
                    className={`w-full flex items-center gap-3 px-3 py-3 rounded-xl text-left border active:opacity-80 ${p.id === currentId
                      ? 'bg-fb-accent-pale border-fb-accent' : 'bg-fb-page-alt border-fb-border'}`}>
                    <span className="font-data text-sm text-fb-ink w-10 flex-shrink-0">P.{p.pageNumber}</span>
                    <span className="flex-1 min-w-0">
                      <span className="block text-sm text-fb-ink truncate">{p.title?.trim() || 'Untitled sketch'}</span>
                      <span className="block text-xs text-fb-ink-muted font-data">{p.date}</span>
                    </span>
                  </button>
                ))}
              </div>
            )}
          <button onClick={onClose}
            className="w-full py-3 rounded-xl text-sm font-medium text-fb-ink-muted bg-black/[0.04] active:bg-fb-page-deep">
            Cancel
          </button>
        </div>
      </div>
    );
  }

  // Burn the station pin, north arrow, scale bar and attribution into a
  // stitched satellite image. White linework over a black casing reads on any
  // ground cover. Web-mercator imagery is north up.
  const SAT_W = 1024, SAT_H = 768;
  function drawSatOverlay(ctx, mpp, station) {
    const cx = SAT_W / 2, cy = SAT_H / 2;
    const cased = path => {
      ctx.strokeStyle = '#000'; ctx.lineWidth = 8; path(); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.5; path(); ctx.stroke();
    };
    const label = (str, x, y, size, align) => {
      ctx.font = `700 ${size}px sans-serif`;
      ctx.textAlign = align; ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#000'; ctx.lineWidth = 6; ctx.strokeText(str, x, y);
      ctx.fillStyle = '#fff'; ctx.fillText(str, x, y);
    };
    ctx.save();
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    // Station pin — a ring with cross-hairs, open at the centre so the mark shows
    cased(() => { ctx.beginPath(); ctx.arc(cx, cy, 17, 0, Math.PI * 2); });
    cased(() => {
      ctx.beginPath();
      [[0, -34, 0, -9], [0, 9, 0, 34], [-34, 0, -9, 0], [9, 0, 34, 0]].forEach(([a, b, c, d]) => {
        ctx.moveTo(cx + a, cy + b); ctx.lineTo(cx + c, cy + d);
      });
    });
    if (station) label(station, cx + 28, cy - 30, 26, 'left');
    // North arrow, top right
    const nx = SAT_W - 54, ny = 44;
    cased(() => {
      ctx.beginPath();
      ctx.moveTo(nx, ny + 78); ctx.lineTo(nx, ny + 24);
      ctx.moveTo(nx - 15, ny + 48); ctx.lineTo(nx, ny + 22); ctx.lineTo(nx + 15, ny + 48);
    });
    label('N', nx, ny, 30, 'center');
    // Scale bar, bottom left
    const bar = fbGnss.niceScale(mpp, 240), bx = 30, by = SAT_H - 34;
    cased(() => {
      ctx.beginPath();
      ctx.moveTo(bx, by - 12); ctx.lineTo(bx, by); ctx.lineTo(bx + bar.px, by); ctx.lineTo(bx + bar.px, by - 12);
    });
    label(bar.label, bx + bar.px / 2, by - 26, 22, 'center');
    // Attribution, bottom right
    ctx.font = '400 17px sans-serif';
    const aw = ctx.measureText(fbGnss.SAT_ATTRIBUTION).width;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(SAT_W - aw - 22, SAT_H - 30, aw + 22, 30);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(fbGnss.SAT_ATTRIBUTION, SAT_W - 11, SAT_H - 15);
    ctx.restore();
  }

  // Sheet that fetches satellite imagery around the station, stitches it on a
  // canvas centred on the mark and hands back a JPEG. It needs a signal now;
  // the saved image then works offline and in the PDF.
  // `size` stitches a canvas other than the station sketch's 1024 × 768, and
  // `plain` leaves the imagery bare (no pin, arrow, scale bar or attribution) —
  // both for the aerial image that goes under a sketch.
  function SatelliteCaptureSheet({ lat, lon, station, onSave, onClose, size, plain, title = 'Satellite image' }) {
    const W = size ? size.w : SAT_W, H = size ? size.h : SAT_H;
    const trapRef = useRef(null);
    useFocusTrap(trapRef, true, onClose);
    const canvasRef = useRef(null);
    const { min, max, initial } = fbGnss.SAT_ZOOM;
    const [zoom, setZoom] = useState(initial);
    const [state, setState] = useState('loading');   // 'loading' | 'ready' | 'partial' | 'failed' | 'offline'
    const [saveErr, setSaveErr] = useState(null);
    const [attempt, setAttempt] = useState(0);

    useEffect(() => {
      const ctx = canvasRef.current.getContext('2d');
      let live = true;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      setSaveErr(null);
      if (navigator.onLine === false) { setState('offline'); return; }
      setState('loading');
      const plan = fbGnss.tilePlan(lat, lon, zoom, W, H);
      const total = plan.tiles.length;
      let done = 0, failed = 0;
      // `giveUp` settles with whatever has arrived, so a stalled tile on a weak
      // signal can't leave the sheet loading for ever.
      const settle = giveUp => {
        if (!live || (!giveUp && done + failed < total)) return;
        if (done === 0) { setState('failed'); return; }
