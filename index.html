<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#3C5445" />
  <meta name="description" content="Digital field notebook for land surveyors" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FieldBook" />
  <title>FieldBook</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- BRAND — every colour and font lives in brand.js (it also loads the Google Fonts).
       Change them there; index.html and sketch.js only reference them. -->
  <script src="./brand.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Colours and fonts come from brand.js — edit them there, not here.
    tailwind.config = FB_BRAND.tailwindConfig();
  </script>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hyperformula@2.6.1/dist/hyperformula.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.22.0/proj4.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
  <!-- Coordinate engine (CRS registry, grid/lat-lon, geoid, point index) -->
  <script src="./geoid-ns.js"></script>
  <script src="./geo.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; padding: 0; }
    body {
      font-family: var(--fb-font-ui);
      background: var(--fb-cover);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* ── Ruled notebook paper ──────────────────────────────────── */
    .page-ruled {
      background-color: var(--fb-page);
      background-image: linear-gradient(
        transparent calc(32px - 1px),
        rgb(var(--fb-rule-tan-rgb) / 0.50) calc(32px - 1px),
        rgb(var(--fb-rule-tan-rgb) / 0.50) 32px,
        transparent 32px
      );
      background-size: 100% 32px;
    }

    /* ── Fine blue engineering grid ────────────────────────────── */
    .page-grid-blue {
      background-color: var(--fb-page);
      background-image:
        linear-gradient(rgb(var(--fb-grid-blue-rgb) / 0.40) 1px, transparent 1px),
        linear-gradient(90deg, rgb(var(--fb-grid-blue-rgb) / 0.40) 1px, transparent 1px),
        linear-gradient(rgb(var(--fb-grid-blue-rgb) / 0.20) 1px, transparent 1px),
        linear-gradient(90deg, rgb(var(--fb-grid-blue-rgb) / 0.20) 1px, transparent 1px);
      background-size: 25mm 25mm, 25mm 25mm, 5mm 5mm, 5mm 5mm;
    }

    /* ── Fieldbook data table ───────────────────────────────────── */
    .fb-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--fb-font-mono);
      font-size: 13px;
    }
    .fb-table th {
      background: rgb(var(--fb-page-rgb) / 0.97);
      border-bottom: 2px solid var(--fb-accent);
      border-right: 1px solid rgba(178,162,138,0.50);
      padding: 7px 5px 5px;
      text-align: center;
      font-family: var(--fb-font-print);
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
      color: var(--fb-cover);
      letter-spacing: 0.09em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .fb-table th:last-child { border-right: none; }
    .fb-table td {
      padding: 0;
      border-right: 1px solid rgba(178,162,138,0.38);
      border-bottom: 1px solid rgba(178,162,138,0.55);
      text-align: center;
      color: var(--fb-ink);
      vertical-align: middle;
      height: 32px;
    }
    .fb-table td:last-child { border-right: none; }
    .fb-table td.td-action { width: 32px; }
    .fb-table tr:nth-child(even) td { background: rgb(var(--fb-border-rgb) / 0.14); }
    .fb-table td > input {
      display: block;
      width: 100%;
      height: 32px;
      padding: 0 5px;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--fb-font-hand);
      font-size: 16px;
      text-align: center;
      color: var(--fb-ink);
      -webkit-appearance: none;
    }
    .fb-table td > input:focus { background: rgb(var(--fb-accent-rgb) / 0.08); }
    .fb-table td > span {
      display: block;
      height: 32px;
      line-height: 32px;
      padding: 0 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Red left-margin line (fieldbook look) ──────────────────── */
    .page-margin-rule {
      border-left: 3px solid rgb(var(--fb-margin-red-rgb) / 0.22);
      margin-left: 32px;
    }

    /* ── Scrollbar ──────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--fb-border); border-radius: 3px; }

    /* ── Enhanced Data Page ──────────────────────────────────────── */
    .dp-formula-bar {
      background: var(--fb-page-alt);
      border-bottom: 1.5px solid var(--fb-border);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
      min-height: 34px;
      flex-shrink: 0;
    }
    .dp-formula-bar .cell-ref {
      font-family: var(--fb-font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--fb-cover);
      min-width: 36px;
      text-align: center;
      background: rgb(var(--fb-cover-rgb) / 0.08);
      border-radius: 4px;
      padding: 2px 5px;
      flex-shrink: 0;
    }
    .dp-formula-bar .fx-label {
      font-size: 12px;
      color: var(--fb-ink-faint);
      font-style: italic;
      flex-shrink: 0;
    }
    .dp-formula-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--fb-font-mono);
      font-size: 13px;
      color: var(--fb-ink);
      min-width: 0;
    }
    .dp-cell-active {
      background: rgb(var(--fb-accent-rgb) / 0.13) !important;
      outline: 2.5px solid #2a5c41;
      outline-offset: -1px;
      box-shadow: inset 0 0 0 1px rgba(42,92,65,0.25);
      z-index: 1;
      position: relative;
    }
    .dp-cell-formula {
      color: var(--fb-cover) !important;
      font-style: italic;
    }
    .dp-cell-dms {
      color: #1a3a8c !important;
    }
    .dp-cell-error {
      color: #dc2626 !important;
      font-size: 11px;
    }
    .dp-col-header {
      cursor: pointer;
      user-select: none;
    }
    .dp-col-header:hover { background: rgb(var(--fb-accent-rgb) / 0.08) !important; }
    .dp-col-header.active-col { background: rgb(var(--fb-accent-rgb) / 0.15) !important; color: #2A3D32 !important; }
    .dp-row-num {
      width: 28px;
      min-width: 28px;
      max-width: 28px;
      text-align: center;
      font-size: 10px;
      color: var(--fb-ink-faint);
      font-family: var(--fb-font-mono);
      background: var(--fb-page-alt);
      border-right: 1.5px solid var(--fb-border) !important;
      padding: 0 2px;
      cursor: default;
      user-select: none;
    }
    .dp-row-num.active-row { background: rgb(var(--fb-accent-rgb) / 0.12); color: var(--fb-cover); font-weight: 700; }
    .dp-toolbar {
      background: var(--fb-page-alt);
      border-bottom: 1.5px solid var(--fb-border);
      display: flex;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex-wrap: nowrap;
      align-items: center;
      padding: 4px 8px;
      gap: 4px;
      flex-shrink: 0;
    }
    .dp-toolbar::-webkit-scrollbar { display: none; }
    .dp-toolbar button {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 5px;
      border: 1px solid var(--fb-border);
      background: var(--fb-page);
      color: var(--fb-ink);
      font-family: var(--fb-font-ui);
      cursor: pointer;
      white-space: nowrap;
      line-height: 1.4;
      flex-shrink: 0;
    }
    .dp-toolbar button:active { background: var(--fb-accent-pale); border-color: var(--fb-accent); }
    .dp-toolbar .dp-drop-btn {
      display: flex; align-items: center; gap: 4px;
      background: var(--fb-page); border: 1px solid var(--fb-border); border-radius: 6px;
      padding: 4px 10px; font-size: 11px;
      font-family: var(--fb-font-ui);
      color: var(--fb-ink); cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .dp-toolbar .dp-drop-btn.active { background: var(--fb-accent-pale); border-color: var(--fb-accent); color: var(--fb-cover); }
    .dp-toolbar .dp-drop-btn:active { background: var(--fb-accent-pale); border-color: var(--fb-accent); }
    .dp-toolbar .dp-tb-sep { width: 1px; height: 18px; background: var(--fb-border); margin: 0 2px; flex-shrink: 0; }
    /* Dropdown panel */
    .dp-drop-panel {
      position: fixed; z-index: 500;
      background: var(--fb-page); border-radius: 10px; min-width: 170px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.16); padding: 5px;
      border: 1px solid var(--fb-border);
    }
    .dp-drop-panel button {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 8px 12px; border-radius: 7px; text-align: left;
      font-size: 12.5px; font-family: var(--fb-font-ui);
      background: none; border: none; color: var(--fb-ink); cursor: pointer;
      white-space: nowrap;
    }
    .dp-drop-panel button:active { background: var(--fb-accent-pale); }
    .dp-drop-panel button:disabled { opacity: 0.35; pointer-events: none; }
    .dp-drop-panel .dp-drop-sep {
      height: 1px; background: var(--fb-border); margin: 4px 6px;
    }
    .dp-drop-panel .dp-drop-section {
      font-size: 9px; color: var(--fb-ink-faint); font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 6px 12px 2px;
    }
    .dp-drop-toggle {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 8px 12px; border-radius: 7px;
      font-size: 12.5px; font-family: var(--fb-font-ui);
      background: none; border: none; color: var(--fb-ink); cursor: pointer;
      gap: 12px;
    }
    .dp-drop-toggle:active { background: var(--fb-accent-pale); }
    .dp-drop-toggle-pill {
      display: inline-flex; align-items: center; gap: 0;
      border-radius: 20px; overflow: hidden; border: 1.5px solid var(--fb-border);
      flex-shrink: 0; font-size: 9.5px; font-weight: 700;
    }
    .dp-drop-toggle-pill span {
      padding: 2px 8px; transition: background 0.15s, color 0.15s;
    }
    .dp-drop-toggle-pill span.on  { background: var(--fb-accent); color: white; }
    .dp-drop-toggle-pill span.off { background: var(--fb-page); color: var(--fb-ink-faint); }
    .dp-col-type-badge {
      display: inline-block;
      font-size: 8px;
      padding: 0 3px;
      border-radius: 3px;
      margin-left: 3px;
      vertical-align: middle;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .dp-col-type-dms  { background: #dbeafe; color: #1d4ed8; }
    .dp-col-type-num  { background: #d1fae5; color: #065f46; }
    .dp-col-type-text { background: #f3f4f6; color: #6b7280; }
    .dp-sum-row td {
      background: var(--fb-page-alt) !important;
      font-weight: 700;
      border-top: 2px solid var(--fb-accent) !important;
      font-size: 12px;
    }
    /* ── Multi-cell selection ─────────────────────────────────── */
    .dp-cell-selected {
      background: rgb(var(--fb-accent-rgb) / 0.15) !important;
    }
    .dp-sel-top    { border-top:    2px solid #2a5c41 !important; }
    .dp-sel-bottom { border-bottom: 2px solid #2a5c41 !important; }
    .dp-sel-left   { border-left:   2px solid #2a5c41 !important; }
    .dp-sel-right  { border-right:  2px solid #2a5c41 !important; }
    /* ── Formula ref selection — dashed range box ─────────────── */
    .dp-fref-sel {
      background: rgb(var(--fb-info-rgb) / 0.09) !important;
    }
    .dp-fref-top    { border-top:    2px dashed var(--fb-info) !important; }
    .dp-fref-bottom { border-bottom: 2px dashed var(--fb-info) !important; }
    .dp-fref-left   { border-left:   2px dashed var(--fb-info) !important; }
    .dp-fref-right  { border-right:  2px dashed var(--fb-info) !important; }
    /* Corner handles — blue squares, 20px, positioned outside the cell */
    .dp-fref-handle {
      position: absolute;
      width: 20px; height: 20px;
      background: var(--fb-info);
      border: 2.5px solid #fff;
      border-radius: 4px;
      z-index: 20;
      touch-action: none;
      cursor: grab;
      box-shadow: 0 1px 6px rgba(0,0,0,0.35);
    }
    .dp-fref-handle:active { cursor: grabbing; }
    /* Top-right handle */
    .dp-fref-handle-tr { top: -10px; right: -10px; }
    /* Bottom-left handle */
    .dp-fref-handle-bl { bottom: -10px; left: -10px; }
    /* ── Drag-and-drop visual feedback ───────────────────────── */
    th.dp-drag-over-col {
      border-left: 2px solid var(--fb-accent) !important;
      background: rgb(var(--fb-accent-rgb) / 0.12) !important;
    }
    .dp-row-num.dp-drag-over-row {
      border-top: 2px solid var(--fb-accent) !important;
      background: rgb(var(--fb-accent-rgb) / 0.10) !important;
      color: var(--fb-cover) !important;
    }
    .dp-col-header[draggable="true"] { cursor: grab; }
    .dp-col-header[draggable="true"]:active { cursor: grabbing; }
    .dp-row-num[draggable="true"] { cursor: grab; }
    .dp-row-num[draggable="true"]:active { cursor: grabbing; }
    /* ── GPS pin chip inside a Notes page ───────────────────────── */
    .fb-geo-pin {
      display: inline-block; padding: 1px 8px; margin: 0 2px; border-radius: 8px;
      background: var(--fb-warn-pale); border: 1px solid var(--fb-warn-line); color: var(--fb-cover);
      font-family: var(--fb-font-mono); font-size: 13px; line-height: 1.5;
      user-select: all;
    }
    /* ── Animations ─────────────────────────────────────────────── */
    .screen-enter { animation: slideUp 0.18s ease-out; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Modal ──────────────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.52);
      backdrop-filter: blur(2px);
      z-index: 50;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .modal-sheet {
      background: var(--fb-page);
      width: 100%; max-width: 600px;
      border-radius: 20px 20px 0 0;
      padding: 20px 20px 40px;
      animation: sheetUp 0.22s ease-out;
      max-height: 90vh;
      overflow-y: auto;
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    /* ── Double-page spread ─────────────────────────────────────── */
    .double-spread {
      display: flex;
      flex-direction: row;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .spread-panel {
      flex: 0 0 min(calc(100vw - 32px), 480px);
      height: 100%;
      overflow-y: auto;
      scroll-snap-align: start;
      border-right: 2px solid var(--fb-border);
    }
    .spread-panel:last-child { border-right: none; }

    /* ── Header strip ───────────────────────────────────────────── */
    .page-header-strip {
      background: var(--fb-page-alt);
      border-bottom: 2px solid var(--fb-accent);
    }
    .page-header-strip input {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(178,162,138,0.5);
      outline: none;
      font-family: var(--fb-font-hand);
      font-size: 15px;
      color: var(--fb-ink);
      width: 100%;
      padding: 1px 0;
    }

    /* ── DMS Numpad ──────────────────────────────────────────────── */
    .dp-numpad {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--fb-cover);
      border-top: 2px solid var(--fb-accent);
      padding: 8px 8px max(20px, env(safe-area-inset-bottom));
      z-index: 9980;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.42);
    }
    .dp-numpad-preview {
      font-family: var(--fb-font-mono);
      font-size: 18px;
      color: var(--fb-accent-pale);
      text-align: right;
      padding: 3px 12px;
      margin-bottom: 6px;
      background: rgba(0,0,0,0.28);
      border-radius: 7px;
      min-height: 34px;
      line-height: 34px;
      letter-spacing: 0.04em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dp-numpad-preview.empty { color: rgb(var(--fb-accent-pale-rgb) / 0.30); }
    .dp-numpad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-bottom: 5px;
    }
    .dp-numpad-btn {
      height: 54px;
      border: none;
      border-radius: 10px;
      font-family: var(--fb-font-mono);
      font-weight: 700;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }
    .dp-numpad-btn:active { opacity: 0.65; }
    .dp-numpad-btn.digit   { background: rgba(255,255,255,0.10); font-size: 20px; }
    .dp-numpad-btn.sym     { background: var(--fb-accent); font-size: 17px; }
    .dp-numpad-btn.special { background: rgba(255,255,255,0.06); font-size: 15px; }
    .dp-numpad-btn.del     { background: rgb(var(--fb-error-deep-rgb) / 0.7); font-size: 18px; }
    .dp-numpad-btn.confirm { background: var(--fb-accent-light); font-size: 17px; }
    .dp-numpad-space {
      width: 100%; height: 46px;
      border: none; border-radius: 10px;
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.55);
      font-size: 13px; letter-spacing: 0.12em;
      cursor: pointer; font-family: var(--fb-font-mono);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; user-select: none;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 4px;
    }
    .dp-numpad-space:active { opacity: 0.6; }
    .dp-numpad-dismiss {
      display: block; width: 100%;
      background: transparent; border: none;
      color: rgba(255,255,255,0.28); font-size: 11px;
      padding: 3px; cursor: pointer; font-family: sans-serif;
    }
    /* ── Fill handle (drag-down to fill/copy) ───────────────────────── */
    .dp-fill-handle {
      position: absolute;
      bottom: -1px; right: -1px;
      width: 8px; height: 8px;
      background: var(--fb-accent);
      border: 1.5px solid white;
      border-radius: 1px;
      cursor: crosshair;
      z-index: 10;
      touch-action: none;
      user-select: none;
    }
    /* Preview highlight for cells that will be filled during a handle drag */
    .dp-cell-fill-preview {
      background: rgb(var(--fb-accent-light-rgb) / 0.13) !important;
      outline: 1px dashed var(--fb-accent-light) !important;
      outline-offset: -1px !important;
    }

    /* ── Formula reference chips ─────────────────────────────────── */
    .dp-ref-chips {
      display: flex; flex-wrap: wrap; gap: 4px;
      padding: 3px 8px 3px;
      background: var(--fb-page-alt);
      border-bottom: 1px solid var(--fb-border);
      flex-shrink: 0;
      min-height: 24px; align-items: center;
    }

    /* ── Layout shell ─────────────────────────────────────────── */
    .notebook-binding-bar { display: none; }
    .notebook-frame {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .notebook-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Desktop: centred column with breathing room on the sides */
    @media (min-width: 768px) {
      #root { display: flex; justify-content: center; }
      .notebook-frame {
        width: 100%;
        box-shadow: 0 0 48px rgba(0,0,0,0.45);
      }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef, useCallback } = React;

  // App version — shown in HomePage footer so Steve can visually confirm which
  // build the PWA is actually running (SW caching on Android makes this
  // otherwise invisible). Format: 1.<sw-cache-bump>. Must stay in sync with
  // CACHE_NAME in sw.js (e.g. 'fieldbook-v1.118' ↔ '1.118').
  const APP_VERSION = '1.167';

  // Local-date YYYY-MM-DD (NOT UTC). `new Date().toISOString()` returns UTC,
  // which rolls to the *next* calendar day in western timezones after early
  // evening (e.g. Nova Scotia, UTC-3/-4) — stamping tomorrow's date onto field
  // notes. Auto-dates must always reflect the surveyor's LOCAL date.
  function todayLocalISO() {
    const d = new Date();
    const m   = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${d.getFullYear()}-${m}-${day}`;
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // PHOTO STORAGE — IndexedDB
  // ─────────────────────────────────────────────────────────────────────────────
  // Photos used to live inside each project's JSON in localStorage. That caps
  // at ~5–10 MB per origin on mobile browsers, and a single fieldbook with a
  // few dozen photos blows past it. `photoDB` stores JPEG dataUrls in a
  // dedicated IndexedDB so the localStorage budget is freed up for everything
  // else (projects, pages, shapes, notes, data rows).
  //
  // Page schema change:
  //   OLD: photos = [{ id, note, dataUrl }]
  //   NEW: photos = [{ id, note, photoRef }]
  // `photoRef` is a string key into the IDB `photos` store. The dataUrl is
  // resolved lazily in the UI and inlined for export/PDF.
  const photoDB = (() => {
    const DB_NAME  = 'fieldbook-photos';
    const STORE    = 'photos';
    const VERSION  = 1;
    let _dbPromise = null;

    function open() {
      if (_dbPromise) return _dbPromise;
      _dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror   = () => reject(req.error);
      });
      return _dbPromise;
    }

    function tx(mode) {
      return open().then(db => db.transaction(STORE, mode).objectStore(STORE));
    }

    function newRef() {
      return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
    }

    async function put(ref, dataUrl) {
      const store = await tx('readwrite');
      return new Promise((resolve, reject) => {
        const r = store.put(dataUrl, ref);
        r.onsuccess = () => resolve(ref);
        r.onerror   = () => reject(r.error);
      });
    }

    async function get(ref) {
      if (!ref) return null;
      const store = await tx('readonly');
      return new Promise((resolve, reject) => {
        const r = store.get(ref);
        r.onsuccess = () => resolve(r.result || null);
        r.onerror   = () => reject(r.error);
      });
    }

    async function getMany(refs) {
      if (!refs || refs.length === 0) return {};
      const store = await tx('readonly');
      const out = {};
      await Promise.all(refs.map(ref => new Promise((resolve) => {
        const r = store.get(ref);
        r.onsuccess = () => { if (r.result) out[ref] = r.result; resolve(); };
        r.onerror   = () => resolve();
      })));
      return out;
    }

    async function del(ref) {
      if (!ref) return;
      const store = await tx('readwrite');
      return new Promise((resolve, reject) => {
        const r = store.delete(ref);
        r.onsuccess = () => resolve();
        r.onerror   = () => reject(r.error);
      });
    }

    async function deleteMany(refs) {
      if (!refs || refs.length === 0) return;
      const store = await tx('readwrite');
      return new Promise((resolve, reject) => {
        let remaining = refs.length;
        let failed = false;
        refs.forEach(ref => {
          const r = store.delete(ref);
          r.onsuccess = () => { if (--remaining === 0 && !failed) resolve(); };
          r.onerror   = () => { if (!failed) { failed = true; reject(r.error); } };
        });
      });
    }

    async function keys() {
      const store = await tx('readonly');
      return new Promise((resolve, reject) => {
        const r = store.getAllKeys();
        r.onsuccess = () => resolve(r.result || []);
        r.onerror   = () => reject(r.error);
      });
    }

    async function getUsageBytes() {
      // Sum all dataUrl lengths. dataUrls are strings, so this is bytes-as-chars.
      // Good enough for a storage gauge; exact byte count isn't worth another pass.
      const store = await tx('readonly');
      return new Promise((resolve, reject) => {
        let total = 0;
        const req = store.openCursor();
        req.onsuccess = (e) => {
          const cur = e.target.result;
          if (cur) {
            if (typeof cur.value === 'string') total += cur.value.length;
            cur.continue();
          } else {
            resolve(total);
          }
        };
        req.onerror = () => reject(req.error);
      });
    }

    // Walk all projects' photo arrays and delete any IDB entries no longer
    // referenced. Called after bulk deletes (project/page removal, import).
    async function pruneOrphans(allProjects) {
      const live = new Set();
      (allProjects || []).forEach(proj => {
        (proj.pages || []).forEach(pg => {
          // DataPage photo refs
          (pg.photos || []).forEach(ph => {
            if (ph && ph.photoRef) live.add(ph.photoRef);
          });
          // Sketch page image refs (sk_ prefix)
          (pg.shapes || []).forEach(s => {
            if (s && s.imageId) live.add(s.imageId);
          });
        });
      });
      const all = await keys();
      const orphans = all.filter(k => !live.has(k));
      if (orphans.length) await deleteMany(orphans);
      return orphans.length;
    }

    return { open, put, get, getMany, del, deleteMany, keys, getUsageBytes, pruneOrphans, newRef };
  })();

  // ─── audioDB — voice-note recordings ───────────────────────────────────────
  // Recordings are stored as Blobs (not base64 — a third smaller, and they play
  // straight from an object URL) in their OWN IndexedDB database rather than a
  // store inside `fieldbook-photos`: no version upgrade of the photo database,
  // and photoDB.pruneOrphans never sees a key it doesn't understand.
  //
  // Voice records live on photo pages:
  //   page.voiceNotes      = [rec]   standalone voice entries
  //   page.photos[i].voice = [rec]   memos attached to a photo
  //   rec = { id, audioRef, mime, dur, size, title, desc, createdAt, geo?, ptNum? }
  // `audioRef` keys into this database. At export the Blob is inlined as
  // `audioDataUrl` (base64) and turned back into a Blob on import.
  const audioDB = (() => {
    const DB_NAME = 'fieldbook-audio';
    const STORE   = 'audio';
    let _dbPromise = null;

    function open() {
      if (_dbPromise) return _dbPromise;
      _dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror   = () => reject(req.error);
      });
      return _dbPromise;
    }
    function tx(mode) {
      return open().then(db => db.transaction(STORE, mode).objectStore(STORE));
    }
    function wrap(makeReq) {
      return new Promise((resolve, reject) => {
        const r = makeReq();
        r.onsuccess = () => resolve(r.result);
        r.onerror   = () => reject(r.error);
      });
    }
    function newRef() {
      return 'au_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
    }
    async function put(ref, blob) { const s = await tx('readwrite'); await wrap(() => s.put(blob, ref)); return ref; }
    async function get(ref)       { if (!ref) return null; const s = await tx('readonly'); return (await wrap(() => s.get(ref))) || null; }
    async function del(ref)       { if (!ref) return; const s = await tx('readwrite'); await wrap(() => s.delete(ref)); }
    async function keys()         { const s = await tx('readonly'); return (await wrap(() => s.getAllKeys())) || []; }

    async function getUsageBytes() {
      const store = await tx('readonly');
      return new Promise((resolve, reject) => {
        let total = 0;
        const req = store.openCursor();
        req.onsuccess = (e) => {
          const cur = e.target.result;
          if (cur) { total += (cur.value && cur.value.size) || 0; cur.continue(); }
          else resolve(total);
        };
        req.onerror = () => reject(req.error);
      });
    }

    // Delete recordings no page references any more (page/project deletes,
    // failed saves). Same contract as photoDB.pruneOrphans.
    async function pruneOrphans(allProjects) {
      const live = new Set();
      (allProjects || []).forEach(proj => (proj.pages || []).forEach(pg =>
        pageVoiceRecs(pg).forEach(v => { if (v.audioRef) live.add(v.audioRef); })));
      const orphans = (await keys()).filter(k => !live.has(k));
      for (const k of orphans) await del(k);
      return orphans.length;
    }

    return { open, put, get, del, keys, getUsageBytes, pruneOrphans, newRef };
  })();

  // Every voice record on a page — standalone notes and per-photo memos.
  function pageVoiceRecs(pg) {
    const out = [];
    (pg.voiceNotes || []).forEach(v => { if (v) out.push(v); });
    (pg.photos || []).forEach(ph => { if (ph && Array.isArray(ph.voice)) ph.voice.forEach(v => { if (v) out.push(v); }); });
    return out;
  }

  // Replace every voice record on a page with `await fn(rec)` (in place).
  async function mapVoiceRecs(pg, fn) {
    if (Array.isArray(pg.voiceNotes)) {
      const next = [];
      for (const v of pg.voiceNotes) next.push(v ? await fn(v) : v);
      pg.voiceNotes = next;
    }
    if (Array.isArray(pg.photos)) {
      for (const ph of pg.photos) {
        if (!ph || !Array.isArray(ph.voice)) continue;
        const next = [];
        for (const v of ph.voice) next.push(v ? await fn(v) : v);
        ph.voice = next;
      }
    }
  }

  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload  = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.readAsDataURL(blob);
    });
  }
  async function dataUrlToBlob(dataUrl) {
    return (await fetch(dataUrl)).blob();
  }

  // Best-effort removal of a recording once nothing references it (copied
  // pages share refs). audioDB.pruneOrphans catches anything this misses.
  function dropAudioIfUnused(ref) {
    if (!ref) return;
    queueMicrotask(() => {
      try {
        const used = DB.getProjects().some(pr => (pr.pages || []).some(pg =>
          pageVoiceRecs(pg).some(v => v.audioRef === ref)));
        if (!used) audioDB.del(ref).catch(() => {});
      } catch {}
    });
  }

  // Sketch engine (sketch.js) loads async. This promise gates the ReactDOM mount
  // so SketchPage is guaranteed to be defined before the app first renders.
  const _sketchPromise = new Promise(resolve => { window._resolveSketch = resolve; });

  // ─────────────────────────────────────────────────────────────────────────────
  // DATA LAYER
  // ─────────────────────────────────────────────────────────────────────────────

  // ── Project storage — IndexedDB with a synchronous write-through cache ────
  // Projects used to live in localStorage (fb_project_<id>), which mobile
  // browsers cap at ~5 MB per origin — a few active fieldbooks hit that
  // ceiling. Projects now live in their own IndexedDB database, whose quota
  // is a share of free disk (typically GBs).
  //
  // The DB API stays synchronous: every project is loaded into memory once at
  // boot (`_dataReady`, awaited before React mounts), reads come from the
  // cache, and writes update the cache immediately then persist to IDB on a
  // short coalescing timer. Pending writes are flushed when the app is hidden.
  //
  // Each project is one record keyed by id (value = JSON string); the listing
  // index [{id,name,createdAt}] is the record '__index__'. If IndexedDB can't
  // be opened (rare: some private-browsing modes) the layer falls back to the
  // old localStorage keys so the app still works.
  const projectDB = (() => {
    const DB_NAME = 'fieldbook-data';
    const STORE   = 'projects';
    let _dbPromise = null;

    function open() {
      if (_dbPromise) return _dbPromise;
      _dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror   = () => reject(req.error);
      });
      return _dbPromise;
    }

    // Every record as { key: jsonString }.
    async function getAll() {
      const db = await open();
      return new Promise((resolve, reject) => {
        const out = {};
        const req = db.transaction(STORE, 'readonly').objectStore(STORE).openCursor();
        req.onsuccess = e => {
          const cur = e.target.result;
          if (cur) { out[cur.key] = cur.value; cur.continue(); } else resolve(out);
        };
        req.onerror = () => reject(req.error);
      });
    }

    // Apply puts ({key: jsonString}) and deletes ([key]) in one transaction.
    // Resolves only once the transaction has committed.
    async function write(puts, dels) {
      const db = await open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        const st = tx.objectStore(STORE);
        Object.keys(puts).forEach(k => st.put(puts[k], k));
        dels.forEach(k => st.delete(k));
        tx.oncomplete = () => resolve();
        tx.onerror    = () => reject(tx.error);
        tx.onabort    = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
      });
    }

    return { open, getAll, write };
  })();

  const INDEX_KEY = '__index__';
  let _backend      = 'idb'; // 'idb' | 'ls' (fallback when IndexedDB is unavailable)
  let _indexCache   = [];    // [{id, name, createdAt}]
  let _projectCache = {};    // full project objects keyed by id
  const _dirty   = new Set(); // record keys awaiting an IDB put
  const _deleted = new Set(); // project ids awaiting an IDB delete
  let _flushTimer = null;
  let _flushChain = Promise.resolve();

  function _reportWriteError(err) {
    console.error('FieldBook: project save failed', err);
    if (window._fbShowStorageError) window._fbShowStorageError();
  }

  // Write all pending changes to IDB now. Returns a promise that settles when
  // they have committed (DataManagementModal awaits this before reloading).
  function _flush() {
    if (_flushTimer) { clearTimeout(_flushTimer); _flushTimer = null; }
    if (_backend !== 'idb' || (_dirty.size === 0 && _deleted.size === 0)) return _flushChain;
    const puts = {};
    _dirty.forEach(k => {
      if (k === INDEX_KEY)    puts[k] = JSON.stringify(_indexCache);
      else if (_projectCache[k]) puts[k] = JSON.stringify(_projectCache[k]);
    });
    const dels = [..._deleted];
    _dirty.clear(); _deleted.clear();
    _flushChain = _flushChain.then(() => projectDB.write(puts, dels)).catch(err => {
      // Re-queue so the next save retries these records.
      Object.keys(puts).forEach(k => { if (k === INDEX_KEY || _projectCache[k]) _dirty.add(k); });
      dels.forEach(k => { if (!_projectCache[k]) _deleted.add(k); });
      _reportWriteError(err);
    });
    return _flushChain;
  }
  function _scheduleFlush() {
    if (!_flushTimer) _flushTimer = setTimeout(_flush, 200);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') _flush();
  });
  window.addEventListener('pagehide', () => _flush());

  function _lsSet(key, value) {
    try { localStorage.setItem(key, value); }
    catch (e) { _reportWriteError(e); }
  }

  function _getIndex() {
    return _indexCache;
  }
  function _saveIndex(arr) {
    _indexCache = arr;
    if (_backend === 'idb') { _dirty.add(INDEX_KEY); _scheduleFlush(); }
    else _lsSet('fb_project_index', JSON.stringify(arr));
  }
  function _getProjectRaw(id) {
    return _projectCache[id] ?? null;
  }
  function _saveProjectRaw(proj) {
    _projectCache[proj.id] = proj;
    if (_backend === 'idb') { _deleted.delete(proj.id); _dirty.add(proj.id); _scheduleFlush(); }
    else _lsSet('fb_project_' + proj.id, JSON.stringify(proj));
    const idx = _getIndex();
    const i = idx.findIndex(e => e.id === proj.id);
    const entry = { id: proj.id, name: proj.name || '', createdAt: proj.createdAt };
    if (i === -1) idx.unshift(entry); else idx[i] = entry;
    _saveIndex(idx);
  }
  function _deleteProjectRaw(id) {
    delete _projectCache[id];
    if (_backend === 'idb') { _dirty.delete(id); _deleted.add(id); _scheduleFlush(); }
    else localStorage.removeItem('fb_project_' + id);
    _saveIndex(_getIndex().filter(e => e.id !== id));
  }

  // Read the pre-IndexedDB localStorage layout: per-project keys plus the
  // even older single `fb_projects` blob (only used when no index exists,
  // matching the original split-migration rule).
  function _readLocalStorageProjects() {
    const projects = {};
    const keys = [];
    let index = null;
    try {
      index = JSON.parse(localStorage.getItem('fb_project_index') || 'null');
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k || !k.startsWith('fb_project_') || k === 'fb_project_index') continue;
        keys.push(k);
        try { const p = JSON.parse(localStorage.getItem(k)); if (p && p.id) projects[p.id] = p; } catch {}
      }
      if (index === null) {
        const blob = JSON.parse(localStorage.getItem('fb_projects') || 'null');
        if (Array.isArray(blob)) {
          blob.forEach(p => { if (p && p.id && !projects[p.id]) projects[p.id] = p; });
          keys.push('fb_projects');
        }
      }
    } catch (e) { console.error('FieldBook: reading localStorage projects failed', e); }
    if (index !== null) keys.push('fb_project_index');
    return { index, projects, keys };
  }

  // Build a listing index that covers exactly the projects we have, keeping
  // the stored order and prepending any project the index doesn't mention.
  function _buildIndex(index, projects) {
    const seen = new Set();
    const out = [];
    (index || []).forEach(e => {
      if (e && projects[e.id] && !seen.has(e.id)) { seen.add(e.id); out.push(e); }
    });
    Object.values(projects).forEach(p => {
      if (!seen.has(p.id)) { seen.add(p.id); out.unshift({ id: p.id, name: p.name || '', createdAt: p.createdAt }); }
    });
    return out;
  }

  // Boot: load every project into memory and migrate any localStorage
  // projects into IndexedDB. localStorage copies are removed only after the
  // IDB transaction commits, so an interrupted migration just re-runs.
  const _dataReady = (async () => {
    const ls = _readLocalStorageProjects();
    let stored;
    try {
      stored = await Promise.race([
        projectDB.getAll(),
        new Promise((_, reject) => setTimeout(() => reject(new Error('IndexedDB open timed out')), 10000)),
      ]);
    } catch (err) {
      console.error('FieldBook: IndexedDB unavailable — using localStorage', err);
      _backend = 'ls';
      _projectCache = ls.projects;
      _indexCache = _buildIndex(ls.index, ls.projects);
      return;
    }

    const projects = {};
    let index = null;
    Object.keys(stored).forEach(k => {
      try {
        if (k === INDEX_KEY) index = JSON.parse(stored[k]);
        else { const p = JSON.parse(stored[k]); if (p && p.id) projects[p.id] = p; }
      } catch {}
    });
    // A project already in IDB is the live copy; only bring over new ones.
    const migrated = Object.keys(ls.projects).filter(id => !projects[id]);
    migrated.forEach(id => { projects[id] = ls.projects[id]; });
    _projectCache = projects;
    _indexCache = _buildIndex([...(index || []), ...(ls.index || [])], projects);

    if (ls.keys.length > 0) {
      const puts = { [INDEX_KEY]: JSON.stringify(_indexCache) };
      migrated.forEach(id => { puts[id] = JSON.stringify(projects[id]); });
      try {
        await projectDB.write(puts, []);
        ls.keys.forEach(k => localStorage.removeItem(k));
        if (migrated.length) console.log(`[projectDB] migrated ${migrated.length} project(s) from localStorage`);
      } catch (err) {
        // Keep localStorage intact; queue the records so normal saves retry.
        console.error('FieldBook: migration to IndexedDB failed — localStorage copy kept', err);
        Object.keys(puts).forEach(k => _dirty.add(k));
      }
    }

    // Ask the browser not to evict our data under storage pressure.
    try { if (navigator.storage?.persist) await navigator.storage.persist(); } catch {}
  })();

  // Day folders are derived from page order, not stored: a title page starts a
  // day and every page after it, up to the next title page, is its sub-page.
  // Pages above the first title page form a leading group with title: null.
  // Returns [{ title: page|null, pages: [subPages] }].
  function groupPages(pages) {
    const groups = [];
    let cur = null;
    for (const pg of (pages || [])) {
      if (pg.type === 'title') { cur = { title: pg, pages: [] }; groups.push(cur); }
      else {
        if (!cur) { cur = { title: null, pages: [] }; groups.push(cur); }
        cur.pages.push(pg);
      }
    }
    return groups;
  }

  const DB = {
    getProjects() {
      return _getIndex().map(e => _getProjectRaw(e.id)).filter(Boolean);
    },
    saveProjects(p) {
      // Bulk save — used by importProjectFromFile. Deletes removed projects.
      const keepIds = new Set(p.map(proj => proj.id));
      _getIndex().filter(e => !keepIds.has(e.id)).forEach(e => _deleteProjectRaw(e.id));
      p.forEach(proj => _saveProjectRaw(proj));
      // _saveProjectRaw prepends new projects; put the listing back in p's order.
      const idx = _getIndex();
      const ordered = p.map(proj => idx.find(e => e.id === proj.id)).filter(Boolean);
      _saveIndex([...ordered, ...idx.filter(e => !ordered.includes(e))]);
    },
    // Move a project up/down the home list (dir: -1 / 1). Active and archived
    // projects are listed separately, so it swaps with the nearest neighbour
    // in the same archived state.
    moveProject(id, dir) {
      const idx = [..._getIndex()];
      const i = idx.findIndex(e => e.id === id);
      if (i === -1) return;
      const isArch = pid => !!_getProjectRaw(pid)?.archived;
      const mine = isArch(id);
      let j = i + dir;
      while (j >= 0 && j < idx.length && isArch(idx[j].id) !== mine) j += dir;
      if (j < 0 || j >= idx.length) return;
      [idx[i], idx[j]] = [idx[j], idx[i]];
      _saveIndex(idx);
    },
    // Archived projects drop out of the working list on the home screen but
    // stay fully usable. Restoring puts the project back at the top.
    setProjectArchived(id, archived) {
      const proj = _getProjectRaw(id);
      if (!proj) return;
      const next = { ...proj };
      if (archived) { next.archived = true; next.archivedAt = new Date().toISOString(); }
      else { delete next.archived; delete next.archivedAt; }
      _saveProjectRaw(next);
      if (!archived) {
        const idx = _getIndex();
        const entry = idx.find(e => e.id === id);
        _saveIndex([entry, ...idx.filter(e => e.id !== id)]);
      }
    },
    createProject(data) {
      const proj = {
        id: Date.now().toString(),
        ...data,
        createdAt: new Date().toISOString(),
        pages: [],
        exportChain: [],
      };
      _saveProjectRaw(proj);
      return proj;
    },
    getProject(id) {
      return _getProjectRaw(id);
    },
    updateProject(id, updates) {
      const proj = _getProjectRaw(id);
      if (!proj) return;
      _saveProjectRaw({ ...proj, ...updates });
    },
    deleteProject(id) {
      _deleteProjectRaw(id);
    },
    duplicateProject(id) {
      const src = _getProjectRaw(id);
      if (!src) return null;
      let n = Date.now();
      const uid = () => String(++n);
      const newProj = JSON.parse(JSON.stringify(src));
      newProj.id = uid();
      newProj.name = (src.name?.trim() ? src.name.trim() + ' (Copy)' : '(Copy)');
      newProj.createdAt = new Date().toISOString();
      newProj.exportChain = [];
      delete newProj.archived;
      delete newProj.archivedAt;
      newProj.pages = newProj.pages.map(pg => ({
        ...pg,
        id: uid(),
        rows:   (pg.rows   || []).map(r => ({ ...r, id: uid() })),
        shapes: (pg.shapes || []).map(s => ({ ...s, id: uid() })),
      }));
      _saveProjectRaw(newProj);
      return newProj;
    },
    // atIndex (optional) inserts at that position in the flat page list instead
    // of appending — used to add a page inside a specific day folder.
    addPage(projectId, pageData, atIndex) {
      const proj = _getProjectRaw(projectId);
      if (!proj) return null;
      const page = {
        id: Date.now().toString(),
        pageNumber: proj.pages.length + 1,
        type: 'data',
        title: '',
        date: todayLocalISO(),
        weather: '',
        notes: '',
        columns: [],
        rows: [],
        location: '',
        crew: '',
        equipment: '',
        datum: 'NAD83(CSRS), UTM Zone 20N / CGVD2013',
        ppm: '',
        temperature: '',
        pressure: '',
        prismConst: '',
        summary: '',
        codeList: '',
        fileNames: '',
        shapes: [],
        ...pageData,
      };
      if (Number.isInteger(atIndex) && atIndex >= 0 && atIndex < proj.pages.length) {
        proj.pages.splice(atIndex, 0, page);
        proj.pages.forEach((g, i) => { g.pageNumber = i + 1; });
      } else {
        proj.pages.push(page);
      }
      _saveProjectRaw(proj);
      return page;
    },
    updatePage(projectId, pageId, updates) {
      const proj = _getProjectRaw(projectId);
      if (!proj) return;
      const gi = proj.pages.findIndex(g => g.id === pageId);
      if (gi === -1) return;
      proj.pages[gi] = { ...proj.pages[gi], ...updates };
      _saveProjectRaw(proj);
    },
    getPage(projectId, pageId) {
      const proj = _getProjectRaw(projectId);
      return proj ? (proj.pages.find(g => g.id === pageId) ?? null) : null;
    },
    deletePage(projectId, pageId) {
      const proj = _getProjectRaw(projectId);
      if (!proj) return;
      proj.pages = proj.pages.filter(g => g.id !== pageId);
      proj.pages.forEach((g, i) => { g.pageNumber = i + 1; });
      _saveProjectRaw(proj);
    },
    duplicatePage(projectId, pageId) {
      const proj = _getProjectRaw(projectId);
      if (!proj) return null;
      const src = proj.pages.find(g => g.id === pageId);
      if (!src) return null;
      let n = Date.now();
      const uid = () => String(++n);
      const newPage = JSON.parse(JSON.stringify(src));
      newPage.id = uid();
      newPage.title = (src.title?.trim() ? src.title.trim() + ' (Copy)' : '(Copy)');
      delete newPage.collapsed;
      if (newPage.rows)   newPage.rows   = newPage.rows.map(r => ({ ...r, id: uid() }));
      if (newPage.shapes) newPage.shapes = newPage.shapes.map(s => ({ ...s, id: uid() }));
      // Insert beside the source so the copy stays in the same day folder. A
      // title page is inserted after its whole day, so the copy starts a new
      // empty day instead of taking over the original's sub-pages.
      let at = proj.pages.indexOf(src) + 1;
      if (src.type === 'title') {
        while (at < proj.pages.length && proj.pages[at].type !== 'title') at++;
      }
      proj.pages.splice(at, 0, newPage);
      proj.pages.forEach((g, i) => { g.pageNumber = i + 1; });
      _saveProjectRaw(proj);
      return newPage;
    },
    reorderPages(projectId, fromIdx, toIdx) {
      const proj = _getProjectRaw(projectId);
      if (!proj) return;
      const pages = [...proj.pages];
      const [moved] = pages.splice(fromIdx, 1);
      pages.splice(toIdx, 0, moved);
      pages.forEach((pg, i) => { pg.pageNumber = i + 1; });
      proj.pages = pages;
      _saveProjectRaw(proj);
    },
    // Move a title page together with its sub-pages past the neighbouring day.
    // dir: -1 = up, 1 = down.
    moveGroup(projectId, titlePageId, dir) {
      const proj = _getProjectRaw(projectId);
      if (!proj) return;
      const groups = groupPages(proj.pages);
      const gi = groups.findIndex(g => g.title && g.title.id === titlePageId);
      const ni = gi + dir;
      // Loose pages above the first title page always stay at the top.
      if (gi === -1 || ni < 0 || ni >= groups.length || !groups[ni].title) return;
      [groups[gi], groups[ni]] = [groups[ni], groups[gi]];
      proj.pages = groups.flatMap(g => g.title ? [g.title, ...g.pages] : g.pages);
      proj.pages.forEach((pg, i) => { pg.pageNumber = i + 1; });
      _saveProjectRaw(proj);
    },
    // Move a page to the end of a day folder (titlePageId = null → the loose
    // pages above the first title page).
    movePageToGroup(projectId, pageId, titlePageId) {
      const proj = _getProjectRaw(projectId);
      if (!proj) return;
      const moved = proj.pages.find(g => g.id === pageId);
      if (!moved || moved.type === 'title') return;
      const pages = proj.pages.filter(g => g.id !== pageId);
      let at = 0;
      if (titlePageId) {
        const ti = pages.findIndex(g => g.id === titlePageId);
        if (ti === -1) return;
        at = ti + 1;
      }
      while (at < pages.length && pages[at].type !== 'title') at++;
      pages.splice(at, 0, moved);
      pages.forEach((pg, i) => { pg.pageNumber = i + 1; });
      proj.pages = pages;
      _saveProjectRaw(proj);
    },
    // excludeMap: { [pageId]: bool } — pages left out of PDF exports by default.
    setPdfExclude(projectId, excludeMap) {
      const proj = _getProjectRaw(projectId);
      if (!proj) return;
      proj.pages.forEach(pg => {
        if (!(pg.id in excludeMap)) return;
        if (excludeMap[pg.id]) pg.pdfExclude = true;
        else delete pg.pdfExclude;
      });
      _saveProjectRaw(proj);
    },
    // ── Custom data-page templates ────────────────────────────────────────────
    getCustomTemplates() {
      try { return JSON.parse(localStorage.getItem('fb_custom_templates') || '[]'); }
      catch { return []; }
    },
    saveCustomTemplate(tpl) {
      const all = DB.getCustomTemplates().filter(t => t.name !== tpl.name);
      localStorage.setItem('fb_custom_templates', JSON.stringify([tpl, ...all]));
    },
    deleteCustomTemplate(name) {
      const all = DB.getCustomTemplates().filter(t => t.name !== name);
      localStorage.setItem('fb_custom_templates', JSON.stringify(all));
    },
  };

  function useRouter() {
    const [hash, setHash] = useState(window.location.hash || '#/');
    useEffect(() => {
      const fn = () => setHash(window.location.hash || '#/');
      window.addEventListener('hashchange', fn);
      return () => window.removeEventListener('hashchange', fn);
    }, []);
    return hash;
  }

  function navigate(path) { window.location.hash = path; }

  function parseRoute(hash) {
    const path = hash.replace('#', '') || '/';
    const pageMatch = path.match(/^\/project\/([^/]+)\/page\/([^/]+)$/);
    if (pageMatch) return { view: 'page', projectId: pageMatch[1], pageId: pageMatch[2] };
    const projMatch = path.match(/^\/project\/([^/]+)$/);
    if (projMatch) return { view: 'project', projectId: projMatch[1] };
    return { view: 'home' };
  }

  // FOCUS TRAP HOOK
  // ─────────────────────────────────────────────────────────────────────────────

  function useFocusTrap(ref, isActive, onEscape) {
    const escRef = useRef(onEscape);
    useEffect(() => { escRef.current = onEscape; });

    useEffect(() => {
      if (!isActive || !ref.current) return;
      const el = ref.current;
      const sel = 'a[href],button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])';
      const getFocusable = () => Array.from(el.querySelectorAll(sel));
      requestAnimationFrame(() => getFocusable()[0]?.focus());

      const handler = e => {
        if (e.key === 'Escape') { escRef.current?.(); return; }
        if (e.key !== 'Tab') return;
        const focusable = getFocusable();
        if (!focusable.length) { e.preventDefault(); return; }
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first) { e.preventDefault(); last.focus(); }
        } else {
          if (document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      };
      document.addEventListener('keydown', handler);
      return () => document.removeEventListener('keydown', handler);
    }, [isActive]);
  }

  const ToastContext = React.createContext(null);

  function ToastProvider({ children }) {
    const [toasts, setToasts] = useState([]);
    const add = (msg, type = 'success') => {
      const id = Date.now() + Math.random();
      setToasts(prev => [...prev, { id, msg, type }]);
      setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
    };
    // `toast` is both callable AND has .success / .error — different callsites
    // throughout the app use both patterns. Before this was an object-only API,
    // which meant every `toast({message, type})` call silently threw and
    // swallowed errors — a huge class of invisible failures on mobile.
    const toast = (arg, maybeType) => {
      if (arg && typeof arg === 'object') add(arg.message || '', arg.type || 'success');
      else add(arg, maybeType || 'success');
    };
    toast.success = msg => add(msg, 'success');
    toast.error   = msg => add(msg, 'error');
    return (
      <ToastContext.Provider value={toast}>
        {children}
        <div style={{ position:'fixed', bottom:24, left:'50%', transform:'translateX(-50%)',
          zIndex:9999, display:'flex', flexDirection:'column', gap:8, alignItems:'center',
          pointerEvents:'none', width:'calc(100% - 32px)', maxWidth:360 }}>
          {toasts.map(t => (
            <div key={t.id} style={{
              background: t.type === 'error' ? FBC.errorDeep : FBC.cover,
              color: t.type === 'error' ? '#FECACA' : FBC.page,
              padding:'10px 18px', borderRadius:10, fontSize:14, fontWeight:500,
              boxShadow:'0 4px 16px rgba(0,0,0,0.35)', pointerEvents:'auto',
              width:'100%', textAlign:'center'
            }}>{t.msg}</div>
          ))}
        </div>
      </ToastContext.Provider>
    );
  }

  function ContextMenu({ x, y, items, onClose }) {
    const ref = useRef(null);
    const [pos, setPos] = useState({ x, y });

    useEffect(() => {
      if (!ref.current) return;
      const { width, height } = ref.current.getBoundingClientRect();
      const vw = window.innerWidth, vh = window.innerHeight;
      setPos({ x: Math.min(x, vw - width - 8), y: Math.min(y, vh - height - 8) });

      const onDown = e => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
      const onKey  = e => { if (e.key === 'Escape') onClose(); };
      document.addEventListener('mousedown', onDown);
      document.addEventListener('keydown', onKey);
      return () => {
        document.removeEventListener('mousedown', onDown);
        document.removeEventListener('keydown', onKey);
      };
    }, []);

    return (
      <div ref={ref} style={{
        position:'fixed', top:pos.y, left:pos.x, zIndex:9998,
        background:'#253B2E', border:`1px solid ${fbAlpha('page', 0.13)}`,

    const [usage, setUsage] = useState({ ls: 0, idb: 0, audio: 0, used: null, quota: null, persisted: null });

    useEffect(() => {
      (async () => {
        let lsBytes = 0;
        try { lsBytes = JSON.stringify(DB.getProjects()).length; } catch {}
        let idbBytes = 0;
        try { idbBytes = await photoDB.getUsageBytes(); } catch {}
        let audioBytes = 0;
        try { audioBytes = await audioDB.getUsageBytes(); } catch {}
        let quota = null, used = null, persisted = null;
        try {
          if (navigator.storage?.estimate) {
            const est = await navigator.storage.estimate();
            quota = est.quota || null;
            used  = est.usage ?? null;
          }
          if (navigator.storage?.persisted) persisted = await navigator.storage.persisted();
        } catch {}
        setUsage({ ls: lsBytes, idb: idbBytes, audio: audioBytes, used, quota, persisted });
      })();
    }, []);

    function fmtMB(bytes) {
      if (bytes < 1024)   return `${bytes} B`;
      if (bytes < 1e6)    return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1e6).toFixed(1)} MB`;
    }

    async function doPrune() {
      try {
        const n = (await photoDB.pruneOrphans(DB.getProjects())) + (await audioDB.pruneOrphans(DB.getProjects()));
        if (n > 0) toast.success(`Cleaned up ${n} orphan photo${n === 1 ? '' : 's'} / recording${n === 1 ? '' : 's'}`);
        else       toast.success('No orphan photos or recordings found');
        // Refresh gauge
        const idbBytes = await photoDB.getUsageBytes();
        const audioBytes = await audioDB.getUsageBytes();
        setUsage(u => ({ ...u, idb: idbBytes, audio: audioBytes }));
      } catch (err) {
        toast.error('Cleanup failed');
      }
    }

    // Photos and sketch images are inlined so the backup is self-contained.
    async function exportBackup() {
      try {
        const projects = await Promise.all(DB.getProjects().map(inlinePhotosForExport));
        const blob = new Blob([JSON.stringify(projects)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `fieldbook_backup_${todayLocalISO()}.json`;
        a.click(); URL.revokeObjectURL(url);
        toast.success(`Backup downloaded (${projects.length} project${projects.length === 1 ? '' : 's'})`);
      } catch (err) {
        console.error('Backup export failed:', err);
        toast.error('Backup failed');
      }
    }

    function importBackup(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async ev => {
        let parsed;
        try { parsed = JSON.parse(ev.target.result); }
        catch { toast.error('Failed to parse backup file'); return; }
        if (!Array.isArray(parsed) || parsed.some(p => !p || !p.id || !Array.isArray(p.pages))) {

            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: FBC.inkMuted, marginBottom: 4 }}>
              <span>Projects &amp; data</span>
              <span style={{ fontFamily: FBF.mono, color: FBC.ink }}>{fmtMB(usage.ls)}</span>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: FBC.inkMuted, marginBottom: 8 }}>
              <span>Photos &amp; images</span>
              <span style={{ fontFamily: FBF.mono, color: FBC.ink }}>{fmtMB(usage.idb)}</span>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: FBC.inkMuted, marginBottom: 8 }}>
              <span>Voice notes</span>

            <div style={{ height: 6, borderRadius: 4, background: '#D2C9B7', overflow: 'hidden', marginBottom: 4 }}>

            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: FBC.inkMuted }}>

  // Returns a short device hint string based on the user-agent.
  function deviceHint() {
    const ua = navigator.userAgent;
    if (/iPhone/.test(ua))            return 'iPhone';
    if (/iPad/.test(ua))              return 'iPad';
    if (/Android/.test(ua))           return 'Android';
    if (/Windows/.test(ua))           return 'Windows';
    if (/Macintosh|Mac OS X/.test(ua)) return 'Mac';
    return 'Unknown';
  }

  // Walk a project|page shape and inline photoRef → dataUrl from photoDB so
  // the exported file is self-contained across devices. Returns a mutated
  // *copy* of the input; photoRef is dropped from the copy, dataUrl is set.
  async function inlinePhotosForExport(projOrPage) {
    const clone = JSON.parse(JSON.stringify(projOrPage));
    const pages = clone.pages ? clone.pages : [clone];

    // Voice recordings: audioDB Blob -> base64 `audioDataUrl` (audioRef dropped)
    for (const pg of pages) {
      await mapVoiceRecs(pg, async v => {
        if (!v.audioRef) return v;
        let blob = null;
        try { blob = await audioDB.get(v.audioRef); } catch {}
        if (!blob) return v;
        const { audioRef, ...rest } = v;
        return { ...rest, audioDataUrl: await blobToDataUrl(blob) };
      });
    }

    // Collect all IDB keys: DataPage photoRefs + sketch imageIds
    const allRefs = [];
    pages.forEach(pg => {
      (pg.photos || []).forEach(ph => { if (ph && ph.photoRef) allRefs.push(ph.photoRef); });
      (pg.shapes || []).forEach(s  => { if (s  && s.imageId)   allRefs.push(s.imageId);   });
    });
    if (allRefs.length === 0) return clone;
    const map = await photoDB.getMany(allRefs);

    pages.forEach(pg => {
      // Inline DataPage photos
      if (Array.isArray(pg.photos)) {
        pg.photos = pg.photos.map(ph => {
          if (ph && ph.photoRef && map[ph.photoRef]) {
            const { photoRef, ...rest } = ph;
            return { ...rest, dataUrl: map[photoRef] };
          }
          return ph;
        });
      }
      // Inline sketch images — export as old-format dataUrl so the file is self-contained
      if (Array.isArray(pg.shapes)) {
        pg.shapes = pg.shapes.map(s => {
          if (s && s.imageId && map[s.imageId]) {
            const { imageId, ...rest } = s;
            return { ...rest, dataUrl: map[imageId] };
          }
          return s;
        });
      }
    });
    return clone;
  }

  // Reverse of inlinePhotosForExport — after importing, move any inline
  // dataUrls into photoDB and replace with fresh photoRef keys. Mutates in
  // place. Returns the mutated input.
  async function extractPhotosFromImport(projOrPage) {
    const pages = projOrPage.pages ? projOrPage.pages : [projOrPage];
    for (const pg of pages) {
      // Voice recordings: inline base64 -> Blob in audioDB under a fresh audioRef
      await mapVoiceRecs(pg, async v => {
        if (!v.audioDataUrl || v.audioRef) return v;
        try {
          const ref = audioDB.newRef();
          await audioDB.put(ref, await dataUrlToBlob(v.audioDataUrl));
          const { audioDataUrl, ...rest } = v;
          return { ...rest, audioRef: ref };
        } catch (err) {
          console.error('Voice note extract-on-import failed:', err);
          return v;
        }
      });
      // Extract DataPage photos
      if (Array.isArray(pg.photos)) {
        const next = [];
        for (const ph of pg.photos) {
          if (ph && ph.dataUrl && !ph.photoRef) {
            try {
              const ref = photoDB.newRef();
              await photoDB.put(ref, ph.dataUrl);
              const { dataUrl, ...rest } = ph;
              next.push({ ...rest, photoRef: ref });
            } catch (err) {
              console.error('Photo extract-on-import failed:', err);
              next.push(ph);
            }
          } else {
            next.push(ph);
          }
        }
        pg.photos = next;
      }
      // Extract sketch images — shapes with inline dataUrl become IDB-backed imageId refs
      if (Array.isArray(pg.shapes)) {
        const next = [];
        for (const s of pg.shapes) {
          if (s && s.type === 'image' && s.dataUrl && !s.imageId) {
            try {
              const imageId = 'sk_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
              await photoDB.put(imageId, s.dataUrl);
              const { dataUrl, ...rest } = s;
              next.push({ ...rest, imageId });
            } catch (err) {
              console.error('Sketch image extract-on-import failed:', err);
              next.push(s); // fall back to keeping inline dataUrl
            }
          } else {
            next.push(s);
          }
        }
        pg.shapes = next;
      }
    }
    return projOrPage;
  }

  // Build and trigger a .fieldbook file download for a project.
  // Appends an export record to the chain and persists it locally too.
  async function exportProjectToFile(project, by, location) {
    const chain = project.exportChain || [];
    const record = {
      seq:       chain.length + 1,
      action:    'export',
      timestamp: new Date().toISOString(),
      by:        by || 'Unknown',
      location:  location || '',
      device:    deviceHint(),
      appVersion: 'fieldbook-v' + APP_VERSION,
    };
    const updatedChain = [...chain, record];

    // Persist the updated chain on this device
    DB.updateProject(project.id, { exportChain: updatedChain });

    // Inline photo dataUrls so the exported file is portable across devices.
    const projectWithPhotos = await inlinePhotosForExport({ ...project, exportChain: updatedChain });

    const exportData = {
      type:       'fieldbook_project_export',
      version:    '1',
      exportedAt: record.timestamp,
      project:    projectWithPhotos,
    };

    const safeName = (project.name || 'project').replace(/[^a-z0-9_\-]/gi, '_');
    const dateStr  = record.timestamp.split('T')[0];
    const filename = `${safeName}_${dateStr}.fieldbook`;

    // Use octet-stream so Android/Windows download managers don't append .json
    // to the filename. application/json caused "foo.fieldbook" → "foo.fieldbook.json".
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/octet-stream' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);

    return updatedChain;
  }

  // Import a .fieldbook file's project into local storage.
  // Appends an import record and assigns new IDs so it doesn't collide.
  async function importProjectFromData(fileData, importerName) {
    const srcProject = fileData.project;
    const chain      = srcProject.exportChain || [];
    const importRecord = {
      seq:       chain.length + 1,
      action:    'import',
      timestamp: new Date().toISOString(),
      by:        importerName || '',
      location:  '',
      device:    deviceHint(),
      appVersion: 'fieldbook-v' + APP_VERSION,
    };

    // Generate fresh IDs so the imported project doesn't collide with existing ones
    let n = Date.now();
    const uid = () => String(++n);
    const newProject = {
      ...srcProject,
      id:            uid(),
      importedAt:    importRecord.timestamp,
      exportChain:   [...chain, importRecord],
      pages: (srcProject.pages || []).map(pg => ({
        ...pg,
        id:   uid(),
        rows: (pg.rows || []).map(r => ({ ...r, id: uid() })),
      })),
    };

    // Move any inline photo dataUrls into photoDB so the project lives under
    // the new photoRef scheme after import.
    await extractPhotosFromImport(newProject);

    DB.saveProject(newProject);
    return newProject;
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // PAGE TRANSFER HELPERS
  // ─────────────────────────────────────────────────────────────────────────────

  // Deep-clone a page with all-new IDs (page, rows, shapes, photos, voice notes).
  // Does NOT modify pageChain — callers append chain records themselves.
  function freshPageIds(page) {
    let n = Date.now();
    const uid = () => 'p_' + (++n) + '_' + Math.random().toString(36).slice(2, 7);
    const cloned = JSON.parse(JSON.stringify(page));
    cloned.id = uid();
    if (Array.isArray(cloned.rows)) {
      cloned.rows = cloned.rows.map(r => ({ ...r, id: uid() }));
    }
    if (Array.isArray(cloned.shapes)) {
      cloned.shapes = cloned.shapes.map(s => ({ ...s, id: uid() }));
    }
    if (Array.isArray(cloned.photos)) {
      // ptId / ptNum link a record to a point in the SOURCE project; the copy
      // gets its own point when its page is first opened (ensureMediaPoints).
      cloned.photos = cloned.photos.map(({ ptId, ptNum, noPoint, ...ph }) => ({
        ...ph, id: uid(),
        ...(Array.isArray(ph.voice) ? { voice: ph.voice.map(v => ({ ...v, id: uid() })) } : {}),
      }));
    }
    if (Array.isArray(cloned.voiceNotes)) {
      cloned.voiceNotes = cloned.voiceNotes.map(({ ptId, ptNum, noPoint, ...v }) => ({ ...v, id: uid() }));
    }
    return cloned;
  }

  // Copy one page from fromProjectId to toProjectId.
  // Returns the newly-created page.
  DB.copyPageToProject = function(fromProjectId, pageId, toProjectId, by) {
    const src         = DB.getPage(fromProjectId, pageId);
    const fromProject = DB.getProject(fromProjectId);
    const toProject   = DB.getProject(toProjectId);
    if (!src || !fromProject || !toProject) return null;

    const cloned = freshPageIds(src);
    const chain  = cloned.pageChain || [];
    chain.push({
      seq:         chain.length + 1,
      action:      'copy',
      timestamp:   new Date().toISOString(),
      by:          by || '',
      location:    '',
      device:      deviceHint(),
      appVersion:  'fieldbook-v' + APP_VERSION,
      fromProject: fromProject.name || '',
      toProject:   toProject.name   || '',
    });
    cloned.pageChain = chain;
    delete cloned.pageNumber;
    DB.addPage(toProjectId, cloned);
    return cloned;
  };

  // Export a single page to a .fieldbook-page file.
  // Appends export record to the page's chain and persists it.
  async function exportPageToFile(page, projectName, by, location, toastFn) {
    const chain = page.pageChain || [];
    const record = {
      seq:         chain.length + 1,
      action:      'export',
      timestamp:   new Date().toISOString(),
      by:          by || '',
      location:    location || '',
      device:      deviceHint(),
      appVersion:  'fieldbook-v' + APP_VERSION,
      fromProject: projectName || '',
      toProject:   null,
    };
    const updatedChain = [...chain, record];
    DB.updatePage(page._projectId || '', page.id, { pageChain: updatedChain });

    // Inline photoRef dataUrls so the .fieldbook-page file is self-contained.
    const pageWithPhotos = await inlinePhotosForExport({ ...page, pageChain: updatedChain });

    const exportData = {
      type:       'fieldbook_page_export',
      version:    '1',
      exportedAt: record.timestamp,
      sourceMeta: {
        projectName: projectName || '',
        pageTitle:   page.title  || '',
        pageType:    page.type   || '',
      },
      page: pageWithPhotos,
    };

    const safeName = (page.title || 'page').replace(/[^a-z0-9_\-]/gi, '_');
    const dateStr  = record.timestamp.split('T')[0];
    const filename = `${safeName}_${dateStr}.fieldbook-page`;

    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/octet-stream' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);

    if (toastFn) toastFn({ message: `Page exported as ${filename}`, type: 'success' });
    return updatedChain;
  }

  // Import a .fieldbook-page file into a project.
  // Validates format, assigns fresh IDs, appends import chain record.
  async function importPageFromData(fileData, toProjectId, importerName) {
    if (fileData.type !== 'fieldbook_page_export') {
      throw new Error('Not a valid .fieldbook-page file');
    }
    const srcPage   = fileData.page;
    const cloned    = freshPageIds(srcPage);
    const chain     = cloned.pageChain || [];
    chain.push({
      seq:         chain.length + 1,
      action:      'import',
      timestamp:   new Date().toISOString(),
      by:          importerName || '',
      location:    '',
      device:      deviceHint(),
      appVersion:  'fieldbook-v' + APP_VERSION,
      fromProject: fileData.sourceMeta?.projectName || '',
      toProject:   null,
    });
    cloned.pageChain = chain;
    delete cloned.pageNumber;
    // Move inlined photo dataUrls into photoDB.
    await extractPhotosFromImport(cloned);
    DB.addPage(toProjectId, cloned);
    return cloned;
  }
