      } else if (page.type === 'title') {
        // ── TITLE PAGE — professional cover sheet ──────────────────────────────
        const BRD2 = [200, 200, 200];
        const GM2  = [110, 110, 110];
        const GL2  = [100, 100, 100];
        let ty = contentY + 6;

        function _titleFieldSP(lbl, val, opts = {}) {
          if (!val?.trim() || ty > H - margin - 16) return;
          const maxW = W - margin * 2 - 14;
          const lines = pdf.splitTextToSize(val.trim(), maxW);
          const lineH = opts.mono ? 5 : 4.8;
          const blockH = lines.length * lineH + 13;
          pdf.setFillColor(...GM2);
          pdf.rect(margin + 2, ty, 2.5, blockH - 2, 'F');
          pdf.setFontSize(6); pdf.setFont('helvetica', 'bold');
          pdf.setTextColor(...GL2);
          pdf.text(lbl.toUpperCase(), margin + 8, ty + 5);
          pdf.setFontSize(10);
          pdf.setFont('helvetica', 'normal');
          pdf.setTextColor(28, 28, 28);
          pdf.text(lines, margin + 8, ty + 10.5);
          pdf.setDrawColor(...BRD2); pdf.setLineWidth(0.25);
          pdf.line(margin + 6, ty + blockH, W - margin - 4, ty + blockH);
          ty += blockH + 4;
        }

        function _instrBlockSP() {
          const instrItems = [
            ['PPM',       page.ppm         || '—'],
            ['Temp',      (page.temperature || '—') + ' °C'],
            ['Pressure',  (page.pressure    || '—') + ' hPa'],
            ['Prism K',   (page.prismConst  || '—') + ' mm'],
          ];
          if (ty > H - margin - 30) return;
          const blockH = 20;
          pdf.setFillColor(...GM2);
          pdf.rect(margin + 2, ty, 2.5, blockH - 2, 'F');
          pdf.setFontSize(6); pdf.setFont('helvetica', 'bold');
          pdf.setTextColor(...GL2);
          pdf.text('INSTRUMENT SETTINGS', margin + 8, ty + 5);
          const colW = (W - margin * 2 - 14) / 2;
          instrItems.forEach(([k, v], i) => {
            const col = i % 2, row = Math.floor(i / 2);
            const ix = margin + 8 + col * (colW + 2);
            const iy = ty + 11 + row * 5.5;
            pdf.setFontSize(6.5); pdf.setFont('helvetica', 'bold'); pdf.setTextColor(...GM2);
            pdf.text(k + ':', ix, iy);
            pdf.setFont('helvetica', 'normal'); pdf.setTextColor(28, 28, 28);
            pdf.text(v, ix + 18, iy);
          });
          pdf.setDrawColor(...BRD2); pdf.setLineWidth(0.25);
          pdf.line(margin + 6, ty + blockH, W - margin - 4, ty + blockH);
          ty += blockH + 4;
        }

        // Dates, start / stop time and duration
        ty = _pdfTitleDates(pdf, page, proj, ty, W, H, margin);
        _titleFieldSP('Location',                    page.location);
        _titleFieldSP('Crew & Responsibilities',     page.crew);
        _titleFieldSP('Equipment (Make, Model, S/N)', page.equipment, { mono: true });
        _titleFieldSP('Datum & Projection',          page.datum);
        _instrBlockSP();
        _titleFieldSP('Summary of Work',             page.summary);
        _titleFieldSP('Code List',                   page.codeList, { mono: true });
        _titleFieldSP('Digital File Names',          page.fileNames, { mono: true });
      } else if (page.type === 'photo') {
        // Same body as the whole-project export: photo grid with point number
        // and coordinates under each photo, then the voice-note record.
        const pagePhotos = page.photos || [];
        const urls = await resolvePhotoUrls(pagePhotos);
        await _pdfPhotoPageBody(pdf, page, pagePhotos, urls, proj, W, H, margin, contentY);
      } else if (page.type === 'gnss') {
        await _pdfGnssBody(pdf, page, proj, { W, H, margin, F, meta, contentY });
      } else if (page.type === 'obstructions') {
        await _pdfSiteBody(pdf, page, { W, margin, F, contentY });
      } else if (page.type === 'notes') {
        _pdfNotesBody(pdf, page, { W, H, margin, contentY });
      } else {
        const cols = page.columns || [], rows = page.rows || [];
        if (cols.length === 0) {
          pdf.setTextColor(150, 150, 150); pdf.setFontSize(9);
          pdf.text('(No columns defined)', W/2, contentY + 20, { align: 'center' });
        } else {
          const head = [cols.map(c => c.label || c.id)];
          const hfRes = evalDataPageCells(cols, rows);
          const body = rows.map(row => cols.map(col => {
            const raw = (row.cells || {})[col.id] || '';
            if (!raw.trim()) return '';
            const key = row.id + '_' + col.id;
            const cellType = getCellType(row, col);
            if (raw.startsWith('=')) return hfRes[key] || '';
            if (cellType === 'dms') return formatDMS(parseDMSInput(raw)) || raw;
            return raw;
          }));
          pdf.autoTable({
            head, body, startY: contentY + 2,
            margin: { left: margin, right: margin, bottom: margin + 14 },
            tableWidth: W - margin*2,
            headStyles: { fillColor: GD, textColor: CR, fontSize: 8, fontStyle: 'bold', halign: 'center',
                          cellPadding: { top: 3, bottom: 3, left: 3, right: 3 } },
            bodyStyles: { fontSize: 8, textColor: [44, 44, 44],
                          cellPadding: { top: 2.5, bottom: 2.5, left: 3, right: 3 } },
            alternateRowStyles: { fillColor: [245, 245, 245] },
            columnStyles: cols.reduce((acc, col, i) => {
              acc[i] = { halign: 'center', font: F.mono };
              return acc;
            }, {}),
          });
          const fy = pdf.lastAutoTable?.finalY;
          if (fy && fy < H - 14) {
            pdf.setFontSize(7); pdf.setFont('helvetica', 'italic'); pdf.setTextColor(107, 114, 128);
            pdf.text(`${rows.length} row${rows.length !== 1 ? 's' : ''}  ·  ${cols.length} column${cols.length !== 1 ? 's' : ''}`, margin, fy + 5);
          }
        }
      }

      // Notebook footer on every sheet of the page
      _pdfNumberSheets(pdf, 1, W, H, margin, exportTsSP);

      const slug = (page.title?.trim() || `P${page.pageNumber}`).replace(/[^a-zA-Z0-9_-]/g, '_');
      const fname = `${proj.name.replace(/[^a-zA-Z0-9_-]/g, '_')}_${slug}_${todayLocalISO()}.pdf`;
      pdf.save(fname);
      toast.success(`Exported ${fname}`);
    } catch (err) {
      console.error('[exportSinglePagePDF]', err);
      toast.error('PDF export failed — see console');
    } finally {
      setExporting(false);
    }
  }

  // View settings a new sketch page inherits from the most recent sketch page
  // in the project, so it starts configured like the last one worked on. A
  // project with no sketch pages yet gets the defaults (everything on, 1:1).
  function sketchViewDefaults(project) {
    const prevSketch = [...(project.pages || [])].reverse().find(p => p.type === 'sketch');
    if (!prevSketch) return {};
    return {
      showGrid:      prevSketch.showGrid      !== false,
      showDims:      prevSketch.showDims      !== false,
      dimsOnDraw:    prevSketch.dimsOnDraw    !== false,
      showValueCard: prevSketch.showValueCard !== false,
      showScaleBar:  prevSketch.showScaleBar  !== false,
      showNorthArrow:prevSketch.showNorthArrow !== false,
      scaleDenom:    prevSketch.scaleDenom    || 1,
      units:         prevSketch.units         || 'm',
    };
  }

  const TYPE_META = {
    data:   { label: 'Data',   ...FB_BRAND.PAGE_TYPES.data,   Icon: () => <Ico.Table />  },
    sketch: { label: 'Sketch', ...FB_BRAND.PAGE_TYPES.sketch, Icon: () => <Ico.Grid />   },
    title:  { label: 'Title',  ...FB_BRAND.PAGE_TYPES.title,  Icon: () => <Ico.File />   },
    photo:  { label: 'Photos', ...FB_BRAND.PAGE_TYPES.photo,  Icon: () => <Ico.Camera /> },
    points: { label: 'Points', ...FB_BRAND.PAGE_TYPES.points, Icon: () => <Ico.Pin />    },
    notes:  { label: 'Notes',  ...FB_BRAND.PAGE_TYPES.notes,  Icon: () => <Ico.Pencil /> },
    gnss:   { label: 'GNSS Obs', ...FB_BRAND.PAGE_TYPES.gnss, Icon: () => <Ico.Antenna /> },
    obstructions: { label: 'Obstructions', ...FB_BRAND.PAGE_TYPES.obstructions, Icon: () => <Ico.SkyPlot /> },
  };

  function ProjectView({ projectId }) {
    const [project, setProject] = useState(null);
    const [addStep, setAddStep] = useState(null); // null | 'type'
    const [addAtIndex, setAddAtIndex] = useState(null); // insert position for the page being added (null = end)
    const [showPdfSheet, setShowPdfSheet] = useState(false);
    const [editingCover, setEditingCover] = useState(false);
    const [coverForm, setCoverForm] = useState({});
    const [exporting, setExporting] = useState(false);
    const [showSettings,    setShowSettings]    = useState(false);
    const [showGps,         setShowGps]         = useState(false);
    const [showExportPts,   setShowExportPts]   = useState(false);
    const [pageActionTarget, setPageActionTarget] = useState(null); // page object
    const [pageExportTarget, setPageExportTarget] = useState(null); // page object
    const [pageCopyToTarget, setPageCopyToTarget] = useState(null); // page object
    const [copyFromOpen,     setCopyFromOpen]     = useState(false);
    const [importPageModal,  setImportPageModal]  = useState(null); // { fileData }
    const [pageChainTarget,  setPageChainTarget]  = useState(null); // page object
    const pageImportInputRef = useRef(null);
    const toast = useToast();

    // getProject returns the in-memory cached object, and DB mutations (reorder,
    // duplicate, etc.) mutate that same object in place. Passing the identical
    // reference to setProject makes React bail out (Object.is), so the UI wouldn't
    // update until a remount. Spread into a new object to force the re-render.
    function reload() { const p = DB.getProject(projectId); setProject(p ? { ...p } : null); }
    useEffect(() => { migrateGeoDefaults(projectId); reload(); }, [projectId]);

    function startEditCover() {
      setCoverForm({
        name:       project.name       || '',
        jobNumber:  project.jobNumber  || '',
        client:     project.client     || '',
        surveyor:   project.surveyor   || '',
        date:       project.date       || '',
      });
      setEditingCover(true);
    }

    function saveCover() {
      if (!coverForm.name.trim()) return;
      DB.updateProject(projectId, coverForm);
      reload();
      setEditingCover(false);
    }

    if (!project) return (
      <div className="flex flex-col h-full bg-fb-dark">
        <NavBar title="Project" onBack={() => navigate('#/')} />
        <div className="flex-1 flex items-center justify-center text-white/40 text-sm">Project not found.</div>
      </div>
    );

    function handleTypeSelect(type) {
      let pageData = { type };
      if (type === 'sketch') {
        pageData = { type: 'sketch', ...sketchViewDefaults(project) };
      }
      if (type === 'data') {
        // Each column now carries: id, label, colType ('text'|'num'|'dms'), width
        const cols = [
          { id: 'c1', label: 'Station', colType: 'text', width: 90 },
          { id: 'c2', label: 'BS',      colType: 'num',  width: 80 },
          { id: 'c3', label: 'HI',      colType: 'num',  width: 80 },
          { id: 'c4', label: 'FS',      colType: 'num',  width: 80 },
          { id: 'c5', label: 'Elev',    colType: 'num',  width: 80 },
          { id: 'c6', label: 'Notes',   colType: 'text', width: 120 },
        ];
        const rows = Array.from({ length: 20 }, (_, i) => {
          const cells = {};
          cols.forEach(c => { cells[c.id] = ''; });
          return { id: 'r_' + Date.now() + '_' + i, cells };
        });
        pageData = { type: 'data', columns: cols, rows };
      }
      if (type === 'title') {
        // Seed new title page from the most recent existing title page in this
        // project — crew, equipment, datum, etc. are almost always the same
        // day-to-day; the user just clears anything that changed rather than
        // re-entering everything from scratch.
        // Day-specific fields (title, summary, notes) are left blank.
        const prevTitle = [...(project.pages || [])].reverse().find(p => p.type === 'title');
        if (prevTitle) {
          pageData = {
            type:        'title',
            location:    prevTitle.location    || '',
            crew:        prevTitle.crew        || '',
            equipment:   prevTitle.equipment   || '',
            datum:       prevTitle.datum       || 'NAD83(CSRS), UTM Zone 20N / CGVD2013',
            ppm:         prevTitle.ppm         || '',
            temperature: prevTitle.temperature || '',
            pressure:    prevTitle.pressure    || '',
            prismConst:  prevTitle.prismConst  || '',
            codeList:    prevTitle.codeList    || '', // carry over — codes are project-wide
            // fileNames intentionally blank — different every session
          };
        } else {
          // First title page — datum text follows the project's coordinate system
          pageData = { type: 'title', datum: fbGeo.projectCrs(project).datumText };
        }
      }
      if (type === 'notes') {
        pageData = { type: 'notes', notesHtml: '' };
      }
      if (type === 'photo') {
        pageData = { type: 'photo', photos: [] };
      }
      if (type === 'points') {
        const cols = pnezdColumns();
        // Rows start empty — they are added automatically when points are placed
        // on the sketch canvas (one row per placed point).
        pageData = { type: 'points', columns: cols, rows: [] };
      }
      if (type === 'gnss') {
        // Receiver, antenna and session settings rarely change between
        // stations, so they carry over from the last GNSS page in the project.
        // Station, times, readings, obstructions and sketch start blank.
        const prev = [...(project.pages || [])].reverse().find(p => p.type === 'gnss' && p.gnss)?.gnss;
        const carry = {};
        if (prev) {
          ['receiverModel', 'receiverSerial', 'receiverSoftware', 'antennaId', 'antenna', 'antennaSerial',
           'cableLength', 'section', 'operators', 'interval', 'elevMask', 'method', 'methodOther',
           'bearingRef', 'declination', 'tol'].forEach(k => { if (prev[k] != null) carry[k] = prev[k]; });
        }
        // Copied by value — the new page must not share objects with the old one.
        pageData = { type: 'gnss', gnss: fbGnss.emptyGnss({ projectName: project.name || '', ...JSON.parse(JSON.stringify(carry)) }) };
      }
      if (type === 'obstructions') {
        // The observer, north reference, declination and mask rarely change
        // between points, so they carry over from the last Obstructions page.
        const prev = [...(project.pages || [])].reverse().find(p => p.type === 'obstructions' && p.site)?.site;
        const carry = {};
        if (prev) ['observer', 'bearingRef', 'declination', 'elevMask'].forEach(k => { if (prev[k] != null) carry[k] = prev[k]; });
        pageData = { type: 'obstructions', site: fbGnss.emptySite({ date: todayLocalISO(), ...carry }) };
      }
      const page = DB.addPage(projectId, pageData, addAtIndex);
      if (page) { reload(); setAddStep(null); setAddAtIndex(null); navigate(`#/project/${projectId}/page/${page.id}`); }
    }

    const pageCount = project.pages?.length || 0;
    const groups = groupPages(project.pages);
    const dayTitles = groups.filter(g => g.title).map(g => g.title);

    function setCollapsed(titleId, collapsed) {
      DB.updatePage(projectId, titleId, { collapsed });
      reload();
    }
    function setAllCollapsed(collapsed) {
      dayTitles.forEach(t => DB.updatePage(projectId, t.id, { collapsed }));
      reload();
    }
    // Moving a sub-page past a title page drops it into the neighbouring day —
    // expand that day so the page doesn't disappear into a collapsed folder.
    function movePage(idx, dir) {
      const pages = project.pages;
      const crossed = pages[idx + dir];
      if (pages[idx].type !== 'title' && crossed?.type === 'title') {
        const dest = dir > 0 ? crossed : [...pages.slice(0, idx + dir)].reverse().find(p => p.type === 'title');
        if (dest?.collapsed) DB.updatePage(projectId, dest.id, { collapsed: false });
      }
      DB.reorderPages(projectId, idx, idx + dir);
      reload();
    }
    function renderPageRow(pg, indent) {
      const idx = project.pages.indexOf(pg);
      return (
        <PageListRow key={pg.id} page={pg} projectId={projectId} indent={indent}
          canMoveUp={idx > 0}
          canMoveDown={idx < project.pages.length - 1}
          onMoveUp={() => movePage(idx, -1)}
          onMoveDown={() => movePage(idx, 1)}
          onDuplicate={() => { DB.duplicatePage(projectId, pg.id); reload(); }}
          onPageAction={pg2 => setPageActionTarget(pg2)}
          onChainBadge={pg2 => setPageChainTarget(pg2)}
        />
      );
    }

    return (
      <div className="flex flex-col h-full" style={{ background: FBC.cover }}>
        <NavBar title={project.name}
          subtitle={project.jobNumber ? `Job #${project.jobNumber}` : undefined}
          onBack={() => navigate('#/')}
          actions={
            <>
              <button
                onClick={() => setShowPdfSheet(true)}
                disabled={exporting}
                title="Export pages to PDF"
                className="p-2 rounded-xl active:bg-white/10 transition-colors"
                style={{ opacity: exporting ? 0.5 : 1 }}
              >
                {exporting
                  ? <span style={{ fontSize: 14 }}>⏳</span>
                  : <Ico.Download />
                }
              </button>
              <button
                onClick={() => setShowExportPts(true)}
                title="Export points (CSV / KML / GPX)"
                className="p-2 rounded-xl active:bg-white/10 transition-colors"
              >
                <Ico.Upload />
              </button>
              <button
                onClick={() => setShowGps(true)}
                title="Record a GPS point"
                className="p-2 rounded-xl active:bg-white/10 transition-colors"
              >
                <Ico.Pin size={18} />
              </button>
              <button
                onClick={() => setShowSettings(true)}
                title="Project settings"
                className="p-2 rounded-xl active:bg-white/10 transition-colors"
              >
                <Ico.Gear />
              </button>
            </>
          }
        />

        {project.archived && (
          <div className="flex items-center justify-between gap-3 px-4 py-2"
            style={{ background: FBC.pageAlt, borderBottom: `1px solid ${FBC.border}` }}>
            <p className="text-xs font-bold uppercase tracking-widest text-fb-muted">Archived project</p>
            <button onClick={() => { DB.setProjectArchived(projectId, false); reload(); toast.success('Project restored'); }}
              className="text-xs font-semibold px-3 py-1.5 rounded-lg text-white active:opacity-80"
              style={{ background: FBC.cover }}>
              Restore
            </button>
          </div>
        )}

        <div className="flex-1 overflow-y-auto p-4 screen-enter">
          {/* Cover */}
          <div className="rounded-2xl overflow-hidden shadow-2xl mb-4" style={{ background: FBC.coverDeep, border: `1.5px solid ${FBC.coverEdge}` }}>
            {editingCover ? (
              <>
                <div className="px-5 py-3 border-b border-fb-mid/30 flex items-center justify-between">
                  <p className="text-fb-light text-[10px] font-bold uppercase tracking-widest">Edit Project Info</p>
                  <div className="flex gap-2">
                    <button onClick={() => setEditingCover(false)}
                      className="text-xs text-white/50 px-3 py-1.5 rounded-lg border border-white/15 active:bg-white/10">
                      Cancel
                    </button>
                    <button onClick={saveCover}
                      className="text-xs text-white px-4 py-1.5 rounded-lg font-semibold active:opacity-80"
                      style={{ background: coverForm.name.trim() ? '#2D6A4F' : '#555' }}>
                      Save
                    </button>
                  </div>
                </div>
                <div className="px-5 py-4 space-y-3">
                  <div>
                    <p className="text-fb-light/45 text-[9px] font-bold uppercase tracking-widest mb-1">Project Name *</p>
                    <input type="text" value={coverForm.name}
                      onChange={e => setCoverForm(f => ({ ...f, name: e.target.value }))}
                      autoFocus maxLength={80}
                      className="w-full bg-white/08 text-white text-sm font-semibold rounded-lg px-3 py-2 outline-none border border-white/15 focus:border-fb-light/50 placeholder-white/25"
                      style={{ background: 'rgba(255,255,255,0.06)' }}
                      placeholder="Project name..." />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <p className="text-fb-light/45 text-[9px] font-bold uppercase tracking-widest mb-1">Job No.</p>
                      <input type="text" value={coverForm.jobNumber}
                        onChange={e => setCoverForm(f => ({ ...f, jobNumber: e.target.value }))}
                        className="w-full text-white text-sm font-data rounded-lg px-3 py-2 outline-none border border-white/15 focus:border-fb-light/50 placeholder-white/25"
                        style={{ background: 'rgba(255,255,255,0.06)' }}
                        placeholder="2026-001" />
                    </div>
                    <div>
                      <p className="text-fb-light/45 text-[9px] font-bold uppercase tracking-widest mb-1">Date</p>
                      <input type="date" value={coverForm.date}
                        onChange={e => setCoverForm(f => ({ ...f, date: e.target.value }))}
                        className="w-full text-white text-sm font-data rounded-lg px-3 py-2 outline-none border border-white/15 focus:border-fb-light/50"
                        style={{ background: 'rgba(255,255,255,0.06)', colorScheme: 'dark' }} />
                    </div>
                    <div>
                      <p className="text-fb-light/45 text-[9px] font-bold uppercase tracking-widest mb-1">Client</p>
                      <input type="text" value={coverForm.client}
                        onChange={e => setCoverForm(f => ({ ...f, client: e.target.value }))}
                        className="w-full text-white text-sm rounded-lg px-3 py-2 outline-none border border-white/15 focus:border-fb-light/50 placeholder-white/25"
                        style={{ background: 'rgba(255,255,255,0.06)' }}
                        placeholder="Client name" />
                    </div>
                    <div>
                      <p className="text-fb-light/45 text-[9px] font-bold uppercase tracking-widest mb-1">Surveyor</p>
                      <input type="text" value={coverForm.surveyor}
                        onChange={e => setCoverForm(f => ({ ...f, surveyor: e.target.value }))}
                        className="w-full text-white text-sm rounded-lg px-3 py-2 outline-none border border-white/15 focus:border-fb-light/50 placeholder-white/25"
                        style={{ background: 'rgba(255,255,255,0.06)' }}
                        placeholder="Your name" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-x-5 pt-1 opacity-40">
                    <CoverField label="Pages" value={String(pageCount)} mono />
                    <CoverField label="Created" value={new Date(project.createdAt).toLocaleDateString('en-CA')} mono />
                  </div>
                </div>
              </>
            ) : (
              <>
                <div className="px-5 py-3 border-b border-fb-mid/30 flex items-center justify-between">
                  <div>
                    <p className="text-fb-light text-[10px] font-bold uppercase tracking-widest mb-0.5">Field Book</p>
                    <h2 className="text-white text-lg font-bold leading-tight">{project.name}</h2>
                  </div>
                  <button onClick={startEditCover}
                    className="p-2 rounded-lg text-white/40 active:text-white active:bg-white/10 transition-colors flex-shrink-0"
                    title="Edit project info">
                    <Ico.Pencil />
                  </button>
                </div>
                <div className="px-5 py-3 grid grid-cols-2 gap-x-5 gap-y-2">
                  <CoverField label="Job No." value={project.jobNumber || '—'} mono />
                  <CoverField label="Date" value={project.date || '—'} mono />
                  <CoverField label="Client" value={project.client || '—'} />
                  <CoverField label="Surveyor" value={project.surveyor || '—'} />
                  <CoverField label="Pages" value={String(pageCount)} mono />
                  <CoverField label="Created" value={new Date(project.createdAt).toLocaleDateString('en-CA')} mono />
                </div>
              </>
            )}
          </div>

          {/* Pages */}
          {pageCount > 0 && (
            <div className="mb-4">
              <div className="flex items-center justify-between mb-2 px-1">
                <p className="text-white/45 text-[10px] font-bold uppercase tracking-widest">Pages</p>
                <div className="flex items-center gap-1.5">
                  {dayTitles.length > 0 && (
                    <button onClick={() => setAllCollapsed(!dayTitles.every(t => t.collapsed))}
                      className="text-[10px] font-semibold px-2 py-0.5 rounded-md transition-colors active:bg-white/20"
                      style={{ color: 'rgba(255,255,255,0.6)', background: 'rgba(255,255,255,0.08)' }}>
                      {dayTitles.every(t => t.collapsed) ? 'Expand all' : 'Collapse all'}
                    </button>
                  )}
                  <button onClick={() => pageImportInputRef.current && pageImportInputRef.current.click()}
                    className="text-[10px] font-semibold px-2 py-0.5 rounded-md transition-colors active:bg-fb-mid/20"
                    style={{ color: 'rgba(99,179,237,0.7)', background: 'rgba(99,179,237,0.1)' }}>
                    ↑ Import Page
                  </button>
                </div>
              </div>
              <div className="space-y-1.5">
                {groups.map((g, gi) => {
                  if (!g.title) return g.pages.map(pg => renderPageRow(pg, false));
                  const t = g.title;
                  const tIdx = project.pages.indexOf(t);
                  return (
                    <React.Fragment key={t.id}>
                      <PageListRow page={t} projectId={projectId}
                        folder={{ collapsed: !!t.collapsed, count: g.pages.length, onToggle: () => setCollapsed(t.id, !t.collapsed) }}
                        canMoveUp={gi > 0 && !!groups[gi - 1].title}
                        canMoveDown={gi < groups.length - 1}
                        onMoveUp={() => { DB.moveGroup(projectId, t.id, -1); reload(); }}
                        onMoveDown={() => { DB.moveGroup(projectId, t.id, 1); reload(); }}
                        onDuplicate={() => { DB.duplicatePage(projectId, t.id); reload(); }}
                        onPageAction={pg2 => setPageActionTarget(pg2)}
                        onChainBadge={pg2 => setPageChainTarget(pg2)}
                      />
                      {!t.collapsed && g.pages.map(pg => renderPageRow(pg, true))}
                      {!t.collapsed && (
                        <button onClick={() => { setAddAtIndex(tIdx + 1 + g.pages.length); setAddStep('type'); }}
                          className="w-full py-2 rounded-xl border border-dashed text-xs font-semibold transition-colors active:bg-white/10"
                          style={{ marginLeft: 14, width: 'calc(100% - 14px)', borderColor: 'rgba(255,255,255,0.2)', color: 'rgba(255,255,255,0.5)' }}>
                          + Add page to this day
                        </button>
                      )}
                    </React.Fragment>
                  );
                })}
              </div>
            </div>
          )}

          <button onClick={() => { setAddAtIndex(null); setAddStep('type'); }}
            className="w-full py-4 rounded-2xl border-2 border-dashed border-fb-mid/50 text-fb-light font-semibold flex items-center justify-center gap-2 active:bg-fb-mid/10 transition-colors text-sm">
            <Ico.Plus /> Add Page
          </button>
        </div>

        {addStep === 'type' && (
          <AddPageTypeModal onSelect={handleTypeSelect} onClose={() => { setAddStep(null); setAddAtIndex(null); }}
            onCopyFrom={() => { setAddStep(null); setAddAtIndex(null); setCopyFromOpen(true); }} />
        )}
        {showPdfSheet && (
          <PdfExportSheet
            project={project}
            onClose={() => setShowPdfSheet(false)}
            onExport={(ids, excludeMap) => {
              DB.setPdfExclude(projectId, excludeMap);
              reload();
              setShowPdfSheet(false);
              exportProjectPDF(projectId, toast, setExporting, ids);
            }}
          />
        )}
        {showSettings && (
          <ProjectSettingsModal
            project={project}
            projectId={projectId}
            onClose={() => setShowSettings(false)}
            onReload={reload}
          />
        )}

        {/* hidden file input for page import */}
        <input ref={pageImportInputRef} type="file" accept=".fieldbook-page,.fieldbook-page.json"
          style={{ display: 'none' }}
          onChange={e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
              try {
                const data = JSON.parse(ev.target.result);
                setImportPageModal({ fileData: data });
              } catch {
                toast({ message: 'Invalid .fieldbook-page file', type: 'error' });
              }
            };
            reader.readAsText(file);
            e.target.value = '';
          }} />

        {showExportPts && <ExportPointsModal projectId={projectId} onClose={() => setShowExportPts(false)} />}

        {showGps && (
          <GpsCaptureSheet projectId={projectId}
            onClose={() => setShowGps(false)}
            onSave={pt => {
              addGpsPointRow(projectId, pt);
              setShowGps(false);
              reload();
              toast.success(`GPS point ${pt.number} saved to Points`);
            }} />
        )}

        {pageActionTarget && (
          <PageActionsSheet
            page={pageActionTarget}
            projectId={projectId}
            onClose={() => setPageActionTarget(null)}
            onCopyTo={pg => { setPageActionTarget(null); setPageCopyToTarget(pg); }}
            onExport={pg => { setPageActionTarget(null); setPageExportTarget(pg); }}
            onChain={pg => { setPageActionTarget(null); setPageChainTarget(pg); }}
            days={dayTitles}
            onMoveToDay={(pg, titleId) => {
              if (titleId) DB.updatePage(projectId, titleId, { collapsed: false });
              DB.movePageToGroup(projectId, pg.id, titleId);
              setPageActionTarget(null);
              reload();
            }}
            onTogglePdf={pg => {
              DB.setPdfExclude(projectId, { [pg.id]: !pg.pdfExclude });
              setPageActionTarget(null);
              reload();
            }}
            onDelete={pg => {
              const subCount = pg.type === 'title' ? (groups.find(g => g.title?.id === pg.id)?.pages.length || 0) : 0;
              const subNote = subCount > 0
                ? ` Its ${subCount} sub-page${subCount !== 1 ? 's are' : ' is'} kept and will join the day above.`
                : '';
              if (!window.confirm(`Delete "${pg.title || 'Untitled'}"?${subNote} This cannot be undone.`)) return;
              DB.deletePage(projectId, pg.id);
              setPageActionTarget(null);
              reload();
            }}
          />
        )}
        {pageCopyToTarget && (
          <CopyToProjectModal
            page={pageCopyToTarget}
            fromProjectId={projectId}
            onClose={() => setPageCopyToTarget(null)}
            onDone={() => { setPageCopyToTarget(null); toast({ message: 'Page copied!', type: 'success' }); }}
            toast={toast}
          />
        )}
        {pageExportTarget && (
          <PageExportModal
            page={pageExportTarget}
            project={project}
            onClose={() => setPageExportTarget(null)}
            onDone={() => setPageExportTarget(null)}
            toast={toast}
          />
        )}
        {importPageModal && (
          <ImportPageModal
            fileData={importPageModal.fileData}
            toProjectId={projectId}
            onClose={() => setImportPageModal(null)}
            onDone={() => { setImportPageModal(null); reload(); toast({ message: 'Page imported!', type: 'success' }); }}
          />
        )}
        {copyFromOpen && (
          <CopyFromProjectModal
            toProjectId={projectId}
            onClose={() => setCopyFromOpen(false)}
            onDone={() => { setCopyFromOpen(false); reload(); toast({ message: 'Page(s) copied!', type: 'success' }); }}
          />
        )}
        {pageChainTarget && (
          <PageChainSheet
            page={pageChainTarget}
            onClose={() => setPageChainTarget(null)}
          />
        )}
      </div>
    );
  }

  // folder: { collapsed, count, onToggle } — set on a title page, which heads a
  // day folder. indent: true for the sub-pages listed under one.
  function PageListRow({ page, projectId, canMoveUp, canMoveDown, onMoveUp, onMoveDown, onDuplicate, onPageAction, onChainBadge, folder, indent }) {
    const meta = TYPE_META[page.type] || TYPE_META.data;
    const rowCount = page.rows?.length || 0;
    const displayTitle = page.title && page.title.trim() ? page.title.trim() : null;
    const hasChain = (page.pageChain || []).length > 0;
    return (
      <div className="flex items-stretch gap-1"
        style={indent ? { marginLeft: 14, paddingLeft: 6, borderLeft: '2px solid rgba(255,255,255,0.18)' } : undefined}>
        {/* Reorder + duplicate + actions buttons */}
        <div className="flex flex-col gap-0.5 flex-shrink-0 justify-center">
          <button
            onClick={canMoveUp ? onMoveUp : undefined}
            disabled={!canMoveUp}
            className="w-7 h-7 flex items-center justify-center rounded-lg transition-colors"
            style={{ color: canMoveUp ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.1)', background: 'rgba(255,255,255,0.05)' }}>
            <Ico.ChevUp />
          </button>
          <button
            onClick={canMoveDown ? onMoveDown : undefined}
            disabled={!canMoveDown}
            className="w-7 h-7 flex items-center justify-center rounded-lg transition-colors"
            style={{ color: canMoveDown ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.1)', background: 'rgba(255,255,255,0.05)' }}>
            <Ico.ChevDown />
          </button>
          <button
            onClick={onDuplicate}
            title="Duplicate page"
            className="w-7 h-7 flex items-center justify-center rounded-lg transition-colors"
            style={{ color: 'rgba(255,255,255,0.35)', background: 'rgba(255,255,255,0.05)', fontSize: 13 }}>
            ⧉
          </button>
          <button
            onClick={() => onPageAction && onPageAction(page)}
            title="Page actions"
            className="w-7 h-7 flex items-center justify-center rounded-lg transition-colors"
            style={{ color: 'rgba(255,255,255,0.35)', background: 'rgba(255,255,255,0.05)', fontSize: 15, letterSpacing: '-1px' }}>
            ···
          </button>
        </div>
        {/* Folder toggle (day header only) */}
        {folder && (
          <button onClick={folder.onToggle}
            title={folder.collapsed ? 'Show sub-pages' : 'Hide sub-pages'}
            aria-expanded={!folder.collapsed}
            className="w-10 flex-shrink-0 flex items-center justify-center rounded-xl transition-colors active:bg-white/20"
            style={{ background: 'rgba(255,255,255,0.14)', color: 'rgba(255,255,255,0.8)' }}>
            {folder.collapsed ? <Ico.ChevR /> : <Ico.ChevDown />}
          </button>
        )}
        {/* Main row */}
        <button onClick={() => navigate(`#/project/${projectId}/page/${page.id}`)}
          className="flex-1 min-w-0 rounded-xl px-3 py-2.5 flex items-center gap-3 text-left transition-colors active:bg-white/15"
          style={{ background: folder ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.07)' }}>
          <span className="font-data text-fb-light text-sm font-bold w-7 flex-shrink-0">{page.pageNumber}</span>
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2">
              <span className="text-[10px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider flex-shrink-0"
                style={{ background: meta.bg, color: meta.color }}>
                {meta.label}
              </span>
              <span className={`text-sm truncate ${displayTitle ? 'text-white/90 font-medium' : 'text-white/40 italic'}`}>
                {displayTitle || 'Untitled'}
              </span>
            </div>
            <p className="text-white/30 text-xs mt-0.5 truncate">
              {page.date}
              {(page.type === 'data' || page.type === 'points') && rowCount > 0 ? ` · ${rowCount} pts` : ''}
              {folder ? ` · ${folder.count} sub-page${folder.count !== 1 ? 's' : ''}` : ''}
            </p>
          </div>
          {page.pdfExclude && (
            <span title="Left out of PDF exports by default"
              className="flex-shrink-0 text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider"
              style={{ background: 'rgba(255,255,255,0.1)', color: 'rgba(255,255,255,0.45)' }}>
              No PDF
            </span>
          )}
          {hasChain && (
            <button
              onClick={e => { e.stopPropagation(); onChainBadge && onChainBadge(page); }}
              title="Page history"
              className="flex-shrink-0 text-xs px-1 py-0.5 rounded"
              style={{ background: 'rgba(99,179,237,0.2)', color: 'rgba(99,179,237,0.9)', fontSize: 11 }}>
              <Ico.Link size={12} />
            </button>
          )}
          <span className="text-white/25 flex-shrink-0"><Ico.ChevR /></span>
        </button>
      </div>
    );
  }

  function PageActionsSheet({ page, projectId, onClose, onCopyTo, onExport, onChain, onDelete, days, onMoveToDay, onTogglePdf }) {
    const trapRef = useRef(null);
    useFocusTrap(trapRef, true, onClose);
    const [moving, setMoving] = useState(false);
    const hasChain = (page.pageChain || []).length > 0;
    const meta = TYPE_META[page.type] || TYPE_META.data;
    const canMove = page.type !== 'title' && (days || []).length > 0;
    return (
      <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
        <div ref={trapRef} className="modal-sheet">
          <div className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4" />
          <div className="flex items-center gap-2 mb-4">
            <span className="text-[10px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider"
              style={{ background: meta.bg, color: meta.color }}>{meta.label}</span>
            <span className="text-fb-text font-semibold text-sm truncate">{page.title || 'Untitled'}</span>
          </div>
          {moving ? (
          <div className="space-y-2">

  // Checkbox with an indeterminate ("some ticked") state for day rows.
  function TriCheck({ checked, indeterminate, onChange }) {
    const ref = useRef(null);
    useEffect(() => { if (ref.current) ref.current.indeterminate = !!indeterminate; }, [indeterminate]);
    return (
      <input ref={ref} type="checkbox" checked={checked} onChange={onChange}
        style={{ width: 22, height: 22, accentColor: FBC.cover, flexShrink: 0 }} />
    );
  }

  // PDF export checklist — pick whole days or individual pages. Pages flagged
  // pdfExclude start unticked and are skipped when a whole day is ticked.
  // onExport(pageIds, excludeMap): excludeMap holds the remembered per-page
  // choice, only for days that have at least one page in this export — a day
  // left out wholesale keeps its pages' existing flags.
  function PdfExportSheet({ project, onClose, onExport }) {
    const trapRef = useRef(null);
    useFocusTrap(trapRef, true, onClose);
    const pages = project.pages || [];
    const groups = groupPages(pages).map(g => ({ title: g.title, all: g.title ? [g.title, ...g.pages] : g.pages }));
    const [checked, setChecked] = useState(() => new Set(pages.filter(p => !p.pdfExclude).map(p => p.id)));

    function toggle(id) {
      setChecked(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
    }
    function toggleGroup(g) {
      setChecked(prev => {
        const n = new Set(prev);
        if (g.all.some(p => n.has(p.id))) g.all.forEach(p => n.delete(p.id));
        else {
          // Tick the day, minus its left-out pages (unless that's all it has)
          const wanted = g.all.filter(p => !p.pdfExclude);
          (wanted.length ? wanted : g.all).forEach(p => n.add(p.id));
        }
        return n;
      });
    }
    function doExport() {
      const excludeMap = {};
      groups.forEach(g => {
        if (!g.all.some(p => checked.has(p.id))) return;
        g.all.forEach(p => { excludeMap[p.id] = !checked.has(p.id); });
      });
      onExport(pages.filter(p => checked.has(p.id)).map(p => p.id), excludeMap);
    }

    // Station sketches that will print inside a ticked GNSS page.
    const insideGnss = _sketchesInsideGnss(pages.filter(p => checked.has(p.id)));
    const pageRow = (p, indent) => {
      const meta = TYPE_META[p.type] || TYPE_META.data;
      return (
        <label key={p.id} className="flex items-center gap-3 rounded-xl px-3 active:bg-gray-100"
          style={{ minHeight: 44, marginLeft: indent ? 18 : 0, background: '#f4f4f4', cursor: 'pointer' }}>
          <TriCheck checked={checked.has(p.id)} onChange={() => toggle(p.id)} />
          <span className="font-data text-fb-muted text-xs w-6 flex-shrink-0">{p.pageNumber}</span>
          <span className="text-[10px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider flex-shrink-0"
            style={{ background: meta.bg, color: meta.color }}>{meta.label}</span>
          <span className="flex-1 min-w-0 text-sm text-fb-text truncate">{p.title?.trim() || 'Untitled'}</span>
          {p.pdfExclude && !checked.has(p.id) && (
            <span className="text-[9px] font-bold uppercase tracking-wider text-fb-muted flex-shrink-0">Left out</span>
          )}
          {p.type === 'sketch' && insideGnss.has(p.id) && checked.has(p.id) && (
            <span title="Prints inside its GNSS Obs page, not as a page of its own"
              className="text-[9px] font-bold uppercase tracking-wider text-fb-ink-muted flex-shrink-0">In GNSS page</span>
          )}
        </label>
      );
    };

    return (
      <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
        <div ref={trapRef} className="modal-sheet">
          <div className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4" />
          <div className="flex items-center justify-between mb-1">
            <h2 className="text-lg font-bold text-fb-dark">Export PDF</h2>
            <div className="flex gap-2">
              <button onClick={() => setChecked(new Set(pages.map(p => p.id)))}
                className="text-xs font-semibold px-3 py-1.5 rounded-lg text-fb-text active:bg-gray-200" style={{ background: '#e9e6dc' }}>
                All
              </button>
              <button onClick={() => setChecked(new Set())}
                className="text-xs font-semibold px-3 py-1.5 rounded-lg text-fb-text active:bg-gray-200" style={{ background: '#e9e6dc' }}>
                None
              </button>
            </div>
          </div>
          <p className="text-fb-muted text-sm mb-3">Tick the days or pages to include.</p>
          <div className="space-y-1.5" style={{ maxHeight: '52vh', overflowY: 'auto' }}>
            {groups.map((g, gi) => {
              if (!g.title) return g.all.map(p => pageRow(p, false));
              const n = g.all.filter(p => checked.has(p.id)).length;
              return (
                <React.Fragment key={g.title.id}>
                  <label className="flex items-center gap-3 rounded-xl px-3 active:bg-gray-200"
                    style={{ minHeight: 48, background: '#e2decf', cursor: 'pointer', marginTop: gi > 0 ? 8 : 0 }}>
                    <TriCheck checked={n === g.all.length} indeterminate={n > 0 && n < g.all.length} onChange={() => toggleGroup(g)} />
                    <span className="flex-1 min-w-0">
                      <span className="block text-sm font-bold text-fb-dark truncate">{g.title.title?.trim() || 'Untitled day'}</span>
                      <span className="block text-xs text-fb-muted">{g.title.date} · {n} of {g.all.length} pages</span>
                    </span>
                  </label>
                  {g.all.map(p => pageRow(p, true))}
                </React.Fragment>
              );
            })}
          </div>
          <button onClick={doExport} disabled={checked.size === 0}
            className="w-full mt-4 py-3 rounded-xl text-white font-semibold transition-colors active:opacity-80"
            style={{ background: checked.size ? FBC.cover : '#aaa' }}>
            Export {checked.size} of {pages.length} page{pages.length !== 1 ? 's' : ''}
          </button>
          <button onClick={onClose}
            className="w-full mt-2 py-3 rounded-xl text-fb-muted font-medium transition-colors active:bg-gray-100"
            style={{ background: '#f4f4f4' }}>
            Cancel
          </button>
        </div>
      </div>
    );
  }
