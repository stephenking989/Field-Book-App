        if (!plain) drawSatOverlay(ctx, plan.mpp, station);
        setState(done < total ? 'partial' : 'ready');
      };
      const slow = setTimeout(() => settle(true), 20000);
      // A tile that fails is asked for once more: a large image needs 60-odd
      // tiles at once, and the odd request is dropped on the way.
      const load = (t, retries) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';   // without it the canvas is tainted and can't be saved
        img.onload = () => { if (live) { ctx.drawImage(img, t.dx, t.dy); done++; settle(); } };
        img.onerror = () => {
          if (retries > 0 && live) setTimeout(() => load(t, retries - 1), 700);
          else { failed++; settle(); }
        };
        img.src = t.url;
      };
      plan.tiles.forEach(t => load(t, 1));
      return () => { live = false; clearTimeout(slow); };
    }, [zoom, attempt]);

    function save() {
      let dataUrl;
      try {
        dataUrl = canvasRef.current.toDataURL('image/jpeg', 0.82);
      } catch (err) {
        console.error('[satellite] canvas export blocked:', err);
        setSaveErr('The browser blocked saving this imagery (cross-origin canvas), so nothing was saved. Use a photo or a linked sketch for this station.');
        return;
      }
      onSave(dataUrl, { zoom, lat, lon, mpp: fbGnss.metresPerPixel(lat, zoom), w: W, h: H, capturedAt: new Date().toISOString() });
    }

    const across = Math.round(fbGnss.metresPerPixel(lat, zoom) * W / 10) * 10;
    const chip = 'flex-1 h-11 rounded-lg text-sm font-semibold border bg-fb-page-alt border-fb-border text-fb-heading active:bg-fb-page-deep disabled:text-fb-ink-faint';
    const canSave = state === 'ready' || state === 'partial';
    return (
      <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
        <div ref={trapRef} className="modal-sheet">
          <div className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4" />
          <div className="flex items-baseline justify-between mb-4">
            <h2 className="text-xl font-bold text-fb-ink">{title}</h2>
            <span className="text-xs font-semibold text-fb-ink-muted font-data">Zoom {zoom} · {across} m across</span>
          </div>
          <canvas ref={canvasRef} width={W} height={H} aria-label="Satellite image preview"
            className="block w-full h-auto rounded-xl border border-fb-border mb-3" />
          {state === 'loading' && <p className="text-xs text-fb-ink-muted text-center mb-3">Loading imagery…</p>}
          {state === 'offline' && <Notice tone="error" className="mb-3">You're offline — imagery needs a signal.</Notice>}
          {state === 'failed' && <Notice tone="error" className="mb-3">The imagery didn't load. Check your signal, then try again.</Notice>}
          {state === 'partial' && <Notice className="mb-3">Part of the image didn't load. Try again.</Notice>}
          {saveErr && <Notice tone="error" className="mb-3">{saveErr}</Notice>}
          <div className="flex gap-2 mb-3">
            <button onClick={() => setZoom(z => Math.max(min, z - 1))} disabled={zoom <= min} className={chip}>Zoom out</button>
            <button onClick={() => setZoom(z => Math.min(max, z + 1))} disabled={zoom >= max} className={chip}>Zoom in</button>
            {state !== 'ready' && state !== 'loading' && (
              <button onClick={() => setAttempt(a => a + 1)} className={chip}>Try again</button>
            )}
          </div>
          <button onClick={save} disabled={!canSave}
            className="w-full py-3.5 rounded-xl text-base font-semibold text-white bg-fb-accent active:opacity-80 disabled:bg-fb-ink-faint">
            Use this image
          </button>
          <p className="text-[11px] text-fb-ink-muted text-center mt-3 leading-snug">
            {fbGnss.SAT_ATTRIBUTION}
          </p>
        </div>
      </div>
    );
  }

  // ── Aerial image for a sketch background ─────────────────────────────────────
  // Latitude or longitude typed on a sheet: free-form ("44 38 55.7 N",
  // "-63.5752"), read as it is typed and shown back as DMS when the field is left.
  function SheetLatLon({ label, kind, value, onCommit }) {
    const [text, setText] = useState(() => fbGnss.fmtLatLonDMS(value, kind));
    const [bad, setBad] = useState(false);
    const focused = useRef(false);
    useEffect(() => {
      if (!focused.current) { setText(fbGnss.fmtLatLonDMS(value, kind)); setBad(false); }
    }, [value]);
    const parse = t => {
      const dd = t.trim() ? fbGnss.parseLatLon(t) : null;
      return dd !== null && Math.abs(dd) <= (kind === 'lon' ? 180 : 90) ? dd : null;
    };
    function leave() {
      focused.current = false;
      const dd = parse(text);
      setBad(!!text.trim() && dd === null);
      if (dd !== null) setText(fbGnss.fmtLatLonDMS(dd, kind));
    }
    return (
      <label className="block flex-1 min-w-0">
        <span className="block text-[10px] font-bold text-fb-ink-muted uppercase tracking-widest mb-1.5">{label}</span>
        <input type="text" autoComplete="off" value={text} placeholder={kind === 'lon' ? '63 34 30.7 W' : '44 38 55.7 N'}
          onFocus={() => { focused.current = true; }} onBlur={leave}
          onChange={e => { setText(e.target.value); setBad(false); onCommit(parse(e.target.value)); }}
          className={`w-full px-3 py-3 rounded-xl text-base font-data bg-fb-field border outline-none placeholder:text-fb-ink-faint ${bad
            ? 'border-fb-error text-fb-error' : 'border-fb-border text-fb-ink focus:border-fb-accent'}`} />
      </label>
    );
  }

  // Picks where the imagery is centred — the phone's GPS, a project point that
  // has geographic coordinates, or a typed latitude / longitude — then hands
  // over to SatelliteCaptureSheet for the imagery itself. sketch.js opens it
  // (through window._fb) and places what onSave returns under the sketch at
  // true scale: onSave(dataUrl, fbGnss.aerialMeta record). `start` pre-fills
  // the centre when an existing image is being replaced.
  function AerialImageSheet({ projectId, start, onSave, onClose }) {
    const project = DB.getProject(projectId);
    const [lat, setLat] = useState(start ? start.lat : null);
    const [lon, setLon] = useState(start ? start.lon : null);
    const [from, setFrom] = useState(start ? 'the image now in this sketch' : '');
    const [step, setStep] = useState('centre');     // 'centre' | 'gps' | 'point' | 'capture'
    const trapRef = useRef(null);
    useFocusTrap(trapRef, step === 'centre', onClose);
    const hasCoords = p => p.lat !== null && p.lon !== null;
    const pointCount = fbGeo.rowPoints(project).filter(p => p.number && hasCoords(p)).length;
    const centre = (la, lo, src) => { setLat(la); setLon(lo); setFrom(src); setStep('centre'); };

    if (step === 'gps') return (
      <GpsCaptureSheet projectId={projectId} mode="position" heading="Image Centre"
        onSave={({ geo }) => centre(geo.lat, geo.lon, 'phone GPS')} onClose={() => setStep('centre')} />
    );
    if (step === 'point') return (
      <PointPickerSheet project={project} heading="Centre on Point" only={hasCoords}
        onPick={p => centre(p.lat, p.lon, `point ${p.number}`)} onClose={() => setStep('centre')} />
    );
    if (step === 'capture') return (
      <SatelliteCaptureSheet lat={lat} lon={lon} plain size={fbGnss.AERIAL_PX} title="Aerial image"
        onSave={(dataUrl, cap) => onSave(dataUrl, fbGnss.aerialMeta(cap))} onClose={() => setStep('centre')} />
    );
    const chip = 'h-11 px-3 rounded-lg text-[13px] font-semibold inline-flex items-center gap-1.5 whitespace-nowrap bg-fb-page-alt border border-fb-border text-fb-heading active:bg-fb-page-deep disabled:text-fb-ink-faint';
    return (
      <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
        <div ref={trapRef} className="modal-sheet">
          <div className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4" />
          <div className="flex items-baseline justify-between mb-4">
            <h2 className="text-xl font-bold text-fb-ink">Aerial image</h2>
            <span className="text-xs font-semibold text-fb-ink-muted">{fbGnss.AERIAL_PROVIDER}</span>
          </div>
          <p className="text-[10px] font-bold text-fb-ink-muted uppercase tracking-widest mb-1.5">Centre the image on</p>
          <div className="flex flex-wrap gap-2 mb-3">
            <button onClick={() => setStep('gps')} className={chip}><Ico.Pin size={14} /> My location</button>
            <button onClick={() => setStep('point')} disabled={pointCount === 0} className={chip}>A project point</button>
          </div>
          <div className="flex gap-2 mb-2">
            <SheetLatLon label="Latitude" kind="lat" value={lat} onCommit={v => { setLat(v); setFrom(''); }} />
            <SheetLatLon label="Longitude" kind="lon" value={lon} onCommit={v => { setLon(v); setFrom(''); }} />
          </div>
          <p className="text-xs text-fb-ink-muted mb-5 leading-snug">
            {from ? `Centre taken from ${from}.` : 'DMS or decimal degrees.'}
          </p>
          <button onClick={() => setStep('capture')} disabled={lat === null || lon === null}
            className="w-full py-3.5 rounded-xl text-base font-semibold text-white bg-fb-accent active:opacity-80 disabled:bg-fb-ink-faint">
            Get imagery
          </button>
        </div>
      </div>
    );
  }

  // The station sketch box: a linked sketch page, a satellite image, a photo,
  // or a blank box for sketching on the printout. `saveNow` writes pending
  // edits at once (before leaving the page, and after storing a new image).
  function GnStationSketch({ g, update, saveNow, page, projectId, project }) {
    const toast = useToast();
    const [picker, setPicker] = useState(false);
    const [satOpen, setSatOpen] = useState(false);
    const [busy, setBusy] = useState(false);
    const [fileKey, setFileKey] = useState(0);
    const fileRef = useRef(null);
    const sk = g.sketch, imgs = g.images;
    const setSketch = patch => update(prev => ({ ...prev, sketch: { ...prev.sketch, ...patch } }));
    const setImage = (slot, rec) => { update(prev => ({ ...prev, images: { ...prev.images, [slot]: rec } })); saveNow(); };
    const linked = (project?.pages || []).find(p => p.id === sk.linkedSketchPageId && p.type === 'sketch') || null;
    const hasPos = Number.isFinite(g.pos.lat) && Number.isFinite(g.pos.lon);

    function linkSketch(sketchPage) {
      if (linked && linked.id !== sketchPage.id && linked.linkedTo === page.id) {
        DB.updatePage(projectId, linked.id, { linkedTo: undefined });
      }
      DB.updatePage(projectId, sketchPage.id, { linkedTo: page.id });
      setSketch({ source: 'linked', linkedSketchPageId: sketchPage.id });
      setPicker(false);
      saveNow();
    }
    function createSketch() {
      saveNow();   // the project is about to change — write this page first
      const stn = g.station.trim();
      const at = (project.pages || []).findIndex(p => p.id === page.id) + 1;
      const made = DB.addPage(projectId, {
        type: 'sketch', title: stn ? `Stn ${stn} — Sketch` : 'Station Sketch', linkedTo: page.id, ...sketchViewDefaults(project),
      }, at);
      if (!made) return;
      setSketch({ source: 'linked', linkedSketchPageId: made.id });
      saveNow();
      navigate(`#/project/${projectId}/page/${made.id}`);
    }
    function openSketch() {
      saveNow();
      navigate(`#/project/${projectId}/page/${linked.id}`);
    }
    async function onPhotoFile(e) {
      const file = e.target.files && e.target.files[0];
      setFileKey(k => k + 1);   // a fresh input, so picking the same file again still fires
      if (!file) return;
      setBusy(true);
      try {
        const ref = photoDB.newRef();
        await photoDB.put(ref, await compressImage(file, 1600, 0.7));
        setImage('photo', { photoRef: ref, capturedAt: new Date().toISOString() });
      } catch (err) {
        console.error('[gnss] station photo import failed:', err);
        toast.error('That photo could not be imported');
      } finally {
        setBusy(false);
      }
    }
    async function saveSatellite(dataUrl, meta) {
      try {
        const ref = photoDB.newRef();
        await photoDB.put(ref, dataUrl);
        setImage('satellite', { photoRef: ref, ...meta });
        setSatOpen(false);
        toast.success('Satellite image saved');
      } catch (err) {
        console.error('[gnss] satellite image save failed:', err);
        toast.error('The image could not be saved');
      }
    }

    // The satellite image, or the way to get one. Used as the main picture and as the inset.
    const satellite = small => (
      imgs.satellite ? (
        <div className={small ? 'max-w-[240px]' : ''}>
          <div className="border border-fb-border overflow-hidden">
            <GnImage photoRef={imgs.satellite.photoRef} alt="Satellite image of the station" />
          </div>
          <p className={GN.note + ' font-data mt-1'}>Zoom {imgs.satellite.zoom} · {gnUT(imgs.satellite.capturedAt)}</p>
          <div className="flex flex-wrap gap-2 mt-2">
            <button type="button" onClick={() => setSatOpen(true)} disabled={!hasPos} className={GN.chip}><Ico.Map size={14} /> Retake</button>
            <button type="button" onClick={() => setImage('satellite', null)} className={GN.chip + ' text-fb-error'}><Ico.Trash /> Remove</button>
          </div>
        </div>
      ) : (
        <div className="rounded-xl bg-fb-page-alt px-4 py-5 text-center">
          <p className="text-sm text-fb-ink-muted mb-3">
            {hasPos ? 'No satellite image yet.' : 'Enter the approx position first.'}
          </p>
          <button type="button" onClick={() => setSatOpen(true)} disabled={!hasPos}
            className={GN.chip + ' disabled:text-fb-ink-faint'}><Ico.Map size={14} /> Get satellite image</button>
        </div>
      )
    );

    return (
      <>
        <GnSegmented label="Station sketch source" options={GN_SKETCH_SOURCES} value={sk.source} onChange={v => setSketch({ source: v })} />
        <div className="mt-3">
          {sk.source === 'linked' && (linked ? (
            <>
              <div className="border border-fb-border overflow-hidden"><GnSketchThumb sketchPage={linked} /></div>
              <p className={GN.note + ' mt-1'}><span className="font-data">P.{linked.pageNumber}</span> · {linked.title?.trim() || 'Untitled sketch'}</p>
              <div className="flex flex-wrap gap-2 mt-2 mb-2">
                <button type="button" onClick={openSketch} className={GN.chip}><Ico.Grid /> Open sketch</button>
                <button type="button" onClick={() => setPicker(true)} className={GN.chip}><Ico.Link size={14} /> Change</button>
              </div>
              <GnToggle on={!!sk.ownPage} onChange={v => setSketch({ ownPage: v })} title="Also export as its own page" />
            </>
          ) : (
            <div className="rounded-xl bg-fb-page-alt px-4 py-5 text-center">
              <p className="text-sm text-fb-ink-muted mb-3">
                {sk.linkedSketchPageId ? 'The linked sketch page is no longer in this project.' : 'No sketch page linked yet.'}
              </p>
              <div className="flex flex-wrap justify-center gap-2">
                <button type="button" onClick={createSketch} className={GN.chip}>＋ Create station sketch</button>
                <button type="button" onClick={() => setPicker(true)} className={GN.chip}>
                  <Ico.Link size={14} /> {sk.linkedSketchPageId ? 'Relink' : 'Link a sketch page'}
                </button>
              </div>
            </div>
          ))}

          {sk.source === 'satellite' && satellite(false)}

          {sk.source === 'photo' && (
            <>
              {/* No capture attribute: Android backgrounds the app for a direct camera
                  launch and can kill it before the photo comes back. The system chooser
                  offers camera or gallery and keeps the app alive. */}
              <input key={fileKey} ref={fileRef} type="file" accept="image/*" onChange={onPhotoFile} className="hidden" />
              {imgs.photo ? (
                <>
                  <div className="border border-fb-border overflow-hidden"><GnImage photoRef={imgs.photo.photoRef} alt="Station sketch photo" /></div>
                  <div className="flex flex-wrap gap-2 mt-2">
                    <button type="button" onClick={() => fileRef.current?.click()} disabled={busy} className={GN.chip}>
                      <Ico.Camera size={14} /> {busy ? 'Importing…' : 'Replace'}
                    </button>
                    <button type="button" onClick={() => setImage('photo', null)} className={GN.chip + ' text-fb-error'}><Ico.Trash /> Remove</button>
                  </div>
                </>
              ) : (
                <div className="rounded-xl bg-fb-page-alt px-4 py-5 text-center">
                  <p className="text-sm text-fb-ink-muted mb-3">No photo yet.</p>
                  <button type="button" onClick={() => fileRef.current?.click()} disabled={busy} className={GN.chip}>
                    <Ico.Camera size={14} /> {busy ? 'Importing…' : 'Add photo'}
                  </button>
                </div>
              )}
            </>
          )}

          {sk.source === 'blank' && (
            <p className="text-sm text-fb-ink-muted py-8 text-center border border-dashed border-fb-border">
              Prints as an empty box for sketching by hand.
            </p>
          )}
        </div>

        {(sk.source === 'linked' || sk.source === 'photo') && (
          <div className="mt-3">
            <GnToggle on={!!sk.inset} onChange={v => setSketch({ inset: v })} title="Location map inset"
              help="Satellite image beside the sketch." />
            {sk.inset && <div className="mt-2">{satellite(true)}</div>}
          </div>
        )}

        <p className={GN.lbl + ' mt-4'}>Sketch notes</p>
        <textarea ref={gnGrow} onInput={e => gnGrow(e.target)} rows={2} aria-label="Sketch notes"
          value={sk.notes} onChange={e => setSketch({ notes: e.target.value })}
          placeholder="Access, parking, how to find the mark..."
          className={`w-full bg-transparent outline-none resize-none overflow-hidden border-b leading-relaxed placeholder:text-fb-ink-faint ${GN.hand} ${GN.ok}`} />

        {picker && <SketchPickerSheet project={project} currentId={sk.linkedSketchPageId} onPick={linkSketch} onClose={() => setPicker(false)} />}
        {satOpen && hasPos && (
          <SatelliteCaptureSheet lat={g.pos.lat} lon={g.pos.lon} station={g.station.trim()}
            onSave={saveSatellite} onClose={() => setSatOpen(false)} />
        )}
      </>
    );
  }

  // ── General and weather observations ─────────────────────────────────────────
  function GnObservations({ g, update }) {
    const rows = g.observations;
    const setRow = (id, patch) => update(prev => ({ ...prev, observations: prev.observations.map(o => (o.id === id ? { ...o, ...patch } : o)) }));
    const addRow = () => update(prev => ({ ...prev,
      observations: [...prev.observations, { id: gnNewId('gw_'), time: fbGnss.utcTimeHMS(), text: '' }] }));
    const removeRow = id => update(prev => ({ ...prev, observations: prev.observations.filter(o => o.id !== id) }));
    return (
      <>
        {rows.length === 0 && (
          <p className="text-sm text-fb-ink-muted py-4 mb-2 text-center rounded-xl bg-fb-page-alt">No observations recorded.</p>
        )}
        {rows.map(o => (
          <div key={o.id} className="py-2 border-b border-fb-border/60">
            <div className="flex items-end gap-2">
              <div className="flex-1 min-w-0 grid grid-cols-2 gap-x-3">
                <GnLocalTime label="Time" ut={o.time} obsDate={g.obsDate} tz={g.tz} onChange={v => setRow(o.id, { time: v })} />
                <GnTime label="Time (UT)" now={false} value={o.time} onChange={v => setRow(o.id, { time: v })} />
              </div>
              <button type="button" onClick={() => removeRow(o.id)} title="Remove this observation"
                className="w-11 h-11 flex-shrink-0 flex items-center justify-center rounded-lg text-fb-error active:bg-fb-page-deep">
                <Ico.Trash />
              </button>
            </div>
            <p className={GN.lbl + ' mt-1.5'}>Comments</p>
            <textarea ref={gnGrow} onInput={e => gnGrow(e.target)} rows={1} aria-label="Observation comments"
              value={o.text} onChange={e => setRow(o.id, { text: e.target.value })}
              placeholder="Cloud, wind, temperature..."
              className={`w-full bg-transparent outline-none resize-none overflow-hidden border-b leading-relaxed placeholder:text-fb-ink-faint ${GN.hand} ${GN.ok}`} />
          </div>
        ))}
        <button type="button" onClick={addRow} className={GN.chip + ' mt-3'}>＋ Add observation</button>
      </>
    );
  }

  // Remount per page so a pending save always lands on the page it belongs to.
  function GnssPage(props) {
    return <GnssPageBody key={props.page.id} {...props} />;
  }

  // The state of a form page whose data lives under one page field (`slot`:
  // 'gnss', 'site'), plus its title. Edits are written 0.8 s after the last
  // change, and at once when the page is left or the app is backgrounded, so
  // nothing typed is lost. Always change the data through update(patch | fn) —
  // it works from a ref, so async handlers never see stale state.
  function useGnDraft({ page, projectId, onReload, slot, initial }) {
    const [data, setData] = useState(initial);
    const [title, setTitleState] = useState(page.title || '');
    const [dirty, setDirty] = useState(false);
    const latest = useRef({ data, title });
    const pending = useRef(false);
    const timer = useRef(null);

    function flush() {
      clearTimeout(timer.current);
      if (!pending.current) return false;
      pending.current = false;
      DB.updatePage(projectId, page.id, { [slot]: latest.current.data, title: latest.current.title });
      setDirty(false);
      return true;
    }
    function queueSave() {
      pending.current = true;
      setDirty(true);
      clearTimeout(timer.current);
      timer.current = setTimeout(() => { flush(); onReload(); }, 800);
    }
    function update(patch) {
      const prev = latest.current.data;
      const next = typeof patch === 'function' ? patch(prev) : { ...prev, ...patch };
      latest.current.data = next;
      setData(next);
      queueSave();
    }
    function setTitle(v) { latest.current.title = v; setTitleState(v); queueSave(); }

    useEffect(() => {
      const onHide = () => { if (document.visibilityState === 'hidden' && flush()) DB.flush(); };
      document.addEventListener('visibilitychange', onHide);
      window.addEventListener('pagehide', onHide);
      return () => {
        document.removeEventListener('visibilitychange', onHide);
        window.removeEventListener('pagehide', onHide);
        flush();
      };
    }, []);

    return { data, title, dirty, update, setTitle, flush };
  }

  // The header strip of a form page: what it is, its title, date and save state.
  function GnPageStrip({ kind, page, title, setTitle, dirty }) {
    return (
      <div className="page-header-strip px-4 py-2.5 flex items-center justify-between gap-3">
        <div className="flex-1 min-w-0">
          <p className={GN.lbl}>{kind} · P.{page.pageNumber}</p>
          <input type="text" value={title} onChange={e => setTitle(e.target.value)} maxLength={60}
            placeholder="Page title..." aria-label="Page title" />
        </div>
        <div className="flex-shrink-0 text-right">
          <p className="text-xs font-data text-fb-ink-muted">{page.date}</p>
          {dirty && <span className="text-[10px] text-fb-ink-muted italic">saving...</span>}
        </div>
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // SITE OBSTRUCTION PAGE (type 'obstructions')
  // The obstruction table and sky plot of the GNSS Obs page as a page of its
  // own — a station recce with no static session. Its data is page.site
  // (fbGnss.emptySite), which names the rows, bearing reference, declination and
  // mask as a GNSS page does, so GnObstructions serves both unchanged.
  // ─────────────────────────────────────────────────────────────────────────────
  function ObstructionPage(props) {
    return <ObstructionPageBody key={props.page.id} {...props} />;
  }

  function ObstructionPageBody({ page, projectId, onReload }) {
    const { data: s, title, dirty, update, setTitle, flush } = useGnDraft({
      page, projectId, onReload, slot: 'site', initial: () => fbGnss.normalizeSite(page.site),
    });
    const field = k => ({ value: s[k], onChange: v => update({ [k]: v }) });
    const mask = fbGnss.num(s.elevMask);
    const maskBad = !!s.elevMask.trim() && !(mask >= 0 && mask <= 90);

    return (
      <div className="bg-fb-page min-h-full" onBlur={() => { if (flush()) onReload(); }}>
        <GnPageStrip kind="Site Obstructions" page={page} title={title} setTitle={setTitle} dirty={dirty} />
        {/* paddingBottom lets the last fields scroll up above the keyboard */}
        <div className="px-4" style={{ paddingBottom: '50vh' }}>
          <GnSection title="Station">
            <div className="grid grid-cols-2 gap-x-4 gap-y-2">
              <GnField label="Station / Point Name" wide {...field('station')} />
              <GnField label="Date" mono type="date" {...field('date')} />
              <GnField label="Observer" {...field('observer')} />
              <GnField label="Elevation Mask" mono inputMode="decimal" unit="°" bad={maskBad} {...field('elevMask')} />
            </div>
          </GnSection>
          <GnSection title="Site Obstructions">
            <GnObstructions g={s} update={update} />
          </GnSection>
        </div>
      </div>
    );
  }

  function GnssPageBody({ page, projectId, project, onReload }) {
    const { data: g, title, dirty, update, setTitle, flush } = useGnDraft({
      page, projectId, onReload, slot: 'gnss', initial: () => fbGnss.normalize(page.gnss, { projectName: project?.name || '' }),
    });
    const [antOpen, setAntOpen] = useState(false);
    const [gpsOpen, setGpsOpen] = useState(false);
    const [showWork, setShowWork] = useState(false);
    const [, setLibTick] = useState(0);   // re-read the antenna library after the sheet closes
    const field = k => ({ value: g[k], onChange: v => update({ [k]: v }) });

    // ── Header ──
    const autoJulian = fbGnss.julianDay(g.obsDate);
    const julian = g.julianManual ? g.julianDay : (autoJulian === null ? '' : String(autoJulian));

    // ── Approx position ──
    const pos = g.pos;
    const setPos = patch => update(prev => ({ ...prev, pos: { ...prev.pos, ...patch, source: 'manual', acc: null, ts: '' } }));
    const ht = fbGeo.orthoHeight(fbGnss.num(pos.h), pos.lat, pos.lon);
    const htBad = !!String(pos.h).trim() && !Number.isFinite(fbGnss.num(pos.h));
    function applyPhoneFix({ geo }) {
      update(prev => ({ ...prev, pos: {
        lat: geo.lat, lon: geo.lon, h: geo.h === null ? '' : geo.h.toFixed(1),
        acc: geo.acc, source: 'phone', ts: geo.ts,
      } }));
      setGpsOpen(false);
    }

    // ── Session ──
    const duration = fbGnss.sessionDuration(g.startUT, g.stopUT);

    // ── Antenna ──
    const libAnt = fbGnss.getAntenna(g.antennaId);
    const antDiffers = fbGnss.snapshotDiffers(g.antenna, libAnt);
    const applyAntenna = a => update({ antennaId: a.id, antenna: fbGnss.antennaSnapshot(a) });
    const ant = g.antenna || {};
    const res = fbGnss.solveHeights(g);
    const steps = fbGnss.workingSteps(res);
    function setReading(set, part, i, v) {
      update(prev => ({ ...prev, [set]: { ...prev[set], [part]: prev[set][part].map((x, j) => (j === i ? v : x)) } }));
    }
    const constants = [
      ['Radius to slant mark (R)', ant.R],
      ['Slant mark above ARP (d)', ant.d],
      ['ARP to L1 phase centre', ant.l1],
      ['ARP to L2 phase centre', ant.l2],
    ];

    // Leaving a field writes at once, so tapping Export (or anything else)
    // straight after typing a value still sees it.
    return (
      <div className="bg-fb-page min-h-full" onBlur={() => { if (flush()) onReload(); }}>
        <GnPageStrip kind="GNSS Static Observation" page={page} title={title} setTitle={setTitle} dirty={dirty} />

        {/* paddingBottom lets the last fields scroll up above the keyboard */}
        <div className="px-4" style={{ paddingBottom: '50vh' }}>

          <GnSection title="Project & Station">
            <div className="grid grid-cols-2 gap-x-4 gap-y-2">
              <GnField label="Project Name" wide {...field('projectName')} />
              <GnField label="Project Section or Crew" wide {...field('section')} />
              <GnField label="Station Number / Name" {...field('station')} />
              <GnField label="Session Identifier" mono {...field('sessionId')} />
              <GnField label="Observation Date (UT)" mono type="date" {...field('obsDate')} />
              <GnField label="Julian Day" mono inputMode="numeric" value={julian} readOnly={!g.julianManual}
                onChange={v => update({ julianDay: v })}
                action={<button type="button" className={GN.chip}
                  onClick={() => update(g.julianManual ? { julianManual: false, julianDay: '' } : { julianManual: true, julianDay: julian })}>
                  {g.julianManual ? 'Auto' : 'Edit'}
                </button>}
                hint={g.julianManual && autoJulian !== null ? `Date gives ${autoJulian}` : undefined} />
              <GnField label="Operator(s)" wide {...field('operators')} />
            </div>
          </GnSection>

          <GnSection title="Receiver & Antenna">
            <div className="grid grid-cols-2 gap-x-4 gap-y-2">
              <GnField label="Receiver Model" {...field('receiverModel')} />
              <GnField label="Receiver Serial No." mono {...field('receiverSerial')} />
              <GnField label="Receiver Software" {...field('receiverSoftware')} />
              <GnField label="Receiver File Name" mono {...field('fileName')} />
              <div className="col-span-2 min-w-0">
                <p className={GN.lbl}>Antenna Model</p>
                <div className="flex items-end gap-2">
                  <p className={`flex-1 min-w-0 h-10 flex items-center border-b border-fb-border text-fb-ink truncate ${GN.hand}`}>
                    {ant.name || '—'}
                  </p>
                  <button type="button" onClick={() => setAntOpen(true)} className={GN.chip}><Ico.Antenna size={14} /> Antennas</button>
                </div>
              </div>
              <GnField label="Antenna Serial No." mono {...field('antennaSerial')} />
              <GnField label="Antenna Cable Length" mono inputMode="decimal" unit="m" {...field('cableLength')} />
            </div>
          </GnSection>

          <GnSection title="Approx Position"
            aside={<button type="button" onClick={() => setGpsOpen(true)} className={GN.chip}><Ico.Pin size={14} /> Use my location</button>}>
            <div className="grid grid-cols-2 gap-x-4 gap-y-2">
              <GnLatLon label="Approx Lat" kind="lat" value={pos.lat} onCommit={v => setPos({ lat: v })} placeholder="44 38 55.7 N" />
              <GnLatLon label="Approx Long" kind="lon" value={pos.lon} onCommit={v => setPos({ lon: v })} placeholder="63 34 30.7 W" />
              <GnField label="Approx Ht — ellipsoidal" mono inputMode="decimal" unit="m" bad={htBad}
                value={pos.h} onChange={v => setPos({ h: v })} />
              <GnReadout label="Ht — orthometric"
                value={ht.H === null ? '' : `${ht.H.toFixed(1)} m`}
                hint={ht.H === null ? '' : `CGVD2013, geoid N ${ht.N.toFixed(1)} m`} />
            </div>
            {pos.source === 'phone' && (
              <p className={GN.note + ' mt-2'}>
                Phone GPS{Number.isFinite(pos.acc) && <>, <span className="font-data">±{pos.acc < 10 ? pos.acc.toFixed(1) : Math.round(pos.acc)} m</span></>}
                {pos.ts && <> · <span className="font-data">{pos.ts.slice(0, 16).replace('T', ' ')} UT</span></>}
              </p>
            )}
          </GnSection>

          <GnSection title="Session">
            <div className="grid grid-cols-2 gap-x-4 gap-y-2">
              <GnLocalTime label="Start Time" ut={g.startUT} obsDate={g.obsDate} tz={g.tz} onChange={v => update({ startUT: v })} />
              <GnLocalTime label="Stop Time" ut={g.stopUT} obsDate={g.obsDate} tz={g.tz} onChange={v => update({ stopUT: v })} />
              <GnTime label="Start Time (UT)" now={false} value={g.startUT} onChange={v => update({ startUT: v })} />
              <GnTime label="Stop Time (UT)" now={false} value={g.stopUT} onChange={v => update({ stopUT: v })} />
              <GnReadout label="Session Length" value={duration ? duration.text : ''} />
              <GnField label="Recording Interval" mono inputMode="decimal" unit="s" {...field('interval')} />
              <GnField label="Elev. Mask" mono inputMode="decimal" unit="°" {...field('elevMask')} />
              <GnField label="PDOP" mono inputMode="decimal" {...field('pdop')} />
              <div className="col-span-2 min-w-0">
                <p className={GN.lbl}>Observation Method</p>
                <div className="flex items-end gap-3">
                  <select aria-label="Observation Method" value={g.method} onChange={e => update({ method: e.target.value })}
                    className={`${GN.line} ${GN.hand} ${GN.ok} ${g.method === 'Other' ? 'w-28 flex-shrink-0' : ''}`}>
                    {fbGnss.METHODS.map(m => <option key={m} value={m}>{m}</option>)}
                  </select>
                  {g.method === 'Other' && (
                    <input type="text" aria-label="Other observation method" placeholder="Describe the method"
                      value={g.methodOther} onChange={e => update({ methodOther: e.target.value })}
                      className={`${GN.line} ${GN.hand} ${GN.ok}`} />
                  )}
                </div>
              </div>
            </div>
          </GnSection>

          <GnSection title="Antenna Height">
            <p className={GN.note + ' mb-3'}>
              3 readings before and 3 after, spaced around the antenna.
            </p>

            <div className="mb-3">
              {constants.map(([label, v]) => (
                <div key={label} className="flex items-baseline justify-between gap-3 py-1 border-b border-fb-border/60">
                  <span className={GN.lbl + ' leading-snug'}>{label}</span>
                  <span className="font-data text-base text-fb-ink flex-shrink-0">{fbGnss.fmt4(v) ? `${fbGnss.fmt4(v)} m` : '—'}</span>
                </div>
              ))}
              <div className="flex items-baseline justify-between gap-3 py-1">
                <span className={GN.lbl}>Slant measure mark</span>
                <span className={`${GN.hand} text-fb-ink flex-shrink-0`}>{ant.slantMark || '—'}</span>
              </div>
            </div>
            {antDiffers && (
              <div className="flex items-center gap-2 mb-3 px-3 py-2 rounded-xl bg-fb-warn-pale border border-fb-warn-line">
                <span className="text-fb-warn flex-shrink-0"><Ico.Warn /></span>
                <span className="flex-1 text-xs text-fb-ink leading-snug">Constants differ from the library entry for <b>{libAnt.name}</b>.</span>
                <button type="button" onClick={() => applyAntenna(libAnt)}
                  className="text-xs font-semibold px-3 py-2 rounded-lg text-white bg-fb-accent active:opacity-80 flex-shrink-0">
                  Use current values
                </button>
              </div>
            )}

            <GnHeights g={g} res={res} onReading={setReading} />

            <div className="w-32 mt-3">
              <GnField label="Range tolerance" mono inputMode="decimal" unit="m" placeholder={fbGnss.fmt4(fbGnss.DEFAULT_TOL).slice(0, 5)}
                {...field('tol')} />
            </div>

            {steps.length > 0 && (
              <div className="mt-3">
                <button type="button" onClick={() => setShowWork(v => !v)} aria-expanded={showWork} className={GN.chip}>
                  {showWork ? '▾' : '▸'} Working
                </button>
                {showWork && (
                  <div className="mt-2">
                    {steps.map((s, i) => (
                      <div key={i} className="py-1.5 border-b border-fb-border/60">
                        <p className={GN.lbl}>{s.t}</p>
                        <p className={`font-data text-[13px] break-words ${s.check ? 'text-fb-warn' : 'text-fb-ink'}`}>{gnBar(s.e)}</p>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            <p className={GN.lbl + ' mt-4 mb-1'}>Antenna Height Drawing</p>
            <GnDrawing svg={fbGnss.buildAntennaSVG(fbGnss.diagramValues(res))} className="max-w-[270px]" />
          </GnSection>

          <GnSection title="Site Obstructions">
            <GnObstructions g={g} update={update} />
          </GnSection>

          <GnSection title="Station Sketch">
            <GnStationSketch g={g} update={update} saveNow={flush} page={page} projectId={projectId} project={project} />
          </GnSection>

          <GnSection title="General & Weather Observations">
            <GnObservations g={g} update={update} />
          </GnSection>
        </div>

        {antOpen && (
          <AntennaLibrarySheet currentId={g.antennaId}
            onPick={a => { applyAntenna(a); setAntOpen(false); setLibTick(t => t + 1); }}
            onClose={() => { setAntOpen(false); setLibTick(t => t + 1); }} />
        )}
        {gpsOpen && (
          <GpsCaptureSheet projectId={projectId} mode="position" heading="Approx Position"
            onSave={applyPhoneFix} onClose={() => setGpsOpen(false)} />
        )}
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // APP ROOT
  // ─────────────────────────────────────────────────────────────────────────────

  function App() {
    const hash  = useRouter();
    const route = parseRoute(hash);
    const toast = useToast();
    const [installPrompt, setInstallPrompt] = useState(null);
    const [pendingFileImport, setPendingFileImport] = useState(null);

    useEffect(() => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .catch(err => toast.error('Service worker failed to register'));
      }
      // Sweep any IDB photos no longer referenced by any project. Covers
      // leftovers from project/page deletes and failed migrations. Safe to
      // run here because it only deletes entries not referenced anywhere.
      (async () => {
        try {
          const n = await photoDB.pruneOrphans(DB.getProjects());
          if (n > 0) console.log(`[photoDB] pruned ${n} orphan${n === 1 ? '' : 's'}`);
        } catch (err) { console.error('[photoDB] prune failed:', err); }
        try {
          const n = await audioDB.pruneOrphans(DB.getProjects());
          if (n > 0) console.log(`[audioDB] pruned ${n} orphan${n === 1 ? '' : 's'}`);
        } catch (err) { console.error('[audioDB] prune failed:', err); }
      })();
      const handler = e => { e.preventDefault(); setInstallPrompt(e); };
      window.addEventListener('beforeinstallprompt', handler);

      // Route persistence: save current route on every navigation so a fresh
      // PWA launch can restore exactly where the user was.
      const saveRoute = () => localStorage.setItem('fb_lastRoute', window.location.hash || '#/');
      window.addEventListener('hashchange', saveRoute);
      saveRoute(); // capture current route immediately

      // PWA File Handling API — handles .fieldbook files opened from the OS
      if ('launchQueue' in window) {
        window.launchQueue.setConsumer(async (launchParams) => {
          if (!launchParams.files || launchParams.files.length === 0) return;
          const fileHandle = launchParams.files[0];
          try {
            const file = await fileHandle.getFile();
            const text = await file.text();
            const data = JSON.parse(text);
            if (data.type !== 'fieldbook_project_export') {
              toast.error('Not a valid .fieldbook file');
              return;
            }
            setPendingFileImport(data);
          } catch {
            toast.error('Could not open .fieldbook file');
          }
        });
      }

      return () => {
        window.removeEventListener('beforeinstallprompt', handler);
        window.removeEventListener('hashchange', saveRoute);
      };
    }, []);

    function handleFileImported(newProject) {
      setPendingFileImport(null);
      toast.success(`"${newProject.name}" imported`);
      navigate(`#/project/${newProject.id}`);
    }

    const RINGS = 15;
    return (
      <div className="notebook-frame">
        {/* Wire-O spiral binding — desktop only (hidden on mobile via CSS) */}
        <div className="notebook-binding-bar" aria-hidden="true">
          {Array.from({ length: RINGS }).map((_, i) => <div key={i} className="spiral-ring" />)}
        </div>
        {/* App content */}
        <div className="notebook-inner">
          {route.view === 'home'    && <HomePage installPrompt={installPrompt} onInstalled={() => setInstallPrompt(null)} />}
          {route.view === 'project' && <ProjectView projectId={route.projectId} />}
          {route.view === 'page'    && <PageView    projectId={route.projectId} pageId={route.pageId} />}
        </div>
        {/* App-level: PWA file-open import modal */}
        {pendingFileImport && (
          <ImportProjectModal
            fileData={pendingFileImport}
            onClose={() => setPendingFileImport(null)}
            onImported={handleFileImported}
          />
        )}
      </div>
    );
  }

  function _StorageErrorBridge() {
    const toast = useToast();
    useEffect(() => {
      window._fbShowStorageError = () => toast.error('Changes could not be saved — device storage may be full. Export a backup, then free up space.');
      return () => { window._fbShowStorageError = null; };
    }, []);
    return null;
  }

  function AppWithProviders() {
    return (
      <ToastProvider>
        <_StorageErrorBridge />
        <App />
      </ToastProvider>
    );
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // PNEZD column IDs — shared between DataPage (points mode) and sketch.js canvas.
  // These are fixed so sketch.js can reference them without hard-coding strings.
  const PNEZD_COLS = {
    ptNum: 'col_ptnum',
    north: 'col_north',
    east:  'col_east',
    elev:  'col_elev',
    desc:  'col_desc',
  };

  // Permanently removes a point row from all 'points' data pages AND removes
  // any matching point shapes from all sketch pages in the same project.
  // Called when: (1) a row is deleted from a Points Data Page, or
  //              (2) user chooses "Delete Permanently" from the sketch delete prompt.
  function deletePointPermanently(projectId, pointId) {
    const project = DB.getProject(projectId);
    if (!project) return;
    // A photo / voice point: flag its record so opening the Photos page doesn't
    // quietly create the point again. The record keeps its own position.
    const gone = project.pages.flatMap(pg => (pg.type === 'points' && pg.rows) || []).find(r => r.id === pointId);
    if (gone && gone.geo && gone.geo.mediaId) {
      const mark = rec => (rec && rec.id === gone.geo.mediaId) ? { ...rec, noPoint: true } : rec;
      project.pages.forEach(pg => {
        if (pg.type !== 'photo') return;
        const hit = (pg.photos || []).some(r => r && r.id === gone.geo.mediaId) || (pg.voiceNotes || []).some(r => r && r.id === gone.geo.mediaId);
        if (hit) DB.updatePage(projectId, pg.id, {
          photos: (pg.photos || []).map(mark),
          ...(pg.voiceNotes ? { voiceNotes: pg.voiceNotes.map(mark) } : {}),
        });
      });
    }
    project.pages.forEach(page => {
      if (page.type === 'points' && page.rows) {
        const next = page.rows.filter(r => r.id !== pointId);
        if (next.length !== page.rows.length)
          DB.updatePage(projectId, page.id, { rows: next });
      }
      if (page.type === 'sketch' && page.shapes) {
        const next = page.shapes.filter(s => !(s.type === 'point' && s.pointId === pointId));
        if (next.length !== page.shapes.length)
          DB.updatePage(projectId, page.id, { shapes: next });
      }
    });
  }

  // Returns the next available Pt # for manual canvas placement.
  // Starts from lastNum+1 (or 1), then walks forward past any existing numbers.
  function getNextManualPtNum(projectId, lastNum) {
    const project = DB.getProject(projectId);
    const usedNums = new Set();
    if (project) {
      for (const pg of project.pages) {
        if (pg.type === 'points' && pg.rows) {
          pg.rows.forEach(r => {
            const n = parseInt(r.cells?.col_ptnum);
            if (!isNaN(n)) usedNums.add(n);
          });
        }
      }
    }
    let candidate = (lastNum != null && !isNaN(parseInt(lastNum)))
      ? parseInt(lastNum) + 1
      : 1;
    while (usedNums.has(candidate)) candidate++;
    return candidate;
  }

  // Returns true if ptNum (as a string) is already used by a row other than excludeRowId.
  function isPtNumTaken(projectId, ptNum, excludeRowId) {
    const project = DB.getProject(projectId);
    if (!project) return false;
    const target = String(ptNum).trim();
    for (const pg of project.pages) {
      if (pg.type === 'points' && pg.rows) {
        for (const r of pg.rows) {
          if (r.id !== excludeRowId && String(r.cells?.col_ptnum ?? '').trim() === target)
            return true;
        }
      }
    }
    return false;
  }

  // Appends a new row object to the first 'points' page in the project.
  // The caller is responsible for building the row (id, cells).
  function addPointRow(projectId, row) {
    const project = DB.getProject(projectId);
    if (!project) return null;
    const pg = project.pages.find(p => p.type === 'points');
    if (!pg) return null;
    const updatedRows = [...(pg.rows || []), row];
    DB.updatePage(projectId, pg.id, { rows: updatedRows });
    return row.id;
  }

  // Updates specific cells on an existing point row (by rowId) across all points pages.
  // cells is an object like { col_ptnum: '5', col_north: '123.45' }
  function updatePointRow(projectId, rowId, cells) {
    const project = DB.getProject(projectId);
    if (!project) return;
    for (const pg of project.pages) {
      if (pg.type === 'points' && pg.rows) {
        const idx = pg.rows.findIndex(r => r.id === rowId);
        if (idx >= 0) {
          const newRows = pg.rows.map((r, i) =>
            i === idx ? { ...r, cells: { ...r.cells, ...cells } } : r
          );
          DB.updatePage(projectId, pg.id, { rows: newRows });
          return;
        }
      }
    }
  }

  // Expose shared globals for sketch.js to consume via window._fb
  window._fb = { DB, PageHeaderStrip, HCell, compressImage, PNEZD_COLS,
                 deletePointPermanently, getNextManualPtNum, addPointRow, updatePointRow, isPtNumTaken,
                 photoDB, parseDMSInput, formatDMS, fbGeo: window.fbGeo, AerialImageSheet };

  // Mount the app only after sketch.js has loaded and resolved _sketchPromise
  Promise.all([_sketchPromise, _dataReady.catch(() => {})]).then(() => {
    // Route persistence: restore last route on fresh PWA launch so the user
    // lands back on their project/page instead of the home screen.
    // Also primes the DB cache so React's first getProjects() call is free.
    (function restoreLastRoute() {
      const saved = localStorage.getItem('fb_lastRoute');
      if (!saved || saved === '#/' || saved === '#' || window.location.hash === saved) return;
      const m = saved.match(/^#\/project\/([^/]+)/);
      if (m) {
        // Validate the project still exists before restoring
        const exists = _getIndex().some(e => e.id === m[1]);
        if (exists) { window.location.hash = saved; }
        else { localStorage.removeItem('fb_lastRoute'); }
      } else {
        window.location.hash = saved;
      }
    })();

    ReactDOM.createRoot(document.getElementById('root')).render(<AppWithProviders />);
  });
</script>

<!-- Sketch engine — loads async, resolves _sketchPromise when ready -->
<script type="text/babel" src="./sketch.js"></script>
