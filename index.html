  }

  // ─────────────────────────────────────────────────────────────────────────────
  // HOME
  // ─────────────────────────────────────────────────────────────────────────────

  // ─────────────────────────────────────────────────────────────────────────────
  // PROJECT TRANSFER HELPERS
  // ─────────────────────────────────────────────────────────────────────────────

  // Returns a short device hint string based on the user-agent.
  function deviceHint() {
    const ua = navigator.userAgent;
    if (/iPhone/.test(ua))            return 'iPhone';
    if (/iPad/.test(ua))              return 'iPad';
    if (/Android/.test(ua))           return 'Android';
    if (/Windows/.test(ua))           return 'Windows';
    if (/Macintosh|Mac OS X/.test(ua)) return 'Mac';
    return 'Unknown';
  }

  // Walk a project|page shape and inline photoRef → dataUrl from photoDB so
  // the exported file is self-contained across devices. Returns a mutated
  // *copy* of the input; photoRef is dropped from the copy, dataUrl is set.
  async function inlinePhotosForExport(projOrPage) {
    const clone = JSON.parse(JSON.stringify(projOrPage));
    const pages = clone.pages ? clone.pages : [clone];

    // Voice recordings: audioDB Blob -> base64 `audioDataUrl` (audioRef dropped)
    for (const pg of pages) {
      await mapVoiceRecs(pg, async v => {
        if (!v.audioRef) return v;
        let blob = null;
        try { blob = await audioDB.get(v.audioRef); } catch {}
        if (!blob) return v;
        const { audioRef, ...rest } = v;
        return { ...rest, audioDataUrl: await blobToDataUrl(blob) };
      });
    }

    // Collect all IDB keys: DataPage photoRefs + sketch imageIds + GNSS page images
    const allRefs = [];
    pages.forEach(pg => {
      (pg.photos || []).forEach(ph => { if (ph && ph.photoRef) allRefs.push(ph.photoRef); });
      (pg.shapes || []).forEach(s  => { if (s  && s.imageId)   allRefs.push(s.imageId);   });
      allRefs.push(...fbGnss.pageImageRefs(pg));
    });
    if (allRefs.length === 0) return clone;
    const map = await photoDB.getMany(allRefs);

    pages.forEach(pg => {
      // Inline DataPage photos
      if (Array.isArray(pg.photos)) {
        pg.photos = pg.photos.map(ph => {
          if (ph && ph.photoRef && map[ph.photoRef]) {
            const { photoRef, ...rest } = ph;
            return { ...rest, dataUrl: map[photoRef] };
          }
          return ph;
        });
      }
      // Inline sketch images — export as old-format dataUrl so the file is self-contained
      if (Array.isArray(pg.shapes)) {
        pg.shapes = pg.shapes.map(s => {
          if (s && s.imageId && map[s.imageId]) {
            const { imageId, ...rest } = s;
            return { ...rest, dataUrl: map[imageId] };
          }
          return s;
        });
      }
      // Inline GNSS page images (satellite capture, station photo)
      const imgs = pg.gnss && pg.gnss.images;
      if (imgs) {
        fbGnss.IMAGE_SLOTS.forEach(slot => {
          const im = imgs[slot];
          if (im && im.photoRef && map[im.photoRef]) {
            const { photoRef, ...rest } = im;
            imgs[slot] = { ...rest, dataUrl: map[photoRef] };
          }
        });
      }
    });
    return clone;
  }

  // Reverse of inlinePhotosForExport — after importing, move any inline
  // dataUrls into photoDB and replace with fresh photoRef keys. Mutates in
  // place. Returns the mutated input.
  async function extractPhotosFromImport(projOrPage) {
    const pages = projOrPage.pages ? projOrPage.pages : [projOrPage];
    for (const pg of pages) {
      // Voice recordings: inline base64 -> Blob in audioDB under a fresh audioRef
      await mapVoiceRecs(pg, async v => {
        if (!v.audioDataUrl || v.audioRef) return v;
        try {
          const ref = audioDB.newRef();
          await audioDB.put(ref, await dataUrlToBlob(v.audioDataUrl));
          const { audioDataUrl, ...rest } = v;
          return { ...rest, audioRef: ref };
        } catch (err) {
          console.error('Voice note extract-on-import failed:', err);
          return v;
        }
      });
      // Extract DataPage photos
      if (Array.isArray(pg.photos)) {
        const next = [];
        for (const ph of pg.photos) {
          if (ph && ph.dataUrl && !ph.photoRef) {
            try {
              const ref = photoDB.newRef();
              await photoDB.put(ref, ph.dataUrl);
              const { dataUrl, ...rest } = ph;
              next.push({ ...rest, photoRef: ref });
            } catch (err) {
              console.error('Photo extract-on-import failed:', err);
              next.push(ph);
            }
          } else {
            next.push(ph);
          }
        }
        pg.photos = next;
      }
      // Extract sketch images — shapes with inline dataUrl become IDB-backed imageId refs
      if (Array.isArray(pg.shapes)) {
        const next = [];
        for (const s of pg.shapes) {
          if (s && s.type === 'image' && s.dataUrl && !s.imageId) {
            try {
              const imageId = 'sk_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
              await photoDB.put(imageId, s.dataUrl);
              const { dataUrl, ...rest } = s;
              next.push({ ...rest, imageId });
            } catch (err) {
              console.error('Sketch image extract-on-import failed:', err);
              next.push(s); // fall back to keeping inline dataUrl
            }
          } else {
            next.push(s);
          }
        }
        pg.shapes = next;
      }
      // Extract GNSS page images back into photoDB under fresh refs
      const imgs = pg.gnss && pg.gnss.images;
      if (imgs) {
        for (const slot of fbGnss.IMAGE_SLOTS) {
          const im = imgs[slot];
          if (!im || !im.dataUrl || im.photoRef) continue;
          try {
            const ref = photoDB.newRef();
            await photoDB.put(ref, im.dataUrl);
            const { dataUrl, ...rest } = im;
            imgs[slot] = { ...rest, photoRef: ref };
          } catch (err) {
            console.error('GNSS image extract-on-import failed:', err);
          }
        }
      }
    }
    return projOrPage;
  }

  // Build and trigger a .fieldbook file download for a project.
  // Appends an export record to the chain and persists it locally too.
  async function exportProjectToFile(project, by, location) {
    const chain = project.exportChain || [];
    const record = {
      seq:       chain.length + 1,
      action:    'export',
      timestamp: new Date().toISOString(),
      by:        by || 'Unknown',
      location:  location || '',
      device:    deviceHint(),
      appVersion: 'fieldbook-v' + APP_VERSION,
    };
    const updatedChain = [...chain, record];

    // Persist the updated chain on this device
    DB.updateProject(project.id, { exportChain: updatedChain });

    // Inline photo dataUrls so the exported file is portable across devices.
    const projectWithPhotos = await inlinePhotosForExport({ ...project, exportChain: updatedChain });

    const exportData = {
      type:       'fieldbook_project_export',
      version:    '1',
      exportedAt: record.timestamp,
      project:    projectWithPhotos,
    };

    const safeName = (project.name || 'project').replace(/[^a-z0-9_\-]/gi, '_');
    const dateStr  = record.timestamp.split('T')[0];
    const filename = `${safeName}_${dateStr}.fieldbook`;

    // Use octet-stream so Android/Windows download managers don't append .json
    // to the filename. application/json caused "foo.fieldbook" → "foo.fieldbook.json".
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/octet-stream' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);

    return updatedChain;
  }

  // Import a .fieldbook file's project into local storage.
  // Appends an import record and assigns new IDs so it doesn't collide.
  async function importProjectFromData(fileData, importerName) {
    const srcProject = fileData.project;
    const chain      = srcProject.exportChain || [];
    const importRecord = {
      seq:       chain.length + 1,
      action:    'import',
      timestamp: new Date().toISOString(),
      by:        importerName || '',
      location:  '',
      device:    deviceHint(),
      appVersion: 'fieldbook-v' + APP_VERSION,
    };

    // Generate fresh IDs so the imported project doesn't collide with existing ones
    let n = Date.now();
    const uid = () => String(++n);
    const pageIds = {};
    const newProject = {
      ...srcProject,
      id:            uid(),
      importedAt:    importRecord.timestamp,
      exportChain:   [...chain, importRecord],
      pages: (srcProject.pages || []).map(pg => ({
        ...pg,
        id:   (pageIds[pg.id] = uid()),
        rows: (pg.rows || []).map(r => ({ ...r, id: uid() })),
      })),
    };
    remapPageLinks(newProject.pages, pageIds);

    // Move any inline photo dataUrls into photoDB so the project lives under
    // the new photoRef scheme after import.
    await extractPhotosFromImport(newProject);

    DB.saveProject(newProject);
    return newProject;
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // PAGE TRANSFER HELPERS
  // ─────────────────────────────────────────────────────────────────────────────

  // A GNSS page and its station sketch point at each other by page id
  // (page.gnss.sketch.linkedSketchPageId ⇄ sketch page.linkedTo). When a whole
  // project's pages are given new ids, carry those links across; a link whose
  // other page isn't in `idMap` is cleared.
  function remapPageLinks(pages, idMap) {
    pages.forEach(pg => {
      if (pg.linkedTo) {
        if (idMap[pg.linkedTo]) pg.linkedTo = idMap[pg.linkedTo];
        else delete pg.linkedTo;
      }
      const sk = pg.gnss && pg.gnss.sketch;
      if (sk && sk.linkedSketchPageId) {
        pg.gnss = { ...pg.gnss, sketch: { ...sk, linkedSketchPageId: idMap[sk.linkedSketchPageId] || '' } };
      }
    });
  }

  // Deep-clone a page with all-new IDs (page, rows, shapes, photos, voice notes).
  // Does NOT modify pageChain — callers append chain records themselves.
  function freshPageIds(page) {
    let n = Date.now();
    const uid = () => 'p_' + (++n) + '_' + Math.random().toString(36).slice(2, 7);
    const cloned = JSON.parse(JSON.stringify(page));
    cloned.id = uid();
    // The page is leaving its project, so page-to-page links can't follow it.
    remapPageLinks([cloned], {});
    if (Array.isArray(cloned.rows)) {
      cloned.rows = cloned.rows.map(r => ({ ...r, id: uid() }));
    }
    if (Array.isArray(cloned.shapes)) {
      cloned.shapes = cloned.shapes.map(s => ({ ...s, id: uid() }));
    }
    if (Array.isArray(cloned.photos)) {
      // ptId / ptNum link a record to a point in the SOURCE project; the copy
      // gets its own point when its page is first opened (ensureMediaPoints).
      cloned.photos = cloned.photos.map(({ ptId, ptNum, noPoint, ...ph }) => ({
        ...ph, id: uid(),
        ...(Array.isArray(ph.voice) ? { voice: ph.voice.map(v => ({ ...v, id: uid() })) } : {}),
      }));
    }
    if (Array.isArray(cloned.voiceNotes)) {
      cloned.voiceNotes = cloned.voiceNotes.map(({ ptId, ptNum, noPoint, ...v }) => ({ ...v, id: uid() }));
    }
    return cloned;
  }

  // Copy one page from fromProjectId to toProjectId.
  // Returns the newly-created page.
  DB.copyPageToProject = function(fromProjectId, pageId, toProjectId, by) {
    const src         = DB.getPage(fromProjectId, pageId);
    const fromProject = DB.getProject(fromProjectId);
    const toProject   = DB.getProject(toProjectId);
    if (!src || !fromProject || !toProject) return null;

    const cloned = freshPageIds(src);
    const chain  = cloned.pageChain || [];
    chain.push({
      seq:         chain.length + 1,
      action:      'copy',
      timestamp:   new Date().toISOString(),
      by:          by || '',
      location:    '',
      device:      deviceHint(),
      appVersion:  'fieldbook-v' + APP_VERSION,
      fromProject: fromProject.name || '',
      toProject:   toProject.name   || '',
    });
    cloned.pageChain = chain;
    delete cloned.pageNumber;
    DB.addPage(toProjectId, cloned);
    return cloned;
  };

  // Export a single page to a .fieldbook-page file.
  // Appends export record to the page's chain and persists it.
  async function exportPageToFile(page, projectName, by, location, toastFn) {
    const chain = page.pageChain || [];
    const record = {
      seq:         chain.length + 1,
      action:      'export',
      timestamp:   new Date().toISOString(),
      by:          by || '',
      location:    location || '',
      device:      deviceHint(),
      appVersion:  'fieldbook-v' + APP_VERSION,
      fromProject: projectName || '',
      toProject:   null,
    };
    const updatedChain = [...chain, record];
    DB.updatePage(page._projectId || '', page.id, { pageChain: updatedChain });

    // Inline photoRef dataUrls so the .fieldbook-page file is self-contained.
    const pageWithPhotos = await inlinePhotosForExport({ ...page, pageChain: updatedChain });

    const exportData = {
      type:       'fieldbook_page_export',
      version:    '1',
      exportedAt: record.timestamp,
      sourceMeta: {
        projectName: projectName || '',
        pageTitle:   page.title  || '',
        pageType:    page.type   || '',
      },
      page: pageWithPhotos,
    };

    const safeName = (page.title || 'page').replace(/[^a-z0-9_\-]/gi, '_');
    const dateStr  = record.timestamp.split('T')[0];
    const filename = `${safeName}_${dateStr}.fieldbook-page`;

    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/octet-stream' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);

    if (toastFn) toastFn({ message: `Page exported as ${filename}`, type: 'success' });
    return updatedChain;
  }

  // Import a .fieldbook-page file into a project.
  // Validates format, assigns fresh IDs, appends import chain record.
  async function importPageFromData(fileData, toProjectId, importerName) {
    if (fileData.type !== 'fieldbook_page_export') {
      throw new Error('Not a valid .fieldbook-page file');
    }
    const srcPage   = fileData.page;
    const cloned    = freshPageIds(srcPage);
    const chain     = cloned.pageChain || [];
    chain.push({
      seq:         chain.length + 1,
      action:      'import',
      timestamp:   new Date().toISOString(),
      by:          importerName || '',
      location:    '',
      device:      deviceHint(),
      appVersion:  'fieldbook-v' + APP_VERSION,
      fromProject: fileData.sourceMeta?.projectName || '',
      toProject:   null,
    });
    cloned.pageChain = chain;
    delete cloned.pageNumber;
    // Move inlined photo dataUrls into photoDB.
    await extractPhotosFromImport(cloned);
    DB.addPage(toProjectId, cloned);
    return cloned;
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // PROJECT SETTINGS MODAL  — Transfer tab + Project Settings placeholder tab
  // ─────────────────────────────────────────────────────────────────────────────

  // ─────────────────────────────────────────────────────────────────────────────
  // GEO — coordinate system, phone-GPS capture (engine lives in geo.js → fbGeo)
  // ─────────────────────────────────────────────────────────────────────────────
  const fbGeo = window.fbGeo;

  // Fixed PNEZD columns — IDs must match PNEZD_COLS constants
  function pnezdColumns() {
    return [
      { id: 'col_ptnum', label: 'Pt #',        colType: 'text', width: 70 },
      { id: 'col_north', label: 'Northing',    colType: 'num',  width: 100 },
      { id: 'col_east',  label: 'Easting',     colType: 'num',  width: 100 },
      { id: 'col_elev',  label: 'Elevation',   colType: 'num',  width: 100 },
      { id: 'col_desc',  label: 'Description', colType: 'text', width: 130 },
    ];
  }

  // Build a Points-page row for a phone-GPS point. `geo` (from fbGeo.makeGeo)
  // rides on the row beside the PNEZD cells; lat/lon is the source of truth and
  // N/E are derived from it in the project's CRS.
  function makeGpsRow(project, { number, desc, geo }) {
    return {
      id: 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      cells: { col_ptnum: String(number || ''), ...fbGeo.gpsCells(geo, project), col_desc: desc || '' },
      geo,
    };
  }

  // Add a phone-GPS point to the project's Points page, creating that page if
  // the project doesn't have one yet. Returns the new row.
  function addGpsPointRow(projectId, point) {
    const project = DB.getProject(projectId);
    if (!project) return null;
    if (!project.pages.some(p => p.type === 'points')) {
      DB.addPage(projectId, { type: 'points', title: 'Points', columns: pnezdColumns(), rows: [] });
    }
    const row = makeGpsRow(project, point);
    addPointRow(projectId, row);
    return row;
  }

  // "Fill Z from phone height" used to be opt-in and is now on by default.
  // A project that never chose (gpsUseZ undefined) is switched on the first
  // time it is opened: blank Z cells of its phone points are filled with H,
  // and the choice is recorded so this runs once. Typed elevations are kept.
  function migrateGeoDefaults(projectId) {
    const project = DB.getProject(projectId);
    if (!project || project.gpsUseZ !== undefined) return;
    const pages = project.pages.map(pg => {
      if (pg.type !== 'points' || !pg.rows) return pg;
      let touched = false;
      const rows = pg.rows.map(r => {
        if (!r.geo || typeof r.geo.H !== 'number' || String(r.cells?.col_elev ?? '').trim()) return r;
        touched = true;
        return { ...r, cells: { ...r.cells, col_elev: fbGeo.fmtElev(r.geo.H) } };
      });
      return touched ? { ...pg, rows } : pg;
    });
    DB.updateProject(projectId, { gpsUseZ: true, pages });
  }

  // Give a geotagged photo / voice note its OWN numbered point on the Points
  // page (source 'photo' | 'voice') so it is listed, exported and placeable on
  // a sketch like any other point. The row carries the media's position and
  // points back at it through geo.mediaId. Returns the row.
  function createMediaPoint(projectId, pageId, kind, rec, number) {
    const project = DB.getProject(projectId);
    if (!project || !rec || !rec.geo) return null;
    return addGpsPointRow(projectId, {
      number: String(number || '').trim() || String(fbGeo.nextGpsPtNum(project)),
      desc: kind === 'voice' ? (rec.title ? `Voice: ${rec.title}` : 'Voice note') : 'Photo',
      geo: { ...rec.geo, source: kind, mediaId: rec.id, mediaPageId: pageId },
    });
  }

  // A media record is gone, or was linked to another point: drop its own
  // point too — unless that point has been placed on a sketch, in which case
  // it stays behind as an ordinary GPS point.
  function removeMediaPoint(projectId, mediaId) {
    const project = DB.getProject(projectId);
    if (!project) return;
    for (const pg of project.pages) {
      if (pg.type !== 'points') continue;
      const row = (pg.rows || []).find(r => r.geo && r.geo.mediaId === mediaId);
      if (!row) continue;
      const onSketch = project.pages.some(sp => sp.type === 'sketch' &&
        (sp.shapes || []).some(sh => sh.type === 'point' && sh.pointId === row.id));
      if (onSketch) {
        const { mediaId: _m, mediaPageId: _p, ...geo } = row.geo;
        DB.updatePage(projectId, pg.id, { rows: pg.rows.map(r => r.id === row.id ? { ...r, geo: { ...geo, source: 'gps' } } : r) });
      } else {
        DB.updatePage(projectId, pg.id, { rows: pg.rows.filter(r => r.id !== row.id) });
      }
      return;
    }
  }

  // Lazy migration for a Photos page: every geotagged photo / voice note that
  // doesn't resolve to a point yet (taken before points were created for
  // media, or copied in from another project) gets its own. Records whose
  // point the user deleted on the Points page (`noPoint`) are left alone.
  // Returns true when the page was changed.
  function ensureMediaPoints(projectId, pageId) {
    const page = DB.getPage(projectId, pageId);
    if (!page) return false;
    let changed = false;
    const fix = (kind, rec) => {
      if (!rec || !rec.geo || rec.noPoint) return rec;
      const rows = fbGeo.rowPoints(DB.getProject(projectId));
      if (fbGeo.mediaRow(rec, rows)) return rec;
      // A number typed under the old scheme that isn't a point yet becomes
      // this record's own point number.
      const want = String(rec.ptNum ?? '').trim();
      createMediaPoint(projectId, pageId, kind, rec, (want && !rows.some(r => r.number === want)) ? want : '');
      changed = true;
      const { ptNum, ptId, ...rest } = rec;
      return rest;
    };
    const photos = (page.photos || []).map(ph => fix('photo', ph));
    const voiceNotes = (page.voiceNotes || []).map(v => fix('voice', v));
    if (changed) DB.updatePage(projectId, pageId, { photos, ...(page.voiceNotes ? { voiceNotes } : {}) });
    return changed;
  }

  // Bottom sheet that records an averaged phone-GPS fix. Pure UI: it hands
  // { number, desc, geo } to onSave and the caller decides where it is stored.
  // mode 'position' drops the point number / description and just returns the
  // fix — used where a position is wanted but no point is created (GNSS Obs page).
  const GPS_AVG_CHOICES = [5, 10, 30, 60];
  function GpsCaptureSheet({ projectId, source = 'gps', heading = 'GPS Point', mode = 'point', onSave, onClose }) {
    const isPoint = mode === 'point';
    const project = DB.getProject(projectId);
    const crs = fbGeo.projectCrs(project);
    const [fix, setFix]         = useState(null);   // latest live fix
    const [err, setErr]         = useState(null);
    const [secs, setSecs]       = useState(10);
    const [phase, setPhaseState] = useState('idle'); // 'idle' | 'averaging' | 'done'
    const [remaining, setRemaining] = useState(0);
    const [count, setCount]     = useState(0);
    const [result, setResult]   = useState(null);   // averaged fix
    const [number, setNumber]   = useState(() => String(fbGeo.nextGpsPtNum(project)));
    const [desc, setDesc]       = useState('');
    const samplesRef = useRef([]);
    const phaseRef   = useRef('idle');
    const fixRef     = useRef(null);
    const trapRef    = useRef(null);
    useFocusTrap(trapRef, true, onClose);

    function setPhase(p) { phaseRef.current = p; setPhaseState(p); }

    // Watch position for as long as the sheet is open so the receiver is warm
    // and the accuracy readout is live before the user starts averaging.
    useEffect(() => {
      if (!navigator.geolocation) { setErr('This browser has no location service.'); return; }
      const id = navigator.geolocation.watchPosition(
        pos => {
          const c = pos.coords;
          const f = { lat: c.latitude, lon: c.longitude, h: c.altitude, acc: c.accuracy };
          fixRef.current = f;
          setErr(null);
          setFix(f);
          if (phaseRef.current === 'averaging') {
            samplesRef.current.push(f);
            setCount(samplesRef.current.length);
          }
        },
        e => setErr(
          e.code === 1 ? 'Location permission denied. Allow location for this site in your browser settings, then reopen this sheet.'
          : e.code === 3 ? 'Still waiting for a GPS fix — move to open sky.'
          : 'Position unavailable — check that location is switched on.'),
        { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
      );
      return () => navigator.geolocation.clearWatch(id);
    }, []);

    // Averaging countdown
    useEffect(() => {
      if (phase !== 'averaging') return;
      const end = Date.now() + secs * 1000;
      setRemaining(secs);
      const t = setInterval(() => {
        const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
        setRemaining(left);
        if (left <= 0) { clearInterval(t); finish(); }
      }, 250);
      return () => clearInterval(t);
    }, [phase]);

    function start() {
      samplesRef.current = [];
      setCount(0);
      setResult(null);
      setPhase('averaging');
    }

    function finish() {
      // No fix arrived inside the window (receiver updates slowly when the
      // phone is still) — fall back to the last live fix rather than nothing.
      const s = samplesRef.current.length ? samplesRef.current : (fixRef.current ? [fixRef.current] : []);
      if (!s.length) { setPhase('idle'); setErr('No GPS fix received — try again under open sky.'); return; }
      const mean = k => s.reduce((a, f) => a + f[k], 0) / s.length;
      const hs = s.filter(f => typeof f.h === 'number' && isFinite(f.h));
      setResult({
        lat: mean('lat'), lon: mean('lon'), acc: mean('acc'),
        h: hs.length ? hs.reduce((a, f) => a + f.h, 0) / hs.length : null,
        fixes: s.length,
      });
      setPhase('done');
    }

    const numTrim = number.trim();
    const duplicate = !!numTrim && fbGeo.usedPointNumbers(project).has(numTrim);

    function save() {
      if (!result) return;
      onSave({ number: numTrim, desc: desc.trim(), geo: fbGeo.makeGeo({ ...result, ts: new Date().toISOString() }, source) });
    }

    const grid = result && fbGeo.toGrid(result.lat, result.lon, crs.id);
    const ht   = result && fbGeo.orthoHeight(result.h, result.lat, result.lon);
    const fieldCls = 'w-full px-3 py-3 rounded-xl text-base text-fb-ink bg-fb-field border border-fb-border outline-none focus:border-fb-accent placeholder:text-fb-ink-faint';
    const lbl = 'text-[10px] font-bold text-fb-ink-muted uppercase tracking-widest';

    return (
      <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
        <div ref={trapRef} className="modal-sheet" style={{ paddingBottom: 32 }}>
          <div tabIndex={0} className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4 outline-none" />
          <div className="flex items-baseline justify-between mb-4">
            <h2 className="text-xl font-bold text-fb-ink">{heading}</h2>
            <span className="text-xs font-semibold text-fb-ink-muted font-data">{crs.short}</span>
          </div>

          {/* Live receiver readout */}
          <div className="rounded-xl px-4 py-3 mb-3 text-center bg-fb-page-alt border border-fb-border">
            <p className={lbl + ' mb-1'}>{phase === 'averaging' ? 'Averaging' : 'Live accuracy'}</p>
            <p className="font-data text-fb-ink text-[30px] leading-tight">
              {fix ? `±${fix.acc < 10 ? fix.acc.toFixed(1) : Math.round(fix.acc)} m` : '— —'}
            </p>
            <p className={`text-xs text-fb-ink-muted mt-1${phase !== 'averaging' && fix ? ' font-data' : ''}`}>
              {phase === 'averaging'
                ? `${remaining} s left · ${count} fix${count === 1 ? '' : 'es'}`
                : fix ? fbGeo.fmtPosition(fix.lat, fix.lon, crs.id) : 'Waiting for GPS…'}
            </p>
            {phase === 'averaging' && (
              <div className="h-1.5 rounded-full mt-2 overflow-hidden bg-fb-border">
                <div className="h-full bg-fb-accent transition-[width] duration-[250ms] ease-linear" style={{ width: `${100 * (1 - remaining / secs)}%` }} />
              </div>
            )}
          </div>

          {err && <Notice tone="error" className="mb-3">{err}</Notice>}

          {/* Averaged result */}
          {result && (
            <div className="rounded-xl px-3 py-2.5 mb-3 bg-fb-field border border-fb-border">
              <div className="flex items-center justify-between mb-1">
                <span className={lbl}>Averaged · {result.fixes} fix{result.fixes === 1 ? '' : 'es'}</span>
                <span className="text-xs font-semibold text-fb-warn">{fbGeo.fmtAcc(result.acc)}</span>
              </div>
              {grid
                ? <>
                    <p className="font-data text-base text-fb-ink">N {fbGeo.fmtGrid(grid.n)}</p>
                    <p className="font-data text-base text-fb-ink">E {fbGeo.fmtGrid(grid.e)}</p>
                  </>
                : <>
                    <p className="font-data text-base text-fb-ink">{fbGeo.fmtLatLon(result.lat, result.lon)}</p>
                    <p className="text-xs text-fb-ink-muted">Local coordinates — lat/lon is stored, no grid N/E.</p>
                  </>}
              <p className="text-xs text-fb-ink-muted mt-1 leading-snug">
                {ht.h === null
                  ? 'No height from this fix.'
                  : <>Ellipsoid ht (phone) {fbGeo.fmtElev(ht.h)} m
                      {ht.H !== null && <> · geoid N {ht.N.toFixed(1)} m · H {fbGeo.fmtElev(ht.H)} m (CGG2013a)</>}
                      {isPoint && <>{' · '}{fbGeo.useZ(project) && ht.H !== null ? 'Z = H' : 'Z left blank'}</>}</>}
              </p>
            </div>
          )}

          {isPoint && (
            <div className="flex gap-2 mb-3">
              <div className="w-[110px]">
                <p className={lbl + ' mb-1.5'}>Pt #</p>
                <input type="text" inputMode="numeric" value={number} onChange={e => setNumber(e.target.value)}
                  className={fieldCls + ' font-data'} />
              </div>
              <div className="flex-1 min-w-0">
                <p className={lbl + ' mb-1.5'}>Description</p>
                <input type="text" value={desc} onChange={e => setDesc(e.target.value)} placeholder="IP fd, culvert, gate…"
                  className={fieldCls} />
              </div>
            </div>
          )}
          {isPoint && duplicate && <Notice className="mb-3">Point {numTrim} already exists in this project.</Notice>}

          {phase !== 'averaging' && (
            <div className="flex items-center gap-1.5 mb-3">
              <span className="text-xs text-fb-ink-muted mr-1">Average for</span>
              {GPS_AVG_CHOICES.map(n => (
                <button key={n} onClick={() => setSecs(n)}
                  className={`flex-1 h-9 rounded-lg text-sm font-semibold border ${secs === n
                    ? 'bg-fb-cover border-fb-cover text-white'
                    : 'bg-fb-page-alt border-fb-border text-fb-heading'}`}>
                  {n} s
                </button>
              ))}
            </div>
          )}

          {phase === 'done' ? (
            <div className="flex gap-2">
              <button onClick={start}
                className="py-3 px-5 rounded-xl text-sm font-semibold text-fb-ink bg-fb-page-alt border border-fb-border active:bg-fb-page-deep">
                Redo
              </button>
              <button onClick={save}
                className="flex-1 py-3.5 rounded-xl text-base font-semibold text-white bg-fb-accent active:opacity-80">
                {!isPoint ? 'Use this position' : duplicate ? 'Save anyway' : 'Save point'}
              </button>
            </div>
          ) : (
            <button onClick={start} disabled={phase === 'averaging' || !navigator.geolocation}
              className="w-full py-3.5 rounded-xl text-base font-semibold text-white bg-fb-accent active:opacity-80 disabled:bg-fb-ink-faint">
              {phase === 'averaging' ? 'Hold still…' : `Record ${secs} s average`}
            </button>
          )}
          <p className="text-[11px] text-fb-ink-muted text-center mt-3 leading-snug">
            Recon grade only — phone GPS, treated as NAD83(CSRS). Not for survey control.
          </p>
        </div>
      </div>
    );
  }

  // Coordinate-system block of the Settings tab in ProjectSettingsModal.
  function ProjectGeoSettings({ project, projectId, onReload }) {
    const toast = useToast();
    const crsId = fbGeo.projectCrsId(project);
    const [pending, setPending] = useState(null);   // crsChangeSummary awaiting a decision
    const [startNum, setStartNum] = useState(String(fbGeo.gpsPtStart(project)));

    function applyCrs(toId, reproject) {
      const fresh = DB.getProject(projectId);
      const from  = fbGeo.getCrs(crsId), to = fbGeo.getCrs(toId);
      // Keep an untouched Title-page datum in step; hand-edited text is left
      // alone and the Title page shows a mismatch warning instead.
      let pages = fbGeo.applyCrsChange(fresh, toId, reproject).map(pg =>
        (pg.type === 'title' && (!pg.datum || pg.datum === from.datumText)) ? { ...pg, datum: to.datumText } : pg);
      // GPS pin chips in notes quote project coordinates — re-write them too.
      const moved = { ...fresh, crs: toId, pages };
      pages = pages.map(pg => (pg.type === 'notes' && pg.notesHtml)
        ? { ...pg, notesHtml: fbGeo.refreshPins(pg.notesHtml, moved) } : pg);
      DB.updateProject(projectId, { crs: toId, pages });
      setPending(null);
      onReload();
      toast.success(reproject ? `Points reprojected to ${to.short}` : `Coordinate system set to ${to.short}`);
    }

    function pickCrs(toId) {
      if (toId === crsId) return;
      const sum = fbGeo.crsChangeSummary(DB.getProject(projectId), toId);
      if (sum.gps + sum.instrument === 0) applyCrs(toId, false);
      else setPending(sum);
    }

    function saveStartNum(v) {
      const n = parseInt(v);
      if (!isFinite(n) || n < 1) { setStartNum(String(fbGeo.gpsPtStart(project))); return; }
      setStartNum(String(n));
      DB.updateProject(projectId, { gpsPtStart: n });
      onReload();
    }

    // Z = H (orthometric, CGG2013a) for phone points — on by default. Existing
    // phone rows follow the switch; a Z the user typed over is never cleared.
    function toggleUseZ() {
      const on = !fbGeo.useZ(project);
      const fresh = DB.getProject(projectId);
      const pages = fresh.pages.map(pg => {
        if (pg.type !== 'points' || !pg.rows) return pg;
        return { ...pg, rows: pg.rows.map(r => {
          if (!r.geo || typeof r.geo.H !== 'number') return r;
          const derived = fbGeo.fmtElev(r.geo.H);
          const cur = String(r.cells?.col_elev ?? '').trim();
          if (on && !cur)             return { ...r, cells: { ...r.cells, col_elev: derived } };
          if (!on && cur === derived) return { ...r, cells: { ...r.cells, col_elev: '' } };
          return r;
        }) };
      });
      DB.updateProject(projectId, { gpsUseZ: on, pages });
      onReload();
    }

    const lbl = 'text-[10px] font-bold text-fb-ink-muted uppercase tracking-widest mb-1.5';
    const to = pending && fbGeo.getCrs(pending.toId);

    return (
      <div className="mb-6">
        <p className={lbl}>Coordinate System</p>
        <div className="space-y-1.5">
          {fbGeo.CRS_REGISTRY.map(c => (
            <button key={c.id} onClick={() => pickCrs(c.id)}
              className={`w-full flex items-center gap-3 px-3 py-3 rounded-xl text-left border active:opacity-80 ${c.id === crsId
                ? 'bg-fb-accent-pale border-fb-accent' : 'bg-fb-page-alt border-fb-border'}`}>
              <span className={`w-[18px] h-[18px] rounded-full border-2 border-fb-accent flex-shrink-0 ${c.id === crsId ? 'bg-fb-accent' : ''}`} />
              <span className="flex-1 min-w-0">
                <span className="block text-sm font-semibold text-fb-ink">{c.label}</span>
                <span className="block text-xs text-fb-ink-muted font-data">{c.epsg ? `EPSG:${c.epsg}` : 'No lat/lon — KML/GPX export disabled'}</span>
              </span>
            </button>
          ))}
        </div>
        {crsId === 'local' && (
          <p className="text-xs text-fb-ink-muted mt-2 leading-snug">
            No lat/lon — map export is off.
          </p>
        )}

        {pending && (
          <div className="rounded-xl px-3 py-2.5 mt-3 bg-fb-warn-pale border border-fb-warn-line">
            <p className="text-sm font-semibold text-fb-ink mb-1 flex items-center gap-2">
              <span className="text-fb-warn flex-shrink-0"><Ico.Warn /></span>Change to {to.short}?
            </p>
            <p className="text-xs text-fb-ink leading-snug mb-3">
              This project has {pending.instrument} entered point{pending.instrument === 1 ? '' : 's'} and {pending.gps} phone-GPS point{pending.gps === 1 ? '' : 's'}.
              {pending.instrument > 0 && (pending.canReproject
                ? <> <b>Relabel</b> keeps their N/E as typed; <b>Reproject</b> converts them to the new grid. Back up first if unsure.</>
                : <> Their N/E are kept as typed.</>)}
            </p>
            <div className="flex flex-wrap gap-2">
              <button onClick={() => setPending(null)}
                className="py-3 px-4 rounded-xl text-sm font-medium text-fb-ink-muted bg-black/[0.04] active:bg-fb-page-deep">
                Cancel
              </button>
              <button onClick={() => applyCrs(pending.toId, false)}
                className="flex-1 py-3 px-4 rounded-xl text-sm font-semibold text-white bg-fb-accent active:opacity-80">
                {pending.canReproject && pending.instrument > 0 ? 'Relabel only' : 'Change'}
              </button>
              {pending.canReproject && pending.instrument > 0 && (
                <button onClick={() => applyCrs(pending.toId, true)}
                  className="flex-1 py-3 px-4 rounded-xl text-sm font-semibold text-fb-ink bg-fb-page-alt border border-fb-border active:bg-fb-page-deep">
                  Reproject {pending.instrument}
                </button>
              )}
            </div>
          </div>
        )}

        <p className={lbl + ' mt-5'}>Phone GPS Points</p>
        <div className="flex items-center gap-3 px-3 py-2.5 rounded-xl mb-1.5 bg-fb-page-alt border border-fb-border">
          <span className="flex-1 text-sm text-fb-ink">Number GPS points from</span>
          <input type="text" inputMode="numeric" value={startNum}
            onChange={e => setStartNum(e.target.value)} onBlur={e => saveStartNum(e.target.value)}
            className="w-[90px] rounded-lg px-2 py-1.5 text-base text-right font-data text-fb-ink bg-fb-field border border-fb-border outline-none focus:border-fb-accent" />
        </div>
        <button onClick={toggleUseZ}
          className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left bg-fb-page-alt border border-fb-border active:opacity-80">
          <span className="flex-1 min-w-0">
            <span className="block text-sm text-fb-ink">Fill Z from phone height</span>
            <span className="block text-xs text-fb-ink-muted leading-snug">CGG2013a geoid. Phone height is ±5–15 m.</span>
          </span>
          <span className={`text-xs font-bold px-2.5 py-1 rounded-full flex-shrink-0 ${fbGeo.useZ(project) ? 'bg-fb-accent text-white' : 'bg-fb-border text-fb-ink'}`}>
            {fbGeo.useZ(project) ? 'ON' : 'OFF'}
          </span>
        </button>
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // EXPORT POINTS — PNEZD CSV / KML / GPX
  // ─────────────────────────────────────────────────────────────────────────────

  // Hand a file to the Android share sheet when the browser will share that
  // type (so it can go straight to a map app); otherwise save it to Downloads.
  // Chrome's share allow-list often rejects .kml / .gpx — that is expected, and
  // is why the download fallback exists. Returns 'shared' | 'saved' | 'cancelled'.
  function canShareFile(file) {
    try { return !!(navigator.canShare && navigator.share && navigator.canShare({ files: [file] })); }
    catch { return false; }
  }
  async function deliverFile(text, filename, mime, forceDownload) {
    const file = new File([text], filename, { type: mime });
    if (!forceDownload && canShareFile(file)) {
      try {
        await navigator.share({ files: [file], title: filename });
        return 'shared';
      } catch (e) {
        if (e && e.name === 'AbortError') return 'cancelled';
        // any other failure → fall through to a normal download
      }
    }
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    return 'saved';
  }

  const POINT_EXPORT_FORMATS = [
    { id: 'csv', label: 'CSV', sub: 'PNEZD',        ext: 'csv', mime: 'text/csv' },
    { id: 'kml', label: 'KML', sub: 'Google Earth', ext: 'kml', mime: 'application/vnd.google-earth.kml+xml' },
    { id: 'gpx', label: 'GPX', sub: 'OsmAnd',       ext: 'gpx', mime: 'application/gpx+xml' },
  ];
  // Quick-select groups. A point can be in several (a GPS photo point is both
  // "Photo" and "GPS").
  const POINT_EXPORT_GROUPS = [
    { id: 'entered', label: 'Entered',                           test: p => p.source === 'instrument' },
    { id: 'photo',   label: 'Photo',           Icon: Ico.Camera, test: p => p.source === 'photo' || p.hasPhoto },
    { id: 'voice',   label: 'Voice',           Icon: Ico.Mic,    test: p => p.source === 'voice' || p.hasVoice },
    { id: 'pins',    label: 'Notes pins',      Icon: Ico.Note,   test: p => p.source === 'notes-pin' },
    { id: 'gps',     label: 'GPS (all phone)', Icon: Ico.Pin,    test: p => p.phone },
  ];

  // pageId (optional): open from a Points page with only that page's points ticked.
  function ExportPointsModal({ projectId, pageId, onClose }) {
    const project = DB.getProject(projectId);
    const crs     = fbGeo.projectCrs(project);
    const toast   = useToast();
    const trapRef = useRef(null);
    useFocusTrap(trapRef, true, onClose);

    const [points] = useState(() => fbGeo.getProjectPoints(project));
    const [sel, setSel]       = useState(() => {
      const mine = pageId ? points.filter(p => p.pageId === pageId) : [];
      return new Set((mine.length ? mine : points).map(p => p.id));
    });
    const [range, setRange]   = useState('');
    const [format, setFormat] = useState(() => {
      try { const f = localStorage.getItem('fb_points_export_format'); return POINT_EXPORT_FORMATS.some(x => x.id === f) ? f : 'csv'; }
      catch { return 'csv'; }
    });
    const [header, setHeader] = useState(false);
    const [busy, setBusy]     = useState(false);

    const fmt = POINT_EXPORT_FORMATS.find(f => f.id === format);
    function pickFormat(id) {
      setFormat(id);
      try { localStorage.setItem('fb_points_export_format', id); } catch {}
    }

    const change = fn => setSel(prev => { const next = new Set(prev); fn(next); return next; });
    const toggle = id => change(s => { if (s.has(id)) s.delete(id); else s.add(id); });

    // Range field — "1-50, 75, 9001-9010"
    const parsed  = fbGeo.parseRange(range);
    const matched = parsed.ranges.length ? points.filter(p => fbGeo.inRanges(p.number, parsed.ranges)) : [];

    const chosen   = points.filter(p => sel.has(p.id));
    const withGrid = chosen.filter(p => p.N !== null && p.E !== null).length;
    const withMap  = chosen.filter(p => p.lat !== null).length;
    const usable   = format === 'csv' ? withGrid : withMap;
    const blocked  = chosen.length === 0 ? 'Select at least one point.'
      : usable > 0 ? null
      : format === 'csv' ? 'None of the selected points have N/E.'
      : !crs.proj4 ? 'This project uses local coordinates, which can\'t be converted to lat/lon — so there is nothing to send to a map app.'
      : 'None of the selected points have a map position (their N/E is blank or outside the project\'s coordinate system).';

    const base = (project.name || 'project').replace(/[^a-z0-9_\-]+/gi, '_').replace(/^_+|_+$/g, '') || 'project';
    const filename = format === 'csv' ? `${base}_points_${crs.fileTag}.csv` : `${base}_points.${fmt.ext}`;
    const shareable = canShareFile(new File(['x'], filename, { type: fmt.mime }));

    async function doExport(forceDownload) {
      if (blocked || busy) return;
      const out = format === 'csv' ? fbGeo.toPNEZD(chosen, { header })
                : format === 'kml' ? fbGeo.toKML(chosen, project)
                : fbGeo.toGPX(chosen, project);
      const left = out.skipped ? ` · ${out.skipped} left out (no ${format === 'csv' ? 'N/E' : 'map position'})` : '';
      setBusy(true);
      let how;
      try { how = await deliverFile(out.text, filename, fmt.mime, forceDownload); }
      catch (e) { console.error('Point export failed:', e); toast.error('Export failed'); setBusy(false); return; }
      setBusy(false);
      const n = `${out.count} point${out.count === 1 ? '' : 's'}`;
      if (how === 'shared') toast.success(`${n} shared${left}`);
      else if (how === 'saved') {
        toast.success(format === 'csv'
          ? `Saved ${filename}${left}`
          : `Saved ${n} — open it from Downloads with OsmAnd or Google Earth${left}`);
      }
    }

    const lbl = 'text-[10px] font-bold text-fb-ink-muted uppercase tracking-widest';
    const chip = on => `h-9 px-3 rounded-lg text-sm font-semibold border inline-flex items-center gap-1.5 flex-shrink-0 whitespace-nowrap ${on
      ? 'bg-fb-cover border-fb-cover text-white'
      : 'bg-fb-page-alt border-fb-border text-fb-heading'}`;
    const secondary = 'py-3 px-4 rounded-xl text-sm font-semibold text-fb-ink bg-fb-page-alt border border-fb-border active:bg-fb-page-deep disabled:opacity-40';

    return (
      <div className="modal-backdrop" style={{ zIndex: 60 }} onClick={e => e.target === e.currentTarget && onClose()}>
        <div ref={trapRef} className="modal-sheet flex flex-col" style={{ paddingBottom: 24, maxHeight: '94vh' }}>
          <div tabIndex={0} className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4 flex-shrink-0 outline-none" />
          <div className="flex items-baseline justify-between mb-4 flex-shrink-0">
            <h2 className="text-xl font-bold text-fb-ink">Export Points</h2>
            <span className="text-xs font-semibold text-fb-ink-muted font-data">{crs.short}</span>
          </div>

          {points.length === 0 ? (
            <p className="text-sm text-fb-ink-muted py-6 text-center rounded-xl bg-fb-page-alt">
              This project has no points yet.
            </p>
          ) : (
            <>
              {/* Quick select */}
              <div className="flex gap-1.5 mb-3 pb-0.5 flex-shrink-0 overflow-x-auto">
                <button className={chip(sel.size === points.length)} onClick={() => setSel(new Set(points.map(p => p.id)))}>All</button>
                {POINT_EXPORT_GROUPS.map(g => {
                  const mine = points.filter(g.test);
                  if (!mine.length) return null;
                  const on = mine.every(p => sel.has(p.id));
                  return (
                    <button key={g.id} className={chip(on)}
                      onClick={() => change(s => mine.forEach(p => { if (on) s.delete(p.id); else s.add(p.id); }))}>
                      {g.Icon && <g.Icon size={14} />}{g.label} <span className="opacity-70 font-data">{mine.length}</span>
                    </button>
                  );
                })}
                <button className={chip(false)} onClick={() => setSel(new Set())}>None</button>
              </div>

              {/* Range */}
              <div className="flex items-center gap-2 mb-1 flex-shrink-0">
                <input type="text" inputMode="text" value={range} onChange={e => setRange(e.target.value)}
                  placeholder="Range: 1-50, 75, 9001-9010"
                  className="flex-1 min-w-0 px-3 py-3 rounded-xl text-base text-fb-ink bg-fb-field border border-fb-border outline-none focus:border-fb-accent placeholder:text-fb-ink-faint font-data" />
                <button disabled={!matched.length} onClick={() => change(s => matched.forEach(p => s.add(p.id)))}
                  className={secondary}>
                  Add
                </button>
                <button disabled={!matched.length} onClick={() => setSel(new Set(matched.map(p => p.id)))}
                  className={secondary}>
                  Only
                </button>
              </div>
              <p className="text-xs text-fb-ink-muted mb-2 flex-shrink-0 min-h-[16px]">
                {range.trim()
                  ? <>{matched.length} point{matched.length === 1 ? '' : 's'} matched{parsed.bad.length ? ` · can't read "${parsed.bad.join(' ')}"` : ''}</>
                  : ''}
              </p>

              {/* Checklist */}
              <div className="flex items-center justify-between mb-1.5 flex-shrink-0">
                <p className={lbl}>{sel.size} of {points.length} selected</p>
                <p className="text-[11px] text-fb-ink-muted">{withMap} with a map position</p>
              </div>
              <div className="rounded-xl mb-3 overflow-y-auto bg-fb-field border border-fb-border" style={{ flex: '1 1 auto', minHeight: 120 }}>
                {points.map(p => {
                  const on  = sel.has(p.id);
                  const uri = p.lat !== null ? fbGeo.geoUri(p.lat, p.lon, [p.number, p.desc].filter(Boolean).join(' ')) : null;
                  return (
                    <div key={p.id} className="flex items-stretch border-b border-fb-page-alt">
                      <button onClick={() => toggle(p.id)} role="checkbox" aria-checked={on}
                        className="flex-1 min-w-0 flex items-center gap-2.5 px-3 py-2.5 text-left active:bg-fb-page-alt">
                        <span className={`w-6 h-6 rounded border-2 border-fb-accent flex-shrink-0 flex items-center justify-center text-sm leading-none text-white ${on ? 'bg-fb-accent' : ''}`}>
                          {on ? '✓' : ''}
                        </span>
                        <span className="font-data text-base text-fb-ink w-16 flex-shrink-0 truncate">{p.number || '—'}</span>
                        <span className="flex-1 min-w-0">
                          <span className="flex items-center gap-1.5">
                            <span className="flex-1 min-w-0 text-sm text-fb-ink truncate">{p.desc || '—'}</span>
                            <SourceTag source={p.source} />
                          </span>
                          <span className="block text-xs text-fb-ink-muted font-data truncate">
                            {p.N !== null && p.E !== null ? `N ${p.text.n}  E ${p.text.e}${p.text.z ? '  Z ' + p.text.z : ''}`
                              : p.lat !== null ? fbGeo.fmtLatLon(p.lat, p.lon) : 'no coordinates'}
                          </span>
                        </span>
                      </button>
                      {uri && (
                        <a href={uri} title="Open in map app" className="flex-shrink-0 flex items-center px-3 text-fb-heading active:bg-fb-page-alt"><Ico.Map size={18} /></a>
                      )}
                    </div>
                  );
                })}
              </div>

              {/* Format */}
              <div className="flex gap-1.5 mb-2 flex-shrink-0">
                {POINT_EXPORT_FORMATS.map(f => (
                  <button key={f.id} onClick={() => pickFormat(f.id)}
                    className={`flex-1 py-2 rounded-lg text-center border ${format === f.id
                      ? 'bg-fb-cover border-fb-cover text-white'
                      : 'bg-fb-page-alt border-fb-border text-fb-heading'}`}>
                    <span className="block text-sm font-semibold">{f.label}</span>
                    <span className="block text-[10px] opacity-75">{f.sub}</span>
                  </button>
                ))}
              </div>
              <div className="flex-shrink-0 mb-3 min-h-[30px]">
                {format === 'csv' ? (
                  <button onClick={() => setHeader(h => !h)} className="flex items-center gap-2 w-full text-left py-1">
                    <span className="flex-1 text-xs text-fb-ink">
                      Point, Northing, Easting, Elevation, Description — in <b>{crs.short}</b>, as shown in the app
                    </span>
                    <span className={`text-xs font-bold px-2.5 py-1 rounded-full flex-shrink-0 ${header ? 'bg-fb-accent text-white' : 'bg-fb-border text-fb-ink'}`}>
                      Header row {header ? 'ON' : 'OFF'}
                    </span>
                  </button>
                ) : (
                  <p className="text-xs text-fb-ink-muted leading-snug">
                    Lat/lon for a phone map app, grouped by point type.
                  </p>
                )}
              </div>

              {blocked && <Notice className="mb-2 flex-shrink-0">{blocked}</Notice>}
              <button onClick={() => doExport(false)} disabled={!!blocked || busy}
                className="w-full py-3.5 rounded-xl text-base font-semibold text-white bg-fb-accent active:opacity-80 disabled:bg-fb-ink-faint flex-shrink-0">
                {busy ? 'Exporting…' : `${shareable ? 'Share' : 'Save'} ${usable} point${usable === 1 ? '' : 's'} as ${fmt.label}`}
              </button>
              {shareable && !blocked && (
                <button onClick={() => doExport(true)} disabled={busy}
                  className="w-full pt-3 text-sm font-semibold text-fb-heading active:opacity-80 flex-shrink-0">
                  Save to Downloads instead
                </button>
              )}
            </>
          )}
        </div>
      </div>
    );
  }

  function ProjectSettingsModal({ project, projectId, onClose, onReload }) {
    const [tab,        setTab]        = useState('transfer');
    const [showExport, setShowExport] = useState(false);
    const [showExportPts, setShowExportPts] = useState(false);
    const toast    = useToast();
    const trapRef  = useRef(null);
    useFocusTrap(trapRef, !showExportPts, onClose);

    const chain = project.exportChain || [];

    function handleExportDone(updatedChain) {
      setShowExport(false);
      onReload();
      toast.success('Project exported — file downloaded');
    }

    return (
      <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
        <div ref={trapRef} className="modal-sheet" style={{ paddingBottom: 40 }}>
          <div className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-4" />
          <h2 className="text-xl font-bold text-fb-text mb-4">Project Settings</h2>

          {/* Tab bar */}
          <div className="flex gap-1 p-1 rounded-xl mb-5" style={{ background: FBC.pageAlt }}>
            {[['transfer', 'Transfer'], ['settings', 'Settings']].map(([id, label]) => (
              <button key={id} onClick={() => setTab(id)}
                className="flex-1 py-2 rounded-lg text-sm font-semibold transition-all"
                style={{
                  background:  tab === id ? FBC.page : 'transparent',
                  color:       tab === id ? FBC.heading : FBC.inkFaint,
                  boxShadow:   tab === id ? '0 1px 4px rgba(0,0,0,0.10)' : 'none',
                }}>
                {label}
              </button>
            ))}
          </div>

          {tab === 'transfer' && (
            <>
              {/* Export button */}
              <button onClick={() => setShowExport(true)}
                className="w-full py-3 rounded-xl font-semibold text-sm text-white active:opacity-80 flex items-center justify-center gap-2 mb-1"
                style={{ background: FBC.accent }}>
                <span style={{ fontSize: 16 }}>↑</span> Export Project File
              </button>
              <p className="text-xs text-fb-muted text-center mb-4">
                Downloads a <code className="font-data">.fieldbook</code> file — share or import on any device
              </p>

              {/* Export points */}
              <button onClick={() => setShowExportPts(true)}
                className="w-full py-3 rounded-xl text-sm font-semibold text-fb-ink bg-fb-page-alt border border-fb-border active:bg-fb-page-deep flex items-center justify-center gap-2 mb-1">
                <Ico.Upload size={16} /> Export Points
              </button>
              <div className="mb-5" />

              {/* Transfer history */}
              <p className="text-xs font-bold text-fb-muted uppercase tracking-widest mb-2">Transfer History</p>
              {chain.length === 0
                ? (
                  <p className="text-sm text-fb-muted py-6 text-center rounded-xl" style={{ background: FBC.pageAlt }}>
                    No exports or imports yet.
                  </p>
                )
                : (
                  <div className="space-y-2 max-h-64 overflow-y-auto">
                    {[...chain].reverse().map((rec, i) => (
                      <div key={i} className="rounded-xl px-3 py-2.5"
                        style={{ background: FBC.pageAlt, border: `1px solid ${FBC.border}` }}>
                        <div className="flex items-center gap-2 mb-0.5">
                          <span className="text-xs font-bold px-1.5 py-0.5 rounded-md text-white"
                            style={{ background: rec.action === 'export' ? FBC.accent : '#1d4ed8', fontSize: 9 }}>
                            {rec.action === 'export' ? '↑ Export' : '↓ Import'} #{rec.seq}
                          </span>
                          <span className="text-xs font-semibold text-fb-text">{rec.by || 'Unknown'}</span>
                        </div>
                        <div className="text-xs text-fb-muted leading-snug">
                          {new Date(rec.timestamp).toLocaleString('en-CA', { dateStyle: 'medium', timeStyle: 'short' })}
                          {rec.location && <span> · {rec.location}</span>}
                          {rec.device   && <span> · {rec.device}</span>}
                          {rec.appVersion && <span> · v{rec.appVersion.replace('fieldbook-v','')}</span>}
                        </div>
                      </div>
                    ))}
                  </div>
                )
              }
            </>
          )}

          {tab === 'settings' && (
            <>
              <ProjectGeoSettings project={project} projectId={projectId} onReload={onReload} />
              <button
                onClick={() => {
                  const archiving = !project.archived;
                  DB.setProjectArchived(projectId, archiving);
                  onClose();
                  if (archiving) { toast.success('Project archived'); navigate('#/'); }
                  else { onReload(); toast.success('Project restored'); }
                }}
                className="w-full py-3 rounded-xl font-semibold text-sm text-fb-text active:opacity-80 mb-1"
                style={{ background: FBC.pageAlt, border: `1px solid ${FBC.border}` }}>
                {project.archived ? 'Restore Project to Active' : 'Archive Project'}
              </button>
              {!project.archived && <p className="text-xs text-fb-muted text-center">Nothing is deleted.</p>}
            </>
          )}
        </div>

        {showExport && (
          <ExportModal
            project={DB.getProject(projectId) || project}
            onClose={() => setShowExport(false)}
            onDone={handleExportDone}
          />
        )}
        {showExportPts && <ExportPointsModal projectId={projectId} onClose={() => setShowExportPts(false)} />}
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────────────────────

  function HomePage({ installPrompt, onInstalled }) {
    const [projects, setProjects] = useState([]);
    const [showNew, setShowNew] = useState(false);
    const [showDataMgr, setShowDataMgr] = useState(false);
    const [delTarget, setDelTarget] = useState(null);
    const [pendingImport, setPendingImport] = useState(null);
    const [actionTarget, setActionTarget] = useState(null); // project object
    const [archivedOpen, setArchivedOpen] = useState(() => {
      try { return localStorage.getItem('fb_archivedOpen') === '1'; } catch { return false; }
    });
    const toast = useToast();
    const delModalRef = useRef(null);
    const importInputRef = useRef(null);
    useFocusTrap(delModalRef, !!delTarget, () => setDelTarget(null));

    useEffect(() => { setProjects(DB.getProjects()); }, []);

    function handleCreate(proj) {
      setShowNew(false);
      setProjects(DB.getProjects());
      navigate(`#/project/${proj.id}`);
    }

    function handleImportFileChange(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (data.type !== 'fieldbook_project_export') {
            toast.error('Not a valid .fieldbook file');
            return;
          }
          setPendingImport(data);
        } catch {
          toast.error('Could not read file — invalid format');
        }
      };
      reader.readAsText(file);
      // Reset so the same file can be re-selected if needed
      e.target.value = '';
    }

    function handleImported(newProject) {
      setPendingImport(null);
      setProjects(DB.getProjects());
      toast.success(`"${newProject.name}" imported`);
      navigate(`#/project/${newProject.id}`);
    }

    function confirmDelete() {
      DB.deleteProject(delTarget);
      setProjects(DB.getProjects());
      setDelTarget(null);
    }

    function handleRename(p) {
      const name = window.prompt('Rename project:', p.name);
      if (name && name.trim() && name.trim() !== p.name) {
        DB.updateProject(p.id, { name: name.trim() });
        setProjects(DB.getProjects());
        toast.success('Project renamed');
      }
    }

    function handleDuplicate(p) {
      DB.duplicateProject(p.id);
      setProjects(DB.getProjects());
      toast.success(`"${p.name}" duplicated`);
    }

    function handleArchive(p) {
      const archiving = !p.archived;
      DB.setProjectArchived(p.id, archiving);
      setProjects(DB.getProjects());
      toast.success(archiving
        ? `"${p.name}" archived — find it under Archived at the bottom`
        : `"${p.name}" restored`);
    }

    function handleMove(p, dir) {
      DB.moveProject(p.id, dir);
      setProjects(DB.getProjects());
    }

    function toggleArchivedOpen() {
      setArchivedOpen(o => {
        try { localStorage.setItem('fb_archivedOpen', o ? '0' : '1'); } catch {}
        return !o;
      });
    }

    const active   = projects.filter(p => !p.archived);
    const archived = projects.filter(p => p.archived);
    const renderCard = (p, i, list) => (
      <ProjectCard key={p.id} project={p}
        canMoveUp={i > 0}
        canMoveDown={i < list.length - 1}
        onMoveUp={() => handleMove(p, -1)}
        onMoveDown={() => handleMove(p, 1)}
        onActions={() => setActionTarget(p)}
        onDelete={() => setDelTarget(p.id)}
        onRename={handleRename}
        onDuplicate={handleDuplicate}
        onArchive={handleArchive} />
    );

    return (
      <div className="flex flex-col h-full bg-fb-dark">
        <NavBar title="FieldBook"
          actions={
            <>
              {installPrompt && (
                <button
                  onClick={() => {
                    installPrompt.prompt();
                    installPrompt.userChoice.then(c => { if (c.outcome === 'accepted') onInstalled(); });
                  }}
                  className="p-2 rounded-xl active:bg-white/10 transition-colors"
                  title="Install FieldBook app"
                >
                  <Ico.Download />
                </button>
              )}
              <button onClick={() => importInputRef.current && importInputRef.current.click()} className="p-2 rounded-xl active:bg-white/10 transition-colors" title="Import project (.fieldbook)">
                <Ico.Upload />
              </button>
              <button onClick={() => setShowDataMgr(true)} className="p-2 rounded-xl active:bg-white/10 transition-colors" title="Data management">
                <Ico.Gear />
              </button>
              <button onClick={() => setShowNew(true)} className="p-2 rounded-xl bg-fb-mid active:bg-fb-light transition-colors">
                <Ico.Plus />
              </button>
            </>
          }
        />
        <div className="flex-1 overflow-y-auto flex flex-col" style={{ background: '#F4F0E8' }}>
          <div className="flex-1">
            {projects.length === 0
              ? <EmptyState onNew={() => setShowNew(true)} onImport={() => importInputRef.current && importInputRef.current.click()} />
              : (
                <div className="p-4 space-y-3 screen-enter">
                  <div className="flex items-center justify-between px-1 pt-1">
                    <p className="text-xs font-semibold text-fb-muted uppercase tracking-widest">
                      {active.length} Project{active.length !== 1 ? 's' : ''}
                    </p>
                    <button onClick={() => importInputRef.current && importInputRef.current.click()}
                      className="text-xs font-semibold px-3 py-2 rounded-lg active:opacity-70"
                      style={{ background: FBC.pageAlt, border: `1px solid ${FBC.border}`, color: FBC.heading }}>
                      ↓ Import Project
                    </button>
                  </div>
                  {active.length === 0 && (
                    <p className="text-sm text-fb-muted text-center py-6">No active projects.</p>
                  )}
                  {active.map(renderCard)}
                  {archived.length > 0 && (
                    <>
                      <button onClick={toggleArchivedOpen} aria-expanded={archivedOpen}
                        className="w-full flex items-center gap-2 px-1 pt-4 pb-1 text-xs font-semibold text-fb-muted uppercase tracking-widest active:opacity-60">
                        {archivedOpen ? <Ico.ChevDown /> : <Ico.ChevR />}
                        Archived ({archived.length})
                      </button>
                      {archivedOpen && archived.map(renderCard)}
                    </>
                  )}
                </div>
              )
            }
          </div>
          {/* Version footer — visible build stamp. Bump APP_VERSION + sw.js
              CACHE_NAME together on every deploy so Steve can confirm the
              installed PWA is on the new build. */}
          <footer style={{
            textAlign: 'center', padding: '16px 16px max(16px, env(safe-area-inset-bottom))',
            fontSize: 11, color: '#A0948A', fontFamily: FBF.sketch,
            letterSpacing: '0.05em',
          }}>
            FieldBook v{APP_VERSION}
          </footer>
        </div>

        <input
          ref={importInputRef}
          type="file"
          accept=".fieldbook,.fieldbook.json"
          style={{ display: 'none' }}
          onChange={handleImportFileChange}
        />

        {showNew && <NewProjectModal onClose={() => setShowNew(false)} onCreate={handleCreate} />}
        {showDataMgr && (
          <DataManagementModal onClose={() => setShowDataMgr(false)}
            onImportProject={() => { setShowDataMgr(false); importInputRef.current && importInputRef.current.click(); }} />
        )}
        {pendingImport && (
          <ImportProjectModal
            fileData={pendingImport}
            onClose={() => setPendingImport(null)}
            onImported={handleImported}
          />
        )}

        {actionTarget && (
          <ProjectActionsSheet
            project={actionTarget}
            onClose={() => setActionTarget(null)}
            onRename={p => { setActionTarget(null); handleRename(p); }}
            onDuplicate={p => { setActionTarget(null); handleDuplicate(p); }}
            onArchive={p => { setActionTarget(null); handleArchive(p); }}
            onDelete={p => { setActionTarget(null); setDelTarget(p.id); }}
          />
        )}

        {delTarget && (
          <div className="modal-backdrop" onClick={() => setDelTarget(null)}>
            <div ref={delModalRef} className="modal-sheet" onClick={e => e.stopPropagation()}>
              <div className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-5" />
              <h2 className="text-lg font-bold text-fb-dark mb-2">Delete Project?</h2>
              <p className="text-fb-muted text-sm mb-6">All pages and data will be permanently deleted.</p>
              <div className="flex gap-3">
                <button onClick={() => setDelTarget(null)} className="flex-1 py-3 rounded-xl border-2 border-gray-200 text-gray-600 font-semibold">Cancel</button>
                <button onClick={confirmDelete} className="flex-1 py-3 rounded-xl bg-red-500 text-white font-semibold">Delete</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  function ProjectCard({ project, canMoveUp, canMoveDown, onMoveUp, onMoveDown, onActions, onDelete, onRename, onDuplicate, onArchive }) {
    const pageCount = project.pages?.length || 0;

  function NewProjectModal({ onClose, onCreate }) {
    const [form, setForm] = useState({ name: '', jobNumber: '', client: '', surveyor: '' });
    const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
    const trapRef = useRef(null);
    useFocusTrap(trapRef, true, onClose);
    const toast = useToast();

    function handleCreate() {
      if (!form.name.trim()) return;
      const proj = DB.createProject({
        name: form.name.trim(),
        jobNumber: form.jobNumber.trim(),
        client: form.client.trim(),
        surveyor: form.surveyor.trim() || 'Surveyor',
        date: todayLocalISO(),
      });
      toast.success('Project created');
      onCreate(proj);
    }

    return (
      <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
        <div ref={trapRef} className="modal-sheet">
          <div className="w-10 h-1 bg-fb-border rounded-full mx-auto mb-5" />
          <h2 className="text-xl font-bold text-fb-dark mb-5">New Project</h2>

  // ─────────────────────────────────────────────────────────────────────────────
  // PROJECT PDF EXPORT — module-level helpers
  // ─────────────────────────────────────────────────────────────────────────────

  // Returns jsPDF font names for handwritten and monospace styles.
  // Custom TTF loading was removed — jsPDF's built-in font registration silently
  // stores broken entries for some TTFs and then crashes on pdf.text() with
  // "Cannot read properties of undefined (reading 'Unicode')". helvetica/courier
  // are jsPDF built-ins and always work.
  function _initPDFFonts() {
    return { hand: 'helvetica', handSt: 'bold', mono: 'courier', monoSt: 'normal' };
  }

  // Build an SVG string from stored sketch page data.
  // Uses window._fbSketchUtils (exposed by sketch.js) for arc/path geometry,
  // and dimension formatting. The PDF draws its own scale bar and north arrow.
  function buildSketchSVG(shapes, layers, viewBox, scaleDenom, units, showDims = true, transparent = false, imageMap = {}) {
    const utils = window._fbSketchUtils;
    if (!utils) return null;
    const { arcPath: _arc, pathToSVGD: _pathD, computeArcFromPI: _cArc,
            fmtPxAsReal: _fmt, normAng: _norm, toDMS: _toDMS } = utils;

    const vb = viewBox || { x: 0, y: 0, w: 800, h: 600 };
    const sd = scaleDenom || 1;
    const un = units || 'm';
    const outW = 1200;
    const outH = Math.round(outW * vb.h / vb.w);
    // ps: viewBox units per output pixel — used to scale all overlay elements
    const ps = vb.w / outW;
    // Text on paper needs a boost: 9.5 output px is only ~4 pt on a letter page.
    // tps is used for font sizes only — geometry, symbols and strokes stay on ps.
    const tps = ps * 1.7;
    let _fm = 1;   // per-shape text size multiplier (s.fontSize), set by _dimsSVG

    const visLayers = new Set((layers || []).filter(l => l.visible !== false).map(l => l.id));
    const defaultLayerId = fbGnss.baseLayerId(layers);

    // ── SVG text element with white halo (matches screen rendering) ──────────
    function _dimSVG(lx, ly, angle, text) {
      const a = angle || 0;
      const rot = a ? ` transform="rotate(${a.toFixed(2)},${lx.toFixed(2)},${ly.toFixed(2)})"` : '';
      const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return `<text x="${lx.toFixed(2)}" y="${ly.toFixed(2)}"${rot} font-size="${(9.5*tps*_fm).toFixed(2)}" font-family="Courier New,monospace" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="#FFFFFF" stroke-width="${(2.2*tps).toFixed(2)}" style="pointer-events:none;user-select:none;paint-order:stroke fill;">${esc(text)}</text>`;
    }

    // ── Rotate a point around a pivot ────────────────────────────────────────
    function _rotPt(x, y, cx, cy, deg) {
      const r = deg * Math.PI / 180;
      const c = Math.cos(r), s = Math.sin(r);
      return { x: cx + (x-cx)*c - (y-cy)*s, y: cy + (x-cx)*s + (y-cy)*c };
    }

    // ── Dimension labels for a single shape (SVG string) ─────────────────────
    function _dimsSVG(s) {
      if (s._hideDims) return '';
      const rot = s._rot || 0;
      _fm = s.fontSize || 1.0;
      const OFF = (15 + 6 * (_fm - 1)) * ps;

      // Pivot for rotation
      let piv;
      if (s._pivot) { piv = s._pivot; }
      else switch (s.type) {
        case 'line':   piv = { x:(s.x1+s.x2)/2, y:(s.y1+s.y2)/2 }; break;
        case 'circle': piv = { x:s.cx, y:s.cy };                     break;
        case 'rect':   piv = { x:s.x+s.w/2, y:s.y+s.h/2 };          break;
        default:       piv = { x:s.x||0, y:s.y||0 };
      }

      // Rotate anchor then emit text at that world position
      function D(rawX, rawY, ang, txt) {
        const { x: lx, y: ly } = rot ? _rotPt(rawX, rawY, piv.x, piv.y, rot) : { x:rawX, y:rawY };
        return _dimSVG(lx, ly, _norm(ang + rot), txt);
      }

      // NTS label override
      if (s.ntsLabel) {
        let nx = 0, ny = 0;
        switch (s.type) {
          case 'line':   nx=(s.x1+s.x2)/2; ny=(s.y1+s.y2)/2; break;
          case 'circle': nx=s.cx;           ny=s.cy;           break;
          case 'rect':   nx=s.x+s.w/2;     ny=s.y+s.h/2;     break;
          default:       return '';
        }
        return _dimSVG(nx, ny, 0, s.ntsLabel);
      }

      switch (s.type) {
        case 'line': {
          const len = Math.hypot(s.x2-s.x1, s.y2-s.y1);
          if (len < 5*ps) return '';
          const mx=(s.x1+s.x2)/2, my=(s.y1+s.y2)/2;
          const nx=-(s.y2-s.y1)/len, ny=(s.x2-s.x1)/len;
          const ang = Math.atan2(s.y2-s.y1, s.x2-s.x1)*180/Math.PI;
          const az  = ((Math.atan2(s.x2-s.x1, -(s.y2-s.y1))*180/Math.PI) + rot + 360) % 360;
          return D(mx+nx*OFF, my+ny*OFF, ang, _fmt(len, sd, un))
               + D(mx-nx*OFF, my-ny*OFF, ang, _toDMS(az));
        }
        case 'curve': {
          const px = s.px !== undefined ? s.px : (s.x1+s.x2)/2;
          const py = s.py !== undefined ? s.py : (s.y1+s.y2)/2;
          const cp = _cArc(s.x1, s.y1, s.x2, s.y2, px, py);
          if (!cp || cp.L < 5*ps) return '';
          const mx=(s.x1+s.x2)/2, my=(s.y1+s.y2)/2;
          const olen = Math.hypot(px-mx, py-my) || 1;
          const ux=(px-mx)/olen, uy=(py-my)/olen;
          const lx1=mx+(cp.M+OFF)*ux,       ly1=my+(cp.M+OFF)*uy;
          const lx2=mx+(cp.M+OFF+10*tps*_fm)*ux, ly2=my+(cp.M+OFF+10*tps*_fm)*uy;
          const r0 = rot ? _rotPt(lx1, ly1, piv.x, piv.y, rot) : { x:lx1, y:ly1 };
          const r1 = rot ? _rotPt(lx2, ly2, piv.x, piv.y, rot) : { x:lx2, y:ly2 };
          return _dimSVG(r0.x, r0.y, 0, `L ${_fmt(cp.L, sd, un)}`)
               + _dimSVG(r1.x, r1.y, 0, `R ${_fmt(cp.R, sd, un)}`);
        }
        case 'circle':
          if (s.r < 5*ps) return '';
          return D(s.cx, s.cy + s.r*0.25, 0, `R=${_fmt(s.r, sd, un)}`);
        case 'rect':
          return D(s.x+s.w/2,     s.y+s.h+OFF, 0,   _fmt(Math.abs(s.w), sd, un))
               + D(s.x+s.w+OFF,   s.y+s.h/2,   -90, _fmt(Math.abs(s.h), sd, un));

        // ── Dimension shape labels ──────────────────────────────────────────
        case 'dim-linear': {
          if (!s.p1||!s.p2) return '';
          const dlLen=Math.hypot(s.p2.x-s.p1.x,s.p2.y-s.p1.y);
          if (dlLen<5*ps) return '';
          const dlOff=s.offset||0;
          const dlpX=-(s.p2.y-s.p1.y)/dlLen, dlpY=(s.p2.x-s.p1.x)/dlLen;
          const mx=(s.p1.x+s.p2.x)/2+dlpX*dlOff, my=(s.p1.y+s.p2.y)/2+dlpY*dlOff;
          const ang=Math.atan2(s.p2.y-s.p1.y,s.p2.x-s.p1.x)*180/Math.PI;
          return _dimSVG(mx,my,_norm(ang),s.ntsLabel?s.ntsLabel:_fmt(dlLen,sd,un));
        }
        case 'dim-angle': {
          if (!s.line1Id||!s.line2Id) return '';
          const dal1=(shapes||[]).find(sh=>sh.id===s.line1Id&&sh.type==='line');
          const dal2=(shapes||[]).find(sh=>sh.id===s.line2Id&&sh.type==='line');
          if (!dal1||!dal2) return '';
          const daInt=_liIntersect(dal1.x1,dal1.y1,dal1.x2,dal1.y2,dal2.x1,dal2.y1,dal2.x2,dal2.y2);
          if (!daInt) return '';
          let daa1=_dimArmAng(dal1.x1,dal1.y1,dal1.x2,dal1.y2,daInt.x,daInt.y);
          let daa2=_dimArmAng(dal2.x1,dal2.y1,dal2.x2,dal2.y2,daInt.x,daInt.y);
          let daDelta=((daa2-daa1)+2*Math.PI)%(2*Math.PI);
          if (daDelta>Math.PI){const t=daa1;daa1=daa2;daa2=t;daDelta=2*Math.PI-daDelta;}
          const midAng=(daa1+daDelta/2)+(s.flip?Math.PI:0);
          const angleDeg=s.flip?(360-daDelta*180/Math.PI):(daDelta*180/Math.PI);
          const arcRA=(s.scale||1.0)*40*ps;
          const lx=daInt.x+Math.cos(midAng)*(arcRA+30*ps);
          const ly=daInt.y+Math.sin(midAng)*(arcRA+30*ps);
          return _dimSVG(lx,ly,_norm(midAng*180/Math.PI),s.ntsLabel?s.ntsLabel:_toDMS(angleDeg));
        }
        case 'dim-bearing': {
          if (!s.p1||!s.p2||s.arrowOnly) return '';
          const dbLen=Math.hypot(s.p2.x-s.p1.x,s.p2.y-s.p1.y);
          if (dbLen<5*ps) return '';
          const bmx=(s.p1.x+s.p2.x)/2, bmy=(s.p1.y+s.p2.y)/2;
          const rawAz=((Math.atan2(s.p2.x-s.p1.x,-(s.p2.y-s.p1.y))*180/Math.PI)+360)%360;
          const lineAng=Math.atan2(s.p2.y-s.p1.y,s.p2.x-s.p1.x)*180/Math.PI;
          return _dimSVG(bmx,bmy,_norm(lineAng),s.ntsLabel?s.ntsLabel:_toDMS(rawAz));
        }
        case 'dim-radius': {
          const rrRef=(shapes||[]).find(sh=>sh.id===s.shapeId);
          if (!rrRef) return '';
          let rrcx,rrcy,rrR;
          if (rrRef.type==='circle') { rrcx=rrRef.cx;rrcy=rrRef.cy;rrR=rrRef.r; }
          else if (rrRef.type==='curve') {
            const rrpx=rrRef.px!==undefined?rrRef.px:(rrRef.x1+rrRef.x2)/2;
            const rrpy=rrRef.py!==undefined?rrRef.py:(rrRef.y1+rrRef.y2)/2;
            const rra=_cArc(rrRef.x1,rrRef.y1,rrRef.x2,rrRef.y2,rrpx,rrpy);
            if (!rra) return '';
            rrcx=rra.cx;rrcy=rra.cy;rrR=rra.R;
          } else return '';
          const rrOff=s.offset||{x:50*ps,y:-50*ps};
          const rrEx=rrcx+rrOff.x+14*ps, rrEy=rrcy+rrOff.y;
          return _dimSVG(rrEx,rrEy,0,s.ntsLabel?s.ntsLabel:`R ${_fmt(rrR,sd,un)}`);
        }

        default:
          return '';
      }
    }

    // ── Geometry helpers for dim shapes (inlined — not in _fbSketchUtils) ───────
    function _liIntersect(x1,y1,x2,y2,x3,y3,x4,y4) {
      const dx1=x2-x1,dy1=y2-y1,dx2=x4-x3,dy2=y4-y3;
      const denom=dx1*dy2-dy1*dx2;
      if (Math.abs(denom)<1e-10) return null;
      const t=((x3-x1)*dy2-(y3-y1)*dx2)/denom;
      return {x:x1+t*dx1,y:y1+t*dy1};
    }
