    function _dimArmAng(lx1,ly1,lx2,ly2,px,py) {
      const dx=lx2-lx1,dy=ly2-ly1,lenSq=dx*dx+dy*dy||1;
      const t=((px-lx1)*dx+(py-ly1)*dy)/lenSq;
      return t<=0.5 ? Math.atan2(dy,dx) : Math.atan2(-dy,-dx);
    }

    // ── Render shapes — in layer order (bottom to top), matching canvas draw order ──
    // Build a layer-index lookup so shapes can be sorted by their layer position.
    // Within each layer, shapes keep their original array order (stable sort).
    const _layerOrder = (layers || []).map(l => l.id);
    const _layerIdx = id => { const i = _layerOrder.indexOf(id); return i === -1 ? 0 : i; };
    const _sortedShapes = [...(shapes || [])].sort((a, b) => {
      const ai = _layerIdx(a.layerId || defaultLayerId);
      const bi = _layerIdx(b.layerId || defaultLayerId);
      return ai - bi;  // lower layer index = rendered first = appears behind
    });

    let shapesSVG = '';
    let dimsSVG   = '';

    for (const s of _sortedShapes) {
      const lid = s.layerId || defaultLayerId;
      if (lid && !visLayers.has(lid)) continue;
      if (s.visible === false) continue;  // per-shape visibility

      const stroke = s.stroke || FBC.cover;
      const sw     = (s.strokeWidth || 1.5) * ps;  // multiply by ps so lines match screen thickness
      const fill   = s.fill || 'none';
      const sOp    = s.strokeOpacity ?? 1;
      const fOp    = s.fillOpacity   ?? 1;
      const dashAttr = s.strokeDash
        ? ` stroke-dasharray="${s.strokeDash.replace(/[\d.]+/g, n => (parseFloat(n)*ps).toFixed(1))}"`
        : '';
      const base   = `stroke="${stroke}" stroke-width="${sw.toFixed(3)}" fill="${fill}" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="${sOp}" fill-opacity="${fOp}"${dashAttr}`;

      let el = '';
      switch (s.type) {
        case 'line':
          el = `<line x1="${s.x1}" y1="${s.y1}" x2="${s.x2}" y2="${s.y2}" ${base}/>`;
          break;
        case 'circle':
          el = `<circle cx="${s.cx}" cy="${s.cy}" r="${s.r}" ${base}/>`;
          break;
        case 'rect':
          el = `<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" ${base}/>`;
          break;
        case 'curve': {
          const px = s.px !== undefined ? s.px : (s.x1+s.x2)/2;
          const py = s.py !== undefined ? s.py : (s.y1+s.y2)/2;
          el = `<path d="${_arc(s.x1, s.y1, s.x2, s.y2, px, py)}" ${base}/>`;
          break;
        }
        case 'path': {
          const d = _pathD(s.nodes, s.closed);
          if (d) el = `<path d="${d}" ${base}/>`;
          break;
        }
        case 'image': {
          const imgUrl = s.dataUrl || imageMap[s.imageId];
          if (imgUrl) {
            const imgOp = s.strokeOpacity ?? s.fillOpacity ?? 1;
            el = `<image href="${imgUrl}" x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" preserveAspectRatio="none" opacity="${imgOp}"/>`;
          }
          break;
        }
        case 'text': {
          const sw = s.w || 180;
          const sh = s.h || 80;
          const tw = sw * ps;
          const th = sh * ps;
          const rx = s.x - tw / 2;
          const ry = s.y - th / 2;
          const fsMult = s.fontSize || 1.0;
          // Font uses tps; the box (and so the anchor + line breaks) stays on ps.
          const tFontSize = 9.5 * tps * fsMult;
          const tLineH = tFontSize * 1.55;
          const charW = 9.5 * 0.601;
          const maxChars = Math.max(1, Math.floor((sw - 6) / charW));
          const _wt = (utils && utils.wrapText) ? utils.wrapText : (t, n) => {
            const out = [];
            for (const para of t.split('\n')) {
              if (para.length <= n) { out.push(para); continue; }
              let rem = para;
              while (rem.length > n) { out.push(rem.slice(0, n)); rem = rem.slice(n); }
              out.push(rem);
            }
            return out;
          };
          const lines = _wt(s.content || '', maxChars);
          const hAlign = s.textAlign  || 'left';
          const vAlign = s.textVAlign || 'top';
          const pad    = 3 * ps;
          let tX;
          if (hAlign === 'center')     tX = rx + tw / 2;
          else if (hAlign === 'right') tX = rx + tw - pad;
          else                         tX = rx + pad;
          const anchor = hAlign === 'center' ? 'middle' : hAlign === 'right' ? 'end' : 'start';
          const totalH = lines.length * tLineH;
          let tY0;
          if (vAlign === 'middle')      tY0 = ry + (th - totalH) / 2 + tFontSize;
          else if (vAlign === 'bottom') tY0 = ry + th - totalH + tFontSize * 0.8;
          else                          tY0 = ry + tFontSize * 1.25;
          const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          const tspans = lines.map((ln, i) =>
            `<tspan x="${tX.toFixed(3)}" dy="${i === 0 ? '0' : tLineH.toFixed(3)}">${esc(ln) || '\u00a0'}</tspan>`
          ).join('');
          el = `<text x="${tX.toFixed(3)}" y="${tY0.toFixed(3)}" font-size="${tFontSize.toFixed(3)}" fill="${stroke}" font-family="Courier New,monospace" text-anchor="${anchor}">${tspans}</text>`;
          break;
        }
        // ── Dimension shapes ────────────────────────────────────────────────
        case 'dim-linear': {
          if (!s.p1 || !s.p2) break;
          const dlOff = s.offset || 0;
          const dlLen = Math.hypot(s.p2.x-s.p1.x, s.p2.y-s.p1.y);
          if (dlLen < 1) break;
          const dlpX = -(s.p2.y-s.p1.y)/dlLen, dlpY = (s.p2.x-s.p1.x)/dlLen;
          const dd1x = s.p1.x+dlpX*dlOff, dd1y = s.p1.y+dlpY*dlOff;
          const dd2x = s.p2.x+dlpX*dlOff, dd2y = s.p2.y+dlpY*dlOff;
          const dlGap=3*ps, dlExt=6*ps, dlAh=8*ps, dlAs=3*ps;
          const dludx=(s.p2.x-s.p1.x)/dlLen, dludy=(s.p2.y-s.p1.y)/dlLen;
          const mka=(ax,ay,dx,dy)=>
            `M ${ax-dx*dlAh*0.5+dy*dlAs} ${ay-dy*dlAh*0.5-dx*dlAs} L ${ax} ${ay} L ${ax-dx*dlAh*0.5-dy*dlAs} ${ay-dy*dlAh*0.5+dx*dlAs}`;
          el = `<g stroke="${stroke}" stroke-width="${(1.2*ps).toFixed(3)}" fill="none" stroke-linecap="round" stroke-linejoin="round">`+
            `<line x1="${s.p1.x+dlpX*dlGap}" y1="${s.p1.y+dlpY*dlGap}" x2="${dd1x+dlpX*dlExt}" y2="${dd1y+dlpY*dlExt}" stroke-width="${(0.9*ps).toFixed(3)}"/>`+
            `<line x1="${s.p2.x+dlpX*dlGap}" y1="${s.p2.y+dlpY*dlGap}" x2="${dd2x+dlpX*dlExt}" y2="${dd2y+dlpY*dlExt}" stroke-width="${(0.9*ps).toFixed(3)}"/>`+
            `<line x1="${dd1x}" y1="${dd1y}" x2="${dd2x}" y2="${dd2y}"/>`+
            `<path d="${mka(dd1x,dd1y,-dludx,-dludy)}"/><path d="${mka(dd2x,dd2y,dludx,dludy)}"/>`+
            `</g>`;
          break;
        }
        case 'dim-angle': {
          if (!showDims || s._hideDims) break;
          const dal1 = (shapes||[]).find(sh=>sh.id===s.line1Id&&sh.type==='line');
          const dal2 = (shapes||[]).find(sh=>sh.id===s.line2Id&&sh.type==='line');
          if (!dal1||!dal2) break;
          const daInt = _liIntersect(dal1.x1,dal1.y1,dal1.x2,dal1.y2,dal2.x1,dal2.y1,dal2.x2,dal2.y2);
          if (!daInt) break;
          let daa1=_dimArmAng(dal1.x1,dal1.y1,dal1.x2,dal1.y2,daInt.x,daInt.y);
          let daa2=_dimArmAng(dal2.x1,dal2.y1,dal2.x2,dal2.y2,daInt.x,daInt.y);
          let daDelta=((daa2-daa1)+2*Math.PI)%(2*Math.PI);
          if (daDelta>Math.PI){const t=daa1;daa1=daa2;daa2=t;}
          const daR=(s.scale||1.0)*40*ps;
          const daLg=s.flip?1:0, daSw=s.flip?0:1;
          const ax1=daInt.x+Math.cos(daa1)*daR, ay1=daInt.y+Math.sin(daa1)*daR;
          const ax2=daInt.x+Math.cos(daa2)*daR, ay2=daInt.y+Math.sin(daa2)*daR;
          el = `<path d="M ${ax1.toFixed(2)} ${ay1.toFixed(2)} A ${daR.toFixed(2)} ${daR.toFixed(2)} 0 ${daLg} ${daSw} ${ax2.toFixed(2)} ${ay2.toFixed(2)}" stroke="${stroke}" stroke-width="${(1.2*ps).toFixed(3)}" fill="none" stroke-linecap="round"/>`;
          break;
        }
        case 'dim-bearing': {
          if (!s.p1||!s.p2) break;
          const dbLen=Math.hypot(s.p2.x-s.p1.x,s.p2.y-s.p1.y);
          if (dbLen<1) break;
          const dbUx=(s.p2.x-s.p1.x)/dbLen, dbUy=(s.p2.y-s.p1.y)/dbLen;
          const dbAh=8*ps, dbAs=3*ps;
          const mkba=(ax,ay,dx,dy)=>
            `M ${ax-dx*dbAh*0.5+dy*dbAs} ${ay-dy*dbAh*0.5-dx*dbAs} L ${ax} ${ay} L ${ax-dx*dbAh*0.5-dy*dbAs} ${ay-dy*dbAh*0.5+dx*dbAs}`;
          el = `<g stroke="${stroke}" stroke-width="${(1.2*ps).toFixed(3)}" fill="none" stroke-linecap="round" stroke-linejoin="round">`+
            `<line x1="${s.p1.x}" y1="${s.p1.y}" x2="${s.p2.x}" y2="${s.p2.y}"/>`+
            `<path d="${mkba(s.p2.x,s.p2.y,dbUx,dbUy)}"/>`+
            `</g>`;
          break;
        }
        case 'dim-radius': {
          const rrRef=(shapes||[]).find(sh=>sh.id===s.shapeId);
          if (!rrRef) break;
          let rrcx,rrcy,rrR;
          if (rrRef.type==='circle') {
            rrcx=rrRef.cx; rrcy=rrRef.cy; rrR=rrRef.r;
          } else if (rrRef.type==='curve') {
            const rrpx=rrRef.px!==undefined?rrRef.px:(rrRef.x1+rrRef.x2)/2;
            const rrpy=rrRef.py!==undefined?rrRef.py:(rrRef.y1+rrRef.y2)/2;
            const rra=_cArc(rrRef.x1,rrRef.y1,rrRef.x2,rrRef.y2,rrpx,rrpy);
            if (!rra) break;
            rrcx=rra.cx; rrcy=rra.cy; rrR=rra.R;
          } else break;
          const rrOff=s.offset||{x:50*ps,y:-50*ps};
          const rrEx=rrcx+rrOff.x, rrEy=rrcy+rrOff.y;
          const rrLL=Math.hypot(rrOff.x,rrOff.y)||1;
          const rrUx=rrOff.x/rrLL, rrUy=rrOff.y/rrLL;
          const rrSx=rrcx+rrUx*rrR, rrSy=rrcy+rrUy*rrR;
          el = `<g stroke="${stroke}" stroke-width="${(1.2*ps).toFixed(3)}" fill="none" stroke-linecap="round">`+
            `<line x1="${rrSx.toFixed(2)}" y1="${rrSy.toFixed(2)}" x2="${rrEx.toFixed(2)}" y2="${rrEy.toFixed(2)}"/>`+
            `<line x1="${rrEx.toFixed(2)}" y1="${rrEy.toFixed(2)}" x2="${(rrEx+12*ps).toFixed(2)}" y2="${rrEy.toFixed(2)}"/>`+
            `</g>`;
          break;
        }
        case 'point': {
          // Point symbol — constant screen-size elements scaled by ps
          const r = 13 * ps;
          const sw = (s.strokeWidth || 1.5) * ps;
          const stroke = s.stroke || FBC.cover;
          const cx = s.x, cy = s.y;
          const sym = s.symbol || 'survey';
          let symEl = '';
          switch (sym) {
            case 'survey':
              symEl = `<circle cx="${cx}" cy="${cy}" r="${r}" stroke="${stroke}" stroke-width="${sw}" fill="none"/>` +
                      `<circle cx="${cx}" cy="${cy}" r="${(r*0.35).toFixed(2)}" fill="${stroke}" stroke="none"/>`;
              break;
            case 'dot':
              symEl = `<circle cx="${cx}" cy="${cy}" r="${(r*0.35).toFixed(2)}" fill="${stroke}" stroke="none"/>`;
              break;
            case 'x': {
              const d = r * 0.7;
              symEl = `<line x1="${(cx-d).toFixed(2)}" y1="${(cy-d).toFixed(2)}" x2="${(cx+d).toFixed(2)}" y2="${(cy+d).toFixed(2)}" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round"/>` +
                      `<line x1="${(cx+d).toFixed(2)}" y1="${(cy-d).toFixed(2)}" x2="${(cx-d).toFixed(2)}" y2="${(cy+d).toFixed(2)}" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round"/>`;
              break;
            }
            case 'cross': {
              const d = r * 0.7;
              symEl = `<line x1="${cx}" y1="${(cy-d).toFixed(2)}" x2="${cx}" y2="${(cy+d).toFixed(2)}" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round"/>` +
                      `<line x1="${(cx-d).toFixed(2)}" y1="${cy}" x2="${(cx+d).toFixed(2)}" y2="${cy}" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round"/>`;
              break;
            }
            case 'square': {
              const h = (r * 0.7).toFixed(2);
              symEl = `<rect x="${(cx-h)}" y="${(cy-h)}" width="${(h*2)}" height="${(h*2)}" stroke="${stroke}" stroke-width="${sw}" fill="none"/>`;
              break;
            }
            case 'triangle': {
              const h = r;
              const pts = `${cx},${(cy-h)} ${(cx-h*0.866)},${(cy+h*0.5)} ${(cx+h*0.866)},${(cy+h*0.5)}`;
              symEl = `<polygon points="${pts}" stroke="${stroke}" stroke-width="${sw}" fill="none" stroke-linejoin="round"/>`;
              break;
            }
            case 'tri-down': {
              const h = r;
              const pts = `${cx},${(cy+h)} ${(cx-h*0.866)},${(cy-h*0.5)} ${(cx+h*0.866)},${(cy-h*0.5)}`;
              symEl = `<polygon points="${pts}" stroke="${stroke}" stroke-width="${sw}" fill="none" stroke-linejoin="round"/>`;
              break;
            }
            case 'diamond': {
              const pts = `${cx},${(cy-r)} ${(cx+r)},${cy} ${cx},${(cy+r)} ${(cx-r)},${cy}`;
              symEl = `<polygon points="${pts}" stroke="${stroke}" stroke-width="${sw}" fill="none" stroke-linejoin="round"/>`;
              break;
            }
            case 'circle':
            default:
              symEl = `<circle cx="${cx}" cy="${cy}" r="${r}" stroke="${stroke}" stroke-width="${sw}" fill="none"/>`;
              break;
          }
          el = `<g>${symEl}</g>`;

          // Labels stacked below symbol
          const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          const pfm = s.fontSize || 1.0;   // text size multiplier — labels only, not the symbol
          const lfs = (9.5 * tps * pfm).toFixed(2);
          const lStep = 11 * tps * pfm;
          let labels = [];
          if (s.showNum     && s.ptNum)    labels.push(esc(s.ptNum));
          if (s.showNorthing && s.northing) labels.push('N ' + esc(s.northing));
          if (s.showEasting  && s.easting)  labels.push('E ' + esc(s.easting));
          if (s.showElev     && s.elev)     labels.push('Z ' + esc(s.elev));
          if (s.showDesc     && s.desc)     labels.push(esc(s.desc));
          let startY = cy + r + 5 * ps + 9 * tps * pfm;
          labels.forEach(txt => {
            el += `<text x="${cx}" y="${startY.toFixed(2)}" font-size="${lfs}" font-family="Courier New,monospace" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="#FFFFFF" stroke-width="${(2.2*tps).toFixed(2)}" paint-order="stroke fill" style="pointer-events:none;user-select:none;">${txt}</text>`;
            startY += lStep;
          });
          // Points don't use _rot and are never added to dimsSVG
          shapesSVG += el;
          continue; // skip the rotation + _dimsSVG logic below
        }
      }
      if (!el) continue;

      if (s._rot) {
        let px, py;
        if (s._pivot) { px = s._pivot.x; py = s._pivot.y; }
        else switch (s.type) {
          case 'line':   px=(s.x1+s.x2)/2; py=(s.y1+s.y2)/2; break;
          case 'circle': px=s.cx;           py=s.cy;           break;
          case 'rect':
          case 'image':  px=s.x+s.w/2;     py=s.y+s.h/2;     break;   // same pivot the canvas uses
          default:       px=s.x||0;         py=s.y||0;
        }
        el = `<g transform="rotate(${s._rot},${px},${py})">${el}</g>`;
      }
      shapesSVG += el;
      if (showDims) dimsSVG += _dimsSVG(s);
    }

    const bgAttr = transparent ? '' : ` style="background:${FBC.page};"`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" width="${outW}" height="${outH}"${bgAttr}>${shapesSVG}${dimsSVG}</svg>`;
  }

  // The aerial image a sketch page is showing, if any (its layer can be hidden).
  function _sketchAerial(page) {
    const layers = page.layers || [];
    return (page.shapes || []).find(s => s.aerial && s.visible !== false
      && layers.find(l => l.id === s.layerId)?.visible !== false) || null;
  }
  // Imagery credit, small, with its left end at (x, y) — printed wherever a
  // sketch that shows an aerial image is drawn. The provider's terms need it.
  function _pdfAerialCredit(pdf, page, x, y) {
    const a = _sketchAerial(page);
    if (!a) return;
    const credit = a.aerial.attribution || fbGnss.SAT_ATTRIBUTION;
    pdf.setFontSize(5.5); pdf.setFont('helvetica', 'normal');
    pdf.setFillColor(255, 255, 255);
    pdf.rect(x - 0.8, y - 2.2, pdf.getTextWidth(credit) + 1.6, 3, 'F');
    pdf.setTextColor(60, 60, 60);
    pdf.text(credit, x, y);
  }

  // Draw the notebook-style page header on the current jsPDF page.
  // Returns the y coordinate where content should start below the header.
  // Helvetica has no prime or minus glyphs — swap them for their plain forms.
  const _pdfPlain = v => String(v ?? '').replace(/[′’]/g, "'").replace(/[″”]/g, '"').replace(/−/g, '-');

  // Body of a notes page, from contentY down, running on to new sheets. Headings
  // print bold and larger, list lines with their markers (notesHtmlToLines).
  function _pdfNotesBody(pdf, page, { W, H, margin, contentY }) {
    const lines = notesHtmlToLines(page.notesHtml);
    if (!lines.length) {
      pdf.setTextColor(150, 150, 150); pdf.setFontSize(9);
      pdf.text('(No notes)', W/2, contentY + 20, { align: 'center' });
      return;
    }
    const STYLE = [{ size: 10, face: 'normal', step: 5.5 }, { size: 13, face: 'bold', step: 7 }, { size: 11, face: 'bold', step: 6.2 }];
    let ny = contentY + 6;
    const fits = () => { if (ny > H - margin - 14) { pdf.addPage(); ny = margin + 6; } };
    pdf.setTextColor(28, 28, 28);
    for (const l of lines) {
      if (l.rule) {
        fits();
        pdf.setDrawColor(150, 150, 150); pdf.setLineWidth(0.2);
        pdf.line(margin, ny - 2, W - margin, ny - 2);
        ny += 3;
        continue;
      }
      if (!l.text) { ny += 3; continue; }
      const st = STYLE[l.head || 0];
      pdf.setFont('helvetica', st.face);
      pdf.setFontSize(st.size);
      for (const ln of pdf.splitTextToSize(_pdfPlain(l.text), W - margin * 2)) {
        fits();
        pdf.text(ln, margin, ny);
        ny += st.step;
      }
    }
  }

  function _pdfPageHeader(pdf, page, meta, W, H, margin, F) {
    const _F = F || { hand: 'helvetica', handSt: 'bold', mono: 'courier', monoSt: 'normal' };

    // White page background
    pdf.setFillColor(255, 255, 255);
    pdf.rect(0, 0, W, H, 'F');

    // Light grey header band
    pdf.setFillColor(236, 236, 236);
    pdf.roundedRect(margin, margin, W - 2*margin, 20, 4, 4, 'F');
    pdf.rect(margin, margin + 10, W - 2*margin, 10, 'F');
    // Thin rule at bottom of header band
    pdf.setDrawColor(180, 180, 180);
    pdf.setLineWidth(0.6);
    pdf.line(margin, margin + 20, W - margin, margin + 20);

    // Page title
    const titleStr = page.title?.trim() || '(Untitled)';
    pdf.setFontSize(11);
    pdf.setFont('helvetica', 'bold');
    pdf.setTextColor(30, 30, 30);
    const titleLines = pdf.splitTextToSize(titleStr, W - margin*2 - 50);
    pdf.text(titleLines[0], margin + 4, margin + 13);

    // Date / weather on the right in header
    const dateStr = [page.date, page.weather].filter(Boolean).join('  ·  ');
    if (dateStr) {
      pdf.setFontSize(7.5);
      pdf.setFont(_F.mono, _F.monoSt);
      pdf.setTextColor(110, 110, 110);
      pdf.text(dateStr, W - margin - 4, margin + 13, { align: 'right' });
    }

    let y = margin + 20 + 3;

    // Notes band (non-title pages only) — drawn inside the cream rect
    if (page.notes?.trim() && page.type !== 'title') {
      const noteLines = pdf.splitTextToSize(page.notes.trim(), W - 2*margin - 18);
      const noteH = noteLines.length * 4.5 + 8;
      pdf.setFillColor(246, 246, 246);
      pdf.rect(margin, y, W - 2*margin, noteH, 'F');
      pdf.setDrawColor(200, 200, 200);
      pdf.setLineWidth(0.3);
      pdf.line(margin, y, W - margin, y);
      pdf.line(margin, y + noteH, W - margin, y + noteH);
      // "Notes:" label
      pdf.setFontSize(6.5);
      pdf.setFont('helvetica', 'bold');
      pdf.setTextColor(107, 114, 128);
      pdf.text('NOTES', margin + 4, y + 5.5);
      // Notes text
      pdf.setFontSize(8);
      pdf.setFont(_F.mono, _F.monoSt);
      pdf.setTextColor(44, 44, 44);
      pdf.text(noteLines, margin + 18, y + 5.5);
      y += noteH + 2;
    }

    return y;
  }

  // ── SKETCH SHEETS ──────────────────────────────────────────────────────────

  // The view a sketch shows where only one is wanted (a GNSS station sketch and
  // its thumbnail): print area A when the sketch has one, else its saved view.
  function _sketchView(sp) {
    const a = fbPrint.primary(fbPrint.normalize(sp.printAreas));
    return a ? fbPrint.frameRect(a) : (sp.viewBox || { x: 0, y: 0, w: 800, h: 600 });
  }

  // Header of one print area's sheet: "Sketch title — Area B", with the frame's
  // scale in the title block. The notes band is left off — it would change the
  // shape of the drawing area the frame was fitted to (fbPrint.PAPER).
  function _pdfAreaHeader(pdf, page, area, meta, W, H, margin, F) {
    const y = _pdfPageHeader(pdf, { ...page, title: `${page.title?.trim() || 'Sketch'} — Area ${area.label}`, notes: '' }, meta, W, H, margin, F);
    const denom = fbPrint.frameScale(area, page.scaleDenom || 1, window._fbSketchUtils.PIXELS_PER_METER);
    pdf.setFontSize(8); pdf.setFont('helvetica', 'bold'); pdf.setTextColor(30, 30, 30);
    pdf.text(`Scale ${fbPrint.scaleText(denom).replace('≈', 'approx. ')}`, W - margin - 4, margin + 7, { align: 'right' });   // Helvetica has no ≈
    return y;
  }

  // Draw one sketch sheet below its header: the paper grid, the drawing cropped
  // to `view` (the page's saved view, or a print area), then the north arrow,
  // scale bar and imagery credit on top. `quiet` leaves an empty or failed
  // drawing blank instead of saying so.
  async function _pdfSketchSheet(pdf, page, view, imageMap, { W, H, margin, contentY, quiet }) {
    // Grid covers full content area
    if (page.showGrid !== false) _drawPdfGrid(pdf, W, H, margin, contentY);
    const drawH = (H - margin - 14) - contentY;
    const note = text => {
      if (quiet) return;
      pdf.setTextColor(150, 150, 150); pdf.setFontSize(9);
      pdf.text(text, W/2, contentY + drawH/2, { align: 'center' });
    };
    const svgStr = buildSketchSVG(page.shapes || [], page.layers, view, page.scaleDenom, page.units, page.showDims !== false, true, imageMap);
    if (!svgStr || !window.html2canvas) { note('(No drawing content)'); return; }
    const availW = W - margin*2;
    // Render at portrait proportions matching the PDF content area so the
    // drawing fills the full page height without clipping or tiny strips
    const pdfOutW = 1600;
    const pdfOutH = Math.round(pdfOutW * drawH / availW);
    // Rewrite the SVG's width/height to portrait proportions while keeping
    // the viewBox so content scales correctly via SVG's own aspect-ratio handling
    const svgForPDF = svgStr.replace(/width="\d+" height="\d+"/, `width="${pdfOutW}" height="${pdfOutH}"`);
    const tmp = document.createElement('div');
    tmp.style.cssText = `position:fixed;left:-9999px;top:-9999px;width:${pdfOutW}px;height:${pdfOutH}px;overflow:hidden;background:transparent;`;
    tmp.innerHTML = svgForPDF;
    document.body.appendChild(tmp);
    try {
      const canvas = await window.html2canvas(tmp, { scale: 1.2, useCORS: true, logging: false, width: pdfOutW, height: pdfOutH, backgroundColor: null });
      document.body.removeChild(tmp);
      // Place image filling the entire content area — use PNG to keep transparency so the grid shows through.
      // 'FAST' enables jsPDF's Flate compression on both the RGB image and its alpha SMask; without it jsPDF
      // stores the full 1920×2448 bitmap RAW (~14 MB) plus an uncompressed alpha mask (~5 MB) on EVERY export.
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', margin, contentY, availW, drawH, undefined, 'FAST');
      // North arrow and scale bar drawn directly in PDF (on top of sketch)
      if (page.showNorthArrow !== false) _drawPdfNorthArrow(pdf, W, margin);
      if (page.showScaleBar !== false) _drawPdfScaleBar(pdf, page.scaleDenom, page.units, W, H, margin, view?.w, availW);
      _pdfAerialCredit(pdf, page, margin + 2, contentY + drawH - 1.5);
    } catch {
      if (tmp.parentNode) document.body.removeChild(tmp);
      note('(Sketch render failed)');
    }
  }

  // ── PDF SKETCH OVERLAY HELPERS ─────────────────────────────────────────────

  // Draw a 5mm graph-paper grid over the content area of a notebook page.
  function _drawPdfGrid(pdf, W, H, margin, top) {
    const step = 5;
    const left = margin, right = W - margin;
    const bottom = H - margin;
    pdf.setDrawColor(200, 195, 185);
    pdf.setLineWidth(0.12);
    for (let x = left; x <= right + 0.01; x += step) {
      pdf.line(x, top, x, bottom);
    }
    for (let y = top; y <= bottom + 0.01; y += step) {
      pdf.line(left, y, right, y);
    }
  }

  // Draw a simple north arrow at the top-right of the content area.
  function _drawPdfNorthArrow(pdf, W, margin) {
    const cx = W - margin - 9;
    const cy = margin + 32;
    pdf.setDrawColor(40, 40, 40); pdf.setLineWidth(0.6);
    pdf.line(cx, cy + 6, cx, cy - 3);
    pdf.line(cx, cy - 3, cx - 2.5, cy + 1.5);
    pdf.line(cx, cy - 3, cx + 2.5, cy + 1.5);
    pdf.setFillColor(40, 40, 40);
    pdf.circle(cx, cy + 6, 0.9, 'F');
    pdf.setFontSize(7); pdf.setFont('helvetica', 'bold'); pdf.setTextColor(40, 40, 40);
    pdf.text('N', cx, cy - 5.5, { align: 'center' });
  }

  // Draw a map-style alternating scale bar at the bottom-right of the content area.
  // vbW  = page.viewBox.w in canvas pixels (how many px wide the sketch viewport is)
  // availW = PDF content width in mm (W - margin*2)
  // These two values are required to compute the physically correct bar width.
  //
  // The sketch uses PIXELS_PER_METER = 1000, so:
  //   pxToReal(px) = px * scaleDenom / 1000  (metres; × 3.28084 for feet)
  //   realToPx(v)  = v_metres * 1000 / scaleDenom
  //
  // On the printed page vbW canvas-pixels fill availW mm, so:
  //   barW_mm = realToPx(niceReal) × (availW / vbW)
  //
  // targetReal for a ~50 mm bar:
  //   realToPx(targetReal) × (availW / vbW) = 50
  //   → targetReal = 50 × vbW / availW × scaleDenom / 1000   (metres)
  function _drawPdfScaleBar(pdf, scaleDenom, units, W, H, margin, vbW, availW) {
    if (!scaleDenom || scaleDenom <= 1 || !vbW || !availW) return;
    const u = units === 'ft' ? 'ft' : 'm';

    // Real-world distance (in display units) that fills ~50 mm on paper
    let targetReal = 50 * (vbW / availW) * scaleDenom / 1000;
    if (units === 'ft') targetReal *= 3.28084;

    // Pick the largest nice value that stays within ~120 % of the target
    const niceVals = [0.1,0.2,0.5,1,2,5,10,25,50,100,150,200,250,500,1000,2000,5000];
    let niceReal = niceVals[0];
    for (const v of niceVals) {
      if (v <= targetReal * 1.2) niceReal = v;
      else break;
    }

    // Canvas pixels the bar represents, then convert to mm on the printed page
    const niceMetres = units === 'ft' ? niceReal / 3.28084 : niceReal;
    const barPx = niceMetres * 1000 / scaleDenom;   // canvas pixels
    const barW  = barPx * availW / vbW;              // mm on paper

    if (barW < 5 || barW > availW * 0.7) return;    // sanity guard

    // Choose nSegs so every tick label is a distinct whole number
    let nSegs = 5;
    for (const n of [5, 4, 2, 1]) {
      if (Number.isInteger(niceReal / n)) { nSegs = n; break; }
    }

    const barH = 3.5;
    const segW = barW / nSegs;
    const bx   = W - margin - 4 - barW;
    const by   = H - margin - 19;
    const dk   = [55, 55, 55];
    const wh   = [255, 255, 255];

    // Alternating filled / white segments
    for (let i = 0; i < nSegs; i++) {
      pdf.setFillColor(...(i % 2 === 0 ? dk : wh));
      pdf.rect(bx + i * segW, by, segW, barH, 'F');
    }

    // Outer border + internal dividers
    pdf.setDrawColor(...dk); pdf.setLineWidth(0.3);
    pdf.rect(bx, by, barW, barH, 'S');
    for (let i = 1; i < nSegs; i++) {
      pdf.line(bx + i * segW, by, bx + i * segW, by + barH);
    }

    // Tick labels — integer values, one per division
    pdf.setFontSize(5.5); pdf.setFont('helvetica', 'normal'); pdf.setTextColor(44, 44, 44);
    for (let i = 0; i <= nSegs; i++) {
      const val = Math.round((i / nSegs) * niceReal);
      pdf.text(String(val), bx + i * segW, by - 1, { align: 'center' });
    }

    // Unit label to the right of bar
    pdf.text(u, bx + barW + 2, by + barH - 0.5, { align: 'left' });
  }

  // ── GNSS OBS PAGE (3 PDF pages) ────────────────────────────────────────────

  // The notebook footer at the bottom of a content sheet: "Page n of N".
  function _pdfNotebookFooter(pdf, n, total, W, H, margin, exportTs) {
    pdf.setDrawColor(200, 200, 200); pdf.setLineWidth(0.3);
    pdf.line(margin + 4, H - margin - 10, W - margin - 4, H - margin - 10);
    pdf.setFontSize(7); pdf.setFont('helvetica', 'bold'); pdf.setTextColor(110, 110, 110);
    pdf.text(`Page ${n} of ${total}`, margin + 4, H - margin - 4);
    pdf.setFont('helvetica', 'normal'); pdf.setTextColor(150, 150, 150);
    pdf.text(`Exported  ${exportTs}`, W - margin - 4, H - margin - 4, { align: 'right' });
  }

  // Footer every content sheet once the whole document exists. Numbers count
  // the sheets of THIS PDF from `firstSheet` on — a GNSS page's three sheets and
  // each overflow sheet of a table count one each — never the notebook's own
  // page numbers, so an export of some pages reads as a complete document.
  // Returns the number of content sheets.
  function _pdfNumberSheets(pdf, firstSheet, W, H, margin, exportTs) {
    const last = pdf.getNumberOfPages(), total = last - firstSheet + 1;
    for (let s = firstSheet; s <= last; s++) {
      pdf.setPage(s);
      _pdfNotebookFooter(pdf, s - firstSheet + 1, total, W, H, margin, exportTs);
    }
    return total;
  }

  // Rasterise an SVG string to a PNG data URL — the same html2canvas route the
  // sketch pages take, so drawings print the way sketches do.
  async function _svgToPng(svgStr, pxW, pxH) {
    const sized = svgStr.replace(/width="[\d.]+" height="[\d.]+"/, `width="${pxW}" height="${pxH}"`);
    const tmp = document.createElement('div');
    tmp.style.cssText = `position:fixed;left:-9999px;top:-9999px;width:${pxW}px;height:${pxH}px;overflow:hidden;background:transparent;`;
    tmp.innerHTML = sized;
    document.body.appendChild(tmp);
    try {
      const canvas = await window.html2canvas(tmp, { scale: 1.2, useCORS: true, logging: false, width: pxW, height: pxH, backgroundColor: null });
      return canvas.toDataURL('image/png');
    } finally {
      if (tmp.parentNode) document.body.removeChild(tmp);
    }
  }

  function _imgSize(url) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload  = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
      img.onerror = () => resolve(null);
      img.src = url;
    });
  }

  // Title for one of a GNSS page's three PDF pages.
  function _gnssPdfTitle(page, part) {
    const stn = (page.gnss?.station || '').trim();
    return `${page.title?.trim() || (stn ? `Stn ${stn}` : 'GNSS Observation')} — ${part}`;
  }

  // Sketch pages that print inside a GNSS page of this export (as its station
  // sketch), and so are left out as pages of their own.
  function _sketchesInsideGnss(pages) {
    const ids = new Set();
    pages.forEach(p => {
      const sk = p.type === 'gnss' && p.gnss?.sketch;
      if (sk && sk.source === 'linked' && sk.linkedSketchPageId && !sk.ownPage) ids.add(sk.linkedSketchPageId);
    });
    return ids;
  }

  // Drawing helpers shared by the form-style PDF pages (GNSS Obs, Obstructions):
  // section rules, labelled fields on ruled lines, fine print and table styles.
  function _pdfFormKit(pdf, { W, margin, F }) {
    const L = margin, CW = W - margin * 2;
    const INK = [28, 28, 28], LBL = [100, 100, 100], RULE = [190, 190, 190], GD = [40, 40, 40];
    const safe = _pdfPlain;

    function section(y, text) {
      pdf.setFontSize(7.5); pdf.setFont('helvetica', 'bold'); pdf.setTextColor(...GD);
      pdf.text(text.toUpperCase(), L, y + 3);
      pdf.setDrawColor(120, 120, 120); pdf.setLineWidth(0.4);
      pdf.line(L, y + 4.5, L + CW, y + 4.5);
      return y + 8;
    }
    // A label over a value on a ruled line.
    function field(x, y, w, label, value, mono) {
      pdf.setFontSize(5.8); pdf.setFont('helvetica', 'bold'); pdf.setTextColor(...LBL);
      pdf.text(label.toUpperCase(), x, y + 2);
      const v = safe(value).trim();
      if (v) {
        pdf.setFontSize(9.5); pdf.setFont(mono ? F.mono : 'helvetica', mono ? F.monoSt : 'normal'); pdf.setTextColor(...INK);
        pdf.text(pdf.splitTextToSize(v, w - 1)[0], x, y + 6.3);
      }
      pdf.setDrawColor(...RULE); pdf.setLineWidth(0.25);
      pdf.line(x, y + 7.5, x + w, y + 7.5);
    }
    const ROW = 9, GAP = 4;
    // cells: [label, value, mono?, span?]
    function fieldRow(y, cells) {
      const n = cells.reduce((a, c) => a + (c[3] || 1), 0), unit = (CW - GAP * (n - 1)) / n;
      let x = L;
      cells.forEach(([label, value, mono, span = 1]) => {
        const w = unit * span + GAP * (span - 1);
        field(x, y, w, label, value, mono);
        x += w + GAP;
      });
      return y + ROW;
    }
    function fineText(str, x, y, opts = {}) {
      pdf.setFontSize(opts.size || 6.5); pdf.setFont('helvetica', opts.style || 'normal'); pdf.setTextColor(...(opts.color || LBL));
      pdf.text(str, x, y, opts.align ? { align: opts.align } : undefined);
    }
    // Largest rectangle of aspect iw:ih centred in a box.
    function fit(x, y, w, h, iw, ih) {
      const k = Math.min(w / iw, h / ih), fw = iw * k, fh = ih * k;
      return { x: x + (w - fw) / 2, y: y + (h - fh) / 2, w: fw, h: fh };
    }
    const tableBase = {
      theme: 'grid',
      styles: { fontSize: 7.5, cellPadding: 0.9, minCellHeight: 4.8, lineColor: RULE, lineWidth: 0.2, textColor: INK, valign: 'middle' },
      headStyles: { fillColor: GD, textColor: [255, 255, 255], font: 'helvetica', fontStyle: 'bold', halign: 'center', lineColor: GD },
    };
    // Rows of a table, padded with blank ruled rows up to `min`.
    const padRows = (rows, min, cols) => rows.concat(Array.from({ length: Math.max(0, min - rows.length) }, () => Array(cols).fill('')));
    const angle = (raw, pad) => {
      const t = String(raw ?? '').trim();
      if (!t) return '';
      const v = gnAngle(t);
      if (v === null || !Number.isFinite(v)) return safe(t);
      return (Number.isInteger(v) ? String(v).padStart(pad, '0') : String(Math.round(v * 100) / 100)) + '°';
    };
    const unit = (v, u) => (String(v ?? '').trim() ? `${String(v).trim()}${u}` : '');
    const wideMargin = { left: L, right: L, bottom: margin + 14 };
    // Obstruction rows with anything entered in them.
    const filledObstructions = list => list.filter(o => ['name', 'desc', 'fromAz', 'fromEl', 'toAz', 'toEl', 'comments'].some(k => String(o[k] ?? '').trim()));
    return { L, CW, INK, LBL, RULE, GD, safe, section, field, fieldRow, fineText, fit, tableBase, padRows, angle, unit, wideMargin, filledObstructions };
  }

  // Draw a GNSS Obs page: Observation Log (on the current PDF page, below its
  // header), then Station Sketch and Site Obstruction Diagram on two new pages.
  // Empty fields print as blank ruled lines so the sheets can be completed by
  // hand. The caller footers all three sheets (_pdfNumberSheets).
  async function _pdfGnssBody(pdf, page, proj, { W, H, margin, F, meta, contentY }) {
    const g   = fbGnss.normalize(page.gnss, { projectName: proj.name || '' });
    const res = fbGnss.solveHeights(g);
    const kit = _pdfFormKit(pdf, { W, margin, F });
    const { L, CW, INK, LBL, RULE, GD, safe, section, fieldRow, fineText, fit, tableBase, padRows, angle, unit, wideMargin } = kit;
    const f4 = v => fbGnss.fmt4(v);
    function nextPage(part) {
      pdf.addPage();
      return _pdfPageHeader(pdf, { ...page, title: _gnssPdfTitle(page, part), notes: '' }, meta, W, H, margin, F);
    }
    const filled = kit.filledObstructions(g.obstructions);
    const obsNo = o => String(g.obstructions.indexOf(o) + 1);    // matches the number on the sky plot
    const declApplied = fbGnss.plotNorth({ ref: g.bearingRef, declination: g.declination }).applied;

    // ═══ Page 1 — Observation Log ═══════════════════════════════════════════
    let y = section(contentY + 2, 'Project & Station');
    const autoJulian = fbGnss.julianDay(g.obsDate);
    const julian = g.julianManual ? g.julianDay : (autoJulian === null ? '' : String(autoJulian));
    [
      [['Project Name', g.projectName],                                   ['Project Section or Crew', g.section]],
      [['Receiver Model', g.receiverModel],                               ['Session Identifier', g.sessionId, true]],
      [['Receiver Serial No.', g.receiverSerial, true],                   ['Station Number / Name', g.station]],
      [['Receiver Software', g.receiverSoftware],                         ['Observation Date (UT)', g.obsDate, true]],
      [['Antenna Model', g.antenna?.name],                                ['Julian Day', julian, true]],
      [['Antenna Serial No.', g.antennaSerial, true],                     ['Operator(s)', g.operators]],
      [['Antenna Cable Length', g.cableLength.trim() ? `${g.cableLength.trim()} m` : '', true], ['Receiver File Name', g.fileName, true]],
    ].forEach(pair => { y = fieldRow(y, pair); });

    y = section(y + 1.5, 'Approx Position & Session');
    const ht = fbGeo.orthoHeight(fbGnss.num(g.pos.h), g.pos.lat, g.pos.lon);
    const posFrom = g.pos.source === 'phone'
      ? `Phone GPS${Number.isFinite(g.pos.acc) ? ` ±${g.pos.acc < 10 ? g.pos.acc.toFixed(1) : Math.round(g.pos.acc)} m` : ''}`
      : g.pos.source === 'manual' ? 'Entered by hand' : '';
    const duration = fbGnss.sessionDuration(g.startUT, g.stopUT);
    // Local clock time beside each UT time, in the page's zone; a local date
    // that isn't the UT observation date is marked (-1 d) / (+1 d).
    const zone = fbGnss.localZone(g.obsDate, g.tz);
    const localOf = ut => {
      const l = fbGnss.utToLocal(g.obsDate, ut, g.tz);
      return l ? l.time + (l.dayShift ? ` (${l.dayShift < 0 ? '-' : '+'}1 d)` : '') : '';
    };
    const method = g.method === 'Other' ? (g.methodOther.trim() ? `Other: ${g.methodOther.trim()}` : 'Other') : g.method;
    y = fieldRow(y, [
      ['Approx Lat', fbGnss.fmtLatLonDMS(g.pos.lat, 'lat'), true],
      ['Approx Long', fbGnss.fmtLatLonDMS(g.pos.lon, 'lon'), true],
      [ht.H === null ? 'Approx Ht — ellipsoidal (approx)' : 'Approx Ht — ellipsoidal', ht.h === null ? safe(g.pos.h) : `${ht.h.toFixed(1)} m`, true],
      ['Ht — orthometric (CGVD2013)', ht.H === null ? '' : `${ht.H.toFixed(1)} m`, true],
    ]);
    y = fieldRow(y, [
      [`Start Time (${zone})`, localOf(g.startUT), true], [`Stop Time (${zone})`, localOf(g.stopUT), true],
      ['Start Time (UT)', g.startUT, true], ['Stop Time (UT)', g.stopUT, true],
    ]);
    y = fieldRow(y, [
      ['Session Length', duration ? duration.text : '', true], ['Recording Interval', unit(g.interval, ' s'), true],
      ['Elev. Mask', unit(g.elevMask, '°'), true], ['PDOP', g.pdop, true],
    ]);
    y = fieldRow(y, [['Observation Method', method], ['Position From', posFrom]]);

    y = section(y + 1.5, 'Antenna Height');
    const top = y, drawW = 56, drawH = drawW * 330 / 240, colW = CW - drawW - 6;
    const A = g.antenna || {};
    const constLine = (label, value, mono) => {
      pdf.setFontSize(7.2); pdf.setFont('helvetica', 'normal'); pdf.setTextColor(...INK);
      pdf.text(label, L, y + 3);
      if (value) { pdf.setFont(mono ? F.mono : 'helvetica', mono ? F.monoSt : 'normal'); pdf.text(safe(value), L + colW, y + 3, { align: 'right' }); }
      pdf.setDrawColor(...RULE); pdf.setLineWidth(0.2);
      pdf.line(L, y + 4.2, L + colW, y + 4.2);
      y += 4.5;
    };
    [['Radius to slant mark (R)', A.R],
     ['Slant mark above ARP (d)', A.d],
     ['ARP to L1 phase centre', A.l1],
     ['ARP to L2 phase centre', A.l2],
    ].forEach(([label, v]) => constLine(label, f4(v) ? `${f4(v)} m` : '', true));
    constLine('Slant measure mark', A.slantMark || '');

    const READ = [['slant', 'before'], ['slant', 'after'], ['vert', 'before'], ['vert', 'after']];
    const reading = (set, part, i) => {
      const raw = String(g[set][part][i] ?? '').trim(), v = fbGnss.num(raw);
      return Number.isFinite(v) ? f4(v) : safe(raw);
    };
    const stat = (set, part, key) => f4(res[set][part]?.[key]);
    const tableMargin = { left: L, right: W - L - colW, bottom: wideMargin.bottom };
    pdf.autoTable({
      ...tableBase, startY: y, margin: tableMargin, tableWidth: colW,
      head: [[{ content: '', rowSpan: 2 }, { content: 'Slant (m)', colSpan: 2 }, { content: 'Vertical (m)', colSpan: 2 }],
             ['Before', 'After', 'Before', 'After']],
      body: [
        ...[0, 1, 2].map(i => [String(i + 1), ...READ.map(([s, p]) => reading(s, p, i))]),
        ['Avg',   ...READ.map(([s, p]) => stat(s, p, 'avg'))],
        ['Range', ...READ.map(([s, p]) => stat(s, p, 'range'))],
      ],
      styles: { ...tableBase.styles, halign: 'center', font: F.mono },
      columnStyles: { 0: { cellWidth: 14, font: 'helvetica', fontStyle: 'bold' } },
    });
    y = pdf.lastAutoTable.finalY + 2.5;
    pdf.autoTable({
      ...tableBase, startY: y, margin: tableMargin, tableWidth: colW,
      head: [['Heights (m)', 'Slant', 'Vertical']],
      // A value derived from the other method's readings prints grey with "calc".
      body: fbGnss.heightRows(res, { print: true }).map(r => [safe(r.label), ...[r.slant, r.vert].map(c =>
        !c ? '' : c.calc ? { content: `${f4(c.v)} calc`, styles: { textColor: LBL } } : f4(c.v))]),
      styles: { ...tableBase.styles, halign: 'center', font: F.mono },
      columnStyles: { 0: { halign: 'left', font: 'helvetica' }, 1: { cellWidth: 26 }, 2: { cellWidth: 26 } },
    });
    y = pdf.lastAutoTable.finalY + 3.2;
    const checks = [];
    if (res.diff !== null) checks.push(`Check: slant - vertical ARP = ${safe(fbGnss.fmtDiff(res.diff))} m`);
    [['slant', 'Slant'], ['vert', 'Vertical']].forEach(([set, name]) => {
      if (res[set].flag) checks.push(`${name} range ${f4(res[set].all.range)} m is over the ${f4(res.tol)} m tolerance`);
    });
    if (res.slantErr) checks.push(`Slant: ${res.slantErr}`);
    if (res.vertErr) checks.push(`Vertical: ${res.vertErr}`);
    if (res.slantNote?.tone === 'warn') checks.push(`Slant: ${res.slantNote.text}`);
    if (res.vertNote?.tone === 'warn') checks.push(`Vertical: ${res.vertNote.text}`);
    pdf.setFontSize(6.5); pdf.setFont('helvetica', 'normal');            // fineText's font, for the wrap width
    checks.flatMap(line => pdf.splitTextToSize(safe(line), colW))
      .forEach(line => { fineText(line, L, y, { color: INK }); y += 3.4; });

    // Antenna height drawing, beside the tables
    const dx = L + CW - drawW;
    try {
      const png = await _svgToPng(fbGnss.buildAntennaSVG(fbGnss.diagramValues(res), { print: true }), 720, 990);
      pdf.addImage(png, 'PNG', dx, top, drawW, drawH, undefined, 'FAST');
    } catch (err) {
      console.error('[pdf] antenna drawing failed:', err);
      fineText('(drawing could not be rendered)', dx + drawW / 2, top + drawH / 2, { align: 'center' });
    }
    pdf.setDrawColor(...RULE); pdf.setLineWidth(0.25);
    pdf.rect(dx, top, drawW, drawH, 'S');
    fineText('ANTENNA HEIGHT DRAWING', dx + drawW / 2, top + drawH + 3.2, { size: 5.8, style: 'bold', align: 'center' });

    // ═══ Page 2 — Station Sketch ════════════════════════════════════════════
    y = nextPage('Station Sketch') + 2;
    y = fieldRow(y, [['Station Number / Name', g.station], ['Observation Date (UT)', g.obsDate, true], ['Session Identifier', g.sessionId, true]]) + 2;

    const boxH = 118, pad = 1.5, sk = g.sketch;
    let sat = null;
    try { if (g.images.satellite?.photoRef) sat = await photoDB.get(g.images.satellite.photoRef); } catch {}
    const inset = !!(sk.inset && (sk.source === 'linked' || sk.source === 'photo') && sat);
    const insetW = 58, insetH = insetW * (g.images.satellite?.h || 3) / (g.images.satellite?.w || 4);
    const mainW = inset ? CW - insetW - pad * 3 : CW - pad * 2;
    const mainFit = (iw, ih) => fit(L + pad, y + pad, mainW, boxH - pad * 2, iw, ih);
    let boxNote = '';
    try {
      if (sk.source === 'linked') {
        const sp = (proj.pages || []).find(p => p.id === sk.linkedSketchPageId && p.type === 'sketch');
        if (!sp) boxNote = '(no sketch page linked)';
        else if (!(sp.shapes || []).length) boxNote = '(nothing drawn on the linked sketch)';
        else {
          const ids = sp.shapes.filter(s => s.type === 'image' && s.imageId).map(s => s.imageId);
          const imageMap = ids.length ? await photoDB.getMany(ids) : {};
          const vb = _sketchView(sp);      // print area A when the sketch has one
          const svg = buildSketchSVG(sp.shapes, sp.layers, vb, sp.scaleDenom, sp.units, sp.showDims !== false, true, imageMap);
          const r = mainFit(vb.w, vb.h);
          if (sp.showGrid !== false) {
            pdf.setDrawColor(200, 195, 185); pdf.setLineWidth(0.12);
            for (let gx = r.x; gx <= r.x + r.w + 0.01; gx += 5) pdf.line(gx, r.y, gx, r.y + r.h);
            for (let gy = r.y; gy <= r.y + r.h + 0.01; gy += 5) pdf.line(r.x, gy, r.x + r.w, gy);
          }
          pdf.addImage(await _svgToPng(svg, 1400, Math.round(1400 * vb.h / vb.w)), 'PNG', r.x, r.y, r.w, r.h, undefined, 'FAST');
          _pdfAerialCredit(pdf, sp, r.x + 1, r.y + r.h - 1);
        }
      } else if (sk.source === 'satellite') {
        if (sat) { const r = mainFit(g.images.satellite.w || 4, g.images.satellite.h || 3); pdf.addImage(sat, 'JPEG', r.x, r.y, r.w, r.h, undefined, 'FAST'); }
        else boxNote = '(no satellite image captured)';
      } else if (sk.source === 'photo') {
        const url = g.images.photo?.photoRef ? await photoDB.get(g.images.photo.photoRef) : null;
        const size = url ? await _imgSize(url) : null;
        if (size) { const r = mainFit(size.w, size.h); pdf.addImage(url, 'JPEG', r.x, r.y, r.w, r.h, undefined, 'FAST'); }
        else boxNote = '(no photo added)';
      }
    } catch (err) {
      console.error('[pdf] station sketch failed:', err);
      boxNote = '(sketch could not be rendered)';
    }
    if (inset) {
      const ix = L + CW - insetW - pad, iy = y + pad;
      pdf.addImage(sat, 'JPEG', ix, iy, insetW, insetH, undefined, 'FAST');
      pdf.setDrawColor(...GD); pdf.setLineWidth(0.3);
      pdf.rect(ix, iy, insetW, insetH, 'S');
      fineText('LOCATION', ix, iy + insetH + 3, { size: 5.8, style: 'bold' });
    }
    if (boxNote) fineText(boxNote, L + pad + mainW / 2, y + boxH / 2, { size: 8, align: 'center', color: [150, 150, 150] });
    pdf.setDrawColor(...GD); pdf.setLineWidth(0.4);
    pdf.rect(L, y, CW, boxH, 'S');
    y += boxH + 4;

    // Sketch notes — the text, or blank lines to write on
    pdf.setFontSize(5.8); pdf.setFont('helvetica', 'bold'); pdf.setTextColor(...LBL);
    pdf.text('SKETCH NOTES', L, y + 2);
    y += 6.5;
    const noteText = safe(sk.notes).trim();
    if (noteText) {
      pdf.setFontSize(9); pdf.setFont('helvetica', 'normal'); pdf.setTextColor(...INK);
      pdf.splitTextToSize(noteText, CW).slice(0, 6).forEach(line => { pdf.text(line, L, y); y += 4.4; });
      y += 1;
    } else {
      pdf.setDrawColor(...RULE); pdf.setLineWidth(0.25);
      for (let i = 0; i < 2; i++) { pdf.line(L, y, L + CW, y); y += 6.5; }
      y -= 3;
    }

    pdf.autoTable({
      ...tableBase, startY: y + 1, margin: wideMargin, tableWidth: CW,
      // Bearings as entered; they are only called magnetic when a declination turns them on the plot.
      head: [['#', 'Obstruction', 'Type / Description', `Bearing (from – to${declApplied ? ', magnetic' : ''})`, 'Comments']],
      body: padRows(filled.map(o => {
        const from = angle(o.fromAz, 3), to = angle(o.toAz, 3);
        return [obsNo(o), safe(o.name), safe(o.desc), from || to ? `${from}${to ? ` – ${to}` : ''}` : '', safe(o.comments)];
      }), 4, 5),
      columnStyles: { 0: { cellWidth: 9, halign: 'center' }, 1: { cellWidth: 38 }, 2: { cellWidth: 38 }, 3: { cellWidth: 40, font: F.mono, halign: 'center' } },
    });
    pdf.autoTable({
      ...tableBase, startY: pdf.lastAutoTable.finalY + 4, margin: wideMargin, tableWidth: CW,
      head: [[`Time (${zone})`, 'Time (UT)', 'General and weather observations']],
      body: padRows(g.observations.filter(o => String(o.time).trim() || String(o.text).trim())
        .map(o => [localOf(o.time), safe(o.time), safe(o.text)]), 4, 3),
      columnStyles: { 0: { cellWidth: 30, font: F.mono, halign: 'center' }, 1: { cellWidth: 24, font: F.mono, halign: 'center' } },
    });

    // ═══ Page 3 — Site Obstruction Diagram ══════════════════════════════════
    y = nextPage('Site Obstruction Diagram') + 2;
    y = fieldRow(y, [['Project Name', g.projectName], ['Station Number / Name', g.station], ['Observation Date (UT)', g.obsDate, true]]) + 3;
    await _pdfSkyPlotBlock(pdf, kit, y, g, F);
  }

  // The Site Obstruction Diagram: the sky plot and the numbered obstruction
  // table. `d` carries obstructions, bearingRef,
  // declination and elevMask — a GNSS page's data or a site page's.
  async function _pdfSkyPlotBlock(pdf, kit, y, d, F) {
    const { L, CW, safe, fineText, tableBase, padRows, angle, wideMargin } = kit;
    const obsNo = o => String(d.obstructions.indexOf(o) + 1);    // matches the number on the sky plot
    const plotW = 132, plotH = plotW * 344 / 320, px = L + (CW - plotW) / 2;
    try {
      const svg = fbGnss.buildSkyPlotSVG(d.obstructions, { print: true, ref: d.bearingRef, declination: d.declination, mask: d.elevMask, parse: gnAngle });
      pdf.addImage(await _svgToPng(svg, 1280, 1376), 'PNG', px, y, plotW, plotH, undefined, 'FAST');
    } catch (err) {
      console.error('[pdf] sky plot failed:', err);
      fineText('(sky plot could not be rendered)', L + CW / 2, y + plotH / 2, { size: 8, align: 'center' });
    }
    // The plot carries its own title (and the declination, when one is applied);
    // nothing else is written under it.
    y += plotH + 4;
    pdf.autoTable({
      ...tableBase, startY: y, margin: wideMargin, tableWidth: CW,
      head: [['#', 'Obstruction', 'Type / Description', 'From Az', 'Elev', 'To Az', 'Elev']],
      body: padRows(kit.filledObstructions(d.obstructions).map(o => [obsNo(o), safe(o.name), safe(o.desc), angle(o.fromAz, 3), angle(o.fromEl, 1), angle(o.toAz, 3), angle(o.toEl, 1)]), 6, 7),
      columnStyles: {
        0: { cellWidth: 9, halign: 'center' }, 1: { cellWidth: 44 },
        3: { cellWidth: 19, font: F.mono, halign: 'center' }, 4: { cellWidth: 16, font: F.mono, halign: 'center' },
        5: { cellWidth: 19, font: F.mono, halign: 'center' }, 6: { cellWidth: 16, font: F.mono, halign: 'center' },
      },
    });
  }

  // Header title of a stand-alone Obstructions page; untitled, it goes by its station.
  function _sitePdfTitle(page) {
    const stn = String(page.site?.station || '').trim();
    return page.title?.trim() || (stn ? `${stn} — Site Obstructions` : 'Site Obstructions');
  }

  // Body of a stand-alone Obstructions page, below its header: the page's own
  // fields, then the diagram and table exactly as page 3 of a GNSS Obs page.
  async function _pdfSiteBody(pdf, page, { W, margin, F, contentY }) {
    const s = fbGnss.normalizeSite(page.site);
    const kit = _pdfFormKit(pdf, { W, margin, F });
    const decl = fbGnss.num(s.declination);
    let y = kit.fieldRow(contentY + 2, [['Station / Point Name', s.station], ['Date', s.date, true], ['Observer', s.observer]]);
    y = kit.fieldRow(y, [
      ['Bearings are', s.bearingRef === 'true' ? 'True' : 'Magnetic'],
      ['Declination', Number.isFinite(decl) ? `${decl > 0 ? '+' : ''}${decl}°` : kit.unit(s.declination, '°'), true],
      ['Elevation Mask', kit.unit(s.elevMask, '°'), true],
    ]) + 3;
    await _pdfSkyPlotBlock(pdf, kit, y, s, F);
  }

  // "Dates & times" block of a Title page: created and survey date, then the
  // day's start, stop and worked-out duration. A blank field prints as a dash.
  // Shared by the whole-project and single-page exports. Returns the y below it.
  function _pdfTitleDates(pdf, page, proj, ty, W, H, margin) {
    const blockH = 30;
    if (ty > H - margin - blockH - 2) return ty;
    const GM = [120, 120, 120];
    const dur = fbGnss.dayDuration(page.startTime, page.stopTime);
    // 0805 saved before the field was left still prints as 08:05.
    const clock = v => { const m = fbGnss.parseHM(v); return m === null ? String(v || '').trim() : fbGnss.fmtHM(m); };
    pdf.setFillColor(...GM);
    pdf.rect(margin + 2, ty, 2.5, blockH - 2, 'F');
    pdf.setFontSize(6); pdf.setFont('helvetica', 'bold'); pdf.setTextColor(100, 100, 100);
    pdf.text('DATES & TIMES', margin + 8, ty + 5);
    const usable = W - margin * 2 - 14;
    const cell = (label, value, x, y) => {
      pdf.setFontSize(6.5); pdf.setFont('helvetica', 'bold'); pdf.setTextColor(...GM);
      pdf.text(label + ':', x, y);
      pdf.setFontSize(9); pdf.setFont('helvetica', 'normal'); pdf.setTextColor(28, 28, 28);
      pdf.text(value || '—', x, y + 5);
    };
    cell('Created',     fmtDateDMY(proj.createdAt), margin + 8, ty + 11);
    cell('Survey Date', page.surveyDate ? fmtDateDMY(page.surveyDate) : '', margin + 10 + usable / 2, ty + 11);
    [['Start', clock(page.startTime)], ['Stop', clock(page.stopTime)], ['Duration', dur ? dur.text : '']]
      .forEach(([label, value], i) => cell(label, value, margin + 8 + i * usable / 3, ty + 23));
    pdf.setDrawColor(200, 200, 200); pdf.setLineWidth(0.25);
    pdf.line(margin + 6, ty + blockH, W - margin - 4, ty + blockH);
    return ty + blockH + 4;
  }

  // Main project PDF export — called from ProjectView.
  // pageIds (optional array) limits the export to those pages; omitted = whole job.
  async function exportProjectPDF(projectId, toast, setExporting, pageIds) {
    if (!window.jspdf?.jsPDF) { toast.error('PDF library not loaded'); return; }
    setExporting(true);

    try {
      const proj = DB.getProject(projectId);
      if (!proj) { toast.error('Project not found'); return; }
      const allPages = proj.pages || [];
      const idSet = pageIds ? new Set(pageIds) : null;
      const pickedPages = idSet ? allPages.filter(p => idSet.has(p.id)) : allPages;
      // A station sketch already prints inside its GNSS page, so it isn't repeated
      // as a page of its own (unless that GNSS page says to export it too).
      const insideGnss = _sketchesInsideGnss(pickedPages);
      const exportPages = pickedPages.filter(p => !(p.type === 'sketch' && insideGnss.has(p.id)));
      // Day each page belongs to (its title page), for TOC headings + filename.
      const dayOf = {};
      groupPages(allPages).forEach(g => {
        if (g.title) dayOf[g.title.id] = g.title;
        g.pages.forEach(p => { dayOf[p.id] = g.title; });
      });

      const { jsPDF } = window.jspdf;
      const W = 210, H = 297, margin = 14;
      const GD  = [40,  40,  40];   // dark grey  (headings, fills)
      const GM  = [110, 110, 110];  // mid grey   (accents, badges)
      const GL  = [160, 160, 160];  // light grey (secondary text)
      const CR  = [255, 255, 255];  // white
      const BRD = [200, 200, 200];  // border grey

      const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      const F   = _initPDFFonts();
      // Export timestamp — used in per-page footer
      const exportTs = new Date().toLocaleString('en-CA', {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: false,
      });

      // ── PAGE 1: TITLE PAGE ─────────────────────────────────────────────────
      // Minimal ink — typography, rules, and whitespace only. No filled shapes.

      // White background
      pdf.setFillColor(255, 255, 255);
      pdf.rect(0, 0, W, H, 'F');

      // Outer border — single thin rule
      pdf.setDrawColor(30, 30, 30); pdf.setLineWidth(0.5);
      pdf.rect(10, 10, W - 20, H - 20, 'S');

      // ── "DIGITAL FIELD BOOK" label — top centre ───────────────────────────
      pdf.setFontSize(7); pdf.setFont('helvetica', 'bold');
      pdf.setTextColor(130, 130, 130);
      pdf.text('D I G I T A L   F I E L D   B O O K', W / 2, 24, { align: 'center' });

      // Rule below label
      pdf.setDrawColor(180, 180, 180); pdf.setLineWidth(0.3);
      pdf.line(28, 27, W - 28, 27);

      // ── Project name — vertically centred in upper half ───────────────────
      // splitTextToSize measures at the CURRENT font size, so the size must be
      // set BEFORE wrapping. Try 32pt first; if it needs >1 line, drop to 26pt
      // and re-wrap. (Previously this measured at the leftover 7pt label size,
      // so long names "fit" on one line and then overflowed the page at 32pt.)
      pdf.setFont('helvetica', 'bold');
      const nameMaxW = W - 56; // matches the 28mm side margins / rules
      pdf.setFontSize(32);
      let nameLines = pdf.splitTextToSize(proj.name, nameMaxW);
      let nameFontSize = 32;
      if (nameLines.length > 1) {
        nameFontSize = 26;
        pdf.setFontSize(26);
        nameLines = pdf.splitTextToSize(proj.name, nameMaxW);
      }
      pdf.setFontSize(nameFontSize);
      pdf.setTextColor(15, 15, 15);
      // Sit the name around 38% down the page
      const nameY = H * 0.38 - ((nameLines.length - 1) * nameFontSize * 0.3528 * 0.6);
      pdf.text(nameLines, W / 2, nameY, { align: 'center' });

      // Thick rule below project name
      pdf.setDrawColor(30, 30, 30); pdf.setLineWidth(0.8);
      pdf.line(28, nameY + 10, W - 28, nameY + 10);

      // ── Metadata — 2-column, left-aligned under rule ──────────────────────
      const mLeft  = 28;
      const mRight = W / 2 + 6;
      const mTop2  = nameY + 22;
      const mRowH2 = 20;
      const metaFields = [
        [mLeft,  mTop2,              'CLIENT',      proj.client   || '—'],
        [mRight, mTop2,              'SURVEYOR',    proj.surveyor || '—'],
        [mLeft,  mTop2 + mRowH2,     'DATE',        proj.date     || '—'],
        [mRight, mTop2 + mRowH2,     'JOB NUMBER',  proj.jobNumber || '—'],
      ];
      metaFields.forEach(([fx, fy, lbl, val]) => {
        pdf.setFontSize(6.5); pdf.setFont('helvetica', 'bold');
        pdf.setTextColor(120, 120, 120);
        pdf.text(lbl, fx, fy);
        pdf.setFontSize(12); pdf.setFont('helvetica', 'normal');
        pdf.setTextColor(20, 20, 20);
        pdf.text(String(val), fx, fy + 8);
        pdf.setDrawColor(200, 200, 200); pdf.setLineWidth(0.25);
        pdf.line(fx, fy + 11, fx + (W / 2 - 34), fy + 11);
      });

      // Thin rule after metadata
      const afterMetaY = mTop2 + mRowH2 * 2 + 4;
      pdf.setDrawColor(180, 180, 180); pdf.setLineWidth(0.3);
      pdf.line(28, afterMetaY, W - 28, afterMetaY);

      // ── Page count + created date ─────────────────────────────────────────
      // The count is the number of content sheets in THIS PDF, which is only
      // known once they are drawn — it is filled in after the content below.
      const createdStr = new Date(proj.createdAt).toLocaleDateString('en-CA', { year: 'numeric', month: 'long', day: 'numeric' });
      const infoY = afterMetaY + 10;
      pdf.setFontSize(7); pdf.setFont('helvetica', 'bold'); pdf.setTextColor(120, 120, 120);
      pdf.text('PAGES', mLeft, infoY);
      pdf.text('CREATED', mRight, infoY);
      pdf.setFontSize(11); pdf.setFont('helvetica', 'normal'); pdf.setTextColor(20, 20, 20);
      pdf.text(createdStr, mRight, infoY + 7);

      // ── Footer — bottom of page, rule + export info ───────────────────────
      const exportDateStr = new Date().toLocaleDateString('en-CA', { year: 'numeric', month: 'long', day: 'numeric' });
      const ftRuleY = H - 20;
      pdf.setDrawColor(180, 180, 180); pdf.setLineWidth(0.3);
      pdf.line(28, ftRuleY, W - 28, ftRuleY);
      pdf.setFontSize(7); pdf.setFont('helvetica', 'normal'); pdf.setTextColor(150, 150, 150);
      pdf.text('FieldBook  ·  Digital Field Notebook', 28, ftRuleY + 6);
      pdf.text(`Exported  ${exportDateStr}`, W - 28, ftRuleY + 6, { align: 'right' });

      // ── TOC PLACEHOLDER PAGES (filled in below) ────────────────────────────
      // The TOC row count is known up front (one row per page + one heading per
      // day), so reserve as many TOC pages as it needs before the content.
      const TOC_TOP = margin + 46, TOC_ROW_H = 12;
      const tocPerPage = Math.floor((H - margin - 20 - TOC_TOP) / TOC_ROW_H) + 1;
      let tocRowCount = 0, _prevDay;
      exportPages.forEach(p => {
        const day = dayOf[p.id] || null;
        if (day !== _prevDay) { if (day) tocRowCount++; _prevDay = day; }
        tocRowCount++;
      });
      const tocPageCount = Math.max(1, Math.ceil(tocRowCount / tocPerPage));
      for (let i = 0; i < tocPageCount; i++) pdf.addPage();

      // ── CONTENT PAGES ─────────────────────────────────────────────────────
      const tocEntries = [];
      const firstSheet = pdf.getNumberOfPages() + 1;   // cover and contents come before it

      for (const page of exportPages) {
        pdf.addPage();
        const sheetNo = pdf.getNumberOfPages() - firstSheet + 1;
        const meta = { data:   { label: 'Data',   color: '#606060', bg: '#EEEEEE' },
                       sketch: { label: 'Sketch', color: '#606060', bg: '#EEEEEE' },
                       title:  { label: 'Title',  color: '#606060', bg: '#EEEEEE' },
                       photo:  { label: 'Photos', color: '#606060', bg: '#EEEEEE' },
                       points: { label: 'Points', color: '#606060', bg: '#EEEEEE' },
                       notes:  { label: 'Notes',  color: '#606060', bg: '#EEEEEE' },
                       gnss:   { label: 'GNSS Obs' },
                       obstructions: { label: 'Obstructions' } }[page.type]
                   || { label: 'Data', color: '#606060', bg: '#EEEEEE' };
        // An untitled GNSS or Obstructions page is listed by its station.
        const gnssStn = page.type === 'gnss' ? (page.gnss?.station || '').trim() : '';
        const displayTitle = page.title?.trim() || (gnssStn ? `Stn ${gnssStn} — ${meta.label}`
          : page.type === 'obstructions' ? _sitePdfTitle(page) : '(Untitled)');
        tocEntries.push({ typeLabel: meta.label, title: displayTitle, sheet: sheetNo, day: dayOf[page.id] || null });

        if (page.type === 'sketch') {
          // Pre-resolve any IDB image refs.
          const _skImgIds = (page.shapes || []).filter(s => s.type === 'image' && s.imageId).map(s => s.imageId);
          const _skImgMap = _skImgIds.length > 0 ? await photoDB.getMany(_skImgIds) : {};
          // A sketch with print areas prints one sheet per area, in label
          // order. With none it prints the view it was left in, as it always has.
          const areas = fbPrint.sorted(fbPrint.normalize(page.printAreas));
          if (areas.length === 0) {
            const contentY = _pdfPageHeader(pdf, page, meta, W, H, margin, F);
            await _pdfSketchSheet(pdf, page, page.viewBox, _skImgMap, { W, H, margin, contentY });
          }
          for (const [i, area] of areas.entries()) {
            if (i > 0) pdf.addPage();
            const contentY = _pdfAreaHeader(pdf, page, area, meta, W, H, margin, F);
            await _pdfSketchSheet(pdf, page, fbPrint.frameRect(area), _skImgMap, { W, H, margin, contentY });
          }

        } else if (page.type === 'title') {
          // ── TITLE PAGE — professional cover sheet ────────────────────────────
          const contentY = _pdfPageHeader(pdf, page, meta, W, H, margin, F);
          const BRD2 = [200, 200, 200];
          const GD2  = [40,  40,  40];
          const GM2  = [120, 120, 120];
          const GL2  = [100, 100, 100];
          let ty = contentY + 6;

          // Helper: draw a titled field block with left accent bar
          function _titleField(lbl, val, opts = {}) {
            if (!val?.trim() || ty > H - margin - 16) return;
            const maxW = W - margin * 2 - 14;
            const lines = pdf.splitTextToSize(val.trim(), maxW);
            const lineH = opts.mono ? 5 : 4.8;
            const blockH = lines.length * lineH + 13;
            // Left accent bar
            pdf.setFillColor(...GM2);
            pdf.rect(margin + 2, ty, 2.5, blockH - 2, 'F');
            // Section label
            pdf.setFontSize(6); pdf.setFont('helvetica', 'bold');
            pdf.setTextColor(...GL2);
            pdf.text(lbl.toUpperCase(), margin + 8, ty + 5);
            // Value text — always helvetica for consistency
            pdf.setFontSize(10);
            pdf.setFont('helvetica', 'normal');
            pdf.setTextColor(28, 28, 28);
            pdf.text(lines, margin + 8, ty + 10.5);
            // Bottom rule
            pdf.setDrawColor(...BRD2); pdf.setLineWidth(0.25);
            pdf.line(margin + 6, ty + blockH, W - margin - 4, ty + blockH);
            ty += blockH + 4;
          }

          // Instrument settings — compact 2-column grid
          function _instrBlock() {
            const instrItems = [
              ['PPM',       page.ppm         || '—'],
              ['Temp',      (page.temperature || '—') + ' °C'],
              ['Pressure',  (page.pressure    || '—') + ' hPa'],
              ['Prism K',   (page.prismConst  || '—') + ' mm'],
            ];
            if (ty > H - margin - 30) return;
            const blockH = 20;
            pdf.setFillColor(...GM2);
            pdf.rect(margin + 2, ty, 2.5, blockH - 2, 'F');
            pdf.setFontSize(6); pdf.setFont('helvetica', 'bold');
            pdf.setTextColor(...GL2);
            pdf.text('INSTRUMENT SETTINGS', margin + 8, ty + 5);
            const colW = (W - margin * 2 - 14) / 2;
            instrItems.forEach(([k, v], i) => {
              const col = i % 2, row = Math.floor(i / 2);
              const ix = margin + 8 + col * (colW + 2);
              const iy = ty + 11 + row * 5.5;
              pdf.setFontSize(6.5); pdf.setFont('helvetica', 'bold'); pdf.setTextColor(...GM2);
              pdf.text(k + ':', ix, iy);
              pdf.setFont('helvetica', 'normal'); pdf.setTextColor(28, 28, 28);
              pdf.text(v, ix + 18, iy);
            });
            pdf.setDrawColor(...BRD2); pdf.setLineWidth(0.25);
            pdf.line(margin + 6, ty + blockH, W - margin - 4, ty + blockH);
            ty += blockH + 4;
          }

          // Dates, start / stop time and duration
          ty = _pdfTitleDates(pdf, page, proj, ty, W, H, margin);
          _titleField('Location',                   page.location);
          _titleField('Crew & Responsibilities',    page.crew);
          _titleField('Equipment (Make, Model, S/N)', page.equipment, { mono: true });
          _titleField('Datum & Projection',         page.datum);
          _instrBlock();
          _titleField('Summary of Work',            page.summary);
          _titleField('Code List',                  page.codeList, { mono: true });
          _titleField('Digital File Names',         page.fileNames, { mono: true });

          if (ty === contentY + 6) {
            // Nothing was rendered — all fields empty
            pdf.setTextColor(150, 150, 150); pdf.setFontSize(9);
            pdf.text('(No data entered)', W/2, contentY + 20, { align: 'center' });
          }

        } else if (page.type === 'photo') {
          // ── PHOTOS PAGE — 2×2 grid ──────────────────────────────────────────
          const contentY = _pdfPageHeader(pdf, page, meta, W, H, margin, F);
          const pagePhotos = page.photos || [];
          const urls = await resolvePhotoUrls(pagePhotos);
          await _pdfPhotoPageBody(pdf, page, pagePhotos, urls, proj, W, H, margin, contentY);

        } else if (page.type === 'gnss') {
          // ── GNSS OBS PAGE — observation log, station sketch, obstruction diagram ──
          const contentY = _pdfPageHeader(pdf, { ...page, title: _gnssPdfTitle(page, 'Observation Log'), notes: '' }, meta, W, H, margin, F);
          await _pdfGnssBody(pdf, page, proj, { W, H, margin, F, meta, contentY });

        } else if (page.type === 'obstructions') {
          // ── OBSTRUCTIONS PAGE — sky plot and obstruction table, one sheet ──
          const contentY = _pdfPageHeader(pdf, { ...page, title: displayTitle }, meta, W, H, margin, F);
          await _pdfSiteBody(pdf, page, { W, margin, F, contentY });

        } else if (page.type === 'notes') {
          // ── NOTES PAGE ──────────────────────────────────────────────────────────
          const contentY = _pdfPageHeader(pdf, page, meta, W, H, margin, F);
          _pdfNotesBody(pdf, page, { W, H, margin, contentY });

        } else {
          // DATA page
          const contentY = _pdfPageHeader(pdf, page, meta, W, H, margin, F);
          const cols = page.columns || [];
          const rows = page.rows || [];

          if (cols.length === 0) {
            pdf.setTextColor(150, 150, 150); pdf.setFontSize(9);
            pdf.text('(No columns defined)', W/2, contentY + 20, { align: 'center' });
          } else {
            const head = [cols.map(c => c.label || c.id)];
            const hfRes = evalDataPageCells(cols, rows);
            const body = rows.map(row => cols.map(col => {
              const raw = (row.cells || {})[col.id] || '';
              if (!raw.trim()) return '';
              const key = row.id + '_' + col.id;
              const cellType = getCellType(row, col);
              if (raw.startsWith('=')) return hfRes[key] || '';
              if (cellType === 'dms') return formatDMS(parseDMSInput(raw)) || raw;
              return raw;
            }));

            const typeColMap = cols.reduce((acc, col, i) => {
              acc[i] = { halign: 'center', font: F.mono };
              return acc;
            }, {});

            pdf.autoTable({
              head,
              body,
              startY: contentY + 2,
              margin: { left: margin, right: margin, bottom: margin + 14 },
              tableWidth: W - margin * 2,
              headStyles: {
                fillColor: GD, textColor: CR, fontSize: 8, fontStyle: 'bold',
                halign: 'center', cellPadding: { top: 3, bottom: 3, left: 3, right: 3 },
              },
              bodyStyles: {
                fontSize: 8, textColor: [44, 44, 44],
                cellPadding: { top: 2.5, bottom: 2.5, left: 3, right: 3 },
              },
              alternateRowStyles: { fillColor: [245, 245, 245] },
              columnStyles: typeColMap,
              didDrawPage: (data) => {
                // Page footer on each autoTable overflow page
                if (data.pageNumber > 1) {
                  // Re-draw the page header label for continuation pages
                  pdf.setFillColor(235, 235, 235);
                  pdf.rect(0, 0, W, 10, 'F');
                  pdf.setFontSize(7); pdf.setFont('helvetica', 'italic'); pdf.setTextColor(107, 114, 128);
                  pdf.text(`${displayTitle}  (continued)`, margin, 7);
                }
              },
            });

            // Row count footer
            pdf.setFontSize(7); pdf.setFont('helvetica', 'italic'); pdf.setTextColor(107, 114, 128);
            const finalY = pdf.lastAutoTable?.finalY;
            if (finalY && finalY < H - 14) {
              pdf.text(`${rows.length} row${rows.length !== 1 ? 's' : ''}  ·  ${cols.length} column${cols.length !== 1 ? 's' : ''}`, margin, finalY + 5);
            }
          }
        }

      }

      // ── FOOTERS + COVER PAGE COUNT ────────────────────────────────────────
      const sheetTotal = _pdfNumberSheets(pdf, firstSheet, W, H, margin, exportTs);
      pdf.setPage(1);
      pdf.setFontSize(11); pdf.setFont('helvetica', 'normal'); pdf.setTextColor(20, 20, 20);
      pdf.text(String(sheetTotal), mLeft, infoY + 7);

      // ── DRAW TOC on the reserved pages (2 …) ───────────────────────────────
      // Rows = one heading per day + one entry per exported page.
      const tocRows = [];
      let _tocDay;
      tocEntries.forEach(entry => {
        if (entry.day !== _tocDay) {
          if (entry.day) tocRows.push({ heading: entry.day });
          _tocDay = entry.day;
        }
        tocRows.push({ entry });
      });

      let ty = 0, _entryIdx = 0;
      tocRows.forEach((row, ri) => {
        if (ri % tocPerPage === 0) {
          const tocPageNo = 2 + ri / tocPerPage;
          pdf.setPage(tocPageNo);

          // White background
          pdf.setFillColor(255, 255, 255);
          pdf.rect(0, 0, W, H, 'F');
          // Dark grey TOC header band
          pdf.setFillColor(50, 50, 50);
          pdf.roundedRect(margin, margin + 10, W - margin*2, 24, 4, 4, 'F');
          pdf.rect(margin, margin + 10 + 20, W - margin*2, 4, 'F');
          pdf.setFontSize(11); pdf.setFont('helvetica', 'bold'); pdf.setTextColor(255, 255, 255);
          pdf.text('TABLE OF CONTENTS', W/2, margin + 25, { align: 'center' });
          pdf.setFontSize(7.5); pdf.setFont('helvetica', 'italic'); pdf.setTextColor(180, 180, 180);
          pdf.text(proj.name, W/2, margin + 20, { align: 'center' });

          // TOC footer
          pdf.setDrawColor(200, 200, 200); pdf.setLineWidth(0.3);
          pdf.line(margin + 4, H - margin - 10, W - margin - 4, H - margin - 10);
          pdf.setFontSize(6.5); pdf.setFont('helvetica', 'normal'); pdf.setTextColor(110, 110, 110);
          pdf.text(proj.name, margin + 4, H - margin - 4);
          // Front matter is numbered in roman numerals; "Page 1" is the first content sheet.
          pdf.text(['i', 'ii', 'iii', 'iv', 'v', 'vi', 'vii', 'viii', 'ix', 'x'][tocPageNo - 1] || '', W - margin - 4, H - margin - 4, { align: 'right' });

          ty = TOC_TOP;
        }

        if (row.heading) {
          // Day heading — title page name + date, thin rule beneath
          const d = row.heading;
          pdf.setFontSize(9); pdf.setFont('helvetica', 'bold'); pdf.setTextColor(30, 30, 30);
          const dayLine = pdf.splitTextToSize((d.title?.trim() || 'Untitled day').toUpperCase(), W - margin*2 - 50)[0];
          pdf.text(dayLine, margin + 4, ty + 1);
          if (d.date) {
            pdf.setFontSize(8); pdf.setFont('helvetica', 'normal'); pdf.setTextColor(110, 110, 110);
            pdf.text(String(d.date), W - margin - 4, ty + 1, { align: 'right' });
          }
          pdf.setDrawColor(120, 120, 120); pdf.setLineWidth(0.3);
          pdf.line(margin + 2, ty + 3.5, W - margin - 2, ty + 3.5);
          ty += TOC_ROW_H;
          return;
        }

        const entry = row.entry;
        const i = _entryIdx++;

        // Alternate row shade
        if (i % 2 === 0) {
          pdf.setFillColor(246, 246, 246);
          pdf.rect(margin + 2, ty - 4.5, W - margin*2 - 4, 10, 'F');
        }

        // Type badge — grey
        pdf.setFillColor(220, 220, 220);
        pdf.roundedRect(margin + 4, ty - 3.5, 16, 7, 1.5, 1.5, 'F');
        const badge = entry.typeLabel.toUpperCase();
        pdf.setFontSize(6); pdf.setFont('helvetica', 'bold'); pdf.setTextColor(80, 80, 80);
        // A long label (OBSTRUCTIONS) is shrunk to stay inside the 16 mm badge.
        pdf.setFontSize(Math.min(6, 6 * 14 / pdf.getTextWidth(badge)));
        pdf.text(badge, margin + 12, ty + 0.5, { align: 'center' });

        // Title text
        pdf.setFontSize(10); pdf.setFont('helvetica', 'normal'); pdf.setTextColor(44, 44, 44);
        const maxTitleW = W - margin*2 - 48;
        const titleLine = pdf.splitTextToSize(entry.title, maxTitleW)[0];
        pdf.text(titleLine, margin + 24, ty + 0.5);

        // Leader dots
        const titleEndX = margin + 24 + pdf.getTextWidth(titleLine) + 2;
        const dotsEndX = W - margin - 16;
        if (titleEndX < dotsEndX) {
          pdf.setFontSize(7); pdf.setTextColor(180, 180, 180);
          let dx = titleEndX;
          while (dx < dotsEndX) { pdf.text('.', dx, ty + 0.5); dx += 2.4; }
        }

        // Page number — the same "Page n" its first sheet carries in the footer
        pdf.setFontSize(10); pdf.setFont('helvetica', 'bold'); pdf.setTextColor(40, 40, 40);
        pdf.text(String(entry.sheet), W - margin - 4, ty + 0.5, { align: 'right' });

        ty += TOC_ROW_H;
      });

      // ── Save ──────────────────────────────────────────────────────────────
      // A partial export covering exactly one day is named for that day's date.
      const exportDays = [...new Set(exportPages.map(p => dayOf[p.id] || null))];
      const oneDay = exportPages.length < allPages.length && exportDays.length === 1 && exportDays[0]?.date;
      const fname = `${proj.name.replace(/[^a-zA-Z0-9_-]/g, '_')}_fieldbook_${oneDay ? exportDays[0].date : todayLocalISO()}.pdf`;
      pdf.save(fname);
      toast.success(`Exported ${fname}`);

    } catch (err) {
      console.error('[exportProjectPDF]', err);
      toast.error('PDF export failed — see console');
    } finally {
      setExporting(false);
    }
  }

  // Single-page PDF export — same format as the per-page section of exportProjectPDF
  // but outputs only the one page (no cover, no TOC).
  async function exportSinglePagePDF(projectId, pageId, toast, setExporting) {
    if (!window.jspdf?.jsPDF) { toast.error('PDF library not loaded'); return; }
    setExporting(true);
    try {
      const proj = DB.getProject(projectId);
      if (!proj) { toast.error('Project not found'); return; }
      const page = proj.pages.find(p => p.id === pageId);
      if (!page) { toast.error('Page not found'); return; }

      const { jsPDF } = window.jspdf;
      const W = 210, H = 297, margin = 14;
      const GD  = [40,  40,  40];
      const GM  = [110, 110, 110];
      const GL  = [160, 160, 160];
      const CR  = [255, 255, 255];
      const metaMap = {
        data:   { label: 'Data',   color: '#606060', bg: '#EEEEEE' },
        sketch: { label: 'Sketch', color: '#606060', bg: '#EEEEEE' },
        title:  { label: 'Title',  color: '#606060', bg: '#EEEEEE' },
        photo:  { label: 'Photos', color: '#606060', bg: '#EEEEEE' },
        notes:  { label: 'Notes',  color: '#606060', bg: '#EEEEEE' },
        gnss:   { label: 'GNSS Obs' },
        obstructions: { label: 'Obstructions' },
      };
      const meta = metaMap[page.type] || metaMap.data;
      const pdf  = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      const F    = _initPDFFonts();
      const exportTsSP = new Date().toLocaleString('en-CA', {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: false,
      });
      // A GNSS page prints as three PDF pages; the first is its Observation Log.
      const headPage = page.type === 'gnss' ? { ...page, title: _gnssPdfTitle(page, 'Observation Log'), notes: '' }
        : page.type === 'obstructions' ? { ...page, title: _sitePdfTitle(page) } : page;
      // A sketch with print areas opens on its first area (see the sketch branch).
      const areas = page.type === 'sketch' ? fbPrint.sorted(fbPrint.normalize(page.printAreas)) : [];
      const contentY = areas.length ? _pdfAreaHeader(pdf, page, areas[0], meta, W, H, margin, F)
                                    : _pdfPageHeader(pdf, headPage, meta, W, H, margin, F);

      if (page.type === 'sketch') {
        const _skImgIds2 = (page.shapes || []).filter(s => s.type === 'image' && s.imageId).map(s => s.imageId);
        const _skImgMap2 = _skImgIds2.length > 0 ? await photoDB.getMany(_skImgIds2) : {};
        if (areas.length === 0) await _pdfSketchSheet(pdf, page, page.viewBox, _skImgMap2, { W, H, margin, contentY, quiet: true });
        for (const [i, area] of areas.entries()) {
          const y = i === 0 ? contentY : (pdf.addPage(), _pdfAreaHeader(pdf, page, area, meta, W, H, margin, F));
          await _pdfSketchSheet(pdf, page, fbPrint.frameRect(area), _skImgMap2, { W, H, margin, contentY: y, quiet: true });
        }
